<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Bridge between the app's startup and the Drive-backed store.
 *
 * The application below is a classic (non-module) script, so it executes during
 * parsing — before app/boot.js, which is a module and therefore deferred. Its
 * first act is to fetch('/terms'), and on a static host that would 404 long
 * before the store exists to answer it.
 *
 * So window.fetch is replaced up front with a version that parks every call.
 * Once the store installs it calls __pghubInstall, the parked calls are
 * replayed into it, and fetch behaves normally from then on. The app just
 * experiences a slightly slow first request.
 */
(function () {
  // Which Drive folder this page's content lives in. Stamped in by
  // tools/build-app.py from the folder the page sits in.
  window.__pghubModule = "MCP";
  var native = window.fetch.bind(window);
  // Published so the store can pass non-app requests straight to the browser.
  // It cannot capture window.fetch itself: by the time its module is imported
  // this shim has already replaced it, so what it would capture is the shim —
  // and passthrough would call back into the handler forever.
  window.__pghubNativeFetch = native;
  var parked = [];
  var handler = null;
  window.__pghubInstall = function (fn) {
    handler = fn;
    var queued = parked.splice(0);
    for (var i = 0; i < queued.length; i++) queued[i]();
  };
  window.fetch = function (input, init) {
    if (handler) return handler(input, init);
    return new Promise(function (resolve, reject) {
      parked.push(function () { (handler || native)(input, init).then(resolve, reject); });
    });
  };
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCP Explorer — Terms</title>
<style>
  /* ===== Dark (default) ===== */
  :root, [data-theme="dark"] {
    --bg: #0f1117;
    --panel: #161922;
    --panel-2: #1d2230;
    --border: #2a2f3d;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --accent-soft: #1e2a44;
    --chip: #2a3550;
    --code-bg: #0b0d13;
    --code-text: #c8d3f5;
    --accent-ink: #0b0d13;
  }

  /* ===== Moonlight ===== */
  [data-theme="moonlight"] {
    --bg: #0b1023; --panel: #121833; --panel-2: #1a2244; --border: #27305a;
    --text: #dfe4ff; --muted: #8e98c9; --accent: #8b9dff; --accent-soft: #1f2a55;
    --chip: #26305c; --code-bg: #080c1c; --code-text: #aeb8ff; --accent-ink: #0b1023;
  }

  /* ===== Gray ===== */
  [data-theme="gray"] {
    --bg: #2b2f36; --panel: #33383f; --panel-2: #3c424a; --border: #4a5159;
    --text: #e7e9ec; --muted: #a7aeb6; --accent: #9fb0c0; --accent-soft: #3f4651;
    --chip: #444b54; --code-bg: #23272d; --code-text: #cdd3da; --accent-ink: #1b1e23;
  }

  /* ===== Soft ===== */
  [data-theme="soft"] {
    --bg: #f6f4f1; --panel: #fffdfb; --panel-2: #f0ebe5; --border: #e6ded6;
    --text: #4b4658; --muted: #9b93a3; --accent: #9d8ec2; --accent-soft: #ece7f5;
    --chip: #ece6f1; --code-bg: #f4efea; --code-text: #6f6678; --accent-ink: #ffffff;
  }

  /* ===== White ===== */
  [data-theme="white"] {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f6; --border: #dfe3ea;
    --text: #1a1d24; --muted: #667085; --accent: #2563eb; --accent-soft: #e5edff;
    --chip: #e8edf7; --code-bg: #f3f5f9; --code-text: #334155; --accent-ink: #ffffff;
  }

  /* ===== Colorful ===== */
  [data-theme="colorful"] {
    --bg: #fef6ff; --panel: #ffffff; --panel-2: #fbeeff; --border: #f0d7f5;
    --text: #2a1b33; --muted: #8a6f93; --accent: #e0179d; --accent-soft: #ffe1f4;
    --chip: #ffe6f7; --code-bg: #2a1b33; --code-text: #ffd6f0; --accent-ink: #ffffff;
  }

  /* ===== Cartoon ===== */
  [data-theme="cartoon"] {
    --bg: #fffbe7; --panel: #ffffff; --panel-2: #fff3c4; --border: #1a1a1a;
    --text: #1a1a1a; --muted: #7a6f3a; --accent: #ff5c8a; --accent-soft: #ffe0ea;
    --chip: #ffe9a8; --code-bg: #1a1a1a; --code-text: #ffe27a; --accent-ink: #1a1a1a;
  }
  [data-theme="cartoon"] .box { border-width: 2px; box-shadow: 3px 3px 0 var(--border); }
  [data-theme="cartoon"] .box:hover { box-shadow: 5px 5px 0 var(--accent); }
  [data-theme="cartoon"] .tab-btn.active,
  [data-theme="cartoon"] #drawer { box-shadow: -3px 0 0 rgba(0,0,0,.15); }
  [data-theme="cartoon"] .tag-chip,
  [data-theme="cartoon"] .related .pill { border: 2px solid var(--border); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #b692ff);
    display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }

  /* Top tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* Theme picker */
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ===== Narrow screens =====
     The desktop layout is a fixed sidebar beside a flexible main. On a 390px
     phone that leaves main at a handful of characters, and the header's
     right-hand cluster — five tabs plus the theme picker — will not wrap, so
     the document comes out wider than the screen and scrolls sideways.

     Below 860px, the same breakpoint the hub uses, the sidebar stacks above the
     content at full width instead of competing with it, and the header wraps
     its controls onto a second row. Stacking rather than overlaying is
     deliberate: an overlay anchored at top:0 would cover the very button that
     closes it, and anchoring below a header whose height changes when it wraps
     is fragile. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1.05rem; }
    .sub { display: none; }                 /* the tagline is on the hub card too */

    /* display:contents dissolves the wrapper so its children become direct flex
       items of the header. That is what lets the theme picker sit at the end of
       the title row while the tabs claim a full-width row of their own —
       otherwise the five tabs share the remainder with the picker and the last
       two are cut off, reachable only by a horizontal swipe nobody would guess
       at. */
    .header-right { display: contents; }
    .tp { margin-left: auto; flex: 0 0 auto; }
    /* order pulls the tabs after the picker so the header settles into two rows
       (title + picker, then tabs) rather than three. Without it the full-width
       tabs break the line first and the picker is stranded on a row of its own. */
    .tabs { order: 1; flex: 0 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; }

    .layout { flex-direction: column; }
    .layout > aside:not(#drawer) {
      width: 100%; min-width: 0; max-height: 45vh;
      border-right: 0; border-bottom: 1px solid var(--border);
    }

    main { padding: 20px 16px 64px; }
    .detail, .detail:has(.pdf-view), .sv-head, #search-results, #search-more, .sr-empty { max-width: 100%; }
    .pdf-frame { height: 70vh; }
    .boxes { grid-template-columns: 1fr; }
    .ov-globe { height: 60vh; }
  }

  .layout { display: flex; flex: 1; min-height: 0; }
  .nav-toggle { height: 34px; }
  .layout.nav-closed > aside:not(#drawer) { display: none; }

  /* Sidebar */
  aside {
    width: 300px; min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 14px 16px 8px; }
  .nav-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  .nav-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .nav-tabs button.active { background: var(--accent); color: var(--accent-ink); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }

  .search-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .search-row .search { margin-bottom: 0; flex: 1; }
  .view-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .view-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center;
  }
  .view-toggle button svg, .icon-btn svg { display: block; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    flex: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  nav { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }

  .group { margin-bottom: 4px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .group-head:hover { background: var(--panel-2); }
  .group-head .caret { transition: transform .15s ease; color: var(--muted); font-size: 11px; width: 12px; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 10px; }
  .group-items { padding-left: 8px; }
  .group.collapsed .group-items { display: none; }

  .term {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 22px; border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .term:hover { background: var(--panel-2); color: var(--text); }
  .term.active { background: var(--accent-soft); color: #fff; }
  .term.active::before {
    content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .term.hidden, .group.hidden { display: none; }

  /* flat-list mode: the single flat group hides its header */
  nav.flat .group-head { display: none; }
  nav.flat .group-items { padding-left: 0; }
  nav.flat .term { padding-left: 14px; }

  /* Detail pane (Glossary tab) */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; min-width: 0; }
  /* A wide child — a table, a diagram, a code block — must scroll inside its
     own box rather than widening the page. */
  .markdown-body pre, .markdown-body table { max-width: 100%; overflow-x: auto; }
  .detail { max-width: 820px; }
  /* embedded PDF viewer (docs that are .pdf files) */
  .detail:has(.pdf-view) { max-width: 1100px; }
  .pdf-view { display: flex; flex-direction: column; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .pdf-bar .pdf-name { font-weight: 650; color: var(--text); }
  .pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .pdf-bar a:hover { text-decoration: underline; }
  .pdf-frame { width: 100%; height: calc(100vh - 180px); min-height: 480px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag-chip {
    display: inline-block; background: var(--chip); color: var(--accent);
    padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  }
  h2.term-title { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.4px; }
  .lede { font-size: 16px; color: var(--muted); line-height: 1.6; margin: 0 0 26px; }

  .section { margin-bottom: 24px; }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 8px;
  }
  .section p, .section li { line-height: 1.65; font-size: 15px; color: var(--text); }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; }

  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--code-text); }
  p code, li code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }

  .related { display: flex; flex-wrap: wrap; gap: 8px; }
  .related .pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .related .pill:hover { border-color: var(--accent); color: var(--text); }

  /* Notes (rich text) */
  .note-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .note-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .note-btn:hover { border-color: var(--accent); }
  .note-btn.muted { color: var(--muted); }
  .note-editor {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
    color: var(--text); outline: none;
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .note-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-editor h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-editor a { color: var(--accent); }
  .note-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .note-editor pre, .note-view pre, .rich pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  }
  .note-editor code, .note-view code, .rich code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .note-editor pre code, .note-view pre code, .rich pre code { background: none; border: 0; padding: 0; }
  .note-editor blockquote, .note-view blockquote, .rich blockquote {
    margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic;
  }
  .note-editor h3, .note-view h3, .rich h3 { margin: 12px 0 6px; font-size: 18px; }
  .note-editor hr, .note-view hr, .rich hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .note-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .note-hint b { color: var(--accent); font-weight: 600; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .notes-head h3 { margin: 0; }
  .notes-actions { display: flex; gap: 6px; }
  .note-action {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .note-action:hover { border-color: var(--accent); color: var(--accent); }
  .note-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note-action.primary:hover { color: var(--accent-ink); filter: brightness(1.05); }
  .note-view {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; min-height: 46px; color: var(--text);
  }
  .note-view img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-view h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-view a { color: var(--accent); }
  .note-view .empty-note { color: var(--muted); }
  .rich { line-height: 1.65; font-size: 15px; }
  .rich img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .rich h4 { margin: 10px 0 6px; font-size: 16px; }
  .rich a { color: var(--accent); }
  .rich table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .rich th, .rich td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .rich th { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .rich pre { margin: 8px 0; }
  .term-actions { display: flex; gap: 8px; margin: -2px 0 20px; }
  .term-actions .danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

  /* Add-term button */
  .add-term-btn {
    width: 100%; margin-top: 10px; border: 1px dashed var(--accent); background: transparent;
    color: var(--accent); padding: 8px 0; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  .add-term-btn:hover { background: var(--accent-soft); }
  .add-term-btn.inline { width: auto; padding: 8px 16px; margin: 0 0 24px 0; }

  /* Add-term modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 640px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-head .drawer-close { margin-left: auto; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-body label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .modal-body .field { margin-bottom: 16px; }
  .modal-body input[type=text], .modal-body textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .modal-body input[type=text]:focus, .modal-body textarea:focus { border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Terms overview (Terms tab) */
  #overview { flex: 1; overflow-y: auto; padding: 30px 40px 80px; display: none; }
  #overview.show { display: block; }
  .ov-head h2 { margin: 0 0 4px; font-size: 24px; }
  .ov-head p { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
  .ov-group { margin-bottom: 34px; }
  .ov-group-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ov-group-title .name { font-size: 15px; font-weight: 650; }
  .ov-group-title .count { font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
  .ov-group.ov-nested { margin-bottom: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
  .ov-group.ov-nested .ov-group-title .name { font-size: 13.5px; color: var(--muted); }
  /* Docs landing list. The tab used to jump straight into whichever document
     sorted first, so there was no way to see what a module actually held. The
     sidebar lists documents flat — these modules carry no doc tags — so the
     landing list is flat too, and the two agree. */
  .docs-index-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
  .docs-index-head h2 { font-size: 1.15rem; margin: 0; }
  .docs-index-head .count { color: var(--muted); font-size: .85rem; }
  .doc-box { text-align: left; }
  .doc-box .b-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .doc-box .b-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-top: 6px; }

  /* Close bar above an open document — a document is something you come back

  .doc-back button { background: var(--panel-2); border: 1px solid var(--border);

  }

  /* Overview view toggle + Wall view */

  .chip-term {
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; font-weight: 600; line-height: 1;
    transition: transform .12s ease, background .15s, box-shadow .15s;

  .chip-term:hover { transform: scale(1.08); background: var(--panel-2); box-shadow: 0 5px 16px rgba(0,0,0,.28); }

    position: absolute; left: 0; top: 0; white-space: nowrap;

    will-change: transform, opacity; user-select: none;

  .globe-controls { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px auto 0; }

  .gc-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Search view */
  #search-view { flex: 1; overflow-y: auto; padding: 26px 40px 80px; display: none; }

  .sv-head { max-width: 820px; margin: 0 auto 16px; }
  #search-input {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none;
  }

  .sv-summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sv-summary b { color: var(--text); }
  #search-results { max-width: 820px; margin: 0 auto; }
  .sr-hit { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; }
  .sr-hit:hover { border-color: var(--accent); }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .sr-title { font-weight: 650; font-size: 14px; }
  .sr-field { font-size: 11px; color: var(--muted); margin-left: auto; }
  .sr-snippet { font-size: 13.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap; }
  .sr-snippet mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  #search-more { max-width: 820px; margin: 6px auto 0; text-align: center; }
  .sr-more-btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .sr-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sr-empty { color: var(--muted); max-width: 820px; margin: 0 auto; }

  /* Docs (rendered in the main pane, listed in the Terms/QA/Docs sidebar) */
  .nav-empty { color: var(--muted); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  .markdown-body { max-width: 820px; color: var(--text); font-size: 15px; line-height: 1.7; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 700; }
  .markdown-body h1 { font-size: 28px; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 22px; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 18px; }
  .markdown-body h4 { font-size: 15.5px; }
  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body blockquote { margin: 0 0 1em; padding: .4em 1em; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 6px 6px 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-text); padding: .12em .4em; border-radius: 4px; font-size: .88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1em; }

  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 14px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .markdown-body th { background: var(--panel-2); font-weight: 650; }
  .markdown-body [data-line] { scroll-margin-top: 20px; }
  .doc-flash { animation: docFlash 2s ease-out; border-radius: 6px; }
  @keyframes docFlash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .markdown-body mark.doc-hit { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

  /* Quick-peek tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 300px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px;

  #drawer {

<script>
/* ---- Data: grouped terms ---- */
/* app-identity: stamp local writes so another app's server rejects them (409) */

/* ---- Index (built-in + custom terms, rebuildable) ---- */
let GROUPS = [];
let TERMS = {};
let customTerms = {};   // id -> custom term (loaded from server or localStorage)

/* nested tags use "::" as the delimiter, e.g. "Reliability::Retries" */
const TAG_SEP = "::";
function tagParts(group) { return (group || "").split(TAG_SEP).map(s => s.trim()).filter(Boolean); }
function tagLeaf(group) { const p = tagParts(group); return p[p.length - 1] || group; }

function rebuildData() {
  GROUPS = []; TERMS = {};
  const byName = {};
  Object.values(customTerms).forEach(t => {
    if (!t.builtin) t._custom = true;
    let g = byName[t.group];
    if (!g) { g = { name: t.group, tag: t.tag || tagLeaf(t.group), terms: [] }; byName[t.group] = g; GROUPS.push(g); }
    g.terms.push(t);
  });
  GROUPS.forEach(g => g.terms.forEach(t => { t._group = g; TERMS[t.id] = t; }));
}

/* drop runtime-only props (_group back-ref, _custom) before persisting */
function stripRuntime(o) {
  const c = {};
  for (const k in o) if (k.charAt(0) !== "_") c[k] = o[k];
  return c;
}
function serializeMap(map) {
  const out = {};
  for (const id in map) out[id] = stripRuntime(map[id]);
  return out;
}

/* built-in terms become seed rows in the store (terms.json / localStorage) */
function builtinSeed() {
  const out = {};
  BUILTIN_GROUPS.forEach(g => g.terms.forEach(t => {
    out[t.id] = {
      id: t.id, title: t.title, group: g.name, tag: g.tag,
      lede: t.lede, what: t.what, why: t.why, apply: t.apply,
      code: t.code, related: t.related, builtin: true
    };
  }));
  return out;
}

const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---- Shared detail HTML ---- */
function detailHTML(t, withTag) {
  const related = (t.related || []).filter(r => TERMS[r]).map(r =>
    `<span class="pill" data-id="${r}">${TERMS[r].title}</span>`).join("");
  return `
    ${withTag ? `<div class="crumbs"><span class="tag-chip">${t._group.tag}</span></div>` : ""}
    <h2 class="term-title">${t.title}</h2>
    ${t.lede ? `<p class="lede">${t.lede}</p>` : ""}
    <div class="term-actions">
      <button class="note-action" data-act="edit-term">&#9998; Edit term</button>
      ${!t.builtin ? `<button class="note-action danger" data-act="delete-term">&#128465; Delete</button>` : ""}
    </div>
    ${t.what ? `<div class="section"><h3>${t.builtin ? "What it is" : "Details"}</h3><div class="rich">${t.what}</div></div>` : ""}
    ${t.why ? `<div class="section"><h3>Why it matters</h3><p>${t.why}</p></div>` : ""}
    ${t.apply && t.apply.length ? `<div class="section"><h3>How to apply</h3><ul>${t.apply.map(a => `<li>${a}</li>`).join("")}</ul></div>` : ""}
    ${t.code ? `<div class="section"><h3>Example</h3><pre><code>${escapeHtml(t.code)}</code></pre></div>` : ""}
    ${notesSectionHTML()}
    ${related ? `<div class="section"><h3>Related terms</h3><div class="related">${related}</div></div>` : ""}
  `;
}

let sidebarMode = "tree";
let navSection = "terms";            // "terms" | "qa" | "topics" | "docs"
function navGroups() { return navSection === "qa" ? QA_GROUPS : navSection === "topics" ? TOPIC_GROUPS : GROUPS; }
function navIndex() { return navSection === "qa" ? QA_INDEX : navSection === "topics" ? TOPIC_INDEX : TERMS; }
function navOpen(id) { return navSection === "qa" ? selectQA(id) : navSection === "topics" ? selectTopic(id) : select(id); }
function renderSidebar(mode) {
  sidebarMode = mode;
  nav.innerHTML = "";
  nav.classList.toggle("flat", mode === "flat");

  if (navSection === "docs") {
    const group = document.createElement("div");
    group.className = "group";
    const items = document.createElement("div");
    items.className = "group-items";
    if (!DOCS.length) {
      const msg = document.createElement("div");
      msg.className = "nav-empty";
      msg.innerHTML = SERVER
        ? "No <code>.md</code> files in the <code>docs/</code> folder yet."
        : "Docs live in Google Drive — sign in to load them.";
      items.appendChild(msg);
    } else {
      DOCS.forEach(d => {
        const el = document.createElement("div");
        el.className = "term";
        el.dataset.id = d.name;
        el.textContent = d.title || d.name;
        el.title = d.name;
        el.addEventListener("click", () => selectDoc(d.name));
        items.appendChild(el);
      });
    }
    group.appendChild(items);
    nav.appendChild(group);
    applyFilter();
    if (currentDocName) markActive(currentDocName);
    return;
  }

  if (mode === "flat") {
    const all = Object.values(navIndex()).slice().sort((a, b) => a.title.localeCompare(b.title));
    const group = document.createElement("div");
    group.className = "group";
    const items = document.createElement("div");
    items.className = "group-items";
    all.forEach(t => items.appendChild(itemEl(t)));
    group.appendChild(items);
    nav.appendChild(group);
  } else {
    renderTreeNode(buildTree(navGroups()), nav, 0);
  }
  applyFilter();
  const activeId = navSection === "qa" ? currentQAId : navSection === "topics" ? currentTopicId : currentId;
  if (activeId) markActive(activeId);
}
function itemEl(t) {
  const el = document.createElement("div");
  el.className = "term";
  el.dataset.id = t.id;
  el.textContent = t.title;
  el.addEventListener("click", () => navOpen(t.id));
  return el;
}
/* build a nested tree from groups whose names use "::" (e.g. "A::B::C") */
function buildTree(groups) {
  const root = { children: {}, order: [], terms: [] };
  groups.forEach(g => {
    let node = root;
    tagParts(g.name).forEach(p => {
      if (!node.children[p]) { node.children[p] = { name: p, children: {}, order: [], terms: [] }; node.order.push(p); }
      node = node.children[p];
    });
    node.terms.push(...g.terms);
  });
  return root;
}
function countTree(node) {
  let n = node.terms.length;
  node.order.forEach(k => (n += countTree(node.children[k])));
  return n;
}
function renderTreeNode(node, container, depth) {
  node.order.forEach(key => {
    const child = node.children[key];
    const group = document.createElement("div");
    group.className = "group";
    const head = document.createElement("div");
    head.className = "group-head";
    head.style.paddingLeft = (10 + depth * 12) + "px";
    head.innerHTML = `<span class="caret">▼</span><span>${child.name}</span><span class="count">${countTree(child)}</span>`;
    head.addEventListener("click", () => group.classList.toggle("collapsed"));
    group.appendChild(head);
    const items = document.createElement("div");
    items.className = "group-items";
    renderTreeNode(child, items, depth + 1);          // nested sub-tags first
    child.terms.forEach(t => {
      const el = itemEl(t);
      el.style.paddingLeft = (22 + depth * 12) + "px";
      items.appendChild(el);
    });
    group.appendChild(items);
    container.appendChild(group);
  });
}

/* ---- Search filter ---- */
const searchInput = document.getElementById("search");
function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  if (navSection === "docs") {
    document.querySelectorAll("#nav .term").forEach(term => {
      const d = DOCS.find(x => x.name === term.dataset.id);
      const hit = !q || (d && ((d.title || "").toLowerCase().includes(q) || d.name.toLowerCase().includes(q)));
      term.classList.toggle("hidden", !hit);
    });
    return;
  }
  const index = navIndex();
  document.querySelectorAll("#nav .group").forEach(group => {
    let visible = 0;
    group.querySelectorAll(".term").forEach(term => {
      const t = index[term.dataset.id];
      const hit = !q || (t && (t.title.toLowerCase().includes(q) || (t.lede || "").toLowerCase().includes(q)));
      term.classList.toggle("hidden", !hit);
      if (hit) visible++;
    });
    group.classList.toggle("hidden", visible === 0);
    if (q) group.classList.remove("collapsed");
  });
}
searchInput.addEventListener("input", applyFilter);

const CHIP_SIZES = [14, 16, 13, 17, 15];
let wallBuilt = false;

/* ---- Globe view (rotating 3D sphere of term chips) ---- */
const ovGlobe = document.getElementById("ov-globe");
const ovbGlobe = document.getElementById("ovb-globe");
let globeBuilt = false, globeActive = false, globeRAF = null;
let globeChips = [];
let gAngleX = 0.3, gAngleY = 0, gVelX = 0, gVelY = 0.004, gPaused = false;
let gZoom = 1, gAuto = true;
const gMouse = { x: 0, y: 0, inside: false };

function buildGlobe() {
  if (globeBuilt) return;
  const all = [];
  ovCtx.groups().forEach((g, gi) => g.terms.forEach(t => all.push({ t, color: GROUP_COLORS[gi % GROUP_COLORS.length] })));
  const N = all.length;
  all.forEach((item, idx) => {
    const phi = Math.acos(1 - 2 * (idx + 0.5) / N);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (idx + 0.5);
    const chip = document.createElement("div");
    chip.className = "globe-chip";
    chip.textContent = item.t.title;
    chip.style.color = item.color;
    chip.style.borderColor = item.color;
    chip.addEventListener("mouseenter", e => { gPaused = true; showTip(e, item.t); });
    chip.addEventListener("mousemove", moveTip);
    chip.addEventListener("mouseleave", () => { gPaused = false; hideTip(); });
    chip.addEventListener("click", () => { hideTip(); ovCtx.open(item.t.id); });
    ovGlobe.appendChild(chip);
    globeChips.push({
      el: chip,
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    });
  });
  globeBuilt = true;
}
function globeFrame() {
  if (!globeActive) return;
  const rect = ovGlobe.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const radius = (Math.min(rect.width, rect.height) / 2 - 70) * gZoom;
  if (!gPaused && gAuto) {
    if (gMouse.inside) {
      gVelY = ((gMouse.x - cx) / cx) * 0.06;
      gVelX = -((gMouse.y - cy) / cy) * 0.06;
    } else {
      gVelY += (0.004 - gVelY) * 0.02;
      gVelX += (0 - gVelX) * 0.02;
    }
    gAngleY += gVelY;
    gAngleX += gVelX;
  }
  const sinY = Math.sin(gAngleY), cosY = Math.cos(gAngleY);
  const sinX = Math.sin(gAngleX), cosX = Math.cos(gAngleX);
  globeChips.forEach(c => {
    const x1 = c.x * cosY - c.z * sinY;
    const z1 = c.x * sinY + c.z * cosY;
    const y2 = c.y * cosX - z1 * sinX;
    const z2 = c.y * sinX + z1 * cosX;
    const depth = (z2 + 1) / 2;                 // 0 (back) .. 1 (front)
    const px = cx + x1 * radius;
    const py = cy + y2 * radius;
    const el = c.el;
    el.style.transform = `translate(-50%,-50%) translate(${px}px,${py}px) scale(${(0.6 + depth * 0.55).toFixed(3)})`;
    el.style.opacity = (0.3 + depth * 0.7).toFixed(3);
    el.style.zIndex = Math.round(depth * 100);
  });
  globeRAF = requestAnimationFrame(globeFrame);
}
function startGlobe() {
  buildGlobe();
  globeActive = true;
  if (!globeRAF) globeRAF = requestAnimationFrame(globeFrame);
}
function stopGlobe() {
  globeActive = false;
  if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
}
ovGlobe.addEventListener("mousemove", e => {
  const r = ovGlobe.getBoundingClientRect();
  gMouse.x = e.clientX - r.left; gMouse.y = e.clientY - r.top; gMouse.inside = true;
});
ovGlobe.addEventListener("mouseleave", () => { gMouse.inside = false; });

/* globe control bar */
const globeControls = document.getElementById("globe-controls");
let gHoldTimer = null;
function gHoldStart(fn) { fn(); gHoldTimer = setInterval(fn, 40); }
function gHoldStop() { if (gHoldTimer) { clearInterval(gHoldTimer); gHoldTimer = null; } }
const GSTEP = 0.1;
function gNudge(dir) {
  if (dir === "left") gAngleY -= GSTEP;
  else if (dir === "right") gAngleY += GSTEP;
  else if (dir === "up") gAngleX -= GSTEP;
  else if (dir === "down") gAngleX += GSTEP;
}
function gZoomBy(f) { gZoom = Math.min(2.4, Math.max(0.6, gZoom * f)); }
const HOLD_END = ["pointerup", "pointerleave", "pointercancel"];
globeControls.querySelectorAll(".gc-btn[data-dir]").forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener("pointerdown", e => { e.preventDefault(); gHoldStart(() => gNudge(dir)); });

   Notes: rich-text editor + image storage (folder or inline fallback)
   =================================================================== */
const NOTE_KEY = id => "mcp-note:" + id;
let dirHandle = null;                       // chosen folder for pasted images
const objectUrls = [];                       // track for cleanup

/* --- tiny IndexedDB kv (to persist the folder handle across reloads) --- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("app:" + APP_ID, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv").objectStore("kv").get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

/* --- Local server upload (preferred when page is served over http) --- */
const SERVER = location.protocol === "http:" || location.protocol === "https:";
async function uploadToServer(blob, name, subdir) {
  const headers = { "X-Filename": name, "Content-Type": blob.type || "application/octet-stream" };
  if (subdir) headers["X-Subdir"] = subdir;   // e.g. "terms" or "qa"
  const res = await fetch("/upload", { method: "POST", headers, body: blob });
  if (!res.ok) throw new Error("upload failed: " + res.status);
  return (await res.json()).url;   // e.g. "/images/terms/autonomy-scoped__123.png"
}

/* notes shared via server (so every browser sees the same notes + images) */
let serverNotesCache = null;
function getServerNotes() {
  if (!serverNotesCache) {
    serverNotesCache = fetch("/notes").then(r => r.ok ? r.json() : {}).catch(() => ({}));
  }
  return serverNotesCache;
}
function saveNoteToServer(termId, html) {
  getServerNotes().then(notes => { notes[termId] = html; });   // keep cache in sync
  fetch("/notes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: termId, html })
  }).catch(() => {});
}

/* custom terms: persisted on the server (shared) or in localStorage (offline) */
const CUSTOM_KEY = "mcp-terms";
async function loadCustomTerms() {
  if (SERVER) {
    try { const r = await fetch("/terms"); return r.ok ? await r.json() : {}; } catch (e) { return {}; }
  }
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "{}"); } catch (e) { return {}; }
}
function persistCustomTerm(term) {
  customTerms[term.id] = term;
  if (SERVER) {
    fetch("/terms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(stripRuntime(term))
    }).catch(() => {});
  } else {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(serializeMap(customTerms))); } catch (e) {}
  }
}
function slugify(s) {
  return (s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")) || "term";
}
function uniqueId(base) {
  let id = base, i = 2;
  while (TERMS[id] || customTerms[id]) { id = base + "-" + i; i++; }
  return id;
}

/* --- File System Access helpers --- */
const FSA = typeof window.showDirectoryPicker === "function";
async function ensurePerm(h, mode = "readwrite") {
  if (!h) return false;
  const opts = { mode };
  if ((await h.queryPermission(opts)) === "granted") return true;
  try { return (await h.requestPermission(opts)) === "granted"; } catch (e) { return false; }
}
async function saveImageToFolder(blob, name) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}
async function loadImageFromFolder(name) {
  const fh = await dirHandle.getFileHandle(name);
  const url = URL.createObjectURL(await fh.getFile());
  objectUrls.push(url);
  return url;
}
async function initFolder() {
  if (!FSA) return;
  try { const h = await idbGet("imgdir"); if (h) dirHandle = h; } catch (e) {}
  updateFolderUI();
}
async function linkFolder() {
  if (!FSA) { alert("This browser can't store images to a folder. Pasted images will be embedded inline instead (try Chrome or Edge for folder storage)."); return; }
  try {
    const h = await window.showDirectoryPicker();
    if (!(await ensurePerm(h))) return;
    dirHandle = h;
    await idbSet("imgdir", h);
    updateFolderUI();
    // re-load any folder images now that we have access
    document.querySelectorAll(".note-editor").forEach(rehydrate);
  } catch (e) { /* user cancelled */ }
}
function updateFolderUI() {
  let label;
  if (SERVER) {
    label = "Pasted images are uploaded to this module's <b>images/</b> folder in Google Drive.";
  } else if (!FSA) {
    label = "Images are embedded inline. Tip: run <b>start.command</b> to save them as files instead.";
  } else if (dirHandle) {
    label = `Pasted images are saved to your linked folder <b>“${dirHandle.name}”</b>.`;
  } else {
    label = "Click 📁 to pick a folder for pasted images — or run <b>start.command</b> for automatic file storage.";
  }
  document.querySelectorAll("[data-folder-status]").forEach(el => el.innerHTML = label);
}

/* --- utilities --- */
const blobToDataURL = blob => new Promise(res => {
  const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob);
});
function placeCaretEnd(el) {
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function insertImg(editor, src, fileName) {
  placeCaretEnd(editor);
  const attr = fileName ? ` data-file="${fileName}"` : "";
  document.execCommand("insertHTML", false, `<img src="${src}"${attr} alt="">`);
}
/* save: strip blob src from folder images (kept by data-file), embedded imgs stay */
function serialize(editor) {
  const c = editor.cloneNode(true);
  c.querySelectorAll("img[data-file]").forEach(img => img.removeAttribute("src"));
  return c.innerHTML;
}
function saveNote(termId, editor) {
  const html = serialize(editor);
  if (SERVER) { saveNoteToServer(termId, html); return; }
  try { localStorage.setItem(NOTE_KEY(termId), html); } catch (e) {}
}
async function rehydrate(editor) {
  if (!dirHandle) return;
  if (!(await ensurePerm(dirHandle))) return;
  for (const img of editor.querySelectorAll("img[data-file]")) {
    if (img.getAttribute("src")) continue;
    try { img.src = await loadImageFromFolder(img.dataset.file); }
    catch (e) { img.alt = "[missing image: " + img.dataset.file + "]"; }
  }
}
async function handleImageBlob(blob, editor, prefix, subdir) {
  // derive extension from MIME, falling back to the file name (dropped files
  // sometimes have an empty type) so an animated .gif is never saved as .png
  let ext = ((blob.type.split("/")[1]) || "").toLowerCase().replace("jpeg", "jpg");
  if (!ext && blob.name) { const m = blob.name.match(/\.([a-z0-9]+)$/i); if (m) ext = m[1].toLowerCase(); }
  if (!ext) ext = "png";
  const name = `${prefix}__${(new Date()).getTime()}.${ext}`;

  // 1) Preferred: the file goes to this module's images/ folder in Drive, and
  //    a durable drive:<id> reference comes back
  if (SERVER) {
    try {
      const url = await uploadToServer(blob, name, subdir);
      insertImg(editor, url, null);   // plain relative URL; persisted on Save
      return;
    } catch (e) { /* server unreachable -> fall through */ }
  }

  // 2) File System Access folder (when opened directly in Chrome/Edge)
  if (dirHandle && await ensurePerm(dirHandle)) {
    try {
      await saveImageToFolder(blob, name);
      insertImg(editor, await loadImageFromFolder(name), name);
      return;
    } catch (e) { /* fall through */ }
  }

  // 3) Last resort: embed inline as a data URL
  insertImg(editor, await blobToDataURL(blob), null);
}

/* --- mount one notes section (noteId namespaces storage; subdir routes images) --- */
function mountNotes(root, noteId, subdir) {
  subdir = subdir || "terms";

  let currentHtml = "";

  function renderView() {
    if (currentHtml && currentHtml.trim()) {
      view.innerHTML = currentHtml;
      if (!SERVER) rehydrate(view);
    } else {
      view.innerHTML = '<span class="empty-note">No notes yet. Click <b>Edit</b> to add notes.</span>';
    }
  }
  function setMode(editing) {
    editArea.hidden = !editing;
    view.hidden = editing;
    editBtn.hidden = editing;
    saveBtn.hidden = !editing;
    cancelBtn.hidden = !editing;
  }

  // load saved notes
  if (SERVER) {
    getServerNotes().then(notes => { currentHtml = (notes && notes[noteId]) || ""; renderView(); });
  } else {
    try { currentHtml = localStorage.getItem(NOTE_KEY(noteId)) || ""; } catch (e) {}
    renderView();
  }

  editBtn.addEventListener("click", () => {
    editor.innerHTML = currentHtml;
    if (!SERVER) rehydrate(editor);
    setMode(true);
    editor.focus();
  });
  cancelBtn.addEventListener("click", () => setMode(false));
  saveBtn.addEventListener("click", () => {
    currentHtml = serialize(editor);

    renderView();

  });

  wireEditor(toolbar, editor, noteId, subdir);

/* shared rich-text wiring (used by notes + the Add-term/Add-QA modals) */
function wireEditor(toolbar, editor, imgPrefix, subdir) {
  const hasFolder = !!toolbar.querySelector('[data-act="folder"]');
  toolbar.innerHTML = buildToolbarHTML(hasFolder);
  toolbar.addEventListener("mousedown", e => e.preventDefault());
  toolbar.addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const cmd = btn.dataset.cmd, act = btn.dataset.act, block = btn.dataset.block;
    editor.focus();
    if (cmd === "createLink") {
      const url = prompt("Link URL:"); if (url) document.execCommand("createLink", false, url);
    } else if (block) {
      document.execCommand("formatBlock", false, block);
    } else if (cmd) {
      document.execCommand(cmd, false, null);
    } else if (act === "code") {
      wrapInlineCode(editor);
    } else if (act === "br") {
      document.execCommand("insertHTML", false, "<br>");
    } else if (act === "hr") {
      document.execCommand("insertHorizontalRule", false);
    } else if (act === "image") {
      pendingEditor = editor; pendingTerm = imgPrefix; pendingSubdir = subdir || ""; fileInput.click();
    } else if (act === "folder") {
      linkFolder();
    } else if (act === "clear") {
      editor.innerHTML = "";
    }
    editor.focus();
  });
  editor.addEventListener("paste", e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.indexOf("image/") === 0) {
        e.preventDefault();
        const blob = it.getAsFile();
        if (blob) handleImageBlob(blob, editor, imgPrefix, subdir);
        return;
      }
    }
  });
  // drag-and-drop image FILES (incl. animated .gif — dropped files keep their
  // real MIME type, unlike clipboard paste which flattens a GIF to a static PNG)
  editor.addEventListener("dragover", e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault();
  });
  editor.addEventListener("drop", e => {
    const files = (e.dataTransfer && e.dataTransfer.files) || [];
    const imgs = Array.from(files).filter(f => (f.type && f.type.indexOf("image/") === 0) || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(f.name || ""));
    if (!imgs.length) return;              // let non-image drops behave normally
    e.preventDefault();
    imgs.forEach(f => handleImageBlob(f, editor, imgPrefix, subdir));
  });
  editor.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.shiftKey) {           // explicit line break
      e.preventDefault();
      document.execCommand("insertHTML", false, "<br>");
    }
    if (e.key === "Tab") {                            // tab -> indent, don't leave editor
      e.preventDefault();
      document.execCommand("insertHTML", false, "\u00a0\u00a0");
    }
  });
}

/* wrap the current selection in inline <code>\u2026</code> (monospace) */
function wrapInlineCode(editor) {
  const sel = getSelection();
  if (!sel || !sel.rangeCount) return;
  const text = sel.toString();
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  document.execCommand("insertHTML", false, "<code>" + (text ? esc(text) : "\u200b") + "</code>\u200b");
}

/* ---- Theme picker ---- */
/* The theme follows the hub. Cookies are keyed by host and ignore the port, so
   one `tech_theme` value is shared by the hub (:8500) and every module — picking
   a theme anywhere moves them all. localStorage stays the standalone fallback
   for running this app on its own (or over file://, where cookies are blocked). */
const THEME_COOKIE = "tech_theme";
const THEMES = ["dark", "moonlight", "gray", "soft", "white", "colorful", "cartoon"];
function _setCookie(k, v) {
  try { document.cookie = k + "=" + encodeURIComponent(v) + ";path=/;max-age=31536000;SameSite=Lax"; }
  catch (e) {}
}
function _getCookie(k) {
  try {
    const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + k + "=([^;]+)"));
    return m ? decodeURIComponent(m[1]) : null;
  } catch (e) { return null; }
}
function applyTheme(name) {
  if (!THEMES.includes(name)) name = "dark";      // ignore an unknown/stale value
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("mcp-theme", name); } catch (e) {}
  _setCookie(THEME_COOKIE, name);                 // tell the hub and the other modules
  // Broadcasts to other open pages and mirrors to Drive, once the modules that
  // provide it have loaded. Anchored on the cookie line rather than the end of
  // applyTheme, because AgenticAI's also re-renders the open document.
  window.__pghubSettings?.setTheme(name);
}
let savedTheme = _getCookie(THEME_COOKIE);        // the hub's choice wins on load
if (!savedTheme) { try { savedTheme = localStorage.getItem("mcp-theme"); } catch (e) {} }
applyTheme(savedTheme || "dark");
/* catch a theme changed in the hub while this tab sat in the background */
function syncThemeFromHub() {
  const c = _getCookie(THEME_COOKIE);
  if (c && c !== document.documentElement.getAttribute("data-theme")) applyTheme(c);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncThemeFromHub(); });
window.addEventListener("focus", syncThemeFromHub);

let searchHits = [], searchShown = 0, notesIndex = {};

function getNotesIndex() {
  if (SERVER) return getServerNotes();
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("mcp-note:") === 0) out[k.slice(9)] = localStorage.getItem(k);
    }
  } catch (e) {}
  return Promise.resolve(out);
}
function snippetHTML(text, idx, len) {
  const pad = 110;                                   // ~a line of context each side
  const s = Math.max(0, idx - pad), e = Math.min(text.length, idx + len + pad);
  return (s > 0 ? "… " : "") + escapeHtml(text.slice(s, idx)) +
         "<mark>" + escapeHtml(text.slice(idx, idx + len)) + "</mark>" +
         escapeHtml(text.slice(idx + len, e)) + (e < text.length ? " …" : "");
}
function fieldsOf(item, type) {
  const f = [];
  if (type === "Term") {
    f.push(["Title", item.title], ["Summary", item.lede || ""],
           [item.builtin ? "What it is" : "Details", stripHtml(item.what || "")],
           ["Why", item.why || ""], ["How to apply", (item.apply || []).join("  •  ")],
           ["Example", item.code || ""]);
  } else if (type === "Topic") {
    f.push(["Title", item.title], ["Summary", item.summary || ""],
           ["Content", stripHtml(item.content || "")]);
  } else {
    f.push(["Title", item.title], ["Question", stripHtml(item.question || "")],
           ["Answer", stripHtml(item.answer || "")]);
  }
  const nid = type === "QA" ? qaNoteId(item.id) : type === "Topic" ? topicNoteId(item.id) : item.id;
  if (notesIndex[nid]) f.push(["Notes", stripHtml(notesIndex[nid])]);
  return f;
}
function computeHits(q) {
  const ql = q.toLowerCase(), hits = [];
  function scan(item, type, open) {
    fieldsOf(item, type).forEach(([name, text]) => {
      if (!text) return;
      const tl = text.toLowerCase();
      let idx = tl.indexOf(ql);
      while (idx !== -1) {
        hits.push({ id: item.id, title: item.title, type, field: name, html: snippetHTML(text, idx, q.length), open });
        idx = tl.indexOf(ql, idx + ql.length);
      }
    });
  }
  Object.values(TERMS).forEach(t => scan(t, "Term", () => select(t.id)));
  Object.values(QA_INDEX).forEach(t => scan(t, "QA", () => selectQA(t.id)));
  Object.values(TOPIC_INDEX).forEach(t => scan(t, "Topic", () => selectTopic(t.id)));
  // docs: search line-by-line so each hit links to its exact line in the doc
  DOCS.forEach(d => {
    (d.markdown || "").replace(/\r\n?/g, "\n").split("\n").forEach((ln, li) => {
      const tl = ln.toLowerCase();
      let idx = tl.indexOf(ql);
      while (idx !== -1) {
        hits.push({ id: d.name, title: d.title || d.name, type: "Doc", field: "Line " + (li + 1),
          html: snippetHTML(ln, idx, q.length), open: () => openDocAt(d.name, li, q) });
        idx = tl.indexOf(ql, idx + ql.length);
      }
    });
  });
  return hits;
}
function renderSearchPage() {
  searchHits.slice(searchShown, searchShown + SEARCH_PAGE).forEach(h => {
    const el = document.createElement("div");
    el.className = "sr-hit";
    el.innerHTML = `<div class="sr-meta"><span class="sr-type">${h.type}</span>` +
      `<span class="sr-title">${escapeHtml(h.title)}</span><span class="sr-field">${h.field}</span></div>` +
      `<div class="sr-snippet">${h.html}</div>`;
    el.addEventListener("click", h.open);
    searchResults.appendChild(el);
  });
  searchShown = Math.min(searchShown + SEARCH_PAGE, searchHits.length);
  searchMore.innerHTML = "";
  const remaining = searchHits.length - searchShown;
  if (remaining > 0) {
    const btn = document.createElement("button");
    btn.className = "sr-more-btn";
    btn.textContent = `Fetch more (${remaining} more)`;
    btn.addEventListener("click", renderSearchPage);
    searchMore.appendChild(btn);
  }
}
function runSearch(q) {
  q = (q || "").trim();
  searchResults.innerHTML = ""; searchMore.innerHTML = ""; searchShown = 0; searchHits = [];
  if (!q) { searchSummary.textContent = ""; searchResults.innerHTML = '<div class="sr-empty">Type to search the full text of every Term and QA (including notes).</div>'; return; }
  searchHits = computeHits(q);
  const items = new Set(searchHits.map(h => h.type + h.id)).size;
  searchSummary.innerHTML = searchHits.length
    ? `<b>${searchHits.length}</b> occurrence${searchHits.length > 1 ? "s" : ""} across <b>${items}</b> item${items > 1 ? "s" : ""}`
    : "No matches.";
  renderSearchPage();
}
function openSearch() {
  Promise.all([getNotesIndex(), loadDocs()]).then(([idx]) => { notesIndex = idx || {}; runSearch(searchInputEl.value); });
  setTimeout(() => searchInputEl.focus(), 0);
}
let searchTimer = null;
searchInputEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(searchInputEl.value), 150);
});

/* ---- Docs (renders .md files from the ./docs/ folder in the main pane) ---- */
let DOCS = [], docsLoaded = false, currentDocName = null;

async function loadDocs() {
  if (docsLoaded) return DOCS;
  if (SERVER) {
    try {
      const r = await fetch("/docs");
      if (r.ok) { DOCS = await r.json(); docsLoaded = true; }
    } catch (e) { DOCS = []; }
  } else {
    docsLoaded = true;
  }
  return DOCS;
}

/* --- inline markdown (bold / italic / code / links / images) --- */
function mdInline(s) {
  s = escapeHtml(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, (m, alt, src) => `<img alt="${alt}" src="${src}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, (m, t, h) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_/g, "$1<em>$2</em>");
  return s;
}

/* --- block markdown -> HTML; each block carries data-line for search jumps --- */
function renderMarkdown(md) {
  const lines = (md || "").replace(/\r\n?/g, "\n").split("\n");
  const at = n => ` data-line="${n}"`;
  const listRe = /^\s*([-*+]|\d+\.)\s+/;
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*```(.*)$/);
    if (fence) {
      const start = i; i++;
      const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;                                                   // consume closing fence
      html += `<pre${at(start)}><code>${escapeHtml(buf.join("\n"))}</code></pre>`;
      continue;
    }
    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (h) { html += `<h${h[1].length}${at(i)}>${mdInline(h[2].trim())}</h${h[1].length}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += `<hr${at(i)}>`; i++; continue; }
    // table: header row followed by a |---|---| separator
    if (line.includes("|") && i + 1 < lines.length &&
        /-/.test(lines[i + 1]) && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const start = i;
      const row = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const heads = row(line); i += 2;
      let body = "";
      while (i < lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])) {
        body += "<tr>" + row(lines[i]).map(c => `<td>${mdInline(c)}</td>`).join("") + "</tr>"; i++;
      }
      html += `<table${at(start)}><thead><tr>${heads.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if (/^\s*>/.test(line)) {
      const start = i; const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html += `<blockquote${at(start)}>${mdInline(buf.join(" "))}</blockquote>`;
      continue;
    }
    if (listRe.test(line)) {
      const ordered = /^\s*\d+\.\s+/.test(line);
      const start = i; let items = "";
      while (i < lines.length && listRe.test(lines[i])) {
        items += `<li${at(i)}>${mdInline(lines[i].replace(listRe, ""))}</li>`; i++;
      }
      html += `<${ordered ? "ol" : "ul"}${at(start)}>${items}</${ordered ? "ol" : "ul"}>`;
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    const start = i; const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6})\s/.test(lines[i]) &&
           !/^\s*```/.test(lines[i]) && !/^\s*>/.test(lines[i]) && !listRe.test(lines[i]) &&
           !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
    html += `<p${at(start)}>${mdInline(buf.join(" "))}</p>`;
  }
  return html;
}

/* open a doc in the main pane (its title stays highlighted in the Docs sidebar) */
/* show the reading pane with the Docs top-tab highlighted */
function showDocsPane() {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "docs"));
  overview.classList.remove("show");
  searchView.classList.remove("show");
  main.style.display = "block";
  if (typeof stopGlobe === "function") stopGlobe();
}

/* render one doc's markdown into the main pane */
function renderDoc(name) {
  const doc = DOCS.find(d => d.name === name);
  if (!doc) return false;
  currentDocName = name;
  markActive(name);
  if (doc.type === "pdf") {
    detail.innerHTML =
      `<div class="pdf-view">` +
        `<div class="pdf-bar"><span class="pdf-name">${escapeHtml(doc.title || doc.name)}</span>` +
        `<a href="${doc.url}">Open full page →</a></div>` +
        `<iframe class="pdf-frame" src="${doc.url}" title="${escapeHtml(doc.name)}"></iframe>` +
      `</div>`;
  } else {
    detail.innerHTML = `<div class="markdown-body">${renderMarkdown(doc.markdown)}</div>`;
  }
  // A document needs a way out that does not depend on the sidebar. Injected
  // after the body is built, because the six renderDoc variants across these
  // pages assemble `detail` differently but all end here.
  detail.insertAdjacentHTML("afterbegin",
    `<div class="doc-back">` +
      `<button type="button" data-act="docs-back">\u2190 All documents</button>` +
      `<button type="button" class="doc-close" data-act="docs-back" title="Close document" aria-label="Close document">\u2715</button>` +
    `</div>`);
  detail.querySelectorAll('[data-act="docs-back"]').forEach(b =>
    b.addEventListener("click", renderDocsIndex));
  history.replaceState(null, "", "#doc/" + encodeURIComponent(name));
  main.scrollTop = 0;
  return true;
}

/* entry point for the Docs tab (top tab or sidebar tab): show a doc, or a hint if none */
/* A document's kind, for the card. Some baked entries predate the `type`
   field, so fall back to the extension rather than mislabelling them. */
function docKind(d) {
  const t = d.type || (/\.md$/i.test(d.name) ? "markdown" : /\.pdf$/i.test(d.name) ? "pdf" : "html");
  return t === "markdown" ? "Markdown" : t === "pdf" ? "PDF" : "Page";
}

/* One card per document. */
function docBox(d) {
  const el = document.createElement("div");
  el.className = "box doc-box";
  el.innerHTML = `<div class="b-title">${escapeHtml(d.title || d.name)}</div>` +
                 `<div class="b-kind">${docKind(d)}</div>`;
  el.title = d.name;
  el.addEventListener("click", () => selectDoc(d.name));
  return el;
}

/* The Docs landing page: what this module actually holds. */
function renderDocsIndex() {
  currentDocName = null;
  markActive(null);
  detail.innerHTML = "";
  if (!DOCS.length) {
      detail.innerHTML = `<div class="markdown-body"><p style="color:var(--muted)">${SERVER
        ? "No <code>.md</code> files in the <code>docs/</code> folder yet — drop some in and reload."
        : "Docs live in Google Drive — sign in to load them."}</p></div>`;
    history.replaceState(null, "", "#docs");
    return;
  }
  const head = document.createElement("div");
  head.className = "docs-index-head";
  head.innerHTML = `<h2>Documents</h2><span class="count">${DOCS.length}</span>`;
  detail.appendChild(head);
  const boxes = document.createElement("div");
  boxes.className = "boxes";
  DOCS.forEach(d => boxes.appendChild(docBox(d)));
  detail.appendChild(boxes);
  history.replaceState(null, "", "#docs");
  main.scrollTop = 0;
}

function enterDocs() {
  loadDocs().then(() => {
    setNavSection("docs");
    showDocsPane();
    renderDocsIndex();
  });
}

/* clicking a doc in the sidebar opens it in the main pane */
function selectDoc(name) {
  if (!DOCS.find(d => d.name === name)) return;
  setNavSection("docs");
  showDocsPane();
  renderDoc(name);
}

/* open a doc from a search hit and jump to the matching line */
async function openDocAt(name, lineNo, query) {
  await loadDocs();
  setNavSection("docs");
  showDocsPane();
  renderDoc(name);
  requestAnimationFrame(() => scrollDocToLine(lineNo, query));
}

function scrollDocToLine(lineNo, query) {
  const blocks = [...detail.querySelectorAll("[data-line]")];
  if (!blocks.length) return;
  let target = blocks.find(b => +b.getAttribute("data-line") === lineNo);
  if (!target) {                                            // otherwise, the block that contains this line
    blocks.forEach(b => {
      const bl = +b.getAttribute("data-line");
      if (bl <= lineNo && (!target || bl > +target.getAttribute("data-line"))) target = b;
    });
  }
  if (!target) target = blocks[0];
  target.scrollIntoView({ block: "center", behavior: "smooth" });
  target.classList.remove("doc-flash"); void target.offsetWidth; target.classList.add("doc-flash");
  setTimeout(() => target.classList.remove("doc-flash"), 2000);
  highlightMatch(target, query);
}

function highlightMatch(el, query) {
  if (!query) return;
  const q = query.toLowerCase();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while (n = walker.nextNode()) nodes.push(n);
  for (const node of nodes) {
    const idx = node.nodeValue.toLowerCase().indexOf(q);
    if (idx === -1) continue;
    const after = node.splitText(idx);
    after.splitText(query.length);
    const mark = document.createElement("mark");
    mark.className = "doc-hit";
    mark.textContent = after.nodeValue;
    after.parentNode.replaceChild(mark, after);
    setTimeout(() => {
      if (mark.parentNode) mark.parentNode.replaceChild(document.createTextNode(mark.textContent), mark);
    }, 4000);
    break;
  }
}

/* ---- Init ---- */
async function boot() {
  [customTerms, qaItems, topicItems] = await Promise.all([loadCustomTerms(), loadQA(), loadTopics()]);
  // ensure built-in terms live in the store; seed any that are missing
  const seed = builtinSeed();
  const missing = Object.keys(seed).filter(id => !customTerms[id]);
  if (missing.length) {
    missing.forEach(id => { customTerms[id] = seed[id]; });
    if (SERVER) {
      for (const id of missing) {
        try { await fetch("/terms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(seed[id]) }); } catch (e) {}
      }
    } else {
      try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(serializeMap(customTerms))); } catch (e) {}
    }
  }
  rebuildData();
  rebuildQAData();
  rebuildTopicData();
  initFolder();
  // restore sidebar open/closed + tree/flat view
  // Stacked above the content on a phone, an open sidebar would push the
  // detail off-screen on arrival, so it starts closed there — but only when
  // the user has expressed no preference of their own.
  const navPref = loadPref("mcp-nav-open", "");
  const narrow  = window.matchMedia("(max-width: 860px)").matches;
  if (navPref === "0" || (navPref === "" && narrow)) layout.classList.add("nav-closed");
  const savedView = loadPref("mcp-nav-view", "tree");
  btnTree.classList.toggle("active", savedView === "tree");
  btnFlat.classList.toggle("active", savedView !== "tree");
  renderSidebar(savedView);
  const initial = location.hash.slice(1);
  if (initial === "docs") {                       // the Docs landing list
    await loadDocs();
    enterDocs();
  } else if (initial.startsWith("doc/")) {        // deep link to a doc: #doc/<filename>
    const nm = decodeURIComponent(initial.slice(4));
    await loadDocs();
    if (DOCS.find(d => d.name === nm)) selectDoc(nm);
    // A link to a document since renamed or removed should land on the list it
    // belongs to, not on an unrelated term.
    else enterDocs();
  } else if (initial.startsWith("topic/") && TOPIC_INDEX[initial.slice(6)]) {
    selectTopic(initial.slice(6));                // #topic/<id>
    loadDocs();
  } else if (initial.startsWith("qa/") && QA_INDEX[initial.slice(3)]) {
    selectQA(initial.slice(3));                   // #qa/<id>
    loadDocs();
  } else {
    select(TERMS[initial] ? initial : GROUPS[0].terms[0].id);
    loadDocs();                                   // warm the docs cache so Search covers them immediately
  }
}
boot();

/* ===== Universal code highlighter — python | js | ts | java | xml | pseudo =====
   Collision-proof: everything lives in this IIFE, so it never clashes with an
   app's own highlightCode/LANG_KW. It highlights every read-only <pre><code>
   (skipping contenteditable editors) and re-highlights on each detail render. */
const HLMOD = (function () {
  const KW = {
    java: new Set(("abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var yield record sealed permits when true false null").split(" ")),
    python: new Set(("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case self cls True False None print len range str int float dict list set tuple bool").split(" ")),
    ts: new Set(("break case catch class const continue debugger default delete do else enum export extends finally for function if import in instanceof new return super switch this throw try typeof var void while with yield let static async await of abstract as asserts declare implements infer interface is keyof namespace never override private protected public readonly require satisfies type unique unknown any accessor out using boolean number string symbol object bigint undefined null true false console").split(" ")),
    pseudo: new Set(("if then else elif endif fi for foreach while do done repeat until loop return function procedure proc def end begin let set print output input read write and or not true false null nil to step in of break continue call").split(" ")),
  };
  const RE = {
    java: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*[fFdDlL]?\b)|([A-Za-z_$][\w$]*)/g,
    python: /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*\.?[\d_]*\b)|([A-Za-z_]\w*)/g,
    ts: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*n?\b)|([A-Za-z_$][\w$]*)/g,
    pseudo: /(#[^\n]*|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|($.^)|(\b\d[\d_]*\.?[\d_]*\b)|([A-Za-z_]\w*)/g,
  };
  const ALIAS = { js: "ts", javascript: "ts", typescript: "ts", py: "python", python3: "python", html: "xml", xhtml: "xml", plaintext: "pseudo", text: "pseudo", pseudocode: "pseudo" };
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function normLang(lang) {
    lang = (lang || "").toLowerCase();
    lang = ALIAS[lang] || lang;
    return (KW[lang] || lang === "xml") ? lang : null;
  }

  function highlightWords(src, L) {
    const kw = KW[L], re = RE[L];
    re.lastIndex = 0;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = re.lastIndex;
      if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
      else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="tok-ann">${esc(m[3])}</span>`;
      else if (m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
      else {
        const w = m[5];
        if (kw.has(w)) out += `<span class="tok-kw">${esc(w)}</span>`;
        else if (/^[A-Z]/.test(w)) out += `<span class="tok-cls">${esc(w)}</span>`;
        else out += esc(w);
      }
    }
    out += esc(src.slice(last));
    return out;
  }

  function highlightXml(src) {
    const re = /(<!--[\s\S]*?-->)|(<[?!]?\/?)([\w:.-]+)((?:\s+[\w:.-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'))?)*)(\s*\/?[?]?>)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = re.lastIndex;
      if (m[1]) { out += `<span class="tok-com">${esc(m[1])}</span>`; continue; }
      let s = `<span class="tok-kw">${esc(m[2])}${esc(m[3])}</span>`;
      s += (m[4] || "").replace(/([\w:.-]+)(\s*=\s*)?("[^"]*"|'[^']*')?/g, (mm, name, eq, val) =>
        !name ? mm :
          `<span class="tok-cls">${esc(name)}</span>` + (eq || "") + (val ? `<span class="tok-str">${esc(val)}</span>` : ""));
      s += `<span class="tok-kw">${esc(m[5])}</span>`;
      out += s;
    }
    out += esc(src.slice(last));
    return out;
  }

  function highlightCode(src, lang) {
    const L = normLang(lang) || detectLang(src);
    return L === "xml" ? highlightXml(src) : highlightWords(src, L);
  }

  function detectLang(s) {
    const t = (s || "").trim();
    if (/^<[!?/a-zA-Z]/.test(t) && /(<\/[a-zA-Z]|\/>|<[a-zA-Z][\w:.-]*[\s/>]|<!--|<\?xml)/.test(t)) return "xml";
    if (/(^|\n)\s*(def |class \w|import \w|from \w+ import|print\()/.test(t) || /:\s*\n/.test(t) && /\bself\b/.test(t)) return "python";
    if (/\b(public|private|protected)\s+(class|static|void|final)|System\.out|\bpackage\s+[\w.]+;|void\s+main/.test(t)) return "java";
    if (/\b(interface|type)\s+[A-Za-z]|:\s*(string|number|boolean)\b|=>|\bconst\s+\w+\s*[:=]|\bfunction\b|console\./.test(t)) return "ts";
    if (/(^|\n)\s*#/.test(t)) return "python";
    return "pseudo";
  }

  return { highlightCode, detectLang, normLang };
})();

(function () {
  function hlOne(code) {
    if (code.dataset.hlx) return;                                  // my own idempotency flag
    if (code.closest && code.closest('[contenteditable="true"], [contenteditable=""]')) return;  // never touch live editors
    if (!code.dataset.lang && code.children.length) return;        // leave pre-highlighted / hand-styled blocks alone
    const lang = code.dataset.lang || HLMOD.detectLang(code.textContent);
    code.dataset.hlx = "1";
    code.innerHTML = HLMOD.highlightCode(code.textContent, lang);
  }
  function hlScan(root) { if (root && root.querySelectorAll) root.querySelectorAll("pre code").forEach(hlOne); }
  const obs = new MutationObserver(ms => {
    for (const mu of ms) for (const n of mu.addedNodes) {
      if (n.nodeType !== 1) continue;
      if (n.matches && n.matches("pre code")) hlOne(n);
      if (n.querySelectorAll) n.querySelectorAll("pre code").forEach(hlOne);
    }
  });
  const roots = ["main", "drawer"].map(id => document.getElementById(id)).filter(Boolean);
  (roots.length ? roots : [document.body]).forEach(r => obs.observe(r, { childList: true, subtree: true }));
  hlScan(document);
})();
</script>
