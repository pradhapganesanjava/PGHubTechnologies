<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Bridge between the app's startup and the Drive-backed store.
 *
 * The application below is a classic (non-module) script, so it executes during
 * parsing — before app/boot.js, which is a module and therefore deferred. Its
 * first act is to fetch('/terms'), and on a static host that would 404 long
 * before the store exists to answer it.
 *
 * So window.fetch is replaced up front with a version that parks every call.
 * Once the store installs it calls __pghubInstall, the parked calls are
 * replayed into it, and fetch behaves normally from then on. The app just
 * experiences a slightly slow first request.
 */
(function () {
  // Which Drive folder this page's content lives in. Stamped in by
  // tools/build-app.py from the folder the page sits in.
  window.__pghubModule = "ReactJs";
  var native = window.fetch.bind(window);
  // Published so the store can pass non-app requests straight to the browser.
  // It cannot capture window.fetch itself: by the time its module is imported
  // this shim has already replaced it, so what it would capture is the shim —
  // and passthrough would call back into the handler forever.
  window.__pghubNativeFetch = native;
  var parked = [];
  var handler = null;
  window.__pghubInstall = function (fn) {
    handler = fn;
    var queued = parked.splice(0);
    for (var i = 0; i < queued.length; i++) queued[i]();
  };
  window.fetch = function (input, init) {
    if (handler) return handler(input, init);
    return new Promise(function (resolve, reject) {
      parked.push(function () { (handler || native)(input, init).then(resolve, reject); });
    });
  };
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReactNotes — Terms</title>
<style>
  /* ===== Dark (default) ===== */
  :root, [data-theme="dark"] {
    --bg: #0f1117;
    --panel: #161922;
    --panel-2: #1d2230;
    --border: #2a2f3d;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --accent-soft: #1e2a44;
    --chip: #2a3550;
    --code-bg: #0b0d13;
    --code-text: #c8d3f5;
    --accent-ink: #0b0d13;
    --ok: #3fb950;
    --warn: #e3a008;
    --danger: #e5534b;
  }
  [data-theme="soft"], [data-theme="white"],
  [data-theme="colorful"], [data-theme="cartoon"] {
    --ok: #1a7f37;
    --warn: #9a6700;
    --danger: #cf222e;
  }

  /* ===== Moonlight ===== */
  [data-theme="moonlight"] {
    --bg: #0b1023; --panel: #121833; --panel-2: #1a2244; --border: #27305a;
    --text: #dfe4ff; --muted: #8e98c9; --accent: #8b9dff; --accent-soft: #1f2a55;
    --chip: #26305c; --code-bg: #080c1c; --code-text: #aeb8ff; --accent-ink: #0b1023;
  }

  /* ===== Gray ===== */
  [data-theme="gray"] {
    --bg: #2b2f36; --panel: #33383f; --panel-2: #3c424a; --border: #4a5159;
    --text: #e7e9ec; --muted: #a7aeb6; --accent: #9fb0c0; --accent-soft: #3f4651;
    --chip: #444b54; --code-bg: #23272d; --code-text: #cdd3da; --accent-ink: #1b1e23;
  }

  /* ===== Soft ===== */
  [data-theme="soft"] {
    --bg: #f6f4f1; --panel: #fffdfb; --panel-2: #f0ebe5; --border: #e6ded6;
    --text: #4b4658; --muted: #9b93a3; --accent: #9d8ec2; --accent-soft: #ece7f5;
    --chip: #ece6f1; --code-bg: #f4efea; --code-text: #6f6678; --accent-ink: #ffffff;
  }

  /* ===== White ===== */
  [data-theme="white"] {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f6; --border: #dfe3ea;
    --text: #1a1d24; --muted: #667085; --accent: #2563eb; --accent-soft: #e5edff;
    --chip: #e8edf7; --code-bg: #f3f5f9; --code-text: #334155; --accent-ink: #ffffff;
  }

  /* ===== Colorful ===== */
  [data-theme="colorful"] {
    --bg: #fef6ff; --panel: #ffffff; --panel-2: #fbeeff; --border: #f0d7f5;
    --text: #2a1b33; --muted: #8a6f93; --accent: #e0179d; --accent-soft: #ffe1f4;
    --chip: #ffe6f7; --code-bg: #2a1b33; --code-text: #ffd6f0; --accent-ink: #ffffff;
  }

  /* ===== Cartoon ===== */
  [data-theme="cartoon"] {
    --bg: #fffbe7; --panel: #ffffff; --panel-2: #fff3c4; --border: #1a1a1a;
    --text: #1a1a1a; --muted: #7a6f3a; --accent: #ff5c8a; --accent-soft: #ffe0ea;
    --chip: #ffe9a8; --code-bg: #1a1a1a; --code-text: #ffe27a; --accent-ink: #1a1a1a;
  }
  [data-theme="cartoon"] .box { border-width: 2px; box-shadow: 3px 3px 0 var(--border); }
  [data-theme="cartoon"] .box:hover { box-shadow: 5px 5px 0 var(--accent); }
  [data-theme="cartoon"] .tab-btn.active,
  [data-theme="cartoon"] #drawer { box-shadow: -3px 0 0 rgba(0,0,0,.15); }
  [data-theme="cartoon"] .tag-chip,
  [data-theme="cartoon"] .related .pill { border: 2px solid var(--border); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #b692ff);
    display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }

  /* Top tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* Theme picker */
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ===== Narrow screens =====
     The desktop layout is a fixed sidebar beside a flexible main. On a 390px
     phone that leaves main at a handful of characters, and the header's
     right-hand cluster — five tabs plus the theme picker — will not wrap, so
     the document comes out wider than the screen and scrolls sideways.

     Below 860px, the same breakpoint the hub uses, the sidebar stacks above the
     content at full width instead of competing with it, and the header wraps
     its controls onto a second row. Stacking rather than overlaying is
     deliberate: an overlay anchored at top:0 would cover the very button that
     closes it, and anchoring below a header whose height changes when it wraps
     is fragile. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1.05rem; }
    .sub { display: none; }                 /* the tagline is on the hub card too */

    /* display:contents dissolves the wrapper so its children become direct flex
       items of the header. That is what lets the theme picker sit at the end of
       the title row while the tabs claim a full-width row of their own —
       otherwise the five tabs share the remainder with the picker and the last
       two are cut off, reachable only by a horizontal swipe nobody would guess
       at. */
    .header-right { display: contents; }
    .tp { margin-left: auto; flex: 0 0 auto; }
    /* order pulls the tabs after the picker so the header settles into two rows
       (title + picker, then tabs) rather than three. Without it the full-width
       tabs break the line first and the picker is stranded on a row of its own. */
    .tabs { order: 1; flex: 0 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; }

    .layout { flex-direction: column; }
    .layout > aside:not(#drawer) {
      width: 100%; min-width: 0; max-height: 45vh;
      border-right: 0; border-bottom: 1px solid var(--border);
    }

    main { padding: 20px 16px 64px; }
    .detail, .detail:has(.pdf-view), .sv-head, #search-results, #search-more, .sr-empty { max-width: 100%; }
    .pdf-frame { height: 70vh; }
    .boxes { grid-template-columns: 1fr; }
    .ov-globe { height: 60vh; }
  }

  .layout { display: flex; flex: 1; min-height: 0; }
  .nav-toggle { height: 34px; }
  .layout.nav-closed > aside:not(#drawer) { display: none; }

  /* Sidebar */
  aside {
    width: 300px; min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 14px 16px 8px; }
  .nav-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  .nav-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .nav-tabs button.active { background: var(--accent); color: var(--accent-ink); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }

  .search-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .search-row .search { margin-bottom: 0; flex: 1; }
  .view-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .view-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center;
  }
  .view-toggle button svg, .icon-btn svg { display: block; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    flex: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  nav { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }

  .group { margin-bottom: 4px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .group-head:hover { background: var(--panel-2); }
  .group-head .caret { transition: transform .15s ease; color: var(--muted); font-size: 11px; width: 12px; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 10px; }
  .group-items { padding-left: 8px; }
  .group.collapsed .group-items { display: none; }

  .term {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 22px; border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .term:hover { background: var(--panel-2); color: var(--text); }
  .term.active { background: var(--accent-soft); color: #fff; }
  .term.active::before {
    content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .term.hidden, .group.hidden { display: none; }

  /* flat-list mode: the single flat group hides its header */
  nav.flat .group-head { display: none; }
  nav.flat .group-items { padding-left: 0; }
  nav.flat .term { padding-left: 14px; }

  /* Detail pane (Glossary tab) */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; min-width: 0; }
  /* A wide child — a table, a diagram, a code block — must scroll inside its
     own box rather than widening the page. */
  .markdown-body pre, .markdown-body table { max-width: 100%; overflow-x: auto; }
  .detail { max-width: 820px; }
  /* embedded PDF viewer (docs that are .pdf files) */
  .detail:has(.pdf-view) { max-width: 1100px; }
  .pdf-view { display: flex; flex-direction: column; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .pdf-bar .pdf-name { font-weight: 650; color: var(--text); }
  .pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .pdf-bar a:hover { text-decoration: underline; }
  .pdf-frame { width: 100%; height: calc(100vh - 180px); min-height: 480px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag-chip {
    display: inline-block; background: var(--chip); color: var(--accent);
    padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  }
  h2.term-title { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.4px; }
  .lede { font-size: 16px; color: var(--muted); line-height: 1.6; margin: 0 0 26px; }

  .section { margin-bottom: 24px; }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 8px;
  }
  .section p, .section li { line-height: 1.65; font-size: 15px; color: var(--text); }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; }

  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--code-text); }
  p code, li code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }
  pre code { line-height: 1.55; display: block; }

  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 0 0 12px; }
  .flow.col { flex-direction: column; align-items: stretch; }
  .flow.col > .arrow { align-self: flex-start; margin-left: 18px; }
  .flow .node {
    flex: 0 1 auto; min-width: 0; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); color: var(--text);
    font-size: 13.5px; font-weight: 600; line-height: 1.35;
  }
  .flow .node small {
    display: block; margin-top: 2px;
    font-size: 11.5px; font-weight: 400; color: var(--muted);
  }
  .flow .node code { font-size: 12px; background: none; padding: 0; border: 0; color: inherit; }
  .flow .node.accent { border-color: var(--accent); background: var(--accent-soft); }
  .flow .node.good   { border-color: var(--ok); }
  .flow .node.bad    { border-color: var(--danger); }
  .flow .node.warn   { border-color: var(--warn); }
  .flow .node.ghost  { background: none; border-style: dashed; color: var(--muted); }
  .flow .arrow {
    align-self: center; flex: 0 0 auto;
    color: var(--muted); font-size: 15px; line-height: 1;
  }
  .flow .arrow.bad  { color: var(--danger); }
  .flow .arrow.good { color: var(--ok); }
  .flow-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 0 0 5px;
  }
  .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 0 0 12px; }
  .cmp > div { border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; background: var(--panel-2); }
  .cmp h4 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
  .cmp.split > div:first-child { border-left: 3px solid var(--ok); }
  .cmp.split > div:last-child  { border-left: 3px solid var(--danger); }
  .cmp ul { margin: 0; padding-left: 17px; }
  .cmp li { font-size: 13.5px; margin-bottom: 4px; line-height: 1.5; }
  .callout {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    background: var(--panel-2); border-radius: 0 8px 8px 0;
    padding: 9px 13px; margin: 0 0 12px; font-size: 14px; line-height: 1.6;
  }
  .callout.warn   { border-left-color: var(--warn); }
  .callout.danger { border-left-color: var(--danger); }
  .callout.good   { border-left-color: var(--ok); }
  .rich ul { margin: 0; padding-left: 20px; }
  .rich li { margin-bottom: 6px; line-height: 1.6; }

  /* ===== Eclipse-style Java syntax highlighting ===== */
  /* Dark themes (default): IDE dark palette */
  .tok-kw  { color: #cc7832; font-weight: 600; }   /* keywords */
  .tok-str { color: #98c379; }                      /* strings / text blocks / chars */
  .tok-com { color: #7f848e; font-style: italic; }  /* comments */
  .tok-num { color: #6cb6ff; }                      /* numbers */
  .tok-ann { color: #d0b344; }                      /* @annotations */
  .tok-cls { color: #4ec9b0; }                      /* Types (Capitalized) */
  /* Light themes: classic Eclipse palette */
  [data-theme="soft"] .tok-kw, [data-theme="white"] .tok-kw, [data-theme="colorful"] .tok-kw, [data-theme="cartoon"] .tok-kw { color: #7f0055; font-weight: 700; }
  [data-theme="soft"] .tok-str, [data-theme="white"] .tok-str, [data-theme="colorful"] .tok-str, [data-theme="cartoon"] .tok-str { color: #2a00ff; }
  [data-theme="soft"] .tok-com, [data-theme="white"] .tok-com, [data-theme="colorful"] .tok-com, [data-theme="cartoon"] .tok-com { color: #3f7f5f; }
  [data-theme="soft"] .tok-num, [data-theme="white"] .tok-num, [data-theme="colorful"] .tok-num, [data-theme="cartoon"] .tok-num { color: #1750eb; }
  [data-theme="soft"] .tok-ann, [data-theme="white"] .tok-ann, [data-theme="colorful"] .tok-ann, [data-theme="cartoon"] .tok-ann { color: #646464; }
  [data-theme="soft"] .tok-cls, [data-theme="white"] .tok-cls, [data-theme="colorful"] .tok-cls, [data-theme="cartoon"] .tok-cls { color: #267f99; }

  .related { display: flex; flex-wrap: wrap; gap: 8px; }
  .related .pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .related .pill:hover { border-color: var(--accent); color: var(--text); }

  /* Notes (rich text) */
  .note-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .note-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .note-btn:hover { border-color: var(--accent); }
  .note-btn.muted { color: var(--muted); }
  .note-editor {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
    color: var(--text); outline: none;
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .note-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-editor h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-editor a { color: var(--accent); }
  .note-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .note-editor pre, .note-view pre, .rich pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  }
  .note-editor code, .note-view code, .rich code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .note-editor pre code, .note-view pre code, .rich pre code { background: none; border: 0; padding: 0; }
  .note-editor blockquote, .note-view blockquote, .rich blockquote {
    margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic;
  }
  .note-editor h3, .note-view h3, .rich h3 { margin: 12px 0 6px; font-size: 18px; }
  .note-editor hr, .note-view hr, .rich hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .note-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .note-hint b { color: var(--accent); font-weight: 600; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .notes-head h3 { margin: 0; }
  .notes-actions { display: flex; gap: 6px; }
  .note-action {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .note-action:hover { border-color: var(--accent); color: var(--accent); }
  .note-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note-action.primary:hover { color: var(--accent-ink); filter: brightness(1.05); }
  .note-view {

  /* Add-term modal */

  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Terms overview (Terms tab) */
  #overview { flex: 1; overflow-y: auto; padding: 30px 40px 80px; display: none; }
  #overview.show { display: block; }
  .ov-head h2 { margin: 0 0 4px; font-size: 24px; }

  .ov-group-title .count { font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
  .ov-group.ov-nested { margin-bottom: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
  .ov-group.ov-nested .ov-group-title .name { font-size: 13.5px; color: var(--muted); }
  /* Docs landing list. The tab used to jump straight into whichever document
     sorted first, so there was no way to see what a module actually held. The
     sidebar lists documents flat — these modules carry no doc tags — so the
     landing list is flat too, and the two agree. */
  .docs-index-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
  .docs-index-head h2 { font-size: 1.15rem; margin: 0; }
  .docs-index-head .count { color: var(--muted); font-size: .85rem; }
  .doc-box { text-align: left; }
  .doc-box .b-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .doc-box .b-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-top: 6px; }

  /* Close bar above an open document — a document is something you come back
     from, so it needs a way out that does not depend on the sidebar. */
  .doc-back { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-back button { background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12px;
    font-family: inherit; font-weight: 600; cursor: pointer; }
  .doc-back button:hover { color: var(--text); border-color: var(--accent); }
  .doc-back .doc-close { margin-left: auto; padding: 5px 9px; }

  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s, background .15s;
  }
  .box:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-2px); }

  /* Overview view toggle + Wall view */
  .ov-toggle { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
  .ov-toggle button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; }

  }
  .chip-term:hover { transform: scale(1.08); background: var(--panel-2); box-shadow: 0 5px 16px rgba(0,0,0,.28); }

  /* Globe view */

  .globe-chip {

    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    will-change: transform, opacity; user-select: none;
  }
  .globe-chip:hover { background: var(--panel-2); }
  .globe-controls { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px auto 0; }
  .gc-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    width: 40px; height: 38px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 700; line-height: 1; display: grid; place-items: center;
    user-select: none; touch-action: none;
  }
  .gc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gc-btn:active { background: var(--accent); color: var(--accent-ink); }
  .gc-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Search view */
  #search-view { flex: 1; overflow-y: auto; padding: 26px 40px 80px; display: none; }
  #search-view.show { display: block; }
  .sv-head { max-width: 820px; margin: 0 auto 16px; }
  #search-input {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .sv-summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sv-summary b { color: var(--text); }
  #search-results { max-width: 820px; margin: 0 auto; }
  .sr-hit { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; }
  .sr-hit:hover { border-color: var(--accent); }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sr-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; background: var(--chip); color: var(--accent); }
  .sr-title { font-weight: 650; font-size: 14px; }
  .sr-field { font-size: 11px; color: var(--muted); margin-left: auto; }
  .sr-snippet { font-size: 13.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap; }
  .sr-snippet mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  #search-more { max-width: 820px; margin: 6px auto 0; text-align: center; }
  .sr-more-btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .sr-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sr-empty { color: var(--muted); max-width: 820px; margin: 0 auto; }

  /* Docs (rendered in the main pane, listed in the Terms/QA/Docs sidebar) */
  .nav-empty { color: var(--muted); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  .markdown-body { max-width: 820px; color: var(--text); font-size: 15px; line-height: 1.7; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 700; }
  .markdown-body h1 { font-size: 28px; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 22px; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 18px; }
  .markdown-body h4 { font-size: 15.5px; }
  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body blockquote { margin: 0 0 1em; padding: .4em 1em; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 6px 6px 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-text); padding: .12em .4em; border-radius: 4px; font-size: .88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1em; }
  .markdown-body pre code { background: none; padding: 0; color: var(--code-text); font-size: 13px; line-height: 1.55; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 14px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .markdown-body th { background: var(--panel-2); font-weight: 650; }
  .markdown-body [data-line] { scroll-margin-top: 20px; }
  .doc-flash { animation: docFlash 2s ease-out; border-radius: 6px; }
  @keyframes docFlash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .markdown-body mark.doc-hit { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

  /* Quick-peek tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 300px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px;

  #drawer {

        what: "<p>A <b>component</b> is a reusable, self-contained piece of UI. In modern React it's a <b>JavaScript function</b> that takes <code>props</code> and returns React elements (JSX). Class components still exist but functions + hooks are the standard.</p><p>Components must start with a <b>capital letter</b> (so JSX treats <code>&lt;Button/&gt;</code> as a component, not the DOM tag <code>&lt;button/&gt;</code>) and must be <b>pure</b> during render — same props/state in, same JSX out, no side effects.</p><p class=\"lede\">🗣️ <b>🗣️ In plain English:</b> components are the <b>Lego blocks</b> of your app — every visible part (buttons, inputs, even whole pages) is a component, and you can reuse the same one as many times as you want. Each one is just a JS function that returns markup (JSX).</p><p class=\"lede\">💡 <b>Composition over inheritance:</b> React builds complex UIs by nesting and composing small components and passing <code>children</code>, not by class inheritance.</p><p><b>App</b> <i>(parent)</i> → <b>props ↓</b> <i>(data down)</i> → <b>Card</b> <i>(child)</i> → <b>callback ↑</b> <i>(events up)</i></p><p>Data flows DOWN via props; events flow UP via callbacks.</p>",

/* ---- Index (built-in + custom terms, rebuildable) ---- */
let GROUPS = [];
let TERMS = {};
let customTerms = {};   // id -> custom term (loaded from server or localStorage)

/* nested tags use "::" as the delimiter, e.g. "Reliability::Retries" */
const TAG_SEP = "::";
function tagParts(group) { return (group || "").split(TAG_SEP).map(s => s.trim()).filter(Boolean); }
function tagLeaf(group) { const p = tagParts(group); return p[p.length - 1] || group; }

function rebuildData() {
  GROUPS = []; TERMS = {};
  const byName = {};
  Object.values(customTerms).forEach(t => {
    if (!t.builtin) t._custom = true;
    let g = byName[t.group];
    if (!g) { g = { name: t.group, tag: t.tag || tagLeaf(t.group), terms: [] }; byName[t.group] = g; GROUPS.push(g); }
    g.terms.push(t);
  });
  GROUPS.forEach(g => g.terms.forEach(t => { t._group = g; TERMS[t.id] = t; }));
}

/* drop runtime-only props (_group back-ref, _custom) before persisting */
function stripRuntime(o) {
  const c = {};
  for (const k in o) if (k.charAt(0) !== "_") c[k] = o[k];
  return c;
}
function serializeMap(map) {
  const out = {};
  for (const id in map) out[id] = stripRuntime(map[id]);
  return out;
}

/* built-in terms become seed rows in the store (terms.json / localStorage) */
function builtinSeed() {
  const out = {};
  BUILTIN_GROUPS.forEach(g => g.terms.forEach(t => {
    out[t.id] = {
      id: t.id, title: t.title, group: g.name, tag: g.tag,
      lede: t.lede, what: t.what, why: t.why, apply: t.apply,
      code: t.code, related: t.related, builtin: true
    };
  }));
  return out;
}

    group: "Interview::Rendering",
    question: "What is the <code>key</code> prop for, and what goes wrong if you use the array index?",
    answer: "<div class=\"callout good\">Keys are <b>identity</b> among siblings. React matches old\u2194new children by key to reuse DOM and component state. They must be stable, unique among siblings, and predictable.</div><ul><li>Index keys are OK only for <b>static lists</b> that never reorder, filter, or insert.</li><li>On reorder/delete, index keys attach the wrong state to the wrong row (inputs swap values, animations glitch).</li><li>Never use <code>Math.random()</code> or a new UUID per render \u2014 that remounts every time.</li><li>Changing a key on purpose is how you <b>reset</b> a subtree.</li></ul>"
  },
  {
    id: "qa-rerender",
    group: "Interview::Rendering",
    question: "What does re-rendering mean in React?",
    answer: "<div class=\"callout good\">A re-render means React <b>calls your function again</b> with the latest props/state and diffs the returned elements. It is not 'the DOM refreshed'. Most re-renders never touch the DOM.</div><ul><li>Triggered by: state setter in this component, parent re-render, context value change, a hook that subscribes (store).</li><li>Cheap for small components. Expensive when you do heavy work in the body or pass new object/fn props into a large memoized child.</li><li>Preventing every re-render is not the goal. Preventing <b>wasted expensive</b> ones is.</li></ul>"
  },
  {
    id: "qa-hydration",
    group: "Interview::Rendering",
    question: "What is hydration? When do you use <code>hydrateRoot</code> vs <code>createRoot</code>?",
    answer: "<div class=\"cmp split\"><div><h4>createRoot</h4><ul><li>Client-only apps</li><li>Wipes the container and mounts fresh</li><li>SPA / Vite without SSR</li></ul></div><div><h4>hydrateRoot</h4><ul><li>SSR / SSG HTML already on the page</li><li>Attaches listeners + state to existing DOM</li><li>Mismatch (server HTML \u2260 client render) warns and can rewrite nodes</li></ul></div></div><div class=\"callout\">Mismatch classics: <code>Date.now()</code>, <code>Math.random()</code>, <code>typeof window</code> during render. Defer those to <code>useEffect</code> or a Client Component.</div>"
  },
  {
    id: "qa-portals",
    group: "Interview::Rendering",
    question: "What are Portals, and when do you use them?",
    answer: "<div class=\"callout good\">A portal renders children into a <b>DOM node outside the parent</b> while keeping them in the same React tree \u2014 context, state, and event bubbling still follow React parents.</div><pre><code>createPortal(&lt;div className=\"overlay\"&gt;{children}&lt;/div&gt;, document.getElementById(\"modal-root\"));</code></pre><p>Use for modals, toasts, tooltips, dropdowns that must escape <code>overflow: hidden</code> or a stacking context. Events still bubble through the React parent, which is why a modal can close from an outside click handler higher in the React tree.</p>"
  },
  {
    id: "qa-concurrent",
    group: "Interview::Rendering",
    question: "What are concurrent features, and how does React prioritize updates?",
    answer: "<div class=\"callout good\">Concurrent React (18+) can <b>interrupt rendering</b>. There is no 'Concurrent Mode' flag anymore \u2014 you opt in per update.</div><ul><li><b>Urgent:</b> typing, clicks, hover \u2014 default updates. They preempt transitions.</li><li><b>Transition:</b> <code>startTransition</code> / <code>useTransition</code> \u2014 filtering, tab switches, navigation. Can be interrupted; <code>isPending</code> is true while they work.</li><li><b>Suspense:</b> a child can pause the nearest boundary and show a fallback without blocking siblings.</li><li>Priority is not a number you set. You mark work as a transition when it is OK to be delayed.</li></ul>"
  },
  {
    id: "qa-long-running",
    group: "Interview::Rendering",
    question: "How do you keep expensive work from blocking the UI?",
    answer: "<ul><li>Wrap the state update that reveals the heavy UI in <code>startTransition</code> so typing stays urgent.</li><li><code>useDeferredValue</code> for a lagging copy of a value (search list trails the input).</li><li>Move truly heavy CPU off the main thread: Web Worker, or precompute on the server (RSC).</li><li>Virtualize long lists (<code>react-window</code> / <code>@tanstack/react-virtual</code>).</li><li>Don't put 10k-item <code>.map</code> in the render path without a transition or virtualization.</li></ul><pre><code>const [q, setQ] = useState(\"\");\nconst [isPending, startTransition] = useTransition();\nconst onChange = e =&gt; {\n  setQ(e.target.value);                         // urgent\n  startTransition(() =&gt; setList(filter(e.target.value))); // interruptible\n};</code></pre>"
  },
  {
    id: "qa-hooks-why",
    group: "Interview::Hooks",
    question: "What are Hooks, and why were they introduced?",
    answer: "<div class=\"callout good\">Hooks (16.8) let function components have <b>state, effects, context, and refs</b> without classes. They also let you reuse stateful logic without HOCs or render-prop wrapper hell.</div><ul><li>Colocate related logic in a custom hook instead of splitting it across <code>componentDidMount</code> / <code>DidUpdate</code> / <code>WillUnmount</code>.</li><li>No <code>this</code> binding bugs.</li><li>The same hook works in any function component \u2014 composition over inheritance.</li></ul>"
  },
  {
    id: "qa-rules-of-hooks",
    group: "Interview::Hooks",
    question: "What are the Rules of Hooks, and why do they exist?",
    answer: "<div class=\"callout good\"><b>1. Only call hooks at the top level</b> of a React function (not in loops, conditions, nested fns).<br><b>2. Only call them from React functions</b> (components or custom hooks), not plain JS.</div><p>React stores hook state in a <b>list on the fiber</b>, matched by <b>call order</b>. A conditional hook shifts the list and you get 'Rendered more hooks than during the previous render' \u2014 or silent state corruption.</p><pre><code>// \u274c\nif (ok) useState(0);\n// \u2705\nconst [n, setN] = useState(0);\nif (ok) setN(1);</code></pre>"
  },
  {
    id: "qa-useeffect",
    group: "Interview::Hooks",
    question: "Explain <code>useEffect</code>: dependency array, cleanup, and common pitfalls.",
    answer: "<table><tr><th>Deps</th><th>When it runs</th></tr><tr><td>omitted</td><td>After every paint \u2014 almost always a bug</td></tr><tr><td><code>[]</code></td><td>Mount (+ remount in Strict Mode). Cleanup on unmount</td></tr><tr><td><code>[a, b]</code></td><td>After paint when <code>Object.is</code> says a dep changed</td></tr></table><ul><li>Effects run <b>after paint</b> (unlike <code>useLayoutEffect</code>). Don't block first paint with them.</li><li>Return a cleanup for subscriptions, timers, abort controllers. Strict Mode remounts in dev to prove cleanup works.</li><li>Stale closures: if you read state inside an effect, it must be in the deps (or use a ref / updater).</li><li>Don't fetch-in-effect as the default architecture in 2026 \u2014 Server Components / loaders / TanStack Query. Still know it; legacy apps and client-only widgets use it.</li><li>Infinite loop: setting state in an effect without a guard or with an unstable dep (new object every render).</li></ul>"
  },
  {
    id: "qa-useeffect-vs-uselayout",
    group: "Interview::Hooks",
    question: "What is the difference between <code>useEffect</code> and <code>useLayoutEffect</code>?",
    answer: "<div class=\"cmp split\"><div><h4>useEffect</h4><ul><li>After paint</li><li>Does not block the browser</li><li>Default for fetch, logging, subscriptions</li></ul></div><div><h4>useLayoutEffect</h4><ul><li>After DOM update, <b>before paint</b></li><li>Blocks paint \u2014 can jank</li><li>Measure DOM / prevent flicker (tooltip position, scroll restore)</li></ul></div></div><div class=\"callout\">If you see a visual flash then a correction, you probably needed layout effect. If you don't, don't use it \u2014 it is sync and delays paint. It also warns on SSR (there is no layout on the server).</div>"
  },
  {
    id: "qa-useref",
    group: "Interview::Hooks",
    question: "What is <code>useRef</code>, and how is it different from <code>useState</code>?",
    answer: "<div class=\"callout good\">A ref is a <b>mutable box</b> (<code>{ current }</code>) that survives renders and <b>does not trigger a re-render</b> when you write to it.</div><table><tr><th>Use</th><th>Tool</th></tr><tr><td>Change should show on screen</td><td><code>useState</code></td></tr><tr><td>DOM node (focus, measure, 3rd-party lib)</td><td><code>useRef</code> + <code>ref={}</code></td></tr><tr><td>Timer id, previous value, 'isMounted' flag</td><td><code>useRef</code></td></tr></table><p>React 19: <code>ref</code> is a normal prop on function components (no <code>forwardRef</code> required for new code), and callback refs can return a cleanup function.</p>"
  },
  {
    id: "qa-usememo-usecallback",
    group: "Interview::Hooks",
    question: "When do you use <code>useMemo</code> vs <code>useCallback</code>? How do they relate to <code>React.memo</code>?",
    answer: "<div class=\"callout good\"><code>useMemo(() =&gt; v, deps)</code> caches a <b>value</b>. <code>useCallback(fn, deps)</code> caches a <b>function</b> (it is <code>useMemo(() =&gt; fn, deps)</code>). <code>React.memo</code> skips a child's render if props are shallow-equal.</div><ul><li>Memoize when the computation is expensive <b>or</b> when a child is <code>memo</code>'d and would re-render because you passed a new object/fn identity.</li><li>Don't wrap everything. Comparison has a cost. Profile first.</li><li>React Compiler auto-memoizes; still explain the trio \u2014 interviewers want the mental model.</li></ul>"
  },
  {
    id: "qa-usereducer",
    group: "Interview::Hooks",
    question: "When do you pick <code>useReducer</code> over <code>useState</code>?",
    answer: "<ul><li>Next state depends on previous in a <b>few related fields</b> (wizard, form with many actions).</li><li>You want named actions: <code>dispatch({ type: 'added', payload })</code> \u2014 easier to log and test.</li><li>You want to pass a <b>stable dispatch</b> down (dispatch identity is stable) instead of many callbacks.</li><li>Keep <code>useState</code> for one boolean, one string, one number. Don't reducer-ify a toggle.</li></ul><div class=\"callout\">It is not Redux. No middleware, no time travel. If many distant trees need the same reducer, then a store.</div>"
  },
  {
    id: "qa-useid",
    group: "Interview::Hooks",
    question: "What is <code>useId</code> and why does it exist?",
    answer: "<div class=\"callout good\">It generates a <b>stable unique ID</b> that matches between server and client \u2014 for <code>htmlFor</code> / <code>aria-labelledby</code> / SVG ids. It is <b>not</b> a list key.</div><pre><code>function Field({ label }) {\n  const id = useId();\n  return (&lt;&gt;\n    &lt;label htmlFor={id}&gt;{label}&lt;/label&gt;\n    &lt;input id={id} /&gt;\n  &lt;/&gt;);\n}</code></pre><div class=\"callout\">Don't use it for list keys or for 'unique id' in your database. Keys come from your data. <code>useId</code> is for accessibility wiring that must not mismatch during hydration.</div>"
  },
  {
    id: "qa-usecontext",
    group: "Interview::Hooks",
    question: "When would you use <code>useContext</code>? What are the pitfalls?",
    answer: "<p>Use it for <b>tree-wide, low-frequency</b> values: theme, current user, locale, feature flags. Any descendant can read without props.</p><ul><li>Every consumer re-renders when the Provider's <code>value</code> identity changes \u2014 memoize the value.</li><li>Split contexts (state vs dispatch) so a button that only dispatches doesn't re-render on every state tick.</li><li>Don't use Context as a dumping ground for all app state. That's how you rebuild a slow Redux.</li><li><code>use(Context)</code> in React 19 can be called conditionally \u2014 unlike <code>useContext</code>.</li></ul>"
  },
  {
    id: "qa-custom-hooks",
    group: "Interview::Hooks",
    question: "What are custom hooks? Show when you'd write one.",
    answer: "<div class=\"callout good\">A custom hook is a function whose name starts with <code>use</code> that calls other hooks. It shares <b>stateful logic</b>, not UI.</div><pre><code>function useOnline() {\n  const [on, setOn] = useState(navigator.onLine);\n  useEffect(() =&gt; {\n    const go = () =&gt; setOn(true), nogo = () =&gt; setOn(false);\n    window.addEventListener(\"online\", go);\n    window.addEventListener(\"offline\", nogo);\n    return () =&gt; {\n      window.removeEventListener(\"online\", go);\n      window.removeEventListener(\"offline\", nogo);\n    };\n  }, []);\n  return on;\n}</code></pre><p>Extract when two components copy the same effect+state, or when a component is drowning in incidental logic (media query, debounce, previous value). Return the minimum surface the UI needs.</p>"
  },
  {
    id: "qa-forwardref",
    group: "Interview::Hooks",
    question: "What was <code>forwardRef</code> for? What changed in React 19?",
    answer: "<div class=\"callout good\">Function components did not receive <code>ref</code> (reserved). <code>forwardRef((props, ref) =&gt; \u2026)</code> passed it through \u2014 inputs, focus traps, wrapping a DOM node.</div><p>React 19: <code>ref</code> is a regular prop. New components just destructure <code>{ ref }</code>. Keep <code>forwardRef</code> in libraries that still support React 18. Callback refs can return a cleanup: <code>ref={node => { \u2026; return () => { /* detach */ }; }}</code>.</p>"
  },
  {
    id: "qa-usesyncexternalstore",
    group: "Interview::Hooks",
    question: "How do you subscribe to an external store without tearing?",
    answer: "<div class=\"callout good\"><code>useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot)</code> is the concurrent-safe way to read non-React state (browser APIs, legacy stores). It avoids tearing under concurrent renders.</div><p>If you roll <code>useEffect</code> + <code>useState</code> to mirror <code>window.innerWidth</code> or a Flux store, you can show a frame of old data. <code>useSyncExternalStore</code> is what Redux and Zustand use under the hood for React 18+.</p>"
  },
  {
    id: "qa-hooks-lifecycle",
    group: "Interview::Hooks",
    question: "Map class lifecycle methods to hooks.",
    answer: "<table><tr><th>Class</th><th>Hooks equivalent</th></tr><tr><td><code>constructor</code> / initial state</td><td><code>useState(init)</code> / lazy init <code>useState(() =&gt; \u2026)</code></td></tr><tr><td><code>componentDidMount</code></td><td><code>useEffect(fn, [])</code> (plus Strict Mode remount in dev)</td></tr><tr><td><code>componentDidUpdate</code></td><td><code>useEffect(fn, [deps])</code></td></tr><tr><td><code>componentWillUnmount</code></td><td>effect cleanup function</td></tr><tr><td><code>shouldComponentUpdate</code> / PureComponent</td><td><code>React.memo</code> / Compiler</td></tr><tr><td><code>getDerivedStateFromError</code></td><td>still a class Error Boundary</td></tr><tr><td><code>getSnapshotBeforeUpdate</code></td><td><code>useLayoutEffect</code> (measure before paint)</td></tr></table>"
  },
  {
    id: "qa-react-memo",
    group: "Interview::Performance",
    question: "How does <code>React.memo</code> work, and when should you use it?",
    answer: "<div class=\"callout good\"><code>React.memo(Comp)</code> shallow-compares previous vs next props and <b>skips the render</b> if they look equal. Default compare is <code>Object.is</code> per prop.</div><ul><li>Use on expensive pure children that receive stable props while the parent re-renders often.</li><li>Useless if the parent always passes a new object/array/function \u2014 fix the parent first.</li><li>A custom compare can go deep, but then you own that bug surface.</li><li>Don't memo leaf buttons. Memo list rows, charts, editors.</li></ul>"
  },
  {
    id: "qa-memo-vs-usememo",
    group: "Interview::Performance",
    question: "What is the difference between <code>React.memo</code> and <code>useMemo</code>?",
    answer: "<div class=\"cmp split\"><div><h4>React.memo</h4><ul><li>Wraps a <b>component</b></li><li>Skip re-rendering that component</li><li>Compares props</li></ul></div><div><h4>useMemo</h4><ul><li>Runs <b>inside</b> a component</li><li>Skip recomputing a value</li><li>Compares dependency array</li></ul></div></div><p>They compose: parent <code>useMemo</code>s the <code>data</code> object so a <code>memo</code> child can bail out. Mixing them up is a common interview fail.</p>"
  },
  {
    id: "qa-prevent-rerenders",
    group: "Interview::Performance",
    question: "How do you prevent unnecessary re-renders?",
    answer: "<ul><li><b>Push state down</b> \u2014 don't store keystrokes in a giant parent that re-renders a dashboard.</li><li><b>Lift content as children</b> \u2014 a stateful wrapper re-renders; <code>children</code> already computed by the parent don't.</li><li><code>React.memo</code> + stable props (<code>useCallback</code>/<code>useMemo</code> or Compiler).</li><li>Split context; memoize provider value.</li><li>Virtualize lists; <code>startTransition</code> for heavy filters.</li><li>Profile first (React Profiler). Guessing is how you add 40 memos that do nothing.</li></ul>"
  },
  {
    id: "qa-context-perf",
    group: "Interview::Performance",
    question: "How do you optimize Context so consumers don't over-render?",
    answer: "<ul><li>Memoize <code>value</code>: <code>useMemo(() =&gt; ({ theme, setTheme }), [theme])</code>.</li><li>Split: <code>StateContext</code> vs <code>DispatchContext</code>. Buttons that only dispatch skip state updates.</li><li>Don't put a fast-changing value (mouse coords, input text) in a wide context.</li><li>Use a store (Zustand selector, Redux <code>useSelector</code>) when different consumers need different slices.</li><li>React 19 <code>use(Context)</code> still re-renders on value change \u2014 it does not magically subscribe to a field.</li></ul>"
  },
  {
    id: "qa-code-splitting",
    group: "Interview::Performance",
    question: "What is code splitting, and how do you do it in React?",
    answer: "<div class=\"callout good\">Split the JS bundle so the browser downloads <b>only the route/widget you need</b>. Smaller first load, faster TTI.</div><pre><code>const Dashboard = lazy(() =&gt; import(\"./Dashboard\"));\n&lt;Suspense fallback={&lt;Spinner /&gt;}&gt;\n  &lt;Dashboard /&gt;\n&lt;/Suspense&gt;</code></pre><p>Route-level splits (React Router / Next.js) give the biggest win. Component-level for heavy editors/charts. Named exports need a tiny re-export default. Next.js App Router splits by default via Server Components + client boundaries.</p>"
  },
  {
    id: "qa-lazy-loading",
    group: "Interview::Performance",
    question: "How does <code>React.lazy</code> work?",
    answer: "<code>React.lazy(() => import('./A'))</code> returns a component that <b>suspends</b> until the dynamic import resolves. It must sit under a <code>Suspense</code> boundary. Failed imports should be wrapped in an error boundary.<div class=\"callout\">Lazy only works with default exports of client components. Server Components in Next just <code>import</code> async \u2014 no <code>lazy</code> needed.</div>"
  },
  {
    id: "qa-virtualization",
    group: "Interview::Performance",
    question: "What is list virtualization, and when do you need it?",
    answer: "<div class=\"callout good\">Only mount the <b>visible rows</b> (plus overscan). A 50k-row table should not create 50k DOM nodes.</div><p>Reach for it when you profile and see commit time / DOM size explode on lists (hundreds+ of complex rows). Libraries: <code>react-window</code>, <code>react-virtualized</code>, TanStack Virtual. Don't virtualize a 20-item dropdown.</p>"
  },
  {
    id: "qa-profiler",
    group: "Interview::Performance",
    question: "How do you use the React Profiler to find performance issues?",
    answer: "<ul><li>React DevTools \u2192 Profiler \u2192 record an interaction (type, open modal, switch tab).</li><li>Look at <b>which components committed</b>, why they rendered ('hook 3 changed', 'parent'), and how long.</li><li>Flamegraph: wide + yellow/red = expensive. Ranked: worst first.</li><li>Fix the cause (state too high, unstable props, missing transition), don't randomly memo.</li><li>Browser Performance panel for paint/layout; Profiler for React-specific 'why did this render'.</li></ul>"
  },
  {
    id: "qa-hoc",
    group: "Interview::Patterns",
    question: "What is a Higher-Order Component?",
    answer: "<div class=\"callout good\">A function that takes a component and returns a new one with extra behaviour: <code>const Auth = withAuth(Page)</code>.</div><p>Pre-hooks reuse pattern. Costs: wrapper hell, static methods not forwarded, prop name clashes, worse DevTools stacks. Custom hooks replaced most HOCs. You still see <code>connect</code> in old Redux.</p>"
  },
  {
    id: "qa-render-props",
    group: "Interview::Patterns",
    question: "What are render props, and how did they evolve into hooks?",
    answer: "<div class=\"callout good\">A component takes a function (often as <code>children</code>) and calls it with data so the consumer decides the UI: <code>&lt;Mouse&gt;{pos => &lt;p&gt;{pos.x}&lt;/p&gt;}&lt;/Mouse&gt;</code>.</div><p>Same job as HOCs: share logic. Same cost: nesting. Hooks inlined that logic: <code>const pos = useMouse()</code>. Render props still shine for <b>headless / compound</b> libraries where the consumer must control markup.</p>"
  },
  {
    id: "qa-compound",
    group: "Interview::Patterns",
    question: "What are compound components?",
    answer: "<div class=\"callout good\">A set of components that share implicit state (often via context) and are composed by the consumer: <code>&lt;Select&gt;&lt;Select.Option/&gt;&lt;/Select&gt;</code> \u2014 like <code>&lt;select&gt;</code>/<code>&lt;option&gt;</code>.</div><p>Used by Radix, Headless UI, Reach. Flexible markup + accessible behaviour without a 40-prop mega component. Trade-off: more moving parts; you must document the contract.</p>"
  },
  {
    id: "qa-composition",
    group: "Interview::Patterns",
    question: "Explain composition vs inheritance in React.",
    answer: "<div class=\"callout good\">React composes with <b><code>children</code>, element props, and hooks</b> \u2014 not class hierarchies. 'Containment' (slots) and 'specialization' (wrapping) replace extends.</div><pre><code>function Dialog({ title, children, footer }) {\n  return (\n    &lt;div className=\"dlg\"&gt;\n      &lt;h2&gt;{title}&lt;/h2&gt;\n      &lt;div&gt;{children}&lt;/div&gt;\n      {footer}\n    &lt;/div&gt;\n  );\n}</code></pre>"
  },
  {
    id: "qa-container-presentational",
    group: "Interview::Patterns",
    question: "What is the presentational vs container pattern? Is it still useful?",
    answer: "<p>Containers fetched data / talked to stores; presentational components were props-in, JSX-out. It was how we reused UI in the Redux era.</p><div class=\"callout\">Today: custom hooks hold the data logic, components stay mostly presentational without a rigid split. Server Components blurred it further (the 'container' is often an async server function). Know the pattern; don't force two files for every widget.</div>"
  },
  {
    id: "qa-anti-patterns",
    group: "Interview::Patterns",
    question: "What are common React anti-patterns?",
    answer: "<ul><li>Mutating state / props.</li><li>Index keys on dynamic lists; random keys.</li><li>Derived state copied into <code>useState</code> that drifts from props (use the prop, or <code>key</code> to reset).</li><li>Effects that sync props \u2192 state for no reason.</li><li>Fetching in <code>useEffect</code> without abort / race handling.</li><li>Giant context for high-frequency state.</li><li>Anonymous components defined inside render (<code>function Item()</code> inside Parent) \u2014 remounts every time.</li><li>Using Redux for a form's local input.</li><li>Disabling Strict Mode to 'fix' double effects.</li></ul>"
  },
  {
    id: "qa-error-boundary",
    group: "Interview::Patterns",
    question: "What are Error Boundaries, and what do they not catch?",
    answer: "<div class=\"callout good\">A class with <code>static getDerivedStateFromError</code> and/or <code>componentDidCatch</code> that catches <b>render-time errors in the child tree</b> and shows a fallback instead of a white screen.</div><ul><li><b>Catch:</b> render, lifecycle, constructors of children.</li><li><b>Don't catch:</b> event handlers, async/promises, SSR, the boundary's own render, <code>setTimeout</code>.</li><li>Event/async: <code>try/catch</code> or route the error into state and rethrow in render to involve a boundary.</li><li>Place them around independent panels so one widget dying doesn't kill the app.</li></ul>"
  },
  {
    id: "qa-strict-mode",
    group: "Interview::Patterns",
    question: "What does Strict Mode do, and why do effects run twice in development?",
    answer: "<div class=\"callout good\">Dev-only checks. It double-invokes render, updaters, and effects (mount \u2192 cleanup \u2192 mount) to surface impure logic and missing cleanup. <b>No production impact.</b></div><p>If your effect double-fetches, your cleanup isn't aborting. Fix the effect (AbortController), don't disable Strict Mode. It also warns on deprecated lifecycles and unexpected side effects during render.</p>"
  },
  {
    id: "qa-synthetic-events",
    group: "Interview::Forms & Events",
    question: "How does React's event system differ from native DOM events?",
    answer: "<ul><li>You listen with camelCase props: <code>onClick</code>, <code>onChange</code>.</li><li>React 17+ delegates to the <b>root container</b>, not <code>document</code>.</li><li>Events bubble along the <b>React tree</b> (portals included), not necessarily the DOM tree.</li><li><code>e.preventDefault()</code> / <code>stopPropagation()</code> work; <code>e.nativeEvent</code> is the real one.</li><li>Pass the function, don't call it: <code>onClick={fn}</code> not <code>onClick={fn()}</code>. Close over args with <code>() => fn(id)</code>.</li></ul>"
  },
  {
    id: "qa-forms-react19",
    group: "Interview::Forms & Events",
    question: "How do forms work in React 19 with the <code>action</code> prop?",
    answer: "<div class=\"callout good\">You can pass an async function to <code>&lt;form action={fn}&gt;</code>. React calls it with <code>FormData</code>, manages pending state, and can invoke a Server Action without a hand-rolled API route.</div><pre><code>async function save(formData) {\n  \"use server\";\n  await db.item.create({ name: formData.get(\"name\") });\n}\n&lt;form action={save}&gt;\n  &lt;input name=\"name\" /&gt;\n  &lt;button&gt;Save&lt;/button&gt;\n&lt;/form&gt;</code></pre><p>Pair with <code>useActionState</code> for returned errors/state and <code>useFormStatus</code> in nested Submit buttons. Controlled inputs still exist when you need live validation.</p>"
  },
  {
    id: "qa-flux",
    group: "Interview::State Management",
    question: "What is the Flux pattern?",
    answer: "<div class=\"callout good\">Unidirectional flow Facebook published before Redux: <b>Action \u2192 Dispatcher \u2192 Store \u2192 View</b>. Views never write to stores directly; they dispatch.</div><p>Redux is the most famous Flux variant (single store, pure reducers). The idea \u2014 one-way data, explicit events \u2014 is what React already wants. You don't implement vanilla Flux in 2026; you name it to show you know why Redux looks the way it does.</p>"
  },
  {
    id: "qa-redux-2026",
    group: "Interview::State Management",
    question: "How does Redux work, and is it still relevant?",
    answer: "<p>A single store, pure reducers, dispatch(action). React-Redux subscribes with selectors. Redux Toolkit (RTK) is the only sane way to write it (slices, Immer, RTK Query).</p><div class=\"callout\">Still relevant in large, many-team apps that want DevTools, middleware, and a strict event log. Overkill for most products in 2026 \u2014 Zustand, Context, and TanStack Query cover the usual cases. Don't say 'Redux is dead'; say 'I pick it when the domain events are the product'.</div>"
  },
  {
    id: "qa-zustand-jotai",
    group: "Interview::State Management",
    question: "What are Zustand and Jotai, and when would you pick them over Redux?",
    answer: "<div class=\"cmp\"><div><h4>Zustand</h4><ul><li>Tiny store, hook-based</li><li>Selectors so components pick a slice</li><li>Almost no boilerplate</li><li>Great default client store</li></ul></div><div><h4>Jotai</h4><ul><li>Atomic: each atom is a piece of state</li><li>Bottom-up, like Recoil</li><li>Fine-grained subscriptions</li><li>Good when atoms compose</li></ul></div></div><p>Pick them when you want shared client state without Redux ceremony. Still use TanStack Query for server cache.</p>"
  },
  {
    id: "qa-server-state",
    group: "Interview::State Management",
    question: "What is 'server state', and how does TanStack Query handle it?",
    answer: "<div class=\"callout good\">Server state is <b>data that lives on the backend</b> \u2014 it can be stale, it needs cache, retries, deduping, and invalidation. It is not the same as <code>useState</code>.</div><ul><li>TanStack Query: <code>useQuery({ queryKey, queryFn })</code> caches by key, shares in-flight requests, refetches on focus, retries, marks stale.</li><li>Mutations invalidate/refetch related keys.</li><li>RSC + Server Actions move some of this to the server; Query still shines for highly interactive client islands and SPAs.</li></ul>"
  },
  {
    id: "qa-pick-state",
    group: "Interview::State Management",
    question: "How do you decide between local state, Context, and a store?",
    answer: "<table><tr><th>Kind of data</th><th>Put it</th></tr><tr><td>Owned by one widget (toggle, input)</td><td><code>useState</code> / <code>useReducer</code></td></tr><tr><td>Shared by a small subtree</td><td>Lift state, or compose children</td></tr><tr><td>Theme / auth / locale</td><td>Context</td></tr><tr><td>Cache of GET / list / detail</td><td>TanStack Query or RSC fetch</td></tr><tr><td>Complex client domain, many writers</td><td>Zustand / Redux</td></tr></table><div class=\"callout\">Start local. Lift. Context for rare global. Query for server. Store last. The interview is about this ladder, not a brand.</div>"
  },
  {
    id: "qa-react-router",
    group: "Interview::Routing",
    question: "What is React Router, and how does client-side routing work?",
    answer: "<div class=\"callout good\">The browser stays on one HTML document. The router reads the URL and renders a matching element tree. <code>Link</code> uses History API (<code>pushState</code>) instead of a full reload.</div><pre><code>&lt;BrowserRouter&gt;\n  &lt;Routes&gt;\n    &lt;Route path=\"/\" element={&lt;Home /&gt;} /&gt;\n    &lt;Route path=\"users/:id\" element={&lt;User /&gt;} /&gt;\n  &lt;/Routes&gt;\n&lt;/BrowserRouter&gt;</code></pre><code>useParams</code>, <code>useSearchParams</code>, <code>useNavigate</code> read/write the URL. Nested routes use <code>&lt;Outlet /&gt;</code>. Data APIs (loaders/actions) exist in RR 6.4+; Next.js App Router is the other common answer."
  },
  {
    id: "qa-browser-vs-hash",
    group: "Interview::Routing",
    question: "BrowserRouter vs HashRouter?",
    answer: "<div class=\"cmp split\"><div><h4>BrowserRouter</h4><ul><li>Clean URLs: <code>/users/1</code></li><li>Needs server fallback to <code>index.html</code> on refresh</li><li>Default for real apps</li></ul></div><div><h4>HashRouter</h4><ul><li><code>/#/users/1</code> \u2014 hash never hits the server</li><li>Static file hosts without rewrite rules</li><li>Ugly URLs; skip if you control the server</li></ul></div></div>"
  },
  {
    id: "qa-private-routes",
    group: "Interview::Routing",
    question: "How do you implement private routes / a route guard?",
    answer: "<pre><code>function RequireAuth({ children }) {\n  const { user } = useAuth();\n  const loc = useLocation();\n  if (!user) return &lt;Navigate to=\"/login\" state={{ from: loc }} replace /&gt;;\n  return children;\n}\n&lt;Route path=\"/app\" element={&lt;RequireAuth&gt;&lt;Dashboard /&gt;&lt;/RequireAuth&gt;} /&gt;</code></pre><p>On login, navigate to <code>state.from</code> or <code>/</code>. Use <code>replace</code> so the login page isn't in history. Next.js: middleware or a server layout that redirects.</p>"
  },
  {
    id: "qa-404-router",
    group: "Interview::Routing",
    question: "How do you handle 404s and programmatic navigation?",
    answer: "<ul><li>A splat route: <code>&lt;Route path=\"*\" element={&lt;NotFound /&gt;} /&gt;</code> last.</li><li><code>useNavigate()</code> \u2014 <code>navigate('/x')</code>, <code>navigate(-1)</code>, <code>navigate('/x', { replace: true })</code>.</li><li><code>redirect</code> from a loader/action in data routers.</li><li>Query: <code>useSearchParams</code> \u2014 don't parse <code>window.location</code> by hand.</li></ul>"
  },
  {
    id: "qa-csr-vs-ssr-routing",
    group: "Interview::Routing",
    question: "Client-side routing vs server-side routing?",
    answer: "<div class=\"cmp split\"><div><h4>Client (SPA)</h4><ul><li>One shell; JS swaps views</li><li>Fast after first load</li><li>Shareable URLs need History API + server fallback</li><li>First paint waits on JS unless you SSR</li></ul></div><div><h4>Server</h4><ul><li>Each URL is a request; server returns HTML</li><li>Great first paint / SEO</li><li>Full reload between pages (unless you enhance with RSC/streaming)</li><li>Next.js App Router mixes both</li></ul></div></div>"
  },
  {
    id: "qa-rr-vs-next",
    group: "Interview::Routing",
    question: "How does React Router compare to the Next.js App Router?",
    answer: "<b>React Router</b> is a library you drop into a SPA (Vite) or a framework. Nested routes, loaders, actions, all client or SSR if you set it up.<b>Next App Router</b> is a full framework: folders = routes, Server Components by default, <code>loading.tsx</code> / <code>error.tsx</code> as Suspense/error boundaries, server actions, streaming. Pick Next when you want SSR/RSC; pick RR+Vite when you want a client app with less magic."
  },
  {
    id: "qa-test-react",
    group: "Interview::Testing",
    question: "How do you test React applications? What is React Testing Library's philosophy?",
    answer: "<div class=\"callout good\"><b>Test what the user sees and does</b>, not implementation details. RTL queries by role, label, text \u2014 not by component state or CSS class.</div><ul><li><b>Jest / Vitest</b> \u2014 runner, mocks, snapshots (use sparingly).</li><li><b>Testing Library</b> \u2014 <code>render</code>, <code>screen.getByRole</code>, <code>userEvent.click</code>.</li><li><b>MSW</b> \u2014 mock HTTP at the network, not inside the component.</li><li><b>Playwright / Cypress</b> \u2014 a few critical E2E paths.</li><li>Avoid Enzyme shallow in new code. Avoid snapshotting huge trees.</li></ul><pre><code>render(&lt;Login /&gt;);\nawait userEvent.type(screen.getByLabelText(/email/i), \"a@b.com\");\nawait userEvent.click(screen.getByRole(\"button\", { name: /sign in/i }));\nexpect(await screen.findByText(/welcome/i)).toBeInTheDocument();</code></pre>"
  },
  {
    id: "qa-test-async-mock",
    group: "Interview::Testing",
    question: "How do you test async UI and mock APIs?",
    answer: "<ul><li>Use <code>findBy*</code> / <code>waitFor</code> \u2014 they retry until timeout.</li><li>MSW handlers in test setup so the component still <code>fetch</code>es.</li><li>Don't mock <code>useEffect</code>. Don't assert that a spy of your fetch helper was called unless that <i>is</i> the contract.</li><li><code>userEvent</code> over <code>fireEvent</code> \u2014 it flushes more realistically.</li></ul>"
  },
  {
    id: "qa-test-hooks",
    group: "Interview::Testing",
    question: "How do you test custom hooks?",
    answer: "<code>renderHook(() => useToggle())</code> from Testing Library. Act on <code>result.current</code>, assert the next value. Prefer testing a hook <b>through a tiny component</b> that uses it \u2014 closer to reality.<div class=\"callout\">If a hook is hard to test, it is probably too coupled to a specific component. Pass dependencies (fetch, storage) in.</div>"
  },
  {
    id: "qa-snapshot-shallow",
    group: "Interview::Testing",
    question: "Snapshot testing vs shallow vs full rendering \u2014 what is actually useful?",
    answer: "<ul><li><b>Full render (RTL):</b> default. Exercises hooks, context, DOM.</li><li><b>Shallow (Enzyme / TestRenderer):</b> children as placeholders. Hides integration bugs. Rarely worth it now.</li><li><b>Snapshots:</b> fragile on anything that moves. OK for a tiny pure formatter, bad for pages. Reviewing 400-line snapshot diffs trains people to click 'u'.</li></ul>"
  },
  {
    id: "qa-ssr",
    group: "Interview::SSR & RSC",
    question: "What is SSR, and what does it buy you?",
    answer: "<div class=\"callout good\">The server runs React, sends HTML, then the client hydrates. User sees content before JS finishes. Better TTFB/LCP and SEO than a blank SPA shell.</div><ul><li>Needs a Node (or edge) runtime and a framework (Next, Remix).</li><li>Watch hydration mismatches.</li><li>Streaming SSR + Suspense: send a shell, then stream in slow bits instead of waiting for all data.</li></ul>"
  },
  {
    id: "qa-ssg",
    group: "Interview::SSR & RSC",
    question: "What is static generation (SSG)?",
    answer: "<div class=\"callout good\">Render HTML <b>at build time</b> (or on-demand ISR). Serve from a CDN. Perfect for docs, marketing, blogs.</div><p>Next: <code>generateStaticParams</code> + fetch with a long cache. Revalidate when content changes. Don't SSG a per-user dashboard \u2014 that's SSR or client fetch.</p>"
  },
  {
    id: "qa-streaming-ssr",
    group: "Interview::SSR & RSC",
    question: "What is streaming SSR, and why does it matter?",
    answer: "<div class=\"callout good\">Instead of waiting for the whole tree, the server <b>flushes HTML in chunks</b> as Suspense boundaries resolve. The browser paints the shell, then fills holes.</div><p>Pairs with selective hydration: React hydrates ready islands first; a slow widget doesn't block the whole page from becoming interactive.</p>"
  },
  {
    id: "qa-rsc",
    group: "Interview::SSR & RSC",
    question: "What are React Server Components, and how do they differ from Client Components?",
    answer: "<div class=\"cmp split\"><div><h4>Server Components (default in Next App Router)</h4><ul><li>Run on the server (or at build)</li><li>Can be <code>async</code>, talk to DB/secrets</li><li>Zero JS shipped for that component</li><li>No state, effects, or browser APIs</li></ul></div><div><h4>Client Components (<code>\"use client\"</code>)</h4><ul><li>The interactive island</li><li>Hooks, events, browser APIs</li><li>JS is shipped and hydrated</li><li>Can import into other clients; cannot be imported into a server file the other way without a boundary</li></ul></div></div><div class=\"callout\">There is no <code>\"use server\"</code> on components \u2014 that marks Server Actions. Server is the default; you opt into client at the boundary. Pass serializable props across.</div>"
  },
  {
    id: "qa-rsc-payload",
    group: "Interview::SSR & RSC",
    question: "How does the RSC payload / server-client split work?",
    answer: "<p>The server renders Server Components to a special stream (not just HTML) describing the tree, including placeholders for Client Components. The client already has the client bundle; it stitches the two. Data fetched on the server never appears as a REST waterfall in the browser unless you chose that.</p><div class=\"callout\">Don't fetch the same data again in a child client <code>useEffect</code> 'just in case'. Pass props, or use a cache that understands RSC.</div>"
  },
  {
    id: "qa-suspense",
    group: "Interview::SSR & RSC",
    question: "How does Suspense work, and what can trigger it?",
    answer: "<div class=\"callout good\">A child <b>throws a promise</b> (or uses an API that does). The nearest <code>&lt;Suspense fallback&gt;</code> shows the fallback until the promise resolves, then retries the tree.</div><ul><li><code>React.lazy</code> code-split.</li><li><code>use(promise)</code> / async Server Components.</li><li>Framework data (Next <code>loading.tsx</code> is a Suspense boundary).</li><li>It does <b>not</b> catch errors \u2014 that's Error Boundaries. Combine both around a route.</li></ul>"
  },
  {
    id: "qa-data-fetching",
    group: "Interview::SSR & RSC",
    question: "What are modern data-fetching patterns, and what are the classic pitfalls?",
    answer: "<table><tr><th>Pattern</th><th>Where</th></tr><tr><td>Async Server Component <code>await fetch</code></td><td>Next App Router \u2014 preferred</td></tr><tr><td>RR loaders / Next route handlers</td><td>Framework data APIs</td></tr><tr><td>TanStack Query</td><td>Client islands, SPA, polling, optimistic</td></tr><tr><td><code>useEffect</code> + fetch</td><td>Legacy / truly client-only widgets</td></tr></table><ul><li><b>Race:</b> slow request 1 finishes after request 2 \u2014 abort or ignore stale.</li><li><b>No cleanup:</b> setState on unmounted component (warning in older React; still wasted work).</li><li><b>Waterfalls:</b> fetch in a child after the parent committed. Fetch in parallel on the server instead.</li><li><b>Duplicate cache:</b> same GET in five components \u2014 Query or RSC cache.</li><li><b>Loading/error:</b> always design the three states; Suspense + error boundary is the modern pair.</li></ul>"
  },
  {
    id: "qa-react19-whats-new",
    group: "Interview::React 19",
    question: "What's new in React 19 that interviewers expect you to name?",
    answer: "<ul><li><b>Actions</b> + form <code>action</code>, <code>useActionState</code>, <code>useFormStatus</code>, <code>useOptimistic</code>.</li><li><b><code>use()</code></b> to read promises and context (can be conditional).</li><li><b>Server Components / Server Actions</b> stable.</li><li><b>React Compiler</b> (auto-memo).</li><li><b><code>ref</code> as a prop</b> + callback-ref cleanup.</li><li>Document metadata: <code>&lt;title&gt;</code>, <code>&lt;meta&gt;</code> in the tree.</li><li>Better hydration + asset preloading APIs (<code>preload</code>, <code>preinit</code>).</li><li>Improved Web Component compatibility.</li></ul>"
  },
  {
    id: "qa-actions",
    group: "Interview::React 19",
    question: "What are Actions in React 19?",
    answer: "<div class=\"callout good\">An Action is an <b>async function used as a transition</b> \u2014 typically a form submit or Server Action. React tracks pending, errors, and can recover via error boundaries. You don't manually <code>useState(isSubmitting)</code> for the happy path.</div><p>Client: <code>startTransition(async () => { await save(); })</code> or <code>&lt;form action={save}&gt;</code>. Server: <code>\"use server\"</code> function imported into a client form. The point is a first-class mutation pipeline, not another REST wrapper.</p>"
  },
  {
    id: "qa-use-hook",
    group: "Interview::React 19",
    question: "What is the <code>use()</code> hook, and how is it different from <code>useEffect</code> + fetch?",
    answer: "<div class=\"callout good\"><code>use(promise)</code> <b>reads a promise during render</b>. If pending, the component suspends. If resolved, you get the value. Unlike other hooks, it <b>can be called conditionally</b>.</div><pre><code>function Comments({ commentsPromise }) {\n  const comments = use(commentsPromise); // suspends until ready\n  return comments.map(c =&gt; &lt;li key={c.id}&gt;{c.text}&lt;/li&gt;);\n}</code></pre><ul><li>No loading state boilerplate \u2014 the parent <code>Suspense</code> handles it.</li><li>The promise should be <b>stable</b> (created in a parent/server, not <code>use(fetch())</code> inline every render).</li><li><code>useEffect</code> + fetch is a client after-paint pattern with race/cleanup issues. <code>use()</code> is render-time and Suspense-native.</li></ul>"
  },
  {
    id: "qa-useactionstate",
    group: "Interview::React 19",
    question: "What does <code>useActionState</code> do?",
    answer: "<div class=\"callout good\"><code>const [state, formAction, pending] = useActionState(action, initialState)</code> \u2014 wraps an Action so you get the <b>last returned value</b> (errors, field messages) and pending flag for a form.</div><pre><code>const [err, action, pending] = useActionState(updateUser, null);\n&lt;form action={action}&gt;\n  {err &amp;&amp; &lt;p&gt;{err}&lt;/p&gt;}\n  &lt;button disabled={pending}&gt;Save&lt;/button&gt;\n&lt;/form&gt;</code></pre><p>Formerly experimental <code>useFormState</code>. Client Components only. The action should return serializable data.</p>"
  },
  {
    id: "qa-useformstatus",
    group: "Interview::React 19",
    question: "What does <code>useFormStatus</code> do?",
    answer: "<div class=\"callout good\">Called in a <b>child</b> of a <code>&lt;form&gt;</code>, it reads that form's pending/data/method/action. Lets a dumb <code>&lt;Submit/&gt;</code> disable itself without prop drilling.</div><pre><code>function Submit() {\n  const { pending } = useFormStatus();\n  return &lt;button disabled={pending}&gt;{pending ? \"Saving\u2026\" : \"Save\"}&lt;/button&gt;;\n}</code></pre><div class=\"callout\">It does not work in the same component that renders the <code>&lt;form&gt;</code> \u2014 must be nested. That's the usual trap.</div>"
  },
  {
    id: "qa-useoptimistic",
    group: "Interview::React 19",
    question: "What is <code>useOptimistic</code> and when do you use it?",
    answer: "<div class=\"callout good\">You show the <b>expected result immediately</b> while the Action is in flight, then React rolls back if it fails.</div><pre><code>const [optimistic, addOptimistic] = useOptimistic(todos);\nasync function add(formData) {\n  const title = formData.get(\"title\");\n  addOptimistic(t =&gt; [...t, { id: \"tmp\", title }]);\n  await saveTodo(title);\n}</code></pre><p>Classic: chat send, like button, todo add. Don't optimistic-update money transfers without a solid rollback story. Pair with Actions so pending/error is consistent.</p>"
  },
  {
    id: "qa-compiler",
    group: "Interview::React 19",
    question: "What is the React Compiler, and does it replace <code>useMemo</code>?",
