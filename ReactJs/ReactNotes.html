    answer: "<div class=\"callout good\">A <b>build-time</b> Babel plugin that auto-memoizes components and hooks when they follow the Rules of React. Most manual <code>memo</code>/<code>useMemo</code>/<code>useCallback</code> become unnecessary.</div><ul><li>If your code is impure (mutating during render, conditional hooks), the compiler <b>skips that function</b> \u2014 silently. Interviews love this.</li><li>Works with React 17\u201319; best with 19's runtime cache.</li><li>You still memoize when you have a measured hotspot the compiler can't see (third-party child, unstable foreign values).</li><li>Say: 'I write pure components and let the compiler work; I can still explain manual memo for legacy or escape hatches.'</li></ul>"
  },
  {
    id: "qa-useTransition-vs-deferred",
    group: "Interview::React 19",
    question: "What is the difference between <code>useTransition</code> and <code>useDeferredValue</code>?",
    answer: "<div class=\"cmp split\"><div><h4>useTransition</h4><ul><li>You wrap the <b>setState</b> that is non-urgent</li><li>Gives <code>isPending</code></li><li>You control which update is a transition</li></ul></div><div><h4>useDeferredValue</h4><ul><li>You keep a <b>lagging copy</b> of a value</li><li>The urgent value (input) updates now; the deferred one trails</li><li>Good when you don't own the setter (value came from props)</li></ul></div></div><p>Search box: either <code>setQuery</code> urgent + <code>startTransition(setResults)</code>, or <code>const deferred = useDeferredValue(query)</code> and filter with <code>deferred</code>. Same idea, different API shape.</p>"
  },
  {
    id: "qa-metadata-preload",
    group: "Interview::React 19",
    question: "How does React 19 handle document metadata and asset preloading?",
    answer: "<p>You can render <code>&lt;title&gt;</code>, <code>&lt;meta&gt;</code>, <code>&lt;link rel=\"stylesheet\"&gt;</code> from components; React hoists them into <code>document.head</code>. No more <code>react-helmet</code> for the simple case.</p><p>Resource APIs: <code>preload</code>, <code>prefetchDNS</code>, <code>preinit</code> \u2014 tell the browser to fetch fonts/scripts/CSS early. Frameworks (Next) often wrap this. Mention it as 'React can now own head tags and hints without a third-party side channel.'</p>"
  },
  {
    id: "qa-debug",
    group: "Interview::Experience",
    question: "How do you debug a React app in the real world?",
    answer: "<ul><li><b>React DevTools:</b> props/state/hooks, why-did-this-render (Profiler), highlight updates.</li><li>Breakpoint in the component body \u2014 you're in a render, don't setState there.</li><li><code>console.log</code> in render is noisy (Strict Mode doubles it). Log in effects/handlers.</li><li>Error boundary + logging service (Sentry) in prod.</li><li>Hydration warnings: diff server vs client output.</li><li>Performance: Profiler + Chrome Performance, not guesses.</li><li>Stale closure: log the value and the dep array; check the identity of objects.</li></ul>"
  },
  {
    id: "qa-a11y",
    group: "Interview::Experience",
    question: "How do you handle accessibility in React?",
    answer: "<ul><li>Semantic HTML first (<code>button</code> not <code>div onClick</code>).</li><li>Labels via <code>htmlFor</code> + <code>useId</code>.</li><li>Keyboard: tab order, <code>onKeyDown</code>, focus management (modal trap, restore focus).</li><li>ARIA only when native semantics aren't enough.</li><li>Don't put <code>click</code> on non-interactive elements without role+tabIndex+keyboard.</li><li>eslint-plugin-jsx-a11y; axe in CI; test with keyboard and a screen reader once per flow.</li></ul>"
  },
  {
    id: "qa-i18n",
    group: "Interview::Experience",
    question: "How do you localize a React app?",
    answer: "<p>Don't concatenate strings. Use a library (FormatJS / react-intl, i18next, Lingui) with message catalogs, ICU plural/select, and locale-aware dates/numbers. Next.js has <code>next-intl</code> / built-in i18n routing.</p><ul><li>Store locale in Context or URL prefix (<code>/en/\u2026</code>).</li><li>SSR: same locale on server and client or you hydrate-mismatch.</li><li><code>useId</code> still for DOM ids; i18n is for copy.</li></ul>"
  },
  {
    id: "qa-styling",
    group: "Interview::Experience",
    question: "What are the ways to style React components, and how do you choose?",
    answer: "<table><tr><th>Approach</th><th>When</th></tr><tr><td>Plain CSS / CSS modules</td><td>Default; modules avoid clashes</td></tr><tr><td>Tailwind</td><td>Utility-first teams, fast UI</td></tr><tr><td>CSS-in-JS (emotion, Panda, stylex)</td><td>Dynamic styles colocated; watch runtime cost</td></tr><tr><td>Component libraries (MUI, Radix + CSS)</td><td>Design system, a11y primitives</td></tr><tr><td>inline <code>style={{}}</code></td><td>Truly dynamic one-offs; no pseudo-classes</td></tr></table><p>Mention CSS modules vs Tailwind as the two you actually shipped. Interviewers want a choice with a reason, not a list of 12 tools.</p>"
  },
  {
    id: "qa-optimistic-experience",
    group: "Interview::Experience",
    question: "How would you implement optimistic UI (pre\u2013React 19 and with 19)?",
    answer: "<p>Pre-19: keep 'confirmed' state from the server and an 'optimistic' overlay in <code>useState</code>; rollback on error; disable double-submit.</p><p>React 19: <code>useOptimistic</code> + Action. The hook is wired to the in-flight Action so rollback is automatic. Still handle the error UI (toast / field message).</p>"
  },
  {
    id: "qa-resize",
    group: "Interview::Experience",
    question: "How do you re-render when the browser is resized?",
    answer: "<pre><code>function useWidth() {\n  return useSyncExternalStore(\n    onStoreChange =&gt; {\n      window.addEventListener(\"resize\", onStoreChange);\n      return () =&gt; window.removeEventListener(\"resize\", onStoreChange);\n    },\n    () =&gt; window.innerWidth,\n    () =&gt; 0  // server snapshot\n  );\n}</code></pre><div class=\"callout\">Don't <code>useState</code>+<code>useEffect</code> if you can use <code>useSyncExternalStore</code> \u2014 no tearing. Debounce if the work per resize is heavy. CSS and container queries often remove the need.</div>"
  },
  {
    id: "qa-batching",
    group: "Interview::Experience",
    question: "What is state batching in React 18+?",
    answer: "<div class=\"callout good\">React 18 batches <b>all</b> setState calls inside timeouts, promises, and native handlers \u2014 not only React event handlers. One re-render for multiple setters in the same tick.</div><p>To force a flush (rare): <code>flushSync(() => setX(1))</code> \u2014 needed when you must read the DOM immediately after. Don't sprinkle it.</p>"
  },
  {
    id: "qa-npx-npm",
    group: "Interview::Tooling",
    question: "What is the difference between npm and npx? package.json vs package-lock.json?",
    answer: "<table><tr><th>Tool / file</th><th>Job</th></tr><tr><td>npm</td><td>Install deps, run <code>package.json</code> scripts</td></tr><tr><td>npx</td><td>Run a package binary once (download if needed)</td></tr><tr><td>package.json</td><td>Declared ranges (<code>^18.2.0</code>) and scripts</td></tr><tr><td>package-lock.json</td><td>Exact tree that was installed \u2014 commit it</td></tr></table><p>dependency = runtime; devDependency = build/test. CI should <code>npm ci</code> against the lockfile, not a floating <code>npm install</code>.</p>"
  },
  {
    id: "qa-bundlers",
    group: "Interview::Tooling",
    question: "Vite vs Webpack vs Parcel \u2014 what do you actually say?",
    answer: "<div class=\"callout good\">They bundle and (in dev) serve with HMR. <b>Vite</b> is the 2026 default for SPAs: native ESM in dev, Rollup/esbuild for prod. Webpack is the legacy CRA/ejected world. Parcel is zero-config, less common in big teams.</div><p>CRA is deprecated. New apps: Vite or a framework (Next). Mention Fast Refresh: HMR that keeps hook state.</p>"
  },
  {
    id: "qa-tree-shaking",
    group: "Interview::Tooling",
    question: "What is tree shaking?",
    answer: "<div class=\"callout good\">Dead-code elimination on <b>static ESM</b> <code>import</code>/<code>export</code>. Unused exports never reach the bundle.</div><p>Help it: named imports, <code>\"sideEffects\": false</code> when true, avoid <code>import _ from 'lodash'</code>. Dynamic <code>require</code> cannot be shaken. Code splitting is complementary: shake removes unused; split delays used-but-not-now.</p>"
  },
  {
    id: "qa-hmr",
    group: "Interview::Tooling",
    question: "What is Hot Module Replacement / Fast Refresh?",
    answer: "<p>Dev server swaps the changed module without a full reload, preserving component state. Fast Refresh is React's flavour of that. Production is unaffected. If state resets on edit, you broke the rules (anonymous export, hook order change).</p>"
  },
  {
    id: "qa-keys-reset-pattern",
    group: "Interview::Experience",
    question: "You switch users and the form still shows the previous user's name. Why, and how do you fix it?",
    answer: "<div class=\"callout danger\">Component state is tied to the component instance, not to a prop named <code>userId</code>. If the same <code>&lt;Form /&gt;</code> stays mounted, its <code>useState(user.name)</code> only used the first name as initial state.</div><pre><code>// \u2705 identity changed \u2192 remount \u2192 fresh state\n&lt;ProfileForm key={user.id} user={user} /&gt;</code></pre><p>Alternatively derive from props and don't copy into state, or sync in an effect (usually worse). This is one of the most common 'experience' traps.</p>"
  },
  {
    id: "qa-stale-closure",
    group: "Interview::Experience",
    question: "What is a stale closure in React? Give a concrete example.",
    answer: "<pre><code>function Timer() {\n  const [n, setN] = useState(0);\n  useEffect(() =&gt; {\n    const id = setInterval(() =&gt; setN(n + 1), 1000); // n is always 0\n    return () =&gt; clearInterval(id);\n  }, []); // eslint would warn\n}</code></pre><div class=\"callout\">The interval closure captured <code>n = 0</code>. Fix: <code>setN(c =&gt; c + 1)</code>, or put <code>n</code> in deps (recreates the interval), or store n in a ref. Interviewers listen for 'snapshot of props/state per render'.</div>"
  },
  {
    id: "qa-why-not-index-demo",
    group: "Interview::Experience",
    question: "A todo list with inputs uses <code>key={i}</code>. You delete the first item and the wrong leftover text remains. Explain.",
    answer: "<div class=\"callout danger\">React reused the first row's component/DOM because the key <code>0</code> still exists \u2014 it now points at what used to be item 2, but the <b>input state stayed on that fiber</b>.</div><p>Fix: <code>key={todo.id}</code>. This is the practical cousin of the 'index as key' theory question \u2014 tell the story.</p>"
  },
  {
    id: "qa-children-rerender",
    group: "Interview::Experience",
    question: "A parent holds a counter. A heavy child is passed as <code>children</code> and does not re-render when the counter ticks. Why?",
    answer: "<div class=\"callout good\">The parent that owns the counter re-renders, but <code>children</code> was <b>created by the grandparent</b> (or whoever passed it). That element's type+props didn't change, so React reuses the heavy fiber.</div><pre><code>function Shell({ children }) {\n  const [n, setN] = useState(0);\n  return (&lt;&gt;&lt;button onClick={() =&gt; setN(n+1)}&gt;{n}&lt;/button&gt;{children}&lt;/&gt;);\n}\n// &lt;Shell&gt;&lt;Heavy /&gt;&lt;/Shell&gt;  \u2014 Heavy is not Shell's child in source; it's a prop</code></pre><p>This is why composition beats wrapping everything in one stateful component. It's also why putting <code>&lt;Heavy /&gt;</code> <i>inside</i> Shell's function body does re-render it.</p>"
  },
  {
    id: "qa-useeffect-fetch-race",
    group: "Interview::Experience",
    question: "How do you cancel an in-flight fetch when the id changes or the component unmounts?",
    answer: "<pre><code>useEffect(() =&gt; {\n  const ac = new AbortController();\n  fetch(`/api/${id}`, { signal: ac.signal })\n    .then(r =&gt; r.json())\n    .then(setData)\n    .catch(e =&gt; { if (e.name !== \"AbortError\") setErr(e); });\n  return () =&gt; ac.abort();\n}, [id]);</code></pre><div class=\"callout\">Without abort, a slow user A response can overwrite user B. TanStack Query and RSC loaders do this for you. Still write the AbortController version in interviews.</div>"
  },
  {
    id: "qa-key-vs-id-html",
    group: "Interview::Experience",
    question: "Is React's <code>key</code> the same as the DOM <code>id</code>?",
    answer: "<div class=\"callout warn\">No. <code>key</code> is a React reconciliation hint \u2014 never put on the DOM. HTML <code>id</code> is for labels, anchors, tests. <code>useId()</code> generates DOM ids, not list keys.</div>"
  },
  {
    id: "qa-default-vs-named-lazy",
    group: "Interview::Experience",
    question: "Why does <code>React.lazy(() => import('./Button'))</code> fail if Button is a named export?",
    answer: "<div class=\"callout warn\"><code>lazy</code> expects <code>{ default: Component }</code>. Named-only modules need a wrapper: <code>lazy(() => import('./Button').then(m => ({ default: m.Button })))</code>.</div><p>Or add a default export. Mention this \u2014 it bites people in code-splitting interviews and in real PRs.</p>"
  },
  {
    id: "qa-conditional-render",
    group: "Interview::Fundamentals",
    question: "How do you do conditional rendering in React?",
    answer: "<div class=\"callout good\">JSX is just expressions, so you branch with JavaScript: ternary, <code>&amp;&amp;</code>, early return, or extract a variable.</div><pre><code>{isAdmin ? &lt;Admin /&gt; : &lt;User /&gt;}\n{count &gt; 0 &amp;&amp; &lt;Badge n={count} /&gt;}\nif (!user) return &lt;Login /&gt;;\nconst body = loading ? &lt;Spinner /&gt; : &lt;List /&gt;;</code></pre><ul><li><code>&amp;&amp;</code> trap: <code>{count &amp;&amp; &lt;Badge /&gt;}</code> renders <b>0</b> when count is 0. Prefer <code>{count &gt; 0 &amp;&amp; \u2026}</code> or a ternary.</li><li>Don't hide with CSS if the subtree shouldn't mount (effects, subscriptions) \u2014 return <code>null</code>.</li><li>Switching between two component <b>types</b> unmounts state. Keep the type and pass a prop, or set a <code>key</code> if you <i>want</i> a reset.</li></ul>"
  },
  {
    id: "qa-prevent-default",
    group: "Interview::Forms & Events",
    question: "Why do you call <code>preventDefault</code> on a form submit in React?",
    answer: "<div class=\"callout good\">A native <code>&lt;form&gt;</code> GET/POSTs and <b>reloads the page</b>. <code>e.preventDefault()</code> keeps it a SPA mutation \u2014 you read fields and <code>setState</code> / call an Action instead.</div><pre><code>function onSubmit(e) {\n  e.preventDefault();\n  save({ email });\n}\n&lt;form onSubmit={onSubmit}&gt;\u2026&lt;/form&gt;</code></pre><p>React 19 <code>&lt;form action={fn}&gt;</code> already prevents the navigation when <code>action</code> is a function. You still <code>preventDefault</code> for <code>onSubmit</code> handlers and for links you want to hijack. <code>stopPropagation</code> is a different tool \u2014 it stops bubbling to React parents (modals, menus).</p>"
  },
  {
    id: "qa-checkbox-file",
    group: "Interview::Forms & Events",
    question: "How do you control checkboxes, radios, and file inputs?",
    answer: "<div class=\"cmp\"><div><h4>Checkbox / radio</h4><ul><li>Controlled: <code>checked={bool}</code> + <code>onChange={e =&gt; set(e.target.checked)}</code></li><li>Radio group: same <code>name</code>, <code>checked={value === \"a\"}</code></li><li>Don't use <code>value</code> as if it were the boolean \u2014 that's HTML, not React state</li></ul></div><div><h4>File input</h4><ul><li>Value is <b>read-only</b> in the DOM \u2014 you cannot set it from React state</li><li>Uncontrolled: <code>ref</code> or <code>onChange</code> \u2192 <code>e.target.files</code></li><li>Reset by changing <code>key</code> on the input</li></ul></div></div><p>Select: <code>value</code> + <code>onChange</code> on the <code>&lt;select&gt;</code> (or each option in a custom listbox). Multiple select: <code>multiple</code> + array state.</p>"
  },
  {
    id: "qa-event-bind",
    group: "Interview::Forms & Events",
    question: "How do you pass arguments to an event handler without firing it during render?",
    answer: "<div class=\"callout danger\"><code>onClick={handle(id)}</code> <b>calls handle during render</b>. Pass a function: <code>onClick={() =&gt; handle(id)}</code> or <code>onClick={handle}</code> when you need the event only.</div><pre><code>// \u2705\n&lt;button onClick={() =&gt; remove(id)}&gt;x&lt;/button&gt;\n&lt;button onClick={handleClick}&gt;ok&lt;/button&gt;\n\n// \u274c runs now, passes the return value (often undefined)\n&lt;button onClick={remove(id)}&gt;x&lt;/button&gt;</code></pre><p>In lists, an inline arrow is fine unless a <code>memo</code> child is skipping renders because of it \u2014 then <code>useCallback</code> or pass <code>id</code> via data attributes / a row component. Don't <code>.bind(this)</code> in render in new code; that's a class leftover.</p>"
  },
  {
    id: "qa-useimperativehandle",
    group: "Interview::Hooks",
    question: "What is <code>useImperativeHandle</code> and when is it justified?",
    answer: "<div class=\"callout good\">It customizes the instance value exposed to a parent <code>ref</code> \u2014 a small imperative escape hatch: <code>focus()</code>, <code>scrollTo()</code>, <code>play()</code> \u2014 not a second props channel.</div><pre><code>useImperativeHandle(ref, () =&gt; ({\n  focus: () =&gt; inputRef.current.focus(),\n}));</code></pre><p>If the parent can do it with props (<code>open</code>, <code>onClose</code>), use props. Imperative handles are for wrapping DOM APIs and third-party widgets. React 19 still needs a ref; you no longer need <code>forwardRef</code> on new components to receive it.</p>"
  },
  {
    id: "qa-sc-architecture-walk",
    group: "Interview::Scenarios",
    question: "Walk me through how React is architected at a high level. What actually happens from a click to pixels on screen?",
    answer: "<div class=\"callout good\"><b>Your tree is a function of state.</b> Components return descriptions (elements). Fiber walks that tree, diffs it, then commits a small set of DOM operations. You never patch the DOM by hand.</div><p class=\"flow-label\">The loop</p><div class=\"flow\"><div class=\"node\">Event<small>click / type / fetch</small></div><div class=\"arrow\">\u2192</div><div class=\"node accent\">setState<small>schedule update</small></div><div class=\"arrow\">\u2192</div><div class=\"node\">Render<small>call components \u2192 new tree</small></div><div class=\"arrow\">\u2192</div><div class=\"node good\">Reconcile<small>diff by type + key</small></div><div class=\"arrow good\">\u2192</div><div class=\"node good\">Commit<small>patch real DOM</small></div></div><ul><li><b>Host tree</b> (DOM / native views) is owned by React. You describe; it mutates.</li><li><b>Render phase</b> is interruptible (Fiber). <b>Commit</b> is synchronous so the user never sees a half-updated UI.</li><li><b>State location</b> decides who re-renders. A click in a leaf only re-renders that leaf <i>if the state lives there</i>. If the setter is 8 levels up, the whole subtree between owner and leaf re-renders unless you memoize or compose.</li><li>Urgent work (typing) can interrupt a transition (filtering a huge list).</li></ul><div class=\"callout\">Say this: 'React is not MVC. It is a scheduler + a reconciler + a renderer. My job is to put state in the right component and keep render pure.'</div>"
  },
  {
    id: "qa-sc-parent-child",
    group: "Interview::Scenarios",
    question: "How do a parent and a child actually talk to each other? Can a child reach into the parent and change its state?",
    answer: "<div class=\"callout good\"><b>Data down, events up.</b> The parent owns state and passes values as props. The child never mutates those props. To change something, it calls a callback the parent passed in \u2014 usually a setter wrapped in a handler.</div><p class=\"flow-label\">One interaction</p><div class=\"flow\"><div class=\"node accent\">Parent<small>const [q, setQ]</small></div><div class=\"arrow\">props \u2193</div><div class=\"node\">Child Search<small>value={q}</small></div><div class=\"arrow\">onChange \u2191</div><div class=\"node good\">setQ<small>parent re-renders</small></div><div class=\"arrow good\">\u2192</div><div class=\"node\">Child Results<small>new q as props</small></div></div><div class=\"cmp split\"><div><h4>Parent \u2192 child</h4><ul><li>Props: data, config, JSX slots (<code>children</code>)</li><li>Context, if many descendants need the same value</li><li>Never: child writes <code>props.user.name = \u2026</code></li></ul></div><div><h4>Child \u2192 parent</h4><ul><li>Callbacks: <code>onSelect</code>, <code>onChange</code>, <code>onClose</code></li><li>Rare: a ref + <code>useImperativeHandle</code> (<code>focus()</code>)</li><li>Never: import the parent's setter, or reach into a sibling</li></ul></div></div><pre><code>function Catalog() {\n  const [query, setQuery] = useState(\"\");\n  const [picked, setPicked] = useState(null);\n  return (\n    &lt;&gt;\n      &lt;Search value={query} onChange={setQuery} /&gt;\n      &lt;Results query={query} onPick={setPicked} /&gt;\n      {picked &amp;&amp; &lt;Detail item={picked} onClose={() =&gt; setPicked(null)} /&gt;}\n    &lt;/&gt;\n  );\n}</code></pre><p>Siblings don't talk. They share a parent. If that parent is far away, lift state, compose (<code>header={&lt;Avatar user={user} /&gt;}</code>), or use context/store \u2014 still the same rule: <b>one owner, props down, callbacks up</b>.</p>"
  },
  {
    id: "qa-sc-deep-click",
    group: "Interview::Scenarios",
    question: "A 'Delete' button sits five levels down. The list that owns the data is at the top. How do you wire that click without making a mess?",
    answer: "<div class=\"callout good\">You do <b>not</b> thread <code>onDelete</code> through five components that don't care. Either pass an already-built row from the top, put a stable <code>onDelete</code> in context, or let the row call a store/action.</div><ul><li><b>Composition (prefer):</b> <code>&lt;Table rows={items.map(i =&gt; &lt;Row key={i.id} item={i} onDelete={remove} /&gt;)} /&gt;</code> \u2014 middle layout components just render <code>rows</code>. They never see <code>onDelete</code>.</li><li><b>Context:</b> <code>DeleteContext</code> with a memoized <code>remove</code>. Fine when many distant widgets fire the same command. Don't put the whole list in that context or every keystroke re-renders the tree.</li><li><b>Store / server action:</b> row calls <code>deleteItem(id)</code>; the list is subscribed to that slice. Best when the list isn't even a React parent (another route, a portal).</li></ul><div class=\"callout warn\">Prop drilling through <code>Page \u2192 Layout \u2192 Card \u2192 Footer \u2192 Button</code> is the smell. If Layout only needs a slot, give it <code>children</code> or a <code>footer</code> element prop.</div>"
  },
  {
    id: "qa-sc-filter-results",
    group: "Interview::Scenarios",
    question: "You are building a page: a search box on the left, a results table on the right, a details pane when you click a row. Where does the state live, and who fetches?",
    answer: "<div class=\"callout good\">Sketch the tree on the whiteboard first. <b>Each piece of state lives in the lowest common owner that needs it.</b> Fetch as close to that owner as you can \u2014 or on the server above it.</div><table><tr><th>State</th><th>Owner</th><th>Why</th></tr><tr><td>Search text</td><td>page (or the search widget if results read a deferred copy)</td><td>Both filter + URL share it</td></tr><tr><td>Selected row id</td><td>page</td><td>Table and details pane both need it</td></tr><tr><td>Row list / server cache</td><td>Query hook or RSC parent</td><td>Not <code>useState</code> \u2014 it's server state</td></tr><tr><td>Details drawer open animation</td><td>the drawer</td><td>Nobody else cares</td></tr></table><ul><li>Keep the input snappy: <code>query</code> is urgent; wrap <code>setResultsFilter</code> in <code>startTransition</code> or <code>useDeferredValue</code>.</li><li>Sync filters to the URL (<code>searchParams</code>) so refresh/share works \u2014 that's also state, just in the router.</li><li>Don't fetch inside every row. Fetch the list once; fetch detail when <code>selectedId</code> changes (or include it in the list payload if it's cheap).</li></ul>"
  },
  {
    id: "qa-sc-million-rows",
    group: "Interview::Scenarios",
    question: "The product owner says this page has to render a million records. What do you actually do?",
    answer: "<div class=\"callout danger\"><b>You do not mount a million React rows.</b> A million <code>&lt;tr&gt;</code>s is a million fibers, a million DOM nodes, and a locked tab. React will not magically make that fine.</div><p class=\"flow-label\">Decide where the million lives</p><div class=\"cmp\"><div><h4>1. Don't send a million to the browser</h4><ul><li>That's the real answer most of the time</li><li>Server-side pagination, search, sort</li><li>Cursor / keyset pagination, not <code>OFFSET 999000</code></li><li>The UI holds one page (20\u2013100 rows) + total count</li></ul></div><div><h4>2. If they must scroll the lot</h4><ul><li><b>Windowing / virtualization:</b> only ~20\u201350 <i>visible</i> rows exist in the DOM</li><li><code>@tanstack/react-virtual</code> / <code>react-window</code></li><li>Fixed (or measured) row height; recycle cells on scroll</li><li>Still don't JSON-parse 1M fat objects on the main thread \u2014 stream / page the dataset</li></ul></div><div><h4>3. If it's analytics, not a table</h4><ul><li>Aggregate on the server (charts, histograms)</li><li>Or a canvas/WebGL grid (AG Grid, canvas tables) \u2014 not JSX per cell</li></ul></div></div><pre><code>// Mental model \u2014 visible window, not the dataset\nfunction HugeList({ rows }) {          // rows might still be too big in RAM\n  const virtualizer = useVirtualizer({\n    count: rows.length,\n    getScrollElement: () =&gt; parentRef.current,\n    estimateSize: () =&gt; 36,\n  });\n  return (\n    &lt;div ref={parentRef} style={{ height: 600, overflow: \"auto\" }}&gt;\n      &lt;div style={{ height: virtualizer.getTotalSize() }}&gt;\n        {virtualizer.getVirtualItems().map(v =&gt; (\n          &lt;Row key={v.key} row={rows[v.index]} style={{ transform: `translateY(${v.start}px)` }} /&gt;\n        ))}\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}</code></pre><ul><li><b>Keys:</b> stable ids, never index \u2014 recycling + index keys = swapped row state.</li><li><b>Memo the row</b> so scrolling doesn't re-render offscreen work you already skipped\u2026 but virtualization already unmounted them.</li><li><b>Don't</b> <code>rows.map</code> a million into JSX 'and then virtualize' \u2014 you already paid the render. The virtualizer must be the thing that <i>chooses</i> which indices to render.</li><li>RAM: a million JS objects with 40 fields is hundreds of MB. Pagination or a compact typed array / worker still matters even with a virtual list.</li></ul><div class=\"callout good\">Interview closer: 'I'd push back on loading 1M into the client. If we must, virtualize the window, keep the dataset off the main thread or paged, and never let a filter run a 1M <code>.filter</code> inside render without a transition or a worker.'</div>"
  },
  {
    id: "qa-sc-filter-million",
    group: "Interview::Scenarios",
    question: "OK, you virtualized the table. Now typing in the filter freezes the page for a second. How do you find it and fix it?",
    answer: "<div class=\"callout warn\">The freeze is almost never 'React is slow'. It is <b>you doing O(n) work on the urgent path</b> \u2014 <code>.filter</code> / sort of a huge array inside render, triggered by every keystroke.</div><ol><li><b>Prove it:</b> React Profiler while you type. If the page component is wide and yellow, look at <i>why</i> (hook 2 changed = the query string).</li><li><b>Split urgency:</b> input state updates now; filtering is a transition.<pre><code>const [q, setQ] = useState(\"\");\nconst [isPending, startTransition] = useTransition();\nconst onChange = e =&gt; {\n  const v = e.target.value;\n  setQ(v);                                  // urgent \u2014 caret stays live\n  startTransition(() =&gt; setNeedle(v));      // list may lag a frame\n};</code></pre></li><li><b>Don't filter in render</b> of a 1M array. Debounce, worker, or ask the server. Client-side, at least <code>useDeferredValue(q)</code> and memoize <code>useMemo(() =&gt; index.search(deferred), [deferred])</code>.</li><li><b>Index:</b> a prefix trie / FlexSearch / worker so you are not scanning a million strings on the main thread.</li><li>Keep the search box in its own component so its <code>useState</code> doesn't re-render the table owner on every key \u2014 table reads <code>deferredQ</code> or a store selector.</li></ol>"
  },
  {
    id: "qa-sc-god-component",
    group: "Interview::Scenarios",
    question: "You inherit a 2,000-line <code>App.jsx</code> that fetches, filters, renders the header, the table, and three modals. How do you break it up without rewriting the product?",
    answer: "<div class=\"callout good\">Split by <b>state ownership</b>, not by file count. Pull out pieces that can keep their own state so the leftover parent re-renders less.</div><ul><li>Extract presentational chunks first (<code>Header</code>, <code>Row</code>) \u2014 low risk, same state.</li><li>Move a modal's <code>open</code> flag <i>into</i> the modal trigger if nothing else needs it.</li><li>Search box: own its input; notify parent on submit/debounce, not per keystroke.</li><li>Data: a <code>useOrders()</code> hook or Query so fetch/error/cache leaves the JSX.</li><li>Pass <code>children</code> into a stateful shell so the expensive table is created by a parent that doesn't tick.</li></ul><pre><code>function Shell({ children }) {\n  const [tab, setTab] = useState(\"open\");\n  return (&lt;&gt;&lt;Tabs value={tab} onChange={setTab} /&gt;{children}&lt;/&gt;);\n}\n// &lt;Shell&gt;&lt;OrdersTable /&gt;&lt;/Shell&gt; \u2014 table doesn't re-render on tab chrome if you structure it this way carefully</code></pre><p>Don't start with Redux. If after the split you still have five distant writers of the same list, then a store. Interviewers want to hear 'I slice state down before I add a library'.</p>"
  },
  {
    id: "qa-sc-modal-anywhere",
    group: "Interview::Scenarios",
    question: "Any screen in the app can open a 'Create ticket' modal. How do you architect that so every page isn't passing <code>setOpen</code> around?",
    answer: "<ul><li><b>Don't lift <code>open</code> to <code>App</code></b> unless App is the only owner. That re-renders the world.</li><li><b>Portal + local trigger:</b> each button owns a small <code>&lt;CreateTicketButton /&gt;</code> that renders a portal. Simplest; duplicate if you have one button.</li><li><b>A tiny store / context:</b> <code>openTicketModal({ prefill })</code> + a single <code>&lt;TicketModalHost /&gt;</code> next to the router. Consumers call the function; they don't subscribe to <code>open</code> (put <code>open</code> in the host only).</li><li>URL: <code>/tickets/new</code> as a route modal (Next intercepting routes, RR). Refresh and back-button work. That's often the best 'global modal'.</li></ul><div class=\"callout\">The trick: <b>the host subscribes, the buttons dispatch</b>. If buttons <code>useContext</code> the boolean, every open/close re-renders every screen that imported the hook.</div>"
  },
  {
    id: "qa-sc-parent-rerender-pain",
    group: "Interview::Scenarios",
    question: "The parent holds a counter in the header. Every click re-renders a heavy chart sitting next to it. Walk me through what you'd do in the room.",
    answer: "<div class=\"callout good\">First say <i>why</i>: the chart is a function child of the component that owns <code>count</code>, so React re-invokes it. The DOM may not change; the JS still ran.</div><ol><li>Profiler: confirm the chart committed because 'parent'. Don't memo yet if the chart is cheap \u2014 but they said it's heavy.</li><li><b>Move the counter down</b> into <code>&lt;HeaderCounter /&gt;</code>. Best fix. State no longer lives next to the chart.</li><li><b>Composition:</b> <code>&lt;Layout header={&lt;Counter /&gt;}&gt;&lt;Chart data={data} /&gt;&lt;/Layout&gt;</code> \u2014 Layout's ticks don't recreate Chart if Chart is passed as <code>children</code> from a parent that didn't re-render.</li><li>Last: <code>React.memo(Chart)</code> + stable <code>data</code>. This is a band-aid if <code>data</code> is a new array every parent render.</li></ol><div class=\"callout warn\">Wrapping Chart in <code>memo</code> while the parent does <code>data={items.filter(\u2026)}</code> inline still fails. Fix identity or state location, not only <code>memo</code>.</div>"
  },
  {
    id: "qa-sc-fetch-where",
    group: "Interview::Scenarios",
    question: "Where should this page fetch \u2014 the parent, each card, a hook, the server? We have a list of projects and each card shows the owner avatar.",
    answer: "<table><tr><th>Choice</th><th>When it is right</th><th>When it hurts</th></tr><tr><td>Parent fetches the list (with owner already joined)</td><td>Default. One round trip. Cards are dumb.</td><td>Payload huge because you over-joined</td></tr><tr><td>Each card fetches its owner</td><td>Never as the default \u2014 N+1 in the browser</td><td>Waterfall, duplicate spinners, rate limits</td></tr><tr><td>TanStack Query per card with the same <code>['user', id]</code> key</td><td>Owner is reused in 12 places; cache dedupes</td><td>Still N requests the first time unless you prefetch</td></tr><tr><td>RSC parent <code>await db.project.findMany({ include: { owner: true }})</code></td><td>App Router. No client waterfalls.</td><td>Need a client island only for the follow button</td></tr></table><div class=\"callout good\">Rule of thumb: <b>fetch where you can see the whole picture</b> (the list owner / the server). Children receive props. Repeat fetches only with a shared cache key, not with copy-pasted <code>useEffect</code>.</div>"
  },
  {
    id: "qa-sc-realtime-list",
    group: "Interview::Scenarios",
    question: "A WebSocket dumps order updates. The grid might have tens of thousands of rows. How do you keep this from melting the UI?",
    answer: "<ul><li><b>Don't <code>setOrders(prev =&gt; [...prev, msg])</code> per packet.</b> Buffer in a ref, flush on <code>requestAnimationFrame</code> or every 50\u2013100ms.</li><li>Store as a <b>Map by id</b>, not an array you rebuild. Selectors return the slice the row needs.</li><li>Virtualize. A row that isn't on screen shouldn't subscribe to the full array \u2014 subscribe to <code>orders.get(id)</code> or a Zustand selector.</li><li><code>startTransition</code> for applying a batch so typing in a filter still wins.</li><li>If the socket is faster than paint, drop intermediate ticks (show latest, not every tick).</li></ul><div class=\"callout\">This is the same 1M-row story: <b>the DOM window is tiny, the model is incremental, the render is a batch</b>.</div>"
  },
  {
    id: "qa-sc-pagination-vs-virtual",
    group: "Interview::Scenarios",
    question: "Pagination, infinite scroll, or a virtualized 1M-row grid \u2014 how do you choose in front of the interviewer?",
    answer: "<div class=\"cmp\"><div><h4>Pagination</h4><ul><li>Default for ops tools, search, anything with sort/filter on the server</li><li>Shareable page in the URL</li><li>Predictable cost</li></ul></div><div><h4>Infinite scroll</h4><ul><li>Feeds, inboxes, mobile</li><li>Still page on the server; append</li><li>Painful to jump to row 500,000 \u2014 don't use it for that</li></ul></div><div><h4>Virtual window on a huge client cache</h4><ul><li>Excel-like sheets, log viewers, already-loaded telemetry</li><li>Needs a loaded (or seekable) dataset</li><li>Jump-to-row is a scroll offset, not a fetch \u2014 until the data isn't local</li></ul></div></div><p>For 'display 1M records' the honest sequence is: <b>server query \u2192 one page \u2192 if they insist on a spreadsheet feel, virtualize a window and load ranges on scroll (like a file seek)</b>, not one JSON blob.</p>"
  },
  {
    id: "qa-sc-children-vs-render",
    group: "Interview::Scenarios",
    question: "I put my expensive child inside the parent JSX. A friend said 'pass it as children instead'. What are they talking about, and when does it matter?",
    answer: "<div class=\"callout good\">If you write <code>&lt;Heavy /&gt;</code> <i>inside</i> <code>Parent</code>'s function, every Parent render creates a new element and reconciles Heavy. If the <i>caller</i> writes <code>&lt;Parent&gt;&lt;Heavy /&gt;&lt;/Parent&gt;</code>, Heavy is an element the caller already produced. Parent re-rendering (counter, toggle) reuses that same child fiber when its props didn't change.</div><pre><code>// Heavy re-renders with Parent\nfunction Parent() {\n  const [n, setN] = useState(0);\n  return (&lt;&gt;&lt;button onClick={() =&gt; setN(n+1)} /&gt;&lt;Heavy /&gt;&lt;/&gt;);\n}\n\n// Heavy does not re-render when Shell's n changes\nfunction Shell({ children }) {\n  const [n, setN] = useState(0);\n  return (&lt;&gt;&lt;button onClick={() =&gt; setN(n+1)}&gt;{n}&lt;/button&gt;{children}&lt;/&gt;);\n}\n&lt;Shell&gt;&lt;Heavy /&gt;&lt;/Shell&gt;</code></pre><p>This is how you keep a ticker or a tab bar from blowing away a dashboard. It is composition as an architecture tool, not a style preference.</p>"
  },
  {
    id: "qa-sc-state-ownership",
    group: "Interview::Scenarios",
    question: "Give me a rule for 'who owns this state?' that you actually use on a team.",
    answer: "<ol><li><b>If only one widget needs it, it lives there.</b> Dropdown open, local input, animation.</li><li><b>If two siblings must stay in sync, their parent owns it</b> (or the URL, or a store if the parent would become a god object).</li><li><b>If it comes from the server, it is not <code>useState</code>.</b> Query cache or RSC. Local state is for the draft, not the source of truth.</li><li><b>If it must survive refresh / share, it belongs in the URL</b> (filters, selected id, tab).</li><li><b>If 12 unrelated trees write it, a store.</b> If they only read a rare global (theme, auth), context.</li></ol><div class=\"callout good\">When unsure, start too local. Lifting is easy. Globalizing first is how you get a 400-field Redux slice and a 1s keystroke.</div>"
  },
  {
    id: "qa-sc-list-row-state",
    group: "Interview::Scenarios",
    question: "Each row has an inline-edit input. Users complain that after sort or delete, the text jumps to another row. What went wrong in the architecture?",
    answer: "<div class=\"callout danger\">Row state got tied to <b>position</b> (index keys, or state stored in the parent as <code>edits[0]</code>) instead of <b>identity</b> (<code>item.id</code>).</div><ul><li><code>key={index}</code> \u2014 React reuses the first fiber for whoever is now first. The input's <code>useState</code> stays on that fiber.</li><li>Fix: <code>key={order.id}</code>, and keep draft text in a map keyed by id (or inside a memoized <code>Row</code> that remounts when id changes).</li><li>If the parent stores <code>drafts: string[]</code>, sorting the list without sorting drafts desyncs them \u2014 store <code>Record&lt;id, draft&gt;</code>.</li></ul><p>Same family as the 1M-row question: <b>identity is the architecture</b>. Virtualization without stable keys will show the same bug at scroll speed.</p>"
  },
];

function overlayBuiltins(local, seed) {
  const missing = [];
  Object.keys(seed).forEach(id => {
    if (!local[id]) missing.push(id);
    local[id] = seed[id];
  });

function ensureMap(x) {
  if (!x || typeof x !== "object") return {};
  if (Array.isArray(x)) {
    const m = {};
    x.forEach(it => { if (it && it.id) m[it.id] = it; });
    return m;
  }
  return x;
}
async function persistSeed(path, storageKey, local, seed) {
  const ids = Object.keys(seed);
  if (!ids.length) return;
  if (SERVER) {
    for (const id of ids) {
      try {
        await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(stripRuntime(seed[id])) });
      } catch (e) {}
    }
  } else {
    try { localStorage.setItem(storageKey, JSON.stringify(serializeMap(local))); } catch (e) {}
  }
}

const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---- Eclipse-style Java syntax highlighter (self-contained, no deps) ---- */
const JAVA_KW = new Set(("abstract assert boolean break byte case catch char class const continue " +
  "default do double else enum extends final finally float for goto if implements import instanceof " +
  "int interface long native new package private protected public return short static strictfp super " +
  "switch synchronized this throw throws transient try void volatile while var yield record sealed " +
  "permits when true false null").split(" "));
function highlightJava(src) {
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  // one token category per match: comment | string/char | annotation | number | word
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*[dDfFlL]?\b)|([A-Za-z_$][\w$]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tok-ann">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
    else {
      const w = m[5];
      if (JAVA_KW.has(w)) out += `<span class="tok-kw">${esc(w)}</span>`;
      else if (/^[A-Z]/.test(w)) out += `<span class="tok-cls">${esc(w)}</span>`;
      else out += esc(w);
    }
  }
  out += esc(src.slice(last));
  return out;
}
function highlightBlocks(root) {
  if (!root) return;
  root.querySelectorAll("pre code").forEach(c => {
    if (c.dataset.hl) return;
    c.innerHTML = highlightJava(c.textContent);
    c.dataset.hl = "1";
  });
}

function renderSidebar(mode) {

function itemEl(t) {

/* build a nested tree from groups whose names use "::" (e.g. "A::B::C") */
function buildTree(groups) {
  const root = { children: {}, order: [], terms: [] };
  groups.forEach(g => {
    let node = root;
    tagParts(g.name).forEach(p => {
      if (!node.children[p]) { node.children[p] = { name: p, children: {}, order: [], terms: [] }; node.order.push(p); }
      node = node.children[p];
    });
    node.terms.push(...g.terms);
  });
  return root;
}
function countTree(node) {
  let n = node.terms.length;
  node.order.forEach(k => (n += countTree(node.children[k])));
  return n;
}
function renderTreeNode(node, container, depth) {
  node.order.forEach(key => {
    const child = node.children[key];
    const group = document.createElement("div");
    group.className = "group";
    const head = document.createElement("div");
    head.className = "group-head";
    head.style.paddingLeft = (10 + depth * 12) + "px";
    head.innerHTML = `<span class="caret">▼</span><span>${child.name}</span><span class="count">${countTree(child)}</span>`;
    head.addEventListener("click", () => group.classList.toggle("collapsed"));
    group.appendChild(head);
    const items = document.createElement("div");
    items.className = "group-items";
    renderTreeNode(child, items, depth + 1);          // nested sub-tags first
    child.terms.forEach(t => {
      const el = itemEl(t);
      el.style.paddingLeft = (22 + depth * 12) + "px";
      items.appendChild(el);
    });
    group.appendChild(items);
    container.appendChild(group);
  });
}

/* ---- Search filter ---- */
const searchInput = document.getElementById("search");
function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  if (navSection === "docs") {
    document.querySelectorAll("#nav .term").forEach(term => {
      const d = DOCS.find(x => x.name === term.dataset.id);
      const hit = !q || (d && ((d.title || "").toLowerCase().includes(q) || d.name.toLowerCase().includes(q)));
      term.classList.toggle("hidden", !hit);
    });
    return;
  }
  const index = navIndex();
  document.querySelectorAll("#nav .group").forEach(group => {
    let visible = 0;
    group.querySelectorAll(".term").forEach(term => {
      const t = index[term.dataset.id];
      const hit = !q || (t && (t.title.toLowerCase().includes(q) || (t.lede || "").toLowerCase().includes(q)));
      term.classList.toggle("hidden", !hit);
      if (hit) visible++;
    });
    group.classList.toggle("hidden", visible === 0);
    if (q) group.classList.remove("collapsed");
  });
}
searchInput.addEventListener("input", applyFilter);

let wallBuilt = false;

/* ---- Globe view (rotating 3D sphere of term chips) ---- */
const ovGlobe = document.getElementById("ov-globe");
const ovbGlobe = document.getElementById("ovb-globe");
let globeBuilt = false, globeActive = false, globeRAF = null;
let globeChips = [];
let gAngleX = 0.3, gAngleY = 0, gVelX = 0, gVelY = 0.004, gPaused = false;
let gZoom = 1, gAuto = true;
const gMouse = { x: 0, y: 0, inside: false };

function buildGlobe() {
  if (globeBuilt) return;
  const all = [];
  ovCtx.groups().forEach((g, gi) => g.terms.forEach(t => all.push({ t, color: GROUP_COLORS[gi % GROUP_COLORS.length] })));
  const N = all.length;
  all.forEach((item, idx) => {
    const phi = Math.acos(1 - 2 * (idx + 0.5) / N);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (idx + 0.5);
    const chip = document.createElement("div");
    chip.className = "globe-chip";
    chip.textContent = item.t.title;
    chip.style.color = item.color;
    chip.style.borderColor = item.color;
    chip.addEventListener("mouseenter", e => { gPaused = true; showTip(e, item.t); });
    chip.addEventListener("mousemove", moveTip);
    chip.addEventListener("mouseleave", () => { gPaused = false; hideTip(); });
    chip.addEventListener("click", () => { hideTip(); ovCtx.open(item.t.id); });
    ovGlobe.appendChild(chip);
    globeChips.push({
      el: chip,
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    });
  });
  globeBuilt = true;
}
function globeFrame() {
  if (!globeActive) return;
  const rect = ovGlobe.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const radius = (Math.min(rect.width, rect.height) / 2 - 70) * gZoom;
  if (!gPaused && gAuto) {
    if (gMouse.inside) {
      gVelY = ((gMouse.x - cx) / cx) * 0.06;
      gVelX = -((gMouse.y - cy) / cy) * 0.06;
    } else {
      gVelY += (0.004 - gVelY) * 0.02;
      gVelX += (0 - gVelX) * 0.02;
    }
    gAngleY += gVelY;
    gAngleX += gVelX;
  }
  const sinY = Math.sin(gAngleY), cosY = Math.cos(gAngleY);
  const sinX = Math.sin(gAngleX), cosX = Math.cos(gAngleX);
  globeChips.forEach(c => {
    const x1 = c.x * cosY - c.z * sinY;
    const z1 = c.x * sinY + c.z * cosY;
    const y2 = c.y * cosX - z1 * sinX;
    const z2 = c.y * sinX + z1 * cosX;
    const depth = (z2 + 1) / 2;                 // 0 (back) .. 1 (front)
    const px = cx + x1 * radius;
    const py = cy + y2 * radius;
    const el = c.el;
    el.style.transform = `translate(-50%,-50%) translate(${px}px,${py}px) scale(${(0.6 + depth * 0.55).toFixed(3)})`;
    el.style.opacity = (0.3 + depth * 0.7).toFixed(3);
    el.style.zIndex = Math.round(depth * 100);
  });
  globeRAF = requestAnimationFrame(globeFrame);
}
function startGlobe() {
  buildGlobe();
  globeActive = true;
  if (!globeRAF) globeRAF = requestAnimationFrame(globeFrame);
}
function stopGlobe() {
  globeActive = false;
  if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
}
ovGlobe.addEventListener("mousemove", e => {
  const r = ovGlobe.getBoundingClientRect();
  gMouse.x = e.clientX - r.left; gMouse.y = e.clientY - r.top; gMouse.inside = true;
});
ovGlobe.addEventListener("mouseleave", () => { gMouse.inside = false; });

let gHoldTimer = null;
function gHoldStart(fn) { fn(); gHoldTimer = setInterval(fn, 40); }
function gHoldStop() { if (gHoldTimer) { clearInterval(gHoldTimer); gHoldTimer = null; } }
const GSTEP = 0.1;
function gNudge(dir) {
  if (dir === "left") gAngleY -= GSTEP;
  else if (dir === "right") gAngleY += GSTEP;
  else if (dir === "up") gAngleX -= GSTEP;
  else if (dir === "down") gAngleX += GSTEP;
}
function gZoomBy(f) { gZoom = Math.min(2.4, Math.max(0.6, gZoom * f)); }
const HOLD_END = ["pointerup", "pointerleave", "pointercancel"];
globeControls.querySelectorAll(".gc-btn[data-dir]").forEach(btn => {

const NOTE_KEY = id => "agentai-note:" + id;

/* --- tiny IndexedDB kv (to persist the folder handle across reloads) --- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("app:" + APP_ID, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv").objectStore("kv").get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

/* --- Local server upload (preferred when page is served over http) --- */
const SERVER = location.protocol === "http:" || location.protocol === "https:";
async function uploadToServer(blob, name, subdir) {
  const headers = { "X-Filename": name, "Content-Type": blob.type || "application/octet-stream" };
  if (subdir) headers["X-Subdir"] = subdir;   // e.g. "terms" or "qa"
  const res = await fetch("/upload", { method: "POST", headers, body: blob });
  if (!res.ok) throw new Error("upload failed: " + res.status);
  return (await res.json()).url;   // e.g. "/images/mynotes/object-class__123.png"
}

  }

}
function saveNoteToServer(termId, html) {

  fetch("/notes", {
    method: "POST",

/* custom terms: persisted on the server (shared) or in localStorage (offline) */
const CUSTOM_KEY = "agentai-terms";

  }

function slugify(s) {

function uniqueId(base) {
  let id = base, i = 2;

/* --- File System Access helpers --- */
const FSA = typeof window.showDirectoryPicker === "function";
async function ensurePerm(h, mode = "readwrite") {
  if (!h) return false;
  const opts = { mode };
  if ((await h.queryPermission(opts)) === "granted") return true;
  try { return (await h.requestPermission(opts)) === "granted"; } catch (e) { return false; }
}
async function saveImageToFolder(blob, name) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}
async function loadImageFromFolder(name) {
  const fh = await dirHandle.getFileHandle(name);
  const url = URL.createObjectURL(await fh.getFile());
  objectUrls.push(url);
  return url;
}
async function initFolder() {
  if (!FSA) return;
  try { const h = await idbGet("imgdir"); if (h) dirHandle = h; } catch (e) {}
  updateFolderUI();
}

  if (!FSA) { alert("This browser can't store images to a folder. Pasted images will be embedded inline instead (try Chrome or Edge for folder storage)."); return; }
  try {
    const h = await window.showDirectoryPicker();
    if (!(await ensurePerm(h))) return;
    dirHandle = h;
    await idbSet("imgdir", h);
    updateFolderUI();
    // re-load any folder images now that we have access
    document.querySelectorAll(".note-editor").forEach(rehydrate);
  } catch (e) { /* user cancelled */ }
}
function updateFolderUI() {
  let label;

  } else if (!FSA) {
    label = "Images are embedded inline. Tip: run <b>start.command</b> to save them as files instead.";
  } else if (dirHandle) {
    label = `Pasted images are saved to your linked folder <b>“${dirHandle.name}”</b>.`;
  } else {

  }

}

/* --- utilities --- */
const blobToDataURL = blob => new Promise(res => {
  const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob);
});
function placeCaretEnd(el) {
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function insertImg(editor, src, fileName) {
  placeCaretEnd(editor);
  const attr = fileName ? ` data-file="${fileName}"` : "";
  document.execCommand("insertHTML", false, `<img src="${src}"${attr} alt="">`);
}
/* save: strip blob src from folder images (kept by data-file), embedded imgs stay */
function serialize(editor) {
  const c = editor.cloneNode(true);
  c.querySelectorAll("img[data-file]").forEach(img => img.removeAttribute("src"));
  return c.innerHTML;
}
function saveNote(termId, editor) {
  const html = serialize(editor);
  if (SERVER) { saveNoteToServer(termId, html); return; }
  try { localStorage.setItem(NOTE_KEY(termId), html); } catch (e) {}
}
async function rehydrate(editor) {
  if (!dirHandle) return;
  if (!(await ensurePerm(dirHandle))) return;
  for (const img of editor.querySelectorAll("img[data-file]")) {
    if (img.getAttribute("src")) continue;
    try { img.src = await loadImageFromFolder(img.dataset.file); }
    catch (e) { img.alt = "[missing image: " + img.dataset.file + "]"; }
  }
}
async function handleImageBlob(blob, editor, prefix, subdir) {
  // derive extension from MIME, falling back to the file name (dropped files
  // sometimes have an empty type) so an animated .gif is never saved as .png
  let ext = ((blob.type.split("/")[1]) || "").toLowerCase().replace("jpeg", "jpg");
  if (!ext && blob.name) { const m = blob.name.match(/\.([a-z0-9]+)$/i); if (m) ext = m[1].toLowerCase(); }
  if (!ext) ext = "png";
  const name = `${prefix}__${(new Date()).getTime()}.${ext}`;

  // 1) Preferred: the file goes to this module's images/ folder in Drive, and
  //    a durable drive:<id> reference comes back
  if (SERVER) {
    try {
      const url = await uploadToServer(blob, name, subdir);
      insertImg(editor, url, null);   // plain relative URL; persisted on Save
      return;
    } catch (e) { /* server unreachable -> fall through */ }
  }

  // 2) File System Access folder (when opened directly in Chrome/Edge)
  if (dirHandle && await ensurePerm(dirHandle)) {
    try {
      await saveImageToFolder(blob, name);
      insertImg(editor, await loadImageFromFolder(name), name);
      return;
    } catch (e) { /* fall through */ }
  }

  // 3) Last resort: embed inline as a data URL
  insertImg(editor, await blobToDataURL(blob), null);
}

/* --- mount one notes section (noteId namespaces storage; subdir routes images) --- */
function mountNotes(root, noteId, subdir) {
  subdir = subdir || "mynotes";
  const editor = root.querySelector(".note-editor");
  if (!editor) return;
  const view = root.querySelector(".note-view");
  const editArea = root.querySelector(".note-edit");
  const editBtn = root.querySelector('[data-act="edit"]');
  const saveBtn = root.querySelector('[data-act="save"]');
  const cancelBtn = root.querySelector('[data-act="cancel"]');
  const toolbar = root.querySelector(".note-toolbar");
  let currentHtml = "";

  function renderView() {
    if (currentHtml && currentHtml.trim()) {
      view.innerHTML = currentHtml;
      if (!SERVER) rehydrate(view);
    } else {
      view.innerHTML = '<span class="empty-note">No notes yet. Click <b>Edit</b> to add notes.</span>';
    }
  }
  function setMode(editing) {
    editArea.hidden = !editing;
    view.hidden = editing;
    editBtn.hidden = editing;
    saveBtn.hidden = !editing;
    cancelBtn.hidden = !editing;
  }

  // load saved notes
  if (SERVER) {
    getServerNotes().then(notes => { currentHtml = (notes && notes[noteId]) || ""; renderView(); });
  } else {
    try { currentHtml = localStorage.getItem(NOTE_KEY(noteId)) || ""; } catch (e) {}
    renderView();
  }
  updateFolderUI();

  editBtn.addEventListener("click", () => {
    editor.innerHTML = currentHtml;
    if (!SERVER) rehydrate(editor);
    setMode(true);
    editor.focus();
  });
  cancelBtn.addEventListener("click", () => setMode(false));
  saveBtn.addEventListener("click", () => {
    currentHtml = serialize(editor);
    saveNote(noteId, editor);
    renderView();
    setMode(false);
  });

  wireEditor(toolbar, editor, noteId, subdir);
}

/* shared rich-text wiring (used by notes + the Add-term/Add-QA modals) */
function wireEditor(toolbar, editor, imgPrefix, subdir) {
  const hasFolder = !!toolbar.querySelector('[data-act="folder"]');
  toolbar.innerHTML = buildToolbarHTML(hasFolder);
  toolbar.addEventListener("mousedown", e => e.preventDefault());
  toolbar.addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const cmd = btn.dataset.cmd, act = btn.dataset.act, block = btn.dataset.block;
    editor.focus();
    if (cmd === "createLink") {
      const url = prompt("Link URL:"); if (url) document.execCommand("createLink", false, url);
    } else if (block) {
      document.execCommand("formatBlock", false, block);
    } else if (cmd) {
      document.execCommand(cmd, false, null);
    } else if (act === "code") {
      wrapInlineCode(editor);
    } else if (act === "br") {
      document.execCommand("insertHTML", false, "<br>");
    } else if (act === "hr") {
      document.execCommand("insertHorizontalRule", false);
    } else if (act === "image") {
      pendingEditor = editor; pendingTerm = imgPrefix; pendingSubdir = subdir || ""; fileInput.click();
    } else if (act === "folder") {
      linkFolder();
    } else if (act === "clear") {
      editor.innerHTML = "";
    }
    editor.focus();
  });
  editor.addEventListener("paste", e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.indexOf("image/") === 0) {
        e.preventDefault();
        const blob = it.getAsFile();
        if (blob) handleImageBlob(blob, editor, imgPrefix, subdir);
        return;
      }
    }
  });
  // drag-and-drop image FILES (incl. animated .gif — dropped files keep their
  // real MIME type, unlike clipboard paste which flattens a GIF to a static PNG)
  editor.addEventListener("dragover", e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault();
  });
  editor.addEventListener("drop", e => {
    const files = (e.dataTransfer && e.dataTransfer.files) || [];
    const imgs = Array.from(files).filter(f => (f.type && f.type.indexOf("image/") === 0) || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(f.name || ""));
    if (!imgs.length) return;              // let non-image drops behave normally
    e.preventDefault();
    imgs.forEach(f => handleImageBlob(f, editor, imgPrefix, subdir));
  });
  editor.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.shiftKey) {           // explicit line break
      e.preventDefault();
      document.execCommand("insertHTML", false, "<br>");
    }
    if (e.key === "Tab") {                            // tab -> indent, don't leave editor
      e.preventDefault();
      document.execCommand("insertHTML", false, "\u00a0\u00a0");
    }
  });
}

/* wrap the current selection in inline <code>\u2026</code> (monospace) */
function wrapInlineCode(editor) {
  const sel = getSelection();
  if (!sel || !sel.rangeCount) return;
  const text = sel.toString();
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  document.execCommand("insertHTML", false, "<code>" + (text ? esc(text) : "\u200b") + "</code>\u200b");
}

/* ---- Theme picker ---- */
/* The theme follows the hub. Cookies are keyed by host and ignore the port, so
   one `tech_theme` value is shared by the hub (:8500) and every module — picking
   a theme anywhere moves them all. localStorage stays the standalone fallback
   for running this app on its own (or over file://, where cookies are blocked). */
const THEME_COOKIE = "tech_theme";
const THEMES = ["dark", "moonlight", "gray", "soft", "white", "colorful", "cartoon"];
function _setCookie(k, v) {
  try { document.cookie = k + "=" + encodeURIComponent(v) + ";path=/;max-age=31536000;SameSite=Lax"; }
  catch (e) {}
}
function _getCookie(k) {
  try {
    const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + k + "=([^;]+)"));
    return m ? decodeURIComponent(m[1]) : null;
  } catch (e) { return null; }
}
function applyTheme(name) {
  if (!THEMES.includes(name)) name = "dark";      // ignore an unknown/stale value
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("agentai-theme", name); } catch (e) {}
  _setCookie(THEME_COOKIE, name);                 // tell the hub and the other modules
  // Broadcasts to other open pages and mirrors to Drive, once the modules that
  // provide it have loaded. Anchored on the cookie line rather than the end of
  // applyTheme, because AgenticAI's also re-renders the open document.
  window.__pghubSettings?.setTheme(name);
}
let savedTheme = _getCookie(THEME_COOKIE);        // the hub's choice wins on load
if (!savedTheme) { try { savedTheme = localStorage.getItem("agentai-theme"); } catch (e) {} }
applyTheme(savedTheme || "dark");
/* catch a theme changed in the hub while this tab sat in the background */
function syncThemeFromHub() {
  const c = _getCookie(THEME_COOKIE);
  if (c && c !== document.documentElement.getAttribute("data-theme")) applyTheme(c);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncThemeFromHub(); });
window.addEventListener("focus", syncThemeFromHub);

    saveNoteToServer(id, "");

let qaItems = {};
let QA_GROUPS = [];
let QA_INDEX = {};
const QA_KEY = "agentai-qa";

function stripHtml(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function rebuildQAData() {
  QA_GROUPS = []; QA_INDEX = {};
  const byName = {};
  Object.values(qaItems).forEach(q => {
    const qtext = stripHtml(q.question);
    q.title = qtext.slice(0, 80) || "Untitled question";   // derived label (no title field)
    q.lede = stripHtml(q.answer).slice(0, 160) || qtext;    // tooltip shows the answer preview
    let g = byName[q.group];
    if (!g) { g = { name: q.group, tag: tagLeaf(q.group), terms: [] }; byName[q.group] = g; QA_GROUPS.push(g); }
    g.terms.push(q);
    QA_INDEX[q.id] = q;
  });
  QA_GROUPS.forEach(g => g.terms.forEach(q => (q._group = g)));
}
async function loadQA() {
  if (SERVER) {
    try { const r = await fetch("/qa"); return r.ok ? await r.json() : {}; } catch (e) { return {}; }
  }
  try { return JSON.parse(localStorage.getItem(QA_KEY) || "{}"); } catch (e) { return {}; }
}
function persistQA(item) {
  qaItems[item.id] = item;
  if (SERVER) {
    fetch("/qa", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(stripRuntime(item)) }).catch(() => {});
  } else {
    try { localStorage.setItem(QA_KEY, JSON.stringify(serializeMap(qaItems))); } catch (e) {}
  }
}
function uniqueQAId(base) {
  let id = base, i = 2;
  while (QA_INDEX[id] || qaItems[id]) { id = base + "-" + i; i++; }
  return id;
}
function qaDetailHTML(q) {
