<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Bridge between the app's startup and the Drive-backed store.
 *
 * The application below is a classic (non-module) script, so it executes during
 * parsing — before app/boot.js, which is a module and therefore deferred. Its
 * first act is to fetch('/terms'), and on a static host that would 404 long
 * before the store exists to answer it.
 *
 * So window.fetch is replaced up front with a version that parks every call.
 * Once the store installs it calls __pghubInstall, the parked calls are
 * replayed into it, and fetch behaves normally from then on. The app just
 * experiences a slightly slow first request.
 */
(function () {
  // Which Drive folder this page's content lives in. Stamped in by
  // tools/build-app.py from the folder the page sits in.
  window.__pghubModule = "SpringFramework";
  var native = window.fetch.bind(window);
  // Published so the store can pass non-app requests straight to the browser.
  // It cannot capture window.fetch itself: by the time its module is imported
  // this shim has already replaced it, so what it would capture is the shim —
  // and passthrough would call back into the handler forever.
  window.__pghubNativeFetch = native;
  var parked = [];
  var handler = null;
  window.__pghubInstall = function (fn) {
    handler = fn;
    var queued = parked.splice(0);
    for (var i = 0; i < queued.length; i++) queued[i]();
  };
  window.fetch = function (input, init) {
    if (handler) return handler(input, init);
    return new Promise(function (resolve, reject) {
      parked.push(function () { (handler || native)(input, init).then(resolve, reject); });
    });
  };
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpringNotes — Terms</title>
<style>
  /* ===== Dark (default) ===== */
  :root, [data-theme="dark"] {
    --bg: #0f1117;
    --panel: #161922;
    --panel-2: #1d2230;
    --border: #2a2f3d;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --accent-soft: #1e2a44;
    --chip: #2a3550;
    --code-bg: #0b0d13;
    --code-text: #c8d3f5;
    --accent-ink: #0b0d13;
    /* semantic colours for diagrams and callouts (overridden for light themes) */
    --ok: #3fb950;
    --warn: #e3a008;
    --danger: #e5534b;
  }
  /* light themes need darker semantic colours to stay legible on white */
  [data-theme="soft"], [data-theme="white"],
  [data-theme="colorful"], [data-theme="cartoon"] {
    --ok: #1a7f37;
    --warn: #9a6700;
    --danger: #cf222e;
  }

  /* ===== Moonlight ===== */
  [data-theme="moonlight"] {
    --bg: #0b1023; --panel: #121833; --panel-2: #1a2244; --border: #27305a;
    --text: #dfe4ff; --muted: #8e98c9; --accent: #8b9dff; --accent-soft: #1f2a55;
    --chip: #26305c; --code-bg: #080c1c; --code-text: #aeb8ff; --accent-ink: #0b1023;
  }

  /* ===== Gray ===== */
  [data-theme="gray"] {
    --bg: #2b2f36; --panel: #33383f; --panel-2: #3c424a; --border: #4a5159;
    --text: #e7e9ec; --muted: #a7aeb6; --accent: #9fb0c0; --accent-soft: #3f4651;
    --chip: #444b54; --code-bg: #23272d; --code-text: #cdd3da; --accent-ink: #1b1e23;
  }

  /* ===== Soft ===== */
  [data-theme="soft"] {
    --bg: #f6f4f1; --panel: #fffdfb; --panel-2: #f0ebe5; --border: #e6ded6;
    --text: #4b4658; --muted: #9b93a3; --accent: #9d8ec2; --accent-soft: #ece7f5;
    --chip: #ece6f1; --code-bg: #f4efea; --code-text: #6f6678; --accent-ink: #ffffff;
  }

  /* ===== White ===== */
  [data-theme="white"] {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f6; --border: #dfe3ea;
    --text: #1a1d24; --muted: #667085; --accent: #2563eb; --accent-soft: #e5edff;
    --chip: #e8edf7; --code-bg: #f3f5f9; --code-text: #334155; --accent-ink: #ffffff;
  }

  /* ===== Colorful ===== */
  [data-theme="colorful"] {
    --bg: #fef6ff; --panel: #ffffff; --panel-2: #fbeeff; --border: #f0d7f5;
    --text: #2a1b33; --muted: #8a6f93; --accent: #e0179d; --accent-soft: #ffe1f4;
    --chip: #ffe6f7; --code-bg: #2a1b33; --code-text: #ffd6f0; --accent-ink: #ffffff;
  }

  /* ===== Cartoon ===== */
  [data-theme="cartoon"] {
    --bg: #fffbe7; --panel: #ffffff; --panel-2: #fff3c4; --border: #1a1a1a;
    --text: #1a1a1a; --muted: #7a6f3a; --accent: #ff5c8a; --accent-soft: #ffe0ea;
    --chip: #ffe9a8; --code-bg: #1a1a1a; --code-text: #ffe27a; --accent-ink: #1a1a1a;
  }
  [data-theme="cartoon"] .box { border-width: 2px; box-shadow: 3px 3px 0 var(--border); }
  [data-theme="cartoon"] .box:hover { box-shadow: 5px 5px 0 var(--accent); }
  [data-theme="cartoon"] .tab-btn.active,
  [data-theme="cartoon"] #drawer { box-shadow: -3px 0 0 rgba(0,0,0,.15); }
  [data-theme="cartoon"] .tag-chip,
  [data-theme="cartoon"] .related .pill { border: 2px solid var(--border); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #b692ff);
    display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }

  /* Top tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* Theme picker */
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ===== Narrow screens =====
     The desktop layout is a fixed sidebar beside a flexible main. On a 390px
     phone that leaves main at a handful of characters, and the header's
     right-hand cluster — five tabs plus the theme picker — will not wrap, so
     the document comes out wider than the screen and scrolls sideways.

     Below 860px, the same breakpoint the hub uses, the sidebar stacks above the
     content at full width instead of competing with it, and the header wraps
     its controls onto a second row. Stacking rather than overlaying is
     deliberate: an overlay anchored at top:0 would cover the very button that
     closes it, and anchoring below a header whose height changes when it wraps
     is fragile. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1.05rem; }
    .sub { display: none; }                 /* the tagline is on the hub card too */

    /* display:contents dissolves the wrapper so its children become direct flex
       items of the header. That is what lets the theme picker sit at the end of
       the title row while the tabs claim a full-width row of their own —
       otherwise the five tabs share the remainder with the picker and the last
       two are cut off, reachable only by a horizontal swipe nobody would guess
       at. */
    .header-right { display: contents; }
    .tp { margin-left: auto; flex: 0 0 auto; }
    /* order pulls the tabs after the picker so the header settles into two rows
       (title + picker, then tabs) rather than three. Without it the full-width
       tabs break the line first and the picker is stranded on a row of its own. */
    .tabs { order: 1; flex: 0 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; }

    .layout { flex-direction: column; }
    .layout > aside:not(#drawer) {
      width: 100%; min-width: 0; max-height: 45vh;
      border-right: 0; border-bottom: 1px solid var(--border);
    }

    main { padding: 20px 16px 64px; }
    .detail, .detail:has(.pdf-view), .sv-head, #search-results, #search-more, .sr-empty { max-width: 100%; }
    .pdf-frame { height: 70vh; }
    .boxes { grid-template-columns: 1fr; }
    .ov-globe { height: 60vh; }
  }

  .layout { display: flex; flex: 1; min-height: 0; }
  .nav-toggle { height: 34px; }
  .layout.nav-closed > aside:not(#drawer) { display: none; }

  /* Sidebar */
  aside {
    width: 300px; min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 14px 16px 8px; }
  .nav-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  .nav-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .nav-tabs button.active { background: var(--accent); color: var(--accent-ink); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }

  .search-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .search-row .search { margin-bottom: 0; flex: 1; }
  .view-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .view-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center;
  }
  .view-toggle button svg, .icon-btn svg { display: block; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    flex: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  nav { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }

  .group { margin-bottom: 4px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .group-head:hover { background: var(--panel-2); }
  .group-head .caret { transition: transform .15s ease; color: var(--muted); font-size: 11px; width: 12px; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 10px; }
  .group-items { padding-left: 8px; }
  .group.collapsed .group-items { display: none; }

  .term {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 22px; border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .term:hover { background: var(--panel-2); color: var(--text); }
  .term.active { background: var(--accent-soft); color: #fff; }
  .term.active::before {
    content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .term.hidden, .group.hidden { display: none; }

  /* flat-list mode: the single flat group hides its header */
  nav.flat .group-head { display: none; }
  nav.flat .group-items { padding-left: 0; }
  nav.flat .term { padding-left: 14px; }

  /* Detail pane (Glossary tab) */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; min-width: 0; }
  /* A wide child — a table, a diagram, a code block — must scroll inside its
     own box rather than widening the page. */
  .markdown-body pre, .markdown-body table { max-width: 100%; overflow-x: auto; }
  .detail { max-width: 820px; }
  /* embedded viewer for framed docs (.pdf and standalone .html pages) */
  .detail:has(.pdf-view) { max-width: 1100px; }
  .pdf-view { display: flex; flex-direction: column; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .pdf-bar .pdf-name { font-weight: 650; color: var(--text); }
  .pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .pdf-bar a:hover { text-decoration: underline; }
  .pdf-frame { width: 100%; height: calc(100vh - 180px); min-height: 480px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag-chip {
    display: inline-block; background: var(--chip); color: var(--accent);
    padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  }
  h2.term-title { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.4px; }
  .lede { font-size: 16px; color: var(--muted); line-height: 1.6; margin: 0 0 26px; }

  .section { margin-bottom: 24px; }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 8px;
  }
  .section p, .section li { line-height: 1.65; font-size: 15px; color: var(--text); }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; }

  /* ===== Diagram primitives: boxes, arrows, comparisons =====
     All colour comes from theme variables so diagrams follow the theme.
     Authored inline in a term's `flow` field using these classes. */
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 0 0 12px; }
  .flow.col { flex-direction: column; align-items: stretch; }
  .flow.col > .arrow { align-self: flex-start; margin-left: 18px; }
  .flow .node {
    flex: 0 1 auto; min-width: 0; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); color: var(--text);
    font-size: 13.5px; font-weight: 600; line-height: 1.35;
  }
  .flow .node small {
    display: block; margin-top: 2px;
    font-size: 11.5px; font-weight: 400; color: var(--muted);
  }
  .flow .node code { font-size: 12px; background: none; padding: 0; color: inherit; }
  .flow .node.accent { border-color: var(--accent); background: var(--accent-soft); }
  .flow .node.good   { border-color: var(--ok); }
  .flow .node.bad    { border-color: var(--danger); }
  .flow .node.warn   { border-color: var(--warn); }
  .flow .node.ghost  { background: none; border-style: dashed; color: var(--muted); }
  .flow .arrow {
    align-self: center; flex: 0 0 auto;
    color: var(--muted); font-size: 15px; line-height: 1;
  }
  .flow .arrow.bad  { color: var(--danger); }
  .flow .arrow.good { color: var(--ok); }
  /* a label sitting above a run of nodes */
  .flow-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 0 0 5px;
  }

  /* side-by-side comparison (this vs that) */
  .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 0 0 12px; }
  .cmp > div { border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; background: var(--panel-2); }
  .cmp h4 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
  .cmp.split > div:first-child { border-left: 3px solid var(--ok); }
  .cmp.split > div:last-child  { border-left: 3px solid var(--danger); }
  .cmp ul { margin: 0; padding-left: 17px; }
  .cmp li { font-size: 13.5px; margin-bottom: 4px; line-height: 1.5; }

  /* ===== Flavour blocks: one problem shape + its fix, paired =====
     Stacked rather than side-by-side — code lines are too long for two
     columns in the detail pane. */
  .variant {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin: 0 0 14px; background: var(--panel-2);
  }
  .variant-head { font-weight: 650; font-size: 14.5px; color: var(--text); margin-bottom: 4px; }
  .variant-note { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 0 0 10px; }
  .variant-code { margin-bottom: 10px; }
  .variant-code:last-child { margin-bottom: 0; }
  .variant-tag {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; font-weight: 700; margin-bottom: 4px;
  }
  .variant-code.bad  .variant-tag { color: var(--danger); }
  .variant-code.good .variant-tag { color: var(--ok); }
  .variant-code pre { margin: 0; border-left: 3px solid var(--border); }
  .variant-code.bad  pre { border-left-color: var(--danger); }
  .variant-code.good pre { border-left-color: var(--ok); }

  /* single highlighted takeaway */
  .callout {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    background: var(--panel-2); border-radius: 0 8px 8px 0;
    padding: 9px 13px; margin: 0 0 12px; font-size: 14px; line-height: 1.6;
  }
  .callout.warn   { border-left-color: var(--warn); }
  .callout.danger { border-left-color: var(--danger); }

  /* "Trade-offs" bullets — same list, flagged so they read as warnings */
  .section ul.gotchas { list-style: none; padding-left: 0; }
  .section ul.gotchas li {
    position: relative; padding-left: 22px; margin-bottom: 8px;
  }
  .section ul.gotchas li::before {
    content: "▲"; position: absolute; left: 0; top: 1px;
    font-size: 11px; color: var(--accent); opacity: .8;
  }

  /* "Interview asks" — question + short answer pairs */
  .asks { display: flex; flex-direction: column; gap: 10px; }
  .ask {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    background: var(--panel-2); border-radius: 0 8px 8px 0; padding: 10px 14px;
  }
  .ask-q { font-weight: 650; font-size: 14.5px; color: var(--text); margin-bottom: 4px; }
  .ask-a { font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .ask-a code { color: var(--code-text); }

  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--code-text); }
  p code, li code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }
  pre code { line-height: 1.55; display: block; }

  /* ===== Eclipse-style Java syntax highlighting ===== */
  /* Dark themes (default): IDE dark palette */
  .tok-kw  { color: #cc7832; font-weight: 600; }   /* keywords */
  .tok-str { color: #98c379; }                      /* strings / text blocks / chars */
  .tok-com { color: #7f848e; font-style: italic; }  /* comments */
  .tok-num { color: #6cb6ff; }                      /* numbers */
  .tok-ann { color: #d0b344; }                      /* @annotations */
  .tok-cls { color: #4ec9b0; }                      /* Types (Capitalized) */
  /* Light themes: classic Eclipse palette */
  [data-theme="soft"] .tok-kw, [data-theme="white"] .tok-kw, [data-theme="colorful"] .tok-kw, [data-theme="cartoon"] .tok-kw { color: #7f0055; font-weight: 700; }
  [data-theme="soft"] .tok-str, [data-theme="white"] .tok-str, [data-theme="colorful"] .tok-str, [data-theme="cartoon"] .tok-str { color: #2a00ff; }
  [data-theme="soft"] .tok-com, [data-theme="white"] .tok-com, [data-theme="colorful"] .tok-com, [data-theme="cartoon"] .tok-com { color: #3f7f5f; }
  [data-theme="soft"] .tok-num, [data-theme="white"] .tok-num, [data-theme="colorful"] .tok-num, [data-theme="cartoon"] .tok-num { color: #1750eb; }
  [data-theme="soft"] .tok-ann, [data-theme="white"] .tok-ann, [data-theme="colorful"] .tok-ann, [data-theme="cartoon"] .tok-ann { color: #646464; }
  [data-theme="soft"] .tok-cls, [data-theme="white"] .tok-cls, [data-theme="colorful"] .tok-cls, [data-theme="cartoon"] .tok-cls { color: #267f99; }

  .related { display: flex; flex-wrap: wrap; gap: 8px; }
  .related .pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .related .pill:hover { border-color: var(--accent); color: var(--text); }

  /* Notes (rich text) */
  .note-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .note-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .note-btn:hover { border-color: var(--accent); }
  .note-btn.muted { color: var(--muted); }
  .note-editor {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
    color: var(--text); outline: none;
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .note-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }

  }
  .note-editor pre code, .note-view pre code, .rich pre code { background: none; border: 0; padding: 0; }
  .note-editor blockquote, .note-view blockquote, .rich blockquote {
    margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic;
  }

  .note-editor hr, .note-view hr, .rich hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .note-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .note-hint b { color: var(--accent); font-weight: 600; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .notes-head h3 { margin: 0; }
  .notes-actions { display: flex; gap: 6px; }
  .note-action {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);

  }
  .note-action:hover { border-color: var(--accent); color: var(--accent); }
  .note-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note-action.primary:hover { color: var(--accent-ink); filter: brightness(1.05); }
  .note-view {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; min-height: 46px; color: var(--text);
  }
  .note-view img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-view h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-view a { color: var(--accent); }

  .rich img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .rich h4 { margin: 10px 0 6px; font-size: 16px; }

  .rich table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .rich th, .rich td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .rich th { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .rich pre { margin: 8px 0; }
  .term-actions { display: flex; gap: 8px; margin: -2px 0 20px; }

  /* Add-term button */
  .add-term-btn {
    width: 100%; margin-top: 10px; border: 1px dashed var(--accent); background: transparent;
    color: var(--accent); padding: 8px 0; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  .add-term-btn:hover { background: var(--accent-soft); }
  .add-term-btn.inline { width: auto; padding: 8px 16px; margin: 0 0 24px 0; }

  /* Add-term modal */
  .modal-bg {

  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;

  }
  .modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }

    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);

  }
  .modal-body input[type=text]:focus, .modal-body textarea:focus { border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Terms overview (Terms tab) */
  #overview { flex: 1; overflow-y: auto; padding: 30px 40px 80px; display: none; }
  #overview.show { display: block; }
  .ov-head h2 { margin: 0 0 4px; font-size: 24px; }
  .ov-head p { margin: 0 0 26px; color: var(--muted); font-size: 14px; }

  .ov-group-title .name { font-size: 15px; font-weight: 650; }
  .ov-group-title .count { font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
  .ov-group.ov-nested { margin-bottom: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
  .ov-group.ov-nested .ov-group-title .name { font-size: 13.5px; color: var(--muted); }
  /* Docs landing list. The tab used to jump straight into whichever document
     sorted first, so there was no way to see what a module actually held. The
     sidebar lists documents flat — these modules carry no doc tags — so the
     landing list is flat too, and the two agree. */
  .docs-index-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
  .docs-index-head h2 { font-size: 1.15rem; margin: 0; }
  .docs-index-head .count { color: var(--muted); font-size: .85rem; }
  .doc-box { text-align: left; }
  .doc-box .b-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .doc-box .b-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-top: 6px; }

  /* Close bar above an open document — a document is something you come back

  .doc-back { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-back button { background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12px;
    font-family: inherit; font-weight: 600; cursor: pointer; }
  .doc-back button:hover { color: var(--text); border-color: var(--accent); }
  .doc-back .doc-close { margin-left: auto; padding: 5px 9px; }

  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s, background .15s;
  }
  .box:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-2px); }
  .box .b-title { font-weight: 650; font-size: 15px; margin-bottom: 4px; }
  .box .b-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }

  /* Overview view toggle + Wall view */
  .ov-toggle { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
  .ov-toggle button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .ov-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .ov-wall { display: none; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px 12px; max-width: 880px; margin: 0 auto; padding-bottom: 70px; }
  .chip-term {
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; font-weight: 600; line-height: 1;
    transition: transform .12s ease, background .15s, box-shadow .15s;
  }
  .chip-term:hover { transform: scale(1.08); background: var(--panel-2); box-shadow: 0 5px 16px rgba(0,0,0,.28); }

  /* Globe view */
  .ov-globe { display: none; position: relative; width: 100%; max-width: 900px; height: 560px; margin: 0 auto; }
  .globe-chip {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    will-change: transform, opacity; user-select: none;
  }
  .globe-chip:hover { background: var(--panel-2); }
  .globe-controls { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px auto 0; }
  .gc-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    width: 40px; height: 38px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 700; line-height: 1; display: grid; place-items: center;
    user-select: none; touch-action: none;
  }
  .gc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gc-btn:active { background: var(--accent); color: var(--accent-ink); }
  .gc-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Search view */
  #search-view { flex: 1; overflow-y: auto; padding: 26px 40px 80px; display: none; }
  #search-view.show { display: block; }
  .sv-head { max-width: 820px; margin: 0 auto 16px; }
  #search-input {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .sv-summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sv-summary b { color: var(--text); }
  #search-results { max-width: 820px; margin: 0 auto; }
  .sr-hit { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; }
  .sr-hit:hover { border-color: var(--accent); }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sr-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; background: var(--chip); color: var(--accent); }
  .sr-title { font-weight: 650; font-size: 14px; }
  .sr-field { font-size: 11px; color: var(--muted); margin-left: auto; }
  .sr-snippet { font-size: 13.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap; }
  .sr-snippet mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  #search-more { max-width: 820px; margin: 6px auto 0; text-align: center; }
  .sr-more-btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .sr-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sr-empty { color: var(--muted); max-width: 820px; margin: 0 auto; }

  /* Docs (rendered in the main pane, listed in the Terms/QA/Docs sidebar) */
  .nav-empty { color: var(--muted); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  .markdown-body { max-width: 820px; color: var(--text); font-size: 15px; line-height: 1.7; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 700; }
  .markdown-body h1 { font-size: 28px; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 22px; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 18px; }
  .markdown-body h4 { font-size: 15.5px; }
  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body blockquote { margin: 0 0 1em; padding: .4em 1em; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 6px 6px 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-text); padding: .12em .4em; border-radius: 4px; font-size: .88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1em; }
  .markdown-body pre code { background: none; padding: 0; color: var(--code-text); font-size: 13px; line-height: 1.55; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 14px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .markdown-body th { background: var(--panel-2); font-weight: 650; }
  .markdown-body [data-line] { scroll-margin-top: 20px; }
  .doc-flash { animation: docFlash 2s ease-out; border-radius: 6px; }
  @keyframes docFlash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .markdown-body mark.doc-hit { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

  /* Quick-peek tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 300px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px;

        what: "<ul>\n      <li>Spring AOP is <b>proxy-based and method-level only</b>.</li>\n      <li>At bean creation, matching beans are wrapped in a <b>JDK dynamic proxy</b> (interfaces) or a <b>CGLIB subclass</b>.</li>\n      <li>Advice runs in the proxy, which then delegates to the real target.</li>\n      <li>Weaker than AspectJ — <b>no field or constructor interception</b> — but needs no weaving step.</li>\n    </ul>",

        flow: "<div class=\"flow col\">\n      <div class=\"node ghost\">Servlet filters<small>CORS · security · correlation id — BEFORE Spring MVC</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node accent\">DispatcherServlet <small>front controller</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node\">HandlerMapping<small>which method? (no match → 404 here)</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node\">Interceptor.preHandle<small>knows the chosen handler</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node\">Argument resolvers<small>@PathVariable · @RequestBody · @Valid</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node good\">Your controller method</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node\">Return-value handler → HttpMessageConverter<small>object → JSON</small></div>\n      <div class=\"arrow bad\">↓ on exception ↓</div>\n      <div class=\"node bad\">HandlerExceptionResolver → your @RestControllerAdvice</div>\n    </div>\n    <div class=\"callout\"><b>Pick your layer by what you need:</b> filter (before Spring, sees everything) · interceptor (knows the handler) · argument resolver (binding) · advice (exceptions).</div>",
        what: "<ul>\n      <li>One <b>front controller</b> servlet receives every request and orchestrates the pipeline.</li>\n      <li><b>HandlerMapping</b> → <b>HandlerAdapter</b> → <b>argument resolvers</b> → your method → <b>return-value handlers</b>.</li>\n      <li>Exceptions go to <b>HandlerExceptionResolvers</b>; interceptors and the filter chain wrap the whole thing.</li>\n    </ul>",

        flow: "<div class=\"flow\">\n      <div class=\"node\">@Controller<small>String return = a VIEW NAME</small></div>\n      <div class=\"arrow\">+</div>\n      <div class=\"node\">@ResponseBody<small>return value = the BODY</small></div>\n      <div class=\"arrow\">=</div>\n      <div class=\"node accent\">@RestController</div>\n    </div>\n    <div class=\"cmp split\">\n      <div><h4>✓ Return a DTO</h4><ul>\n        <li>Contract is explicit</li>\n        <li>Schema stays private</li>\n        <li>No lazy-loading blowups</li></ul></div>\n      <div><h4>✗ Return a JPA entity</h4><ul>\n        <li>Leaks your schema into the API</li>\n        <li><code>LazyInitializationException</code></li>\n        <li>Surprise N+1 during serialization</li></ul></div>\n    </div>",
        what: "<ul>\n      <li><code>@RestController</code> = <code>@Controller</code> + <code>@ResponseBody</code> on every method.</li>\n      <li>Return a <b>domain object</b> (serialized), <b><code>ResponseEntity</code></b> (status/header control), or <b><code>void</code></b>.</li>\n      <li>Jackson converts, driven by <code>Accept</code> and the method's <code>produces</code>.</li>\n      <li><code>@RequestBody</code> deserializes the input, optionally validated with <code>@Valid</code>.</li>\n    </ul>",

      {

        lede: "One place to translate exceptions into HTTP status codes and a consistent error body.",
        flow: "<div class=\"flow col\">\n      <div class=\"node\">Domain exception thrown in a service</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node accent\">@RestControllerAdvice → @ExceptionHandler<small>most specific type wins</small></div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node good\">ProblemDetail (RFC 7807)<small>type · title · detail · field errors</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Blind spot:</b> advice only sees what reaches the DispatcherServlet. Exceptions thrown in a <b>servlet filter</b> — including Spring Security's 401/403 — never get there. Configure <code>AuthenticationEntryPoint</code> / <code>AccessDeniedHandler</code> separately.</div>",

        lede: "Spring's outbound HTTP clients — RestClient (modern, blocking), WebClient (reactive), RestTemplate (legacy, maintenance mode).",
        flow: "<div class=\"cmp\">\n      <div><h4>RestClient <small style=\"color:var(--ok)\">← new blocking default</small></h4><ul>\n        <li>Spring 6.1+</li>\n        <li>Fluent API, blocking semantics</li></ul></div>\n      <div><h4>WebClient</h4><ul>\n        <li>Non-blocking / reactive</li>\n        <li>Works in both stacks</li></ul></div>\n      <div><h4>RestTemplate <small style=\"color:var(--muted)\">legacy</small></h4><ul>\n        <li>Maintenance mode</li>\n        <li>Not being extended</li></ul></div>\n    </div>\n    <div class=\"callout\"><b>Decision:</b> blocking code → <code>RestClient</code>. Reactive stack → <code>WebClient</code>. New <code>RestTemplate</code> → don't.</div>",

      {
        id: "spring-webflux",
        title: "Spring WebFlux",
        lede: "The reactive, non-blocking web stack built on Reactor — <code>Mono</code>/<code>Flux</code> instead of blocking returns.",
        flow: "<div class=\"cmp\">\n      <div><h4>Spring MVC</h4><ul>\n        <li>Thread <b>per request</b></li>\n        <li>Blocking JDBC/JPA fine</li>\n        <li>Simple stack traces + debugging</li>\n        <li>+ virtual threads = high concurrency anyway</li></ul></div>\n      <div><h4>WebFlux</h4><ul>\n        <li>Small <b>event loop</b> pool</li>\n        <li>Needs R2DBC / reactive drivers <b>end to end</b></li>\n        <li><code>Mono</code> / <code>Flux</code>, lazy until subscribed</li>\n        <li>Wins on streaming + fan-out</li></ul></div>\n    </div>\n    <div class=\"callout danger\"><b>One blocking call poisons the event loop</b> — and it only shows up under load, never on your laptop.</div>",
        what: "<ul>\n      <li>Reactive, non-blocking stack on Netty (or any Servlet 3.1+ container).</li>\n      <li>Handlers return <b><code>Mono&lt;T&gt;</code></b> (0–1) or <b><code>Flux&lt;T&gt;</code></b> (0–n), composed with operators.</li>\n      <li><b>Nothing executes until subscribed.</b></li>\n      <li>Requires <b>reactive drivers end-to-end</b> — R2DBC, reactive Mongo.</li>\n    </ul>",
        why: "<ul>\n      <li>Scales to <b>many concurrent, mostly-idle connections</b> with few threads — streaming, gateways, fan-out.</li>\n      <li>For ordinary CRUD on a blocking database it <b>adds difficulty with no benefit</b>, and virtual threads now cover much of the original motivation.</li>\n    </ul>",

        id: "spring-data-jpa",
        title: "Spring Data JPA",
        lede: "Repository interfaces over Jakarta Persistence API (JPA) whose implementations Spring generates — from method names, @Query, or specifications.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">interface OrderRepository<small>you write only this</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">Spring generates the impl<small>at startup, by proxy</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node good\">CRUD + paging + sorting</div>\n    </div>\n    <div class=\"flow-label\">Four ways to express a query — pick by complexity</div>\n    <div class=\"flow\">\n      <div class=\"node good\">Derived name<small>findByStatus(…)</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">@Query<small>JPQL or native</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">Specification / Querydsl<small>dynamic predicates</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">Projection<small>select only what you need</small></div>\n    </div>",
        what: "<ul>\n      <li>Extend <code>JpaRepository&lt;T, ID&gt;</code> → <b>CRUD, paging and sorting for free</b>.</li>\n      <li><b>Derived queries</b> are parsed from the method name.</li>\n      <li><b><code>@Query</code></b> takes JPQL or native SQL; <b>Specifications</b> build dynamic predicates.</li>\n      <li><b>Projections</b> (interface or DTO) select only the columns you need.</li>\n    </ul>",
        why: "<ul>\n      <li>Removes the DAO layer almost entirely while staying inside JPA.</li>\n      <li><b>The tradeoff:</b> convenience hides the SQL — so you must still watch the generated queries.</li>\n    </ul>",

      {
        id: "transactional",
        title: "@Transactional",
        lede: "Declarative transaction demarcation — Spring begins, commits or rolls back around the annotated method.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">Caller</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">Proxy<small>BEGIN</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">Your method</div>\n      <div class=\"arrow good\">returns →</div>\n      <div class=\"node good\">COMMIT</div>\n      <div class=\"arrow bad\">throws →</div>\n      <div class=\"node bad\">ROLLBACK<small>unchecked only!</small></div>\n    </div>\n    <div class=\"cmp split\">\n      <div><h4>✓ Rolls back by default</h4><ul>\n        <li><code>RuntimeException</code></li>\n        <li><code>Error</code></li></ul></div>\n      <div><h4>✗ COMMITS by default</h4><ul>\n        <li>Checked exceptions — <code>IOException</code>, your own <code>throws</code> types</li>\n        <li>Fix: <code>rollbackFor = X.class</code></li></ul></div>\n    </div>\n    <div class=\"flow-label\">Propagation — how the method joins an existing transaction</div>\n    <div class=\"flow\">\n      <div class=\"node accent\">REQUIRED<small>join, or start one (default)</small></div>\n      <div class=\"node\">REQUIRES_NEW<small>suspend outer, own tx, 2nd connection</small></div>\n      <div class=\"node\">MANDATORY<small>must already be in one</small></div>\n      <div class=\"node\">SUPPORTS / NEVER</div>\n    </div>",
        what: "<ul>\n      <li>A proxy consults the <b><code>PlatformTransactionManager</code></b> around your method.</li>\n      <li><b>Propagation</b> decides how it joins an existing transaction; <b>isolation</b> maps to the database level.</li>\n      <li><b>Default rollback = unchecked exceptions only.</b> Checked exceptions commit.</li>\n      <li><code>readOnly = true</code> lets the provider skip dirty checking.</li>\n    </ul>",
        why: "<ul>\n      <li>Correct boundaries are the difference between <b>atomic business operations and half-written data</b>.</li>\n      <li>Because it is proxy-based, the boundary is <b>the public entry point of another bean</b> — not any method you like.</li>\n    </ul>",
        apply: [
          "Put it on the service layer, one transaction per use case — not on repositories or controllers.",
          "Add <code>rollbackFor</code> when you throw checked exceptions you want rolled back.",
          "Mark query paths <code>@Transactional(readOnly = true)</code>.",
          "Keep remote calls out of transactions — an open connection waiting on HTTP exhausts the pool."
        ],
        code: "@Service\nclass TransferService {\n  @Transactional(rollbackFor = InsufficientFunds.class)\n  void transfer(Long from, Long to, Money amt) throws InsufficientFunds {\n    accounts.debit(from, amt);\n    accounts.credit(to, amt);\n  }\n}",
        related: [
          "proxy-mechanics",
          "persistence-context",
          "spring-data-jpa"
        ]
      },
      {
        id: "persistence-context",
        title: "EntityManager & Persistence Context",
        lede: "A first-level cache of managed entities, bound to the transaction, that flushes changes to SQL automatically.",
        flow: "<div class=\"flow col\">\n      <div class=\"node accent\">Inside @Transactional — entity is MANAGED</div>\n      <div class=\"node good\">→ dirty checking on · lazy loading works · no save() needed</div>\n      <div class=\"arrow\">↓ transaction ends ↓</div>\n      <div class=\"node bad\">Outside — entity is DETACHED</div>\n      <div class=\"node bad\">→ changes ignored · lazy access throws LazyInitializationException</div>\n    </div>\n    <div class=\"callout\"><b>This one boundary explains</b> writes you never asked for, JSON serialization blowups, and stale reads. Map to DTOs <i>inside</i> the transaction.</div>",
        what: "<ul>\n      <li>The persistence context is a <b>first-level cache of managed entities</b>, bound to the transaction.</li>\n      <li><b>Managed</b> entities are dirty-checked — Hibernate writes UPDATEs at flush, <b>with no <code>save()</code> call</b>.</li>\n      <li>Flush happens <b>before query execution and at commit</b>.</li>\n      <li><b>Detached</b> entities are inert, and their uninitialized lazy associations throw.</li>\n    </ul>",
        why: "<ul>\n      <li>Most \"surprising\" JPA behaviour traces back to <b>where the persistence context begins and ends</b>.</li>\n      <li>Entity identity is guaranteed <b>only within one persistence context</b>.</li>\n    </ul>",

        title: "N + 1 Select Problem",
        lede: "One query loads N parents, then each lazy association triggers its own query — N+1 round trips instead of one.",
        flow: "<div class=\"flow-label\">✗ The shape — 1 query for parents, then one per child set</div>\n    <div class=\"flow\">\n      <div class=\"node\">SELECT * FROM orders<small>1 query → 100 rows</small></div>\n      <div class=\"arrow bad\">→ then for EACH row →</div>\n      <div class=\"node bad\">SELECT * FROM items WHERE order_id = ?<small>× 100</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Invisible in dev.</b> With 10 rows it is fast; with 10 000 it is a timeout. Catching it means counting <i>queries</i>, never measuring response time on a laptop.</div>\n    <div class=\"flow-label\">It arrives in six different disguises — the fix depends on which one you have</div>\n    <div class=\"flow\">\n      <div class=\"node\">1 · lazy collection in a loop</div>\n      <div class=\"node\">2 · @ManyToOne eager default</div>\n      <div class=\"node\">3 · @OneToOne ignores LAZY</div>\n      <div class=\"node\">4 · serializing entities</div>\n      <div class=\"node\">5 · repository call in a loop</div>\n      <div class=\"node\">6 · join fetch + paging</div>\n    </div>",
        what: "<ul>\n      <li>One query loads N parents; <b>each lazy association then fires its own query</b> — 1 + N round trips.</li>\n      <li>It is a <b>family of bugs, not one bug</b>: the same symptom arrives from mappings, from serialization, and from ordinary loops.</li>\n      <li>Each shape has a <b>different correct fix</b> — <code>@EntityGraph</code> does nothing for a <code>@OneToOne</code> that ignores LAZY.</li>\n      <li><b>Global backstop:</b> <code>hibernate.default_batch_fetch_size: 50</code> turns 1 + N into 1 + N/50. It mitigates every flavour but fixes none of them properly.</li>\n    </ul>",

        code: "// Detect it first — count the queries, don't guess.\n\n// application-dev.yml\nspring.jpa.properties.hibernate.generate_statistics: true\nlogging.level.org.hibernate.stat: DEBUG\n\n// …or assert it in a test, which is what actually keeps it fixed\n@Test\nvoid loadsOrdersInOneQuery() {\n  var stats = entityManagerFactory.unwrap(SessionFactory.class).getStatistics();\n  stats.clear();\n\n  orderService.dashboard();\n\n  assertThat(stats.getPrepareStatementCount()).isEqualTo(1);\n}",
        variants: [
          {"name":"1 · Lazy collection iterated in a loop","note":"The textbook case. The parents load in one query, then touching <code>getItems()</code> on each one wakes up a separate SELECT.","bad":"List<Order> orders = orderRepository.findByStatus(OPEN);   // 1 query\n\nfor (Order o : orders) {\n  total += o.getItems().size();       // +1 query PER ORDER\n}","fix":"@EntityGraph on that query","good":"public interface OrderRepository extends JpaRepository<Order, Long> {\n  @EntityGraph(attributePaths = \"items\")\n  List<Order> findByStatus(Status status);      // 1 query, items included\n}\n\n// or, in JPQL:\n@Query(\"select distinct o from Order o join fetch o.items where o.status = :s\")\nList<Order> findByStatus(@Param(\"s\") Status status);"},

          {"name":"4 · Serializing entities in the controller","note":"The loop is inside Jackson. <code>spring.jpa.open-in-view</code> is <b>on by default</b>, so the persistence context is still open during serialization and every lazy association quietly resolves — a hidden N+1 in the response writer.","bad":"@GetMapping(\"/orders\")\nList<Order> all() {\n  return orderRepository.findAll();   // Jackson walks o.getItems() → +1 query each\n}","fix":"project to a DTO inside the transaction","good":"// application.yml\nspring.jpa.open-in-view: false        // make the failure loud instead of silent\n\n// select exactly what the screen needs — no entities leave the service\n@Query(\"\"\"\n    select new com.acme.OrderCard(o.id, o.total, count(i))\n    from Order o left join o.items i group by o.id, o.total\n    \"\"\")\nList<OrderCard> cards();              // 1 query, no lazy loading anywhere"},
          {"name":"5 · A repository call inside a loop","note":"The hand-rolled version — no lazy loading involved at all. Easy to miss in review because each individual call looks perfectly reasonable.","bad":"for (Long id : orderIds) {\n  Order o = orderRepository.findById(id).orElseThrow();   // N queries\n  results.add(map(o));\n}","fix":"one batched query, then group in memory","good":"List<Order> orders = orderRepository.findAllById(orderIds);   // 1 query\n\n// need them keyed? group once, in memory — not per element\nMap<Long, Order> byId = orders.stream()\n    .collect(toMap(Order::getId, identity()));"},
          {"name":"6 · join fetch + pagination — the fix that breaks paging","note":"You fixed flavour 1, then added <code>Pageable</code>. Joining a collection multiplies rows, so Hibernate cannot apply <code>LIMIT</code> safely — it loads <b>every matching row</b> and paginates in memory. Watch for <code>HHH90003004: firstResult/maxResults specified with collection fetch</code>.","bad":"@Query(\"select o from Order o join fetch o.items\")\nPage<Order> findAllWithItems(Pageable page);   // whole table into heap, then paged","fix":"two queries — page the ids, then fetch","good":"// 1) page over the roots only — LIMIT works, no join\n@Query(\"select o.id from Order o where o.status = :s\")\nPage<Long> pageIds(@Param(\"s\") Status s, Pageable page);\n\n// 2) fetch the full graph for just that page\n@Query(\"select distinct o from Order o join fetch o.items where o.id in :ids\")\nList<Order> withItems(@Param(\"ids\") List<Long> ids);"}

        why: "<ul>\n      <li>The clean way to cut off a slow or external collaborator <b>inside an integration test</b>.</li>\n      <li>Overused, it both <b>fragments the context cache</b> and tests mocks instead of behaviour.</li>\n    </ul>",

      {
        id: "ann-stereotypes",
        title: "@Component @Service @Repository @Controller",
        lede: "The four stereotype annotations that mark a class as a scan candidate — same core effect, different semantics.",
        flow: "<div class=\"cmp\">\n      <div><h4>@Component</h4><ul><li>Generic marker</li><li><b>No extra behaviour</b></li></ul></div>\n      <div><h4>@Service</h4><ul><li>Business logic</li><li><b>Intent only</b> — same as @Component</li></ul></div>\n      <div><h4>@Repository</h4><ul><li>Data access</li><li>✓ <b>Exception translation</b></li></ul></div>\n      <div><h4>@Controller</h4><ul><li>Web layer</li><li>✓ <b>Handler mapping</b></li></ul></div>\n    </div>\n    <div class=\"callout\"><b>All four are scanned identically</b> — they're meta-annotated with <code>@Component</code>. Only <code>@Repository</code> and <code>@Controller</code> add real behaviour.</div>",
        what: "<ul>\n      <li>All four are meta-annotated with <code>@Component</code>, so <b>component scanning finds any of them</b>.</li>\n      <li><b><code>@Repository</code></b> adds persistence exception translation → <code>DataAccessException</code>.</li>\n      <li><b><code>@Controller</code></b> makes the class a handler-mapping candidate.</li>\n      <li><b><code>@Service</code></b> is semantically pure — intent, no behaviour.</li>\n    </ul>",
        why: "<ul>\n      <li>The right one <b>documents the layer and switches on the behaviour that layer needs</b>.</li>\n      <li>Using <code>@Component</code> everywhere loses exception translation and stops controllers being discovered.</li>\n    </ul>",
        apply: [
          "<code>@Service</code> for business logic, <code>@Repository</code> for data access, <code>@Controller</code>/<code>@RestController</code> for web, <code>@Component</code> for everything else (converters, listeners, helpers).",
          "The default bean name is the decapitalized simple class name; override with <code>@Service(\"customName\")</code>.",
          "Build your own stereotype by meta-annotating <code>@Component</code> — useful for a company-wide <code>@UseCase</code> or <code>@DomainService</code>.",
          "The class must sit under a scanned package, and needs a constructor the container can call."
        ],
        code: "@Service\nclass PricingService { }\n\n@Repository\nclass JdbcOrderRepository { }   // SQLException -> DataAccessException\n\n// custom stereotype\n@Target(TYPE) @Retention(RUNTIME) @Component\n@interface UseCase { }",
        gotcha: [
          "<code>@Repository</code>'s exception translation only applies to beans it annotates — a <code>@Component</code> DAO leaks raw <code>SQLException</code>s to callers.",
          "A stereotype on a class outside the scanned package does nothing at all. No warning, no bean, just an unsatisfied dependency at startup.",
          "Stereotypes create <b>singletons</b> by default. Any mutable instance field is shared across every request thread."
        ],
        ask: [
          {"q":"Is there any functional difference between @Component and @Service?","a":"Today, no — <code>@Service</code> adds nothing beyond intent. That is the honest answer, and it is what interviewers want: it is a <b>semantic</b> marker. <code>@Repository</code> and <code>@Controller</code>, in contrast, do carry real behaviour."},
          {"q":"How would you register a class you don't own as a bean?","a":"You can't annotate it, so use a <code>@Bean</code> factory method in a <code>@Configuration</code> class — that is precisely the case <code>@Bean</code> exists for."}
        ],
        related: [
          "bean",
          "component-scanning",
          "ann-bean",
          "ann-componentscan"
        ]
      },
      {
        id: "ann-autowired",
        title: "@Autowired",
        lede: "Marks a constructor, setter or field as an injection point — resolves by type (not by name).",
        flow: "<div class=\"callout\"><b>Since Spring 4.3:</b> a class with exactly <b>one constructor</b> needs no <code>@Autowired</code> at all. The best usage of this annotation is usually not writing it.</div>\n    <div class=\"cmp split\">\n      <div><h4>✓ Constructor</h4><ul><li><code>final</code> fields</li><li>Testable with <code>new</code></li><li>Dependencies visible</li></ul></div>\n      <div><h4>✗ Field</h4><ul><li>Needs reflection to test</li><li>Hides coupling</li><li>Silently no-ops on <code>static</code></li></ul></div>\n    </div>",
        what: "<ul>\n      <li>Marks a constructor, setter or field as an <b>injection point</b>.</li>\n      <li>Resolves <b>by type</b>, then <code>@Primary</code>, then <code>@Qualifier</code>, then parameter-name match.</li>\n      <li>Optional via <code>required = false</code>, <code>Optional&lt;T&gt;</code>, <code>@Nullable</code>, or <code>ObjectProvider&lt;T&gt;</code>.</li>\n    </ul>",
        why: "<ul>\n      <li>The annotation most associated with Spring, and <b>the most often misused</b>.</li>\n      <li>Knowing when you can <b>omit</b> it is a sign of fluency.</li>\n    </ul>",
        apply: [
          "Prefer <b>constructor injection</b>; with one constructor omit <code>@Autowired</code> entirely.",
          "Use <b>setter</b> (or <code>ObjectProvider&lt;T&gt;</code>) only for genuinely optional collaborators — keep required deps in the constructor.",
          "Avoid <b>field</b> <code>@Autowired</code> in application code — it hides dependencies, blocks <code>final</code>, and needs reflection/Spring to unit-test.",
          "Disambiguate same-type beans with <code>@Primary</code> / <code>@Qualifier</code> — do not rely on parameter-name matching.",
          "Inject <code>List&lt;T&gt;</code> / <code>Map&lt;String,T&gt;</code> when you want every implementation of a strategy interface."
        ],
        code: "// 1. Constructor (recommended) — @Autowired optional if single ctor\n@Service\nclass OrderService {\n  private final OrderRepository repo;\n  private final PaymentGateway gateway;\n\n  OrderService(OrderRepository repo, PaymentGateway gateway) {\n    this.repo = repo;\n    this.gateway = gateway;\n  }\n}\n\n// 2. Setter — optional dependency\n@Service\nclass ReportService {\n  private final OrderRepository repo;\n  private MetricsClient metrics;\n\n  ReportService(OrderRepository repo) {\n    this.repo = repo;\n  }\n\n  @Autowired(required = false)\n  void setMetrics(MetricsClient metrics) {\n    this.metrics = metrics;\n  }\n\n  void run() {\n    var data = repo.findAll();\n    if (metrics != null) metrics.record(\"report.run\");\n  }\n}\n\n// 3. Field — works, weakest (avoid in app code)\n@Service\nclass FragileOrderService {\n  @Autowired private OrderRepository repo;\n  @Autowired private PaymentGateway gateway;\n}",
        gotcha: [
          "<b>Not by name.</b> <code>@Autowired</code> matches type. Assuming bean-name wiring is a common interview trap — that is <code>@Resource</code> / <code>@Qualifier</code>.",
          "<b>Field injection is a testing tax.</b> You cannot <code>new</code> the class with mocks; you need reflection or a Spring context.",
          "Field injection hides a growing dependency list — nothing forces you to notice nine collaborators.",
          "Two candidates and no <code>@Primary</code>/<code>@Qualifier</code> → <code>NoUniqueBeanDefinitionException</code> at <b>startup</b> (a feature).",
          "<code>@Autowired</code> on a <code>static</code> field silently does nothing.",
          "Never combine field injection with <code>final</code> — the field is set by reflection after construction."
        ],
        ask: [
          {"q":"Constructor vs setter vs field injection — which and why?","a":"<b>Constructor</b>: mandatory dependencies, allows <code>final</code>, object never half-built, unit-testable with plain <code>new</code>. <b>Setter</b>: genuinely optional collaborators (<code>required = false</code>). <b>Field</b>: concise but hides dependencies, blocks <code>final</code>, needs reflection to test — avoid in production code."},
          {"q":"Does @Autowired inject by name?","a":"<b>No — by type first.</b> Name is only used via <code>@Qualifier</code>, or as a fragile fallback when the parameter/field name matches a bean name. <code>@Resource</code> is name-first."},
          {"q":"What happens when no bean of that type exists?","a":"<code>NoSuchBeanDefinitionException</code> at startup. Make it optional with <code>@Autowired(required = false)</code>, <code>Optional&lt;T&gt;</code>, or <code>ObjectProvider&lt;T&gt;</code> if absence is legitimate."},
          {"q":"Do you still need @Autowired on the constructor?","a":"Not since Spring 4.3, if the class has exactly one constructor. Multiple constructors: put <code>@Autowired</code> on the one Spring should use."}
        ],
        related: [
          "dependency-injection",
          "ann-qualifier",
          "ann-lazy",
          "bean"
        ]

      {
        id: "ann-qualifier",
        title: "@Qualifier & @Primary",
        lede: "Tie-breakers when several beans match an injection point by type.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">by type</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">@Primary<small>the default</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">@Qualifier<small>beats @Primary</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node ghost\">param name = bean name<small>fragile fallback</small></div>\n      <div class=\"arrow bad\">→</div>\n      <div class=\"node bad\">NoUniqueBeanDefinition</div>\n    </div>\n    <div class=\"callout warn\"><b>Strings aren't refactor-safe.</b> Build a typed marker instead: <code>@Qualifier @Retention(RUNTIME) @interface Replica {}</code> — then typos are compile errors.</div>",
        what: "<ul>\n      <li><b><code>@Primary</code></b> = the default winner for a type (global).</li>\n      <li><b><code>@Qualifier(\"name\")</code></b> = demand a specific bean at one injection point.</li>\n      <li><code>@Qualifier</code> works as a <b>meta-annotation</b> for typed markers.</li>\n    </ul>",
        why: "<ul>\n      <li>Several implementations of one interface is <b>the normal case</b>.</li>\n      <li>Makes the choice <b>explicit and reviewable</b>, not classpath-order dependent.</li>\n    </ul>",
        apply: [
          "Mark the sensible default <code>@Primary</code>; qualify only the exceptions.",
          "Prefer a custom qualifier annotation over a string — typos become compile errors.",
          "Remember the fallback: naming the constructor parameter after the bean also resolves it (fragile, but it explains 'why does this work?').",
          "<code>@Resource(name = \"…\")</code> resolves by <b>name first</b>; mixing conventions in one codebase confuses readers."
        ],
        code: "@Bean @Primary DataSource primary() { … }\n@Bean @Qualifier(\"replica\") DataSource replica() { … }\n\nReportService(@Qualifier(\"replica\") DataSource ds) { this.ds = ds; }\n\n// typed marker — safer than a string\n@Qualifier @Retention(RUNTIME) @interface Replica { }",
        gotcha: [
          "<code>@Primary</code> is <b>global</b> for that type: every unqualified injection point gets it. It is a default, not a scoped preference.",
          "Qualifier strings are not refactor-safe — renaming a <code>@Bean</code> method breaks them at runtime with no compiler help.",
          "Two <code>@Primary</code> beans of the same type is worse than none: <code>NoUniqueBeanDefinitionException</code>.",
          "<code>@Primary</code> loses to an explicit <code>@Qualifier</code> — that precedence is the whole point, and it is a common exam question."
        ],
        ask: [
          {"q":"Both @Primary and @Qualifier are present — which wins?","a":"<code>@Qualifier</code>. It is the specific request at the injection point; <code>@Primary</code> is only the fallback default when nothing more specific was asked for."},
          {"q":"How do you inject all implementations, not just one?","a":"Inject <code>List&lt;T&gt;</code> (ordered by <code>@Order</code>/<code>Ordered</code>) or <code>Map&lt;String,T&gt;</code> keyed by bean name. <code>@Primary</code> is ignored — you get every candidate."}
        ],
        related: [
          "qualifier-primary",
          "ann-autowired",
          "ann-bean",
          "dependency-injection"
        ]
      },
      {
        id: "ann-scope",
        title: "@Scope",
        lede: "Declares how many instances the container creates and how long each lives.",
        flow: "<div class=\"flow\">\n      <div class=\"node accent\">singleton<small>1 per context · eager · destroyed ✓</small></div>\n      <div class=\"node\">prototype<small>N per lookup · lazy · never destroyed ✗</small></div>\n      <div class=\"node\">request / session / application<small>web only — needs a request thread</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Prototype into singleton = one instance forever.</b> The singleton looks it up exactly once. Inject <code>ObjectProvider&lt;T&gt;</code> instead.</div>",
        what: "<ul>\n      <li><b>singleton</b> (default) — one per context, created eagerly.</li>\n      <li><b>prototype</b> — new per lookup, <b>Spring never destroys it</b>.</li>\n      <li><b>Web scopes</b> — request, session, application, websocket.</li>\n      <li>Shorter into longer needs <code>proxyMode = TARGET_CLASS</code> or a provider.</li>\n    </ul>",
        why: "<ul>\n      <li>Scope mismatch is <b>silent</b>, not a crash: every later user gets the first request's data.</li>\n    </ul>",
        apply: [
          "Keep singletons stateless — that is what makes the default safe.",
          "Prototype-in-singleton → inject <code>ObjectProvider&lt;T&gt;</code> and call <code>getObject()</code> per use.",
          "Add <code>@Scope(proxyMode = TARGET_CLASS)</code> when you must inject a request-scoped bean directly.",
          "Reach for request/session scope rarely; passing the value as a method parameter is usually clearer and always thread-safe."
        ],
        code: "@Component @Scope(\"prototype\")\nclass ReportJob { }\n\n@Component\n@Scope(value = \"request\", proxyMode = ScopedProxyMode.TARGET_CLASS)\nclass RequestContext { }",
        gotcha: [
          "<b>Spring never destroys prototype beans.</b> <code>@PreDestroy</code> is not called and the container keeps no reference — any resource cleanup is entirely yours.",
          "Injecting a prototype into a singleton gives you <b>one</b> instance forever. The prototype scope applies at lookup time, and the singleton looks it up exactly once.",
          "Web scopes outside a request thread (a <code>@Scheduled</code> job, an <code>@Async</code> task) throw — there is no request bound to that thread.",
          "Singletons are created <b>eagerly</b> at startup, so a slow constructor delays boot for everyone."
        ],
        ask: [
          {"q":"How do you inject a prototype into a singleton correctly?","a":"Three ways: inject <code>ObjectProvider&lt;T&gt;</code>/<code>Provider&lt;T&gt;</code> and call it per use (cleanest); use a scoped proxy; or implement <code>ApplicationContextAware</code> and look up manually (worst — couples you to Spring)."},
          {"q":"Is 'singleton' thread-safe?","a":"No. Singleton means <i>shared</i>, and Spring adds no synchronization. Safety comes from keeping the bean stateless."}
        ],
        related: [
          "bean-scopes",
          "bean-lifecycle",
          "ann-lazy",
          "ann-autowired"
        ]

      {
        id: "ann-lifecycle-callbacks",
        title: "@PostConstruct & @PreDestroy",
        lede: "Initialization and shutdown callbacks the container invokes after injection and before disposal.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">constructor<small>deps NOT set (field injection)</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">injection</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node good\">@PostConstruct<small>earliest fully-formed point</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">AOP proxy applied<small>← AFTER init</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">in use</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">@PreDestroy<small>singletons only</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Proxying happens after init</b> — so <code>@Transactional</code>/<code>@Async</code> called from <code>@PostConstruct</code> runs <b>un-proxied</b>.</div>",
        what: "<ul>\n      <li><b><code>@PostConstruct</code></b> runs after the constructor <i>and</i> after all dependencies are injected.</li>\n      <li><b><code>@PreDestroy</code></b> runs on context close — <b>singletons only</b>.</li>\n      <li>For classes you don't own: <code>@Bean(initMethod, destroyMethod)</code>; Boot infers <code>close()</code> for <code>AutoCloseable</code>.</li>\n      <li>Both must be <code>void</code>, no arguments, and live in <b><code>jakarta.annotation</code></b> (not <code>javax</code>).</li>\n    </ul>",
        why: "<ul>\n      <li>Constructors run <b>before injection completes</b> for field/setter injection.</li>\n      <li>Graceful shutdown — flushing, deregistering — <b>depends on <code>@PreDestroy</code> actually firing</b>.</li>\n    </ul>",
        apply: [
          "Validate configuration and warm caches in <code>@PostConstruct</code> so bad config fails at boot.",
          "For work that needs the <i>whole</i> context ready (not just this bean), use <code>ApplicationRunner</code> instead.",
          "Both methods must be <code>void</code> and take no arguments.",
          "Since Jakarta EE 9 these live in <code>jakarta.annotation</code>, not <code>javax.annotation</code>."
        ],
        code: "@Component\nclass CacheWarmer {\n  @PostConstruct void warm()  { /* deps injected by now */ }\n  @PreDestroy   void flush() { /* on context close */ }\n}",
        gotcha: [
          "Calling an <code>@Transactional</code> or <code>@Async</code> method from <code>@PostConstruct</code> runs it <b>un-proxied</b> — the proxy is not in place for this bean yet.",
          "<code>@PreDestroy</code> never runs on prototype-scoped beans, and does not run if the JVM is killed with <code>SIGKILL</code> or the context is never closed.",
          "Throwing from <code>@PostConstruct</code> aborts startup. That is usually correct — but make the message say what config is wrong.",
          "Wrong package (<code>javax</code> vs <code>jakarta</code>) means the annotation is silently ignored on Spring 6 / Boot 3."
        ],
        ask: [
          {"q":"Why not just do the work in the constructor?","a":"With constructor injection the dependencies <i>are</i> available — so for simple cases you can. <code>@PostConstruct</code> matters when the bean uses field/setter injection (not yet populated in the constructor), or when setup should not run during construction, e.g. so a subclass is fully initialized first."},
          {"q":"What is the full initialization order?","a":"Constructor → dependency injection → <code>*Aware</code> callbacks → <code>BeanPostProcessor.postProcessBeforeInitialization</code> → <code>@PostConstruct</code> → <code>InitializingBean.afterPropertiesSet()</code> → <code>initMethod</code> → <code>postProcessAfterInitialization</code> (where AOP proxying happens)."}
        ],
        related: [
          "bean-lifecycle",
          "ann-scope",
          "proxy-mechanics",
          "ann-bean"
        ]

      {
        id: "ann-value",
        title: "@Value",
        lede: "Injects a single externalized property, or a Spring Expression Language (SpEL) expression, into a field or parameter.",
        flow: "<div class=\"cmp\">\n      <div><h4><code>$</code> — property placeholder</h4><ul>\n        <li><code>@Value(\"${app.timeout:2000}\")</code></li>\n        <li>Resolved from the <b>Environment</b></li>\n        <li><code>:</code> supplies a default</li></ul></div>\n      <div><h4><code>#</code> — SpEL expression</h4><ul>\n        <li><code>@Value(\"#{systemProperties['x']}\")</code></li>\n        <li><b>Evaluated</b>, can call beans/methods</li></ul></div>\n    </div>\n    <div class=\"callout warn\">Past two or three related keys, switch to <b><code>@ConfigurationProperties</code></b>: typed, validated, autocompleted, and it fails at boot instead of mid-request.</div>",
        what: "<ul>\n      <li>Injects <b>one</b> externalized property or SpEL expression into a field or parameter.</li>\n      <li>Resolution goes through the <b>Environment</b> — every property source participates, with relaxed binding.</li>\n    </ul>",
        why: "<ul>\n      <li>The <b>quickest way to pull one setting into one place</b>.</li>\n      <li>Its weakness is scale: each one is an <b>untyped string</b>, and a missing key fails only when that bean is created.</li>\n    </ul>",
        apply: [
          "Always supply a default (<code>:fallback</code>) or accept that a missing key breaks startup — decide deliberately.",
          "Prefer <code>@ConfigurationProperties</code> once you have more than a couple of related keys.",
          "Use it on constructor parameters, not fields, so the value is visible in tests.",
          "Escape the dollar in Kotlin/Groovy string literals, and never use <code>@Value</code> for secrets you then log."
        ],
        code: "@Service\nclass Client {\n  Client(@Value(\"${app.api.base-url}\") String baseUrl,\n         @Value(\"${app.api.timeout-ms:2000}\") int timeoutMs) { … }\n}",
        gotcha: [
          "<code>@Value</code> on a <code>static</code> field does nothing — a classic silent failure.",
          "It does <b>not</b> work in a <code>@PostConstruct</code>-free constructor when combined with field injection: the field is still null in the constructor body.",
          "Type conversion errors (<code>\"abc\"</code> into an <code>int</code>) surface as a confusing <code>BeanCreationException</code>, not a clear config error.",
          "No validation, no IDE autocompletion, no grouping — the reasons <code>@ConfigurationProperties</code> exists."
        ],
        ask: [
          {"q":"@Value or @ConfigurationProperties?","a":"<code>@ConfigurationProperties</code> for anything structured: typed binding, JSR-380 validation, nesting, lists, relaxed binding and IDE completion, with failures at startup. <code>@Value</code> only for a one-off scalar or when you need SpEL."},
          {"q":"What does @Value(\"#{...}\") do differently?","a":"<code>$</code> is <b>property placeholder</b> resolution against the Environment; <code>#</code> is <b>SpEL</b> evaluation, which can call methods and reference other beans (<code>#{systemProperties['user.region']}</code>)."}
        ],
        related: [

        title: "@Lazy & @DependsOn",
        lede: "Defer a bean's creation until first use, or force one bean to be initialized before another.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">@Lazy on a bean<small>not built until asked for</small></div>\n      <div class=\"arrow\">vs</div>\n      <div class=\"node accent\">@Lazy at an injection point<small>proxy now, real bean on first call</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Global lazy init is a false economy.</b> Startup looks fast, then a missing bean or bad config blows up on the <i>first production request</i> — the opposite of fail-fast.</div>",
        what: "<ul>\n      <li><b><code>@Lazy</code></b> on a definition postpones instantiation; on an <b>injection point</b> it injects a resolving proxy.</li>\n      <li><b><code>@DependsOn(\"bean\")</code></b> forces initialization order for coupling the container can't see.</li>\n    </ul>",
        why: "<ul>\n      <li><code>@Lazy</code> trims startup for <b>rarely-used heavyweight beans</b>, and can break a constructor-injection cycle.</li>\n      <li><code>@DependsOn</code> is the <b>only way to order beans</b> whose relationship isn't expressed by injection.</li>\n    </ul>",
        apply: [
          "Use <code>@Lazy</code> selectively; <code>spring.main.lazy-initialization=true</code> globally hides config errors until runtime.",
          "<code>@Lazy</code> on one side of a circular dependency breaks it — but treat that as a design smell to revisit.",
          "Prefer explicit injection over <code>@DependsOn</code>; a string bean name is invisible to refactoring.",

        code: "@Service\nclass Reports {\n  Reports(@Lazy HeavyEngine engine) { this.engine = engine; }  // proxy now, real bean on first call\n}\n\n@Component @DependsOn(\"flywayInitializer\")\nclass SchemaDependentBean { }",
        gotcha: [
          "Global lazy initialization is a <b>false economy</b>: startup looks fast, then a missing bean or bad config blows up on the first production request.",

          "<code>@DependsOn</code> uses string bean names: rename the bean and the ordering silently disappears.",
          "<code>@Lazy</code> does nothing on a prototype bean — prototypes are already created on demand."

        ask: [
          {"q":"How do you resolve a circular dependency?","a":"Best: extract the shared behaviour into a third bean, or invert the call with an <code>ApplicationEvent</code>. Tactical: <code>@Lazy</code> on one injection point, or setter injection. Avoid <code>spring.main.allow-circular-references=true</code> — it re-enables a footgun Boot 2.6 deliberately disabled."},

  {
    name: "Annotations::Configuration & Boot",
