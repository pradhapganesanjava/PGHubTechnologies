    terms: [
      {
        id: "ann-configuration",
        title: "@Configuration",
        lede: "Marks a class as a source of bean definitions — its @Bean methods are factory methods the container calls.",
        flow: "<div class=\"cmp\">\n      <div><h4>Full — proxyBeanMethods = true</h4><ul>\n        <li>CGLIB-proxied class</li>\n        <li>Sibling call → <b>the singleton</b> ✓</li>\n        <li>Can't be <code>final</code></li></ul></div>\n      <div><h4>Lite — proxyBeanMethods = false</h4><ul>\n        <li>No proxy</li>\n        <li>Sibling call → <b>a new object</b> ⚠</li>\n        <li>Faster; Boot's own default</li></ul></div>\n    </div>\n    <div class=\"callout\"><b>Sidestep the whole question:</b> take dependencies as <code>@Bean</code> method <i>parameters</i>, never by calling a sibling method.</div>",
        what: "<ul>\n      <li>Marks a class as a <b>source of bean definitions</b>.</li>\n      <li><b>Full mode</b> intercepts inter-<code>@Bean</code> calls so they return the container singleton.</li>\n      <li><b>Lite mode</b> skips interception — faster startup, native-image friendly.</li>\n    </ul>",
        why: "<ul>\n      <li><b>Type safety, refactoring and real control flow</b> that XML never had.</li>\n      <li>The exact mechanism <b>every Boot auto-configuration</b> is built on.</li>\n    </ul>",
        apply: [
          "Group beans by concern, one focused configuration class each.",
          "Pass dependencies as <code>@Bean</code> method <b>parameters</b> rather than calling other <code>@Bean</code> methods — then lite mode is always safe.",
          "Use <code>proxyBeanMethods = false</code> for configs whose methods never call each other; it is what Boot's own auto-configurations do.",
          "Compose with <code>@Import</code>, <code>@Profile</code> and <code>@Conditional</code> instead of writing one giant class."
        ],
        code: "@Configuration(proxyBeanMethods = false)\nclass DataConfig {\n  @Bean DataSource dataSource(DataProperties p) { … }\n  @Bean JdbcTemplate jdbc(DataSource ds) { return new JdbcTemplate(ds); }\n}",
        gotcha: [
          "Switching to <code>proxyBeanMethods = false</code> <b>changes behaviour</b> if any <code>@Bean</code> method calls another — you silently get duplicate instances.",
          "A full-mode <code>@Configuration</code> class cannot be <code>final</code>, and its <code>@Bean</code> methods cannot be <code>private</code> or <code>final</code> — CGLIB has to subclass and override them.",
          "<code>@Configuration</code> classes are themselves beans, created very early. Injecting application services into them invites ordering problems.",
          "<code>@Component</code> also allows <code>@Bean</code> methods, but always in lite mode — an easy way to get the duplicate-instance bug without asking for it."
        ],
        ask: [
          {"q":"What actually is the difference between full and lite mode?","a":"Full mode CGLIB-proxies the config class so inter-<code>@Bean</code> calls are intercepted and return the singleton. Lite mode does not proxy, so such a call is a plain Java method call producing a new object. Lite is faster and native-image friendly; full is safer if your methods call each other."},
          {"q":"Can @Bean live on a @Component class?","a":"Yes, but it runs in lite mode with no interception. Prefer <code>@Configuration</code> so the semantics are explicit."}
        ],
        related: [
          "configuration-class",
          "ann-bean",
          "ann-import",
          "auto-configuration"
        ]
      },
      {
        id: "ann-bean",
        title: "@Bean",
        lede: "A factory method whose return value the container registers and manages as a bean.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">method name<small>→ becomes the BEAN NAME</small></div>\n      <div class=\"arrow\">+</div>\n      <div class=\"node\">return type<small>→ becomes the BEAN TYPE</small></div>\n      <div class=\"arrow\">+</div>\n      <div class=\"node\">parameters<small>→ injected like anywhere else</small></div>\n      <div class=\"arrow\">=</div>\n      <div class=\"node accent\">managed bean</div>\n    </div>\n    <div class=\"callout warn\">Boot <b>infers <code>destroyMethod</code></b> and will call <code>close()</code>/<code>shutdown()</code> on <code>AutoCloseable</code> beans at shutdown — whether you meant it or not. Opt out with <code>destroyMethod = \"\"</code>.</div>",
        what: "<ul>\n      <li>A <b>factory method</b> whose return value the container registers and manages.</li>\n      <li><b>Name = method name</b> (override with <code>@Bean(\"x\")</code>); <b>type = declared return type</b>.</li>\n      <li><code>initMethod</code>/<code>destroyMethod</code> attach lifecycle callbacks to classes you can't annotate.</li>\n    </ul>",
        why: "<ul>\n      <li>How you bring <b>third-party classes</b> under container management.</li>\n      <li>How <b>every Boot default bean</b> is defined.</li>\n    </ul>",
        apply: [
          "Declare the <b>most specific useful</b> return type: it is what other injection points match against.",
          "Take collaborators as method parameters rather than calling sibling <code>@Bean</code> methods.",
          "Combine with <code>@ConditionalOnMissingBean</code> when writing reusable configuration so applications can override.",
          "Name it deliberately — the method name becomes public API for <code>@Qualifier</code> lookups."
        ],
        code: "@Bean(destroyMethod = \"shutdown\")\nExecutorService workers() { return Executors.newFixedThreadPool(4); }\n\n@Bean @ConditionalOnMissingBean\nRestClient restClient(RestClient.Builder b) { return b.build(); }",
        gotcha: [
          "Returning a <b>narrow</b> type (<code>HikariDataSource</code>) instead of the interface (<code>DataSource</code>) is fine for injection but couples every consumer; returning too <b>wide</b> a type (<code>Object</code>) makes the bean unmatchable by type.",
          "Renaming the method renames the bean — quietly breaking <code>@Qualifier(\"oldName\")</code> at runtime.",
          "Boot's inferred <code>destroyMethod</code> will call <code>close()</code> on your bean at shutdown whether you meant it to or not. Set <code>destroyMethod = \"\"</code> to opt out.",
          "A <code>@Bean</code> method that returns <code>null</code> registers a null bean and produces a baffling downstream NPE."
        ],
        ask: [
          {"q":"@Bean or @Component — how do you choose?","a":"Do you own the class? <code>@Component</code> — less code, wiring lives with the class. Third-party class, or construction needs logic/conditions/several variants of the same type? <code>@Bean</code>."},
          {"q":"A @Bean method is called twice — how many instances exist?","a":"One, if the config class is in full mode (default): the CGLIB proxy intercepts and returns the singleton. In lite mode (<code>proxyBeanMethods = false</code>, or on a <code>@Component</code>), you get two distinct objects."}
        ],
        related: [
          "ann-configuration",
          "bean",
          "ann-conditional",
          "configuration-class"
        ]

      {
        id: "ann-springbootapplication",
        title: "@SpringBootApplication",
        lede: "The entry-point meta-annotation: @Configuration + @EnableAutoConfiguration + @ComponentScan.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">@Configuration<small>this class defines beans</small></div>\n      <div class=\"arrow\">+</div>\n      <div class=\"node\">@EnableAutoConfiguration<small>apply conditional defaults</small></div>\n      <div class=\"arrow\">+</div>\n      <div class=\"node accent\">@ComponentScan<small>scan from THIS package down</small></div>\n    </div>\n    <div class=\"callout danger\"><b>The third one bites.</b> The annotation's <i>location</i> is configuration: a component in a sibling package is never found. Put the class in the <b>root package</b>.</div>",
        what: "<ul>\n      <li>Combines <b>@Configuration + @EnableAutoConfiguration + @ComponentScan</b>.</li>\n      <li>Scanning starts at <b>its own package and goes downwards</b>.</li>\n      <li><code>run()</code> infers the context type, binds the environment, starts the server, publishes events.</li>\n    </ul>",

        apply: [

          "Narrow or extend with <code>scanBasePackages</code> when code legitimately lives elsewhere.",
          "Exclude specific auto-configurations with <code>exclude = {…}</code> rather than fighting them bean by bean.",

        gotcha: [

          "Putting the main class in the <b>default</b> (root, unnamed) package makes Boot scan every jar on the classpath. Startup crawls and stray beans appear.",
          "<code>@SpringBootApplication</code> is <code>@Configuration</code> in full mode, so the class is CGLIB-proxied and cannot be <code>final</code>.",

        ask: [
          {"q":"What three annotations does it combine, and why does that matter?","a":"<code>@Configuration</code> (the class defines beans), <code>@EnableAutoConfiguration</code> (apply conditional defaults), <code>@ComponentScan</code> (scan from this package down). The third is the one that bites: the annotation's <b>location</b> determines what gets scanned."},
          {"q":"How do you disable one auto-configuration?","a":"<code>@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)</code> or the <code>spring.autoconfigure.exclude</code> property. Usually better: define your own bean and let <code>@ConditionalOnMissingBean</code> back off."}

        what: "<ul>\n      <li>Defaults to the <b>declaring class's package and below</b>.</li>\n      <li><code>basePackageClasses</code> is <b>refactor-safe</b>; string <code>basePackages</code> is not.</li>\n      <li><b>Filters</b> narrow by annotation, type, regex or a custom <code>TypeFilter</code>.</li>\n    </ul>",

        why: "<ul>\n      <li>Composes configuration <b>without relying on component scanning</b>.</li>\n      <li>Essential for libraries: a starter must work <b>regardless of the host app's scan root</b>.</li>\n    </ul>",

      {
        id: "ann-configurationproperties",
        title: "@ConfigurationProperties",
        lede: "Binds a whole property prefix to a typed object — the structured alternative to scattered @Value.",
        flow: "<div class=\"cmp split\">\n      <div><h4>✓ record — constructor binding</h4><ul>\n        <li>Immutable, no setters</li>\n        <li>Missing value → <b>startup failure</b></li>\n        <li>Can't be half-bound</li></ul></div>\n      <div><h4>⚠ class — setter binding</h4><ul>\n        <li>Forget a setter → <b>silently ignored</b></li>\n        <li>You find the null much later</li></ul></div>\n    </div>\n    <div class=\"flow\">\n      <div class=\"node\">APP_API_BASE_URL</div>\n      <div class=\"arrow\">=</div>\n      <div class=\"node\">app.api.base-url</div>\n      <div class=\"arrow\">=</div>\n      <div class=\"node\">app.api.baseUrl</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">baseUrl<small>relaxed binding</small></div>\n    </div>",
        what: "<ul>\n      <li>Binds a whole <b>property prefix</b> onto a typed record or class.</li>\n      <li><b>Relaxed binding</b> matches kebab, camel and SCREAMING_SNAKE spellings.</li>\n      <li>Handles <b>nesting, List/Map, Duration, DataSize</b>.</li>\n      <li><code>@Validated</code> + constraints → <b>fail at startup</b> on bad values.</li>\n    </ul>",
        why: "<ul>\n      <li>Configuration becomes a <b>typed, validated, documented object</b>.</li>\n      <li>Mistakes surface <b>at boot</b>, not on the unlucky request that first reads them.</li>\n    </ul>",
        apply: [
          "Use immutable <code>record</code>s for constructor binding — no setters, no half-populated state.",
          "Always add <code>@Validated</code> plus constraints; config errors should stop the boot.",
          "Add <code>spring-boot-configuration-processor</code> so your keys get IDE autocompletion.",
          "Inject the properties object, not the individual values, so related settings travel together."
        ],
        code: "@ConfigurationProperties(prefix = \"app.api\")\n@Validated\nrecord ApiProperties(@NotBlank String baseUrl,\n                     @Positive int timeoutMs,\n                     Duration retryBackoff) { }",
        gotcha: [
          "A <b>record</b> uses constructor binding — it needs no setters, but it also cannot be partially bound: a missing non-defaulted value is a startup failure (usually what you want).",
          "A <b>class</b> uses setter binding by default: forget a setter and the property is silently ignored, leaving a null you discover much later.",
          "The prefix must be <b>kebab-case</b> in the annotation. <code>prefix = \"appApi\"</code> is invalid and fails at startup.",
          "Binding does not warn about unknown keys under your prefix — a typo'd property is silently unused unless you enable strict binding."
        ],
        ask: [
          {"q":"What is relaxed binding?","a":"One property can be written several ways and still bind: <code>app.api.base-url</code>, <code>app.api.baseUrl</code>, <code>APP_API_BASE_URL</code>, <code>app.api.base_url</code>. That is what lets environment variables (which cannot contain dots or dashes) map cleanly onto YAML keys."},
          {"q":"How do you validate configuration at startup?","a":"Annotate the properties type <code>@Validated</code> and put JSR-380 constraints on the fields. Binding then fails fast with a readable report of every violated key — far better than an NPE mid-request."}
        ],
        related: [
          "application-properties",
          "ann-value",
          "ann-profile",
          "ann-validated"
        ]
      },
      {
        id: "ann-conditional",
        title: "@ConditionalOnX",
        lede: "The condition family that decides at startup whether a bean or configuration is registered at all.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">@ConditionalOnClass<small>library on classpath?</small></div>\n      <div class=\"node\">@ConditionalOnProperty<small>flag set? default: NO</small></div>\n      <div class=\"node accent\">@ConditionalOnMissingBean<small>user hasn't defined one?</small></div>\n      <div class=\"node\">@ConditionalOnWebApplication</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node good\">bean registered</div>\n    </div>\n    <div class=\"callout warn\"><b>Order matters.</b> <code>@ConditionalOnBean</code>/<code>OnMissingBean</code> see only definitions registered <i>so far</i> — safe inside auto-configurations (they run last), unreliable in your own config.</div>",
        what: "<ul>\n      <li>A family of conditions evaluated <b>while bean definitions are registered</b>.</li>\n      <li>All build on the generic <code>@Conditional(SomeCondition.class)</code>.</li>\n      <li><code>@ConditionalOnProperty</code> defaults to <b><code>matchIfMissing = false</code></b> — absent property means no bean.</li>\n    </ul>",
        why: "<ul>\n      <li>The entire engine behind <b>auto-configuration</b>.</li>\n      <li>The reason \"define your own bean to override the default\" <b>works</b>.</li>\n    </ul>",
        apply: [
          "Pair <code>@ConditionalOnMissingBean</code> with every default bean you publish in shared configuration.",
          "Gate optional features on <code>@ConditionalOnProperty(name = \"…\", havingValue = \"true\", matchIfMissing = false)</code>.",
          "Inspect matches with <code>--debug</code> or the actuator <code>conditions</code> endpoint before guessing.",
          "<code>@ConditionalOnClass</code> works because annotation values are read via ASM — the class need not be loadable."
        ],
        code: "@AutoConfiguration\n@ConditionalOnClass(RestClient.class)\nclass HttpAutoConfiguration {\n  @Bean @ConditionalOnMissingBean\n  RestClient restClient(RestClient.Builder b) { return b.build(); }\n}",
        gotcha: [
          "<code>@ConditionalOnBean</code> and <code>@ConditionalOnMissingBean</code> are <b>order-sensitive</b>: they see only definitions registered so far. They are safe inside auto-configurations (which run last) and unreliable in ordinary user configuration.",
          "<code>@ConditionalOnMissingBean</code> matches <b>by type</b> — defining a bean of a subtype may not suppress the default the way you expect.",
          "<code>@ConditionalOnProperty</code> defaults to <code>matchIfMissing = false</code>: an absent property means the bean is <b>not</b> created. Set it deliberately.",
          "Conditions are evaluated once at startup. Changing a property at runtime does not create or remove the bean."
        ],
        ask: [
          {"q":"How does Boot let you override an auto-configured bean?","a":"Auto-configurations are processed <b>after</b> user configuration, and their beans carry <code>@ConditionalOnMissingBean</code>. So when your bean of that type already exists, the default condition fails and Boot backs off — no exclusion needed."},
          {"q":"Why is @ConditionalOnBean discouraged in your own @Configuration?","a":"It only sees bean definitions registered before it is evaluated, and ordinary configuration classes have no guaranteed order. The result is a condition that passes or fails depending on scan order."}
        ],
        related: [
          "auto-configuration",
          "ann-bean",
          "ann-profile",
          "ann-configuration"
        ]
      },
      {
        id: "ann-async-scheduled",
        title: "@Async & @Scheduled",
        lede: "Run a method on another thread, or on a recurring timer — both proxy-based, both easy to get wrong.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">Caller thread</div>\n      <div class=\"arrow accent\">→ @Async →</div>\n      <div class=\"node accent\">TaskExecutor thread</div>\n      <div class=\"arrow bad\">✗ does NOT carry →</div>\n      <div class=\"node bad\">transaction · SecurityContext · request scope</div>\n    </div>\n    <div class=\"callout danger\"><b>Two defaults that bite:</b> an <code>@Async void</code> method <b>swallows its exception</b> (return <code>CompletableFuture</code>), and the <code>@Scheduled</code> pool is <b>a single thread</b> — one slow job delays every other.</div>\n    <div class=\"cmp\">\n      <div><h4>fixedRate</h4><ul><li>Fixed cadence from <b>start</b></li><li>Slow job → drift + queueing</li></ul></div>\n      <div><h4>fixedDelay</h4><ul><li>Gap after <b>completion</b></li><li>Safer when duration varies</li></ul></div>\n    </div>",
        what: "<ul>\n      <li><code>@EnableAsync</code> + <code>@Async</code> → returns immediately, runs on a <b>TaskExecutor</b>. Must return <code>void</code>, <code>Future</code> or <code>CompletableFuture</code>.</li>\n      <li><code>@EnableScheduling</code> + <code>@Scheduled</code> → timer via <code>fixedRate</code>, <code>fixedDelay</code> or <code>cron</code>.</li>\n      <li>Both are <b>proxy-based</b>: self-invocation doesn't work.</li>\n    </ul>",
        why: "<ul>\n      <li>The cheapest way to get background work in a Spring app.</li>\n      <li>And the cheapest way to get a <b>swallowed exception, a single-threaded bottleneck, or a job firing on every replica</b>.</li>\n    </ul>",
        apply: [
          "Always configure an explicit executor and pool size; the defaults are not production settings.",
          "Return <code>CompletableFuture</code> from <code>@Async</code> when the caller needs the result or the failure.",
          "Prefer <code>fixedDelay</code> (gap after completion) over <code>fixedRate</code> (fixed cadence) for jobs whose duration varies.",
          "In a multi-instance deployment use a distributed lock (ShedLock) or a real scheduler — <code>@Scheduled</code> fires on every replica."
        ],
        code: "@EnableAsync @EnableScheduling\n@Configuration class TaskConfig { }\n\n@Async CompletableFuture<Report> build(Long id) { … }\n\n@Scheduled(cron = \"0 0 3 * * *\", zone = \"UTC\")\nvoid nightlyCleanup() { … }",
        gotcha: [
          "<b>An <code>@Async void</code> method swallows its exception.</b> Nothing observes it unless you register an <code>AsyncUncaughtExceptionHandler</code>. Return <code>CompletableFuture</code> and the failure is at least capturable.",
          "Both are AOP — <b>self-invocation does not work</b>, and neither does calling them from <code>@PostConstruct</code>.",
          "<code>@Async</code> starts a new thread, so the <b>transaction, SecurityContext and request scope do not propagate</b>. <code>@Transactional</code> on the async method starts its own.",
          "The default <code>@Scheduled</code> pool is a <b>single thread</b>: one slow job delays every other scheduled task in the application.",
          "<code>fixedRate</code> does not run overlapping executions by default — a job slower than its period silently drifts and queues."
        ],
        ask: [
          {"q":"Why did my @Async method run synchronously?","a":"Almost certainly self-invocation (called via <code>this</code> from the same bean), a missing <code>@EnableAsync</code>, or a non-public method. All three bypass the proxy that makes it asynchronous."},
          {"q":"How do you stop a @Scheduled job running on all instances?","a":"It has no cluster awareness — every replica fires it. Use a distributed lock (ShedLock), leader election, or move the schedule to an external trigger such as a Kubernetes CronJob hitting one endpoint."}
        ],
        related: [
          "spring-aop",
          "proxy-mechanics",
          "transactional",
          "ann-cacheable"
        ]
      },
      {
        id: "ann-cacheable",
        title: "@Cacheable @CacheEvict @CachePut",
        lede: "Declarative caching around method calls — the result is stored under a key and reused on the next matching call.",
        flow: "<div class=\"flow\">\n      <div class=\"node accent\">@Cacheable<small>hit → SKIP the method</small></div>\n      <div class=\"node\">@CachePut<small>ALWAYS run, then overwrite</small></div>\n      <div class=\"node\">@CacheEvict<small>remove entries</small></div>\n    </div>\n    <div class=\"flow\">\n      <div class=\"node\">call</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">key in cache?</div>\n      <div class=\"arrow good\">yes →</div>\n      <div class=\"node good\">return cached<small>method never runs</small></div>\n      <div class=\"arrow\">no →</div>\n      <div class=\"node\">run + store</div>\n    </div>\n    <div class=\"callout danger\"><b>Unbounded cache = a memory leak with a nice name.</b> Set a TTL and a maximum size on every one.</div>",
        what: "<ul>\n      <li><code>@EnableCaching</code> switches on the AOP interceptor.</li>\n      <li><b>Key</b> defaults to the method arguments; override with SpEL.</li>\n      <li>Backed by any <code>CacheManager</code> — Caffeine, Redis, a simple map.</li>\n      <li><code>sync = true</code> stops a <b>thundering herd</b> of concurrent misses.</li>\n    </ul>",
        why: "<ul>\n      <li>Moves caching <b>out of business logic entirely</b>.</li>\n      <li>The risk: it's <b>invisible at the call site</b> — a stale cache looks exactly like a bug in the reader.</li>\n    </ul>",
        apply: [
          "Set an explicit TTL and maximum size on every cache — an unbounded cache is a memory leak with a nice name.",
          "Design the key deliberately with SpEL: <code>key = \"#userId + ':' + #locale\"</code>.",
          "Use <code>@CacheEvict</code> on every write path that invalidates the cached data.",
          "<code>sync = true</code> prevents a thundering herd of concurrent misses recomputing the same key."
        ],
        code: "@Cacheable(cacheNames = \"users\", key = \"#id\", sync = true)\nUser find(Long id) { return repo.findById(id).orElseThrow(); }\n\n@CacheEvict(cacheNames = \"users\", key = \"#user.id\")\nvoid update(User user) { repo.save(user); }",
        gotcha: [
          "Proxy-based, so <b>self-invocation is not cached</b> — the single most common 'caching does nothing' report.",
          "The default key is built from <b>all</b> arguments. Add a parameter and every existing entry misses; pass a mutable object and the key changes underneath you.",
          "Caching a method that returns a <b>mutable</b> object hands every caller the same instance — one caller's mutation corrupts the cache.",
          "<code>@CacheEvict</code> runs <b>before</b> the method by default. With <code>beforeInvocation = false</code> (the default) it runs after, and is skipped if the method throws — decide which you want.",
          "Caching inside a transaction can publish an eviction that a later rollback does not undo."
        ],
        ask: [
          {"q":"@Cacheable vs @CachePut?","a":"<code>@Cacheable</code> <b>skips</b> the method when a cached value exists. <code>@CachePut</code> <b>always</b> executes and overwrites the entry. Use <code>@CachePut</code> on updates where you want the cache refreshed rather than merely invalidated."},
          {"q":"What breaks when you cache in a clustered deployment?","a":"A local cache (Caffeine, ConcurrentMap) is per-instance, so an eviction on one node leaves the others stale. Either use a shared store (Redis) or accept the staleness explicitly with a short TTL."}
        ],
        related: [
          "spring-aop",
          "proxy-mechanics",
          "ann-async-scheduled",
          "ann-transactional"
        ]
      }
    ]

    name: "Annotations::Web & REST",

    terms: [
      {
        id: "ann-restcontroller",
        title: "@RestController & @Controller",
        lede: "@RestController is @Controller + @ResponseBody — every return value is serialized into the response body.",
        flow: "<div class=\"cmp split\">\n      <div><h4>@RestController</h4><ul>\n        <li>Return value → <b>the response body</b></li>\n        <li>For APIs</li></ul></div>\n      <div><h4>@Controller</h4><ul>\n        <li>String return → <b>a view name</b></li>\n        <li>Returning <code>\"ok\"</code> makes Spring hunt for a template called \"ok\" ⚠</li></ul></div>\n    </div>",
        what: "<ul>\n      <li><code>@RestController</code> = <code>@Controller</code> + <code>@ResponseBody</code> on every method.</li>\n      <li><code>@Controller</code> resolves String returns through a <b>ViewResolver</b>.</li>\n      <li>Both are stereotypes — the class <b>must be component-scanned</b>.</li>\n    </ul>",
        why: "<ul>\n      <li>Choosing wrongly gives one of Spring's most confusing symptoms: a <b>404 or template error instead of your string</b>.</li>\n    </ul>",
        apply: [
          "<code>@RestController</code> for APIs, <code>@Controller</code> only when rendering server-side templates.",
          "Return DTOs, never JPA entities.",
          "Keep the class thin: bind, delegate to a service, map the result.",
          "Put the shared path prefix on a class-level <code>@RequestMapping</code>."
        ],
        code: "@RestController\n@RequestMapping(\"/api/v1/orders\")\nclass OrderController {\n  @GetMapping(\"/{id}\") OrderDto get(@PathVariable Long id) { return svc.find(id); }\n}",
        gotcha: [
          "Returning a <b>JPA entity</b> leaks your schema into the API contract and triggers <code>LazyInitializationException</code> or surprise N+1 queries during serialization.",
          "A <code>@Controller</code> method returning a plain String is interpreted as a view name — add <code>@ResponseBody</code> or switch to <code>@RestController</code>.",
          "Controllers are <b>singletons</b>. An instance field holding per-request state is a data-leak bug across users.",
          "Jackson needs a way to construct your DTO: a record, or a no-arg constructor plus getters. A class with only a custom constructor fails to deserialize."
        ],
        ask: [
          {"q":"What exactly does @ResponseBody change?","a":"It tells Spring to write the return value <b>into the response body</b> via an <code>HttpMessageConverter</code>, rather than treating it as a view name for a <code>ViewResolver</code>. <code>@RestController</code> simply applies it to every method in the class."},
          {"q":"How do you control the HTTP status?","a":"<code>@ResponseStatus(HttpStatus.CREATED)</code> for a fixed status, or return <code>ResponseEntity</code> when it varies per call. Use <code>ResponseEntity</code> only where it earns its verbosity."}

        related: [

      {
        id: "ann-requestmapping",
        title: "@RequestMapping & @GetMapping family",
        lede: "Maps a URL pattern, HTTP method and content type to a handler method.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">@GetMapping</div><div class=\"node\">@PostMapping</div><div class=\"node\">@PutMapping</div>\n      <div class=\"node\">@PatchMapping</div><div class=\"node\">@DeleteMapping</div>\n      <div class=\"arrow\">=</div>\n      <div class=\"node ghost\">@RequestMapping + a fixed method</div>\n    </div>\n    <div class=\"callout warn\"><b><code>@RequestMapping</code> with no <code>method</code> matches every verb</b> — including DELETE. Use the shortcuts.</div>\n    <div class=\"flow\">\n      <div class=\"node bad\">consumes mismatch<small>→ 415 Unsupported Media Type</small></div>\n      <div class=\"node bad\">produces mismatch<small>→ 406 Not Acceptable</small></div>\n    </div>",
        what: "<ul>\n      <li>Matches on <b>path, method, params, headers, consumes, produces</b>.</li>\n      <li>Class-level and method-level mappings <b>concatenate</b>.</li>\n      <li><code>consumes</code> = the request's Content-Type; <code>produces</code> = negotiated against Accept.</li>\n    </ul>",
        why: "<ul>\n      <li>Conflicts are caught <b>at startup</b>, not as mysterious 404s later.</li>\n    </ul>",
        apply: [
          "Use the verb shortcuts; they read better and cannot be given the wrong method by accident.",
          "Put the resource prefix at class level and only the varying part on the method.",
          "Set <code>produces</code>/<code>consumes</code> when an endpoint genuinely serves several representations.",
          "Prefer path variables for identity (<code>/orders/{id}</code>) and query parameters for filtering."
        ],
        code: "@RestController @RequestMapping(\"/api/v1/orders\")\nclass OrderController {\n  @GetMapping(\"/{id}\")         OrderDto get(@PathVariable Long id) { … }\n  @PostMapping(consumes = APPLICATION_JSON_VALUE)\n  OrderDto create(@RequestBody CreateOrder cmd) { … }\n}",
        gotcha: [
          "Two methods matching the same request is an <b>ambiguous mapping</b> failure at startup — noisy, but far better than a coin-flip at runtime.",
          "A trailing-slash URL no longer matches by default in Spring 6 (<code>setUseTrailingSlashMatch</code> was removed) — a real migration break.",
          "<code>@RequestMapping</code> with no <code>method</code> matches <b>every</b> HTTP verb, including <code>DELETE</code>. Almost never what you want.",
          "Path variables containing dots used to be truncated by suffix-pattern matching; that legacy behaviour is off in Spring 6, but old tutorials still warn about it."
        ],
        ask: [
          {"q":"consumes vs produces?","a":"<code>consumes</code> constrains the <b>request</b> <code>Content-Type</code> the handler accepts (mismatch → 415 Unsupported Media Type). <code>produces</code> constrains what it can return, negotiated against the request's <code>Accept</code> header (mismatch → 406 Not Acceptable)."}
        ],
        related: [
          "request-mapping",

          "ann-pathvariable",
          "dispatcherservlet"
        ]

      {
        id: "ann-pathvariable",
        title: "@PathVariable @RequestParam @RequestHeader",
        lede: "Bind pieces of the request URL, query string and headers to handler-method parameters.",
        flow: "<div class=\"cmp\">\n      <div><h4>@PathVariable</h4><ul><li><b>Identity</b> — <code>/orders/42</code></li><li>Missing → <b>404</b></li></ul></div>\n      <div><h4>@RequestParam</h4><ul><li><b>Query</b> — filter/sort/page</li><li>Missing + required → <b>400</b></li></ul></div>\n      <div><h4>@RequestHeader</h4><ul><li>Metadata — tenant, trace</li></ul></div>\n    </div>\n    <div class=\"callout warn\">Without <code>-parameters</code> at compile time, names are erased → <b>\"Name for argument not specified\"</b> at runtime. Boot's plugin sets it; name it explicitly if unsure.</div>",
        what: "<ul>\n      <li>Bind a <b>URI segment</b>, a <b>query/form parameter</b>, or a <b>header</b> to a method parameter.</li>\n      <li>All support <code>required</code> and <code>defaultValue</code>, and convert via the <code>Converter</code>/<code>Formatter</code> chain.</li>\n      <li><code>Optional&lt;T&gt;</code> is an alternative to <code>required = false</code>.</li>\n    </ul>",
        why: "<ul>\n      <li>Removes manual parsing — a wrong type becomes a <b>clean 400</b>, not a <code>NumberFormatException</code> in your code.</li>\n    </ul>",
        apply: [
          "Give every optional <code>@RequestParam</code> a <code>defaultValue</code>, or type it <code>Optional&lt;T&gt;</code>.",
          "Register a <code>Converter</code> for domain types so <code>@PathVariable OrderId id</code> just works.",
          "Collapse many filter parameters into one command object rather than eight parameters.",
          "Compile with <code>-parameters</code> (Boot's plugin does) or name the binding explicitly: <code>@PathVariable(\"id\")</code>."
        ],
        code: "@GetMapping(\"/{id}\")\nOrderDto get(@PathVariable Long id,\n             @RequestParam(defaultValue = \"false\") boolean expand,\n             @RequestHeader(name = \"X-Tenant\", required = false) String tenant) { … }",
        gotcha: [
          "Without <code>-parameters</code> at compile time, parameter names are erased and binding fails at runtime with 'Name for argument not specified'. Name it explicitly if in doubt.",
          "A missing <b>required</b> parameter is a 400; a missing <b>path variable</b> means the mapping simply did not match, so you get a 404 instead.",
          "<code>defaultValue</code> implies <code>required = false</code> — setting both is contradictory and the default wins.",
          "Binding a primitive (<code>int</code>) with <code>required = false</code> throws when absent: there is no null to assign. Use the wrapper type."
        ],
        ask: [
          {"q":"@PathVariable or @RequestParam — how do you choose?","a":"Path variables identify a <b>resource</b> (<code>/orders/42</code>) and are part of its identity. Query parameters <b>modify a query</b> — filtering, sorting, pagination — and are typically optional. If removing it would change which resource you mean, it belongs in the path."}
        ],
        related: [
          "request-mapping",
          "ann-requestbody",
          "ann-requestmapping",
          "ann-validated"
        ]

      {
        id: "ann-requestbody",
        title: "@RequestBody & @ResponseBody",
        lede: "Deserialize the request body into an object, and serialize the return value into the response body.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">JSON</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">HttpMessageConverter<small>chosen by Content-Type</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">your record</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node good\">@Valid checks it</div>\n    </div>\n    <div class=\"callout danger\"><b>Binding to a JPA entity is mass assignment.</b> A client can set <code>id</code>, <code>role</code>, or any field you never meant to expose. Always bind to a purpose-built command DTO.</div>",
        what: "<ul>\n      <li>Both run through the <b>HttpMessageConverter chain</b> — <code>Content-Type</code> in, <code>Accept</code> out.</li>\n      <li>For JSON that's Jackson, driven by the auto-configured <code>ObjectMapper</code>.</li>\n      <li>A handler can have <b>only one <code>@RequestBody</code></b> — the stream is read once.</li>\n    </ul>",
        why: "<ul>\n      <li>This is the boundary where <b>untrusted input becomes typed Java objects</b>.</li>\n      <li>The right place for validation — and <b>the wrong place to accept an entity type</b>.</li>\n    </ul>",
        apply: [
          "Bind to a purpose-built command <b>record</b>, not to your JPA entity.",
          "Always pair with <code>@Valid</code> so malformed input fails before your logic runs.",
          "Configure Jackson centrally (<code>spring.jackson.*</code> or an <code>ObjectMapper</code> bean) rather than annotating every DTO.",
          "Reject unknown fields (<code>FAIL_ON_UNKNOWN_PROPERTIES</code>) on internal APIs; tolerate them on public ones for forward compatibility."
        ],
        code: "record CreateOrder(@NotBlank String sku, @Positive int qty) { }\n\n@PostMapping @ResponseStatus(CREATED)\nOrderDto create(@Valid @RequestBody CreateOrder cmd) { return svc.create(cmd); }",
        gotcha: [
          "Binding <code>@RequestBody</code> straight to an <b>entity</b> is a mass-assignment vulnerability: a client can set <code>id</code>, <code>role</code>, or any other field you never meant to expose.",
          "Malformed JSON throws <code>HttpMessageNotReadableException</code> <b>before</b> validation runs — handle it in your <code>@RestControllerAdvice</code> or clients get an ugly 400.",
          "A handler can have only <b>one</b> <code>@RequestBody</code> parameter; the stream is read once.",
          "Jackson needs a record or a no-arg constructor. A DTO class with only an all-args constructor and no <code>@JsonCreator</code> fails to deserialize."
        ],
        ask: [
          {"q":"Why not bind directly to the JPA entity?","a":"Three reasons: mass assignment (clients set fields you never intended), coupling your database schema to your public API, and serialization landmines from lazy associations. A DTO makes the contract explicit and reviewable."}
        ],
        related: [
          "ann-validated",
          "rest-controller",
          "ann-restcontroller",
          "ann-exceptionhandler"
        ]
      },
      {
        id: "ann-validated",
        title: "@Valid & @Validated",
        lede: "Triggers Bean Validation: on a request body at the controller boundary, or on any bean's methods via Aspect-Oriented Programming (AOP).",
        flow: "<div class=\"cmp\">\n      <div><h4>@Valid <small style=\"color:var(--muted)\">Jakarta standard</small></h4><ul>\n        <li>On a parameter or nested field</li>\n        <li><b>Cascades</b> into the object graph</li>\n        <li>Throws <code>MethodArgumentNotValidException</code></li></ul></div>\n      <div><h4>@Validated <small style=\"color:var(--muted)\">Spring</small></h4><ul>\n        <li>Adds <b>validation groups</b></li>\n        <li>On a <b>class</b> → AOP method validation</li>\n        <li>Throws <code>ConstraintViolationException</code></li></ul></div>\n    </div>\n    <div class=\"callout danger\"><b>Two different exceptions.</b> Handle both in your advice, or one path returns a bare 500.</div>",
        what: "<ul>\n      <li><b><code>@Valid</code></b> validates a request body or nested field and <b>cascades</b>.</li>\n      <li><b><code>@Validated</code></b> on a class enables <b>AOP-based method validation</b> for any bean.</li>\n      <li>Needs a provider on the classpath (<code>spring-boot-starter-validation</code>) — <b>without it the annotations are inert</b>.</li>\n    </ul>",
        why: "<ul>\n      <li>Turns malformed input into a <b>structured 400 with per-field errors</b>, instead of a null three layers down.</li>\n    </ul>",
        apply: [

          "Add <code>@Valid</code> to nested fields — validation does <b>not</b> cascade automatically.",
          "Map <code>MethodArgumentNotValidException</code> to a <code>ProblemDetail</code> with field errors in one <code>@RestControllerAdvice</code>.",
          "Write a <code>ConstraintValidator</code> for domain rules instead of piling on regexes."

        code: "record Address(@NotBlank String city) { }\nrecord CreateUser(@NotBlank String name, @Valid Address address) { }  // @Valid cascades\n\n@Validated\n@Service\nclass Importer {\n  void load(@NotBlank String path) { … }   // checked by AOP\n}",
        gotcha: [
          "<b>Validation does not cascade by default.</b> Without <code>@Valid</code> on the nested field, constraints inside <code>Address</code> are never evaluated.",
          "The two throw <b>different</b> exceptions — <code>MethodArgumentNotValidException</code> (parameter binding) vs <code>ConstraintViolationException</code> (method validation). Handle both or one produces a bare 500.",

        ask: [
          {"q":"@Valid or @Validated?","a":"<code>@Valid</code> is the JSR-380 standard for cascading validation on a parameter or field. <code>@Validated</code> is Spring-specific: it supports <b>validation groups</b> and, at class level, switches on method-level validation via AOP. Use <code>@Valid</code> for bodies, <code>@Validated</code> when you need groups or non-controller validation."},
          {"q":"How do you validate differently for create and update?","a":"Validation groups: define marker interfaces <code>Create</code>/<code>Update</code>, set <code>groups</code> on each constraint, and use <code>@Validated(Create.class)</code> at the relevant handler."}

      {

        flow: "<div class=\"flow col\">\n      <div class=\"node\">exception thrown in a service</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node accent\">@RestControllerAdvice → most specific @ExceptionHandler</div>\n      <div class=\"arrow\">↓</div>\n      <div class=\"node good\">ProblemDetail — status + type + detail + field errors</div>\n    </div>\n    <div class=\"callout danger\"><b>Blind spot:</b> filters run <i>before</i> the DispatcherServlet, so Spring Security's 401/403 never reach your advice. Configure <code>AuthenticationEntryPoint</code> and <code>AccessDeniedHandler</code> to match your error format.</div>",
        what: "<ul>\n      <li><code>@RestControllerAdvice</code> = <code>@ControllerAdvice</code> + <code>@ResponseBody</code>, applied across controllers.</li>\n      <li>Handlers <b>inside a single controller take precedence</b> over global ones.</li>\n      <li><b><code>ProblemDetail</code></b> (RFC 7807) is the standard body shape from Spring 6.</li>\n    </ul>",

      {
        id: "ann-responsestatus",
        title: "@ResponseStatus & @CrossOrigin",
        lede: "Declare the success status of a handler (or the status of an exception), and open an endpoint to browser cross-origin calls.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">@ResponseStatus(CREATED)<small>fixed success status</small></div>\n      <div class=\"arrow\">vs</div>\n      <div class=\"node\">ResponseEntity<small>when status/headers VARY</small></div>\n      <div class=\"arrow bad\">→</div>\n      <div class=\"node bad\">ResponseEntity wins<small>@ResponseStatus is ignored</small></div>\n    </div>\n    <div class=\"callout warn\"><b>CORS is enforced by the browser, not the server.</b> curl and Postman ignore it entirely — \"it works in Postman\" proves nothing about a CORS problem.</div>",
        what: "<ul>\n      <li><b><code>@ResponseStatus</code></b> on a handler = the success status; on an <b>exception class</b> = the status when it escapes.</li>\n      <li><b><code>@CrossOrigin</code></b> configures CORS — origins, methods, headers, credentials — checked via a preflight <code>OPTIONS</code>.</li>\n    </ul>",
        why: "<ul>\n      <li>Status codes are an API's <b>most-read documentation</b>.</li>\n      <li>CORS is a <b>browser rule unrelated to authentication</b> — misunderstanding it wastes hours.</li>\n    </ul>",
        apply: [
          "<code>@ResponseStatus(CREATED)</code> on POST handlers that create a resource; <code>NO_CONTENT</code> on deletes.",
          "Prefer central CORS configuration (<code>WebMvcConfigurer</code> or Spring Security) over <code>@CrossOrigin</code> sprinkled everywhere.",
          "Never pair <code>allowCredentials = true</code> with <code>allowedOrigins = \"*\"</code> — the browser rejects it, and it is unsafe.",
          "Remember that <code>@ResponseStatus</code> is ignored when the method returns a <code>ResponseEntity</code> — the entity wins."
        ],
        code: "@PostMapping @ResponseStatus(HttpStatus.CREATED)\nOrderDto create(@Valid @RequestBody CreateOrder cmd) { … }\n\n@ResponseStatus(HttpStatus.NOT_FOUND)\nclass OrderNotFound extends RuntimeException { }",
        gotcha: [
          "<b>CORS is enforced by the browser, not the server.</b> curl and Postman ignore it entirely — 'it works in Postman' proves nothing about a CORS problem.",
          "With Spring Security on the path, CORS must be enabled <b>in the security config</b> too, or the preflight <code>OPTIONS</code> is rejected before MVC sees it.",
          "<code>@ResponseStatus</code> on an exception is silently overridden by any <code>@ExceptionHandler</code> matching that type.",
          "<code>@CrossOrigin</code> with no attributes allows <b>all</b> origins for that endpoint — a permissive default that often ships by accident."

        ask: [

  {
    name: "Annotations::Data & Transactions",
    tag: "Annotations",
    terms: [
      {
        id: "ann-transactional",
        title: "@Transactional",
        lede: "Declarative transaction demarcation — the proxy begins, commits or rolls back around the method.",
        flow: "<div class=\"flow\">\n      <div class=\"node\">Caller</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">Proxy · BEGIN</div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">method</div>\n      <div class=\"arrow good\">return →</div>\n      <div class=\"node good\">COMMIT</div>\n      <div class=\"arrow bad\">unchecked throw →</div>\n      <div class=\"node bad\">ROLLBACK</div>\n    </div>\n    <div class=\"cmp split\">\n      <div><h4>✓ Rolls back</h4><ul><li>RuntimeException</li><li>Error</li></ul></div>\n      <div><h4>✗ Commits anyway</h4><ul><li>Checked exceptions</li><li>Fix: <code>rollbackFor = X.class</code></li></ul></div>\n    </div>\n    <div class=\"callout danger\"><b>Self-invocation does nothing.</b> <code>this.save()</code> from inside the same bean bypasses the proxy — no transaction, no error, no clue.</div>",
        what: "<ul>\n      <li><b>propagation</b> — REQUIRED (default), REQUIRES_NEW, SUPPORTS, MANDATORY, NEVER, NESTED.</li>\n      <li><b>isolation</b>, <b>timeout</b>, <b>readOnly</b>, <b>rollbackFor</b>/<b>noRollbackFor</b>.</li>\n      <li>Default rollback = <b><code>RuntimeException</code> and <code>Error</code> only</b>.</li>\n    </ul>",
        why: "<ul>\n      <li>Simultaneously <b>the most useful and most misunderstood</b> annotation in Spring.</li>\n      <li>Almost every question about it reduces to two facts: <b>it is a proxy</b>, and <b>its default rollback rule surprises people</b>.</li>\n    </ul>",
        apply: [
          "Put it on the <b>service</b> layer, one transaction per use case — not on repositories or controllers.",
          "Add <code>rollbackFor</code> whenever you throw a checked exception that should roll back.",
          "Mark read paths <code>@Transactional(readOnly = true)</code>.",
          "Keep HTTP calls and long computations <b>out</b> of transactions — an idle open connection exhausts the pool."
        ],
        code: "@Transactional(rollbackFor = InsufficientFunds.class, timeout = 5)\nvoid transfer(Long from, Long to, Money amt) throws InsufficientFunds {\n  accounts.debit(from, amt);\n  accounts.credit(to, amt);\n}",
        gotcha: [
          "<b>Self-invocation does nothing.</b> <code>this.save()</code> from inside the same bean bypasses the proxy — no transaction, no error, no clue.",
          "<b>Checked exceptions commit by default.</b> Throwing <code>IOException</code> mid-method leaves the partial write committed unless you set <code>rollbackFor</code>.",
          "<code>private</code>, <code>final</code>, <code>static</code> and package-private methods cannot be advised by a CGLIB proxy.",
          "Catching an exception inside the transactional method means Spring never sees it — no rollback. Worse, if an <b>inner</b> <code>REQUIRED</code> transaction failed, the shared transaction is already marked rollback-only and the commit throws <code>UnexpectedRollbackException</code>.",
          "<code>readOnly = true</code> is a hint to the provider and the driver, not a hard guard — some databases still permit writes."
        ],
        ask: [
          {"q":"Why doesn't @Transactional roll back on a checked exception?","a":"It inherits EJB's convention: unchecked exceptions signal unexpected failure (roll back), checked exceptions are anticipated business outcomes (commit). Whether you agree or not, it is the default — override it with <code>rollbackFor</code>."},
          {"q":"What is UnexpectedRollbackException?","a":"An inner <code>REQUIRED</code> transaction failed and marked the shared transaction <b>rollback-only</b>; the outer method caught the exception and tried to commit anyway. Spring refuses and throws at commit time. The fix is usually <code>REQUIRES_NEW</code> for the inner unit, or not swallowing the exception."},
          {"q":"Where should the annotation live?","a":"The service layer — the boundary of one business use case. On repositories the unit is too small (each call its own transaction); on controllers it is too wide (an open transaction across serialization and HTTP work)."}
        ],
        related: [
          "transactional",
          "proxy-mechanics",
          "persistence-context",
          "ann-query"
        ]
      },
      {
        id: "ann-entity",
        title: "@Entity @Table @Id @GeneratedValue",
        lede: "The Jakarta Persistence API (JPA) mapping annotations that make a class a persistent table row with a primary key.",
        flow: "<div class=\"cmp split\">\n      <div><h4>SEQUENCE <small style=\"color:var(--ok)\">preferred</small></h4><ul>\n        <li>Pre-allocates ids in blocks</li>\n        <li><b>Batch inserts work ✓</b></li>\n        <li>Postgres, Oracle</li></ul></div>\n      <div><h4>IDENTITY</h4><ul>\n        <li>Must INSERT to learn the id</li>\n        <li><b>Kills JDBC batching ✗</b></li>\n        <li>Simpler; fine at low write volume</li></ul></div>\n    </div>\n    <div class=\"callout danger\"><b>Never base <code>equals</code>/<code>hashCode</code> on a generated id.</b> It's null before persist — add the entity to a <code>HashSet</code>, save it, and you can no longer find or remove it.</div>",
        what: "<ul>\n      <li><b><code>@Entity</code></b> — a managed persistent class; needs a no-arg constructor, must not be <code>final</code>.</li>\n      <li><b><code>@Table</code></b> — table name, indexes, unique constraints.</li>\n      <li><b><code>@Id</code> + <code>@GeneratedValue</code></b> — primary key and generation strategy.</li>\n    </ul>",
        why: "<ul>\n      <li>The generation strategy has a <b>direct, invisible performance consequence</b>.</li>\n      <li>A <code>final</code> entity <b>can't be proxied</b> — lazy loading silently degrades to eager.</li>\n    </ul>",
        apply: [
          "Prefer <code>SEQUENCE</code> on Postgres/Oracle with a matching <code>allocationSize</code> so inserts can batch.",
          "Give entities a business-meaningful <code>equals</code>/<code>hashCode</code> based on a natural or assigned key, never on a generated id.",
          "Declare column constraints (<code>nullable</code>, <code>length</code>, <code>unique</code>) so schema validation catches drift.",
          "Keep entities out of your API layer entirely — map to DTOs."
        ],
        code: "@Entity\n@Table(name = \"orders\", indexes = @Index(columnList = \"status\"))\nclass Order {\n  @Id @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"order_seq\")\n  private Long id;\n}",
        gotcha: [
          "<b><code>IDENTITY</code> kills batch inserts.</b> Hibernate must execute each INSERT immediately to learn the generated id, so <code>hibernate.jdbc.batch_size</code> has no effect.",
          "<code>equals</code>/<code>hashCode</code> based on a generated id is broken for new entities: the id is null before persist, so an entity added to a <code>HashSet</code> becomes unfindable once it is assigned.",
          "An entity class that is <code>final</code>, or has <code>final</code> methods, cannot be proxied — lazy loading silently degrades to eager.",
          "Using Lombok's <code>@Data</code> on an entity generates <code>equals</code>/<code>hashCode</code>/<code>toString</code> over <b>all</b> fields, including lazy associations — which triggers loading, and sometimes infinite recursion."
        ],
        ask: [
          {"q":"IDENTITY or SEQUENCE?","a":"<code>SEQUENCE</code> where the database supports it: Hibernate can pre-allocate ids in blocks, which keeps JDBC batching working and cuts round trips. <code>IDENTITY</code> is simpler and fine for low write volume, but it forces an immediate INSERT per entity."},
          {"q":"Why is generated-id equals() a trap?","a":"Before persist the id is null, so two new entities compare equal (or the object's hash changes after the id is assigned). Put an entity in a <code>HashSet</code> before persisting and you can no longer find or remove it. Use a natural key or an application-assigned UUID."}
        ],
        related: [
          "persistence-context",
          "spring-data-jpa",
          "ann-relationships",
          "ann-transactional"
        ]

      {
        id: "ann-relationships",
        title: "@OneToMany @ManyToOne @JoinColumn",
        lede: "Map associations between entities — and decide, via fetch type, how much of the object graph loads.",
        flow: "<div class=\"flow\">\n      <div class=\"node bad\">@ManyToOne<small>EAGER by default ⚠</small></div>\n      <div class=\"node bad\">@OneToOne<small>EAGER by default ⚠</small></div>\n      <div class=\"node good\">@OneToMany<small>LAZY by default ✓</small></div>\n      <div class=\"node good\">@ManyToMany<small>LAZY by default ✓</small></div>\n    </div>\n    <div class=\"callout danger\"><b>Override every one to LAZY</b>, then fetch what a use case needs with <code>@EntityGraph</code> or <code>join fetch</code>. The eager defaults quietly drag the object graph along on every load.</div>\n    <div class=\"flow\">\n      <div class=\"node accent\">Order<small>@OneToMany(mappedBy=\"order\") — inverse side</small></div>\n      <div class=\"arrow\">↔</div>\n      <div class=\"node\">Item<small>@ManyToOne @JoinColumn — OWNING side, holds the FK</small></div>\n    </div>",
        what: "<ul>\n      <li><b><code>@ManyToOne</code> and <code>@OneToOne</code> default to EAGER</b>; the collection sides default to LAZY.</li>\n      <li><b><code>@JoinColumn</code></b> names the foreign key on the <b>owning</b> side; <b><code>mappedBy</code></b> marks the inverse.</li>\n      <li><b><code>cascade</code></b> propagates operations; <b><code>orphanRemoval</code></b> deletes detached children.</li>\n    </ul>",
        why: "<ul>\n      <li>Fetch type is <b>the single biggest determinant of JPA performance</b>.</li>\n      <li>The eager default on <code>@ManyToOne</code> is the one you <b>almost always want to override</b>.</li>\n    </ul>",
        apply: [
          "Set <code>fetch = FetchType.LAZY</code> on <b>every</b> association, including <code>@ManyToOne</code>.",
          "Load what a use case needs with <code>join fetch</code> or <code>@EntityGraph</code> on that specific query.",
          "Keep the owning side clear and write helper methods that update both sides of a bidirectional link.",
          "Use <code>cascade</code> narrowly — <code>CascadeType.ALL</code> on a shared reference deletes rows you did not mean to touch."
        ],
        code: "@Entity class Order {\n  @OneToMany(mappedBy = \"order\", cascade = ALL, orphanRemoval = true)\n  private List<Item> items = new ArrayList<>();\n}\n\n@Entity class Item {\n  @ManyToOne(fetch = FetchType.LAZY) @JoinColumn(name = \"order_id\")\n  private Order order;\n}",
        gotcha: [
          "<b><code>@ManyToOne</code> is EAGER by default</b> — every load silently drags its parent along, and chains of them fan out into a large join or many queries.",
          "Lazy access outside the transaction throws <code>LazyInitializationException</code>. <code>open-in-view</code> (on by default in Boot) hides this in the web layer while quietly issuing queries during serialization — turn it off.",
          "<code>join fetch</code> on <b>two</b> collections produces a cartesian product; Hibernate throws <code>MultipleBagFetchException</code> for two <code>List</code>s.",
          "Forgetting to set both sides of a bidirectional association leaves an in-memory graph that disagrees with the database until you reload.",
          "<code>CascadeType.REMOVE</code> on <code>@ManyToOne</code> means deleting a child deletes the parent — almost never intended."
        ],
        ask: [
          {"q":"What is spring.jpa.open-in-view and why disable it?","a":"It keeps the persistence context open for the whole request so lazy loading works in the view/serialization layer. That sounds convenient but it holds a database connection for the request's full duration and hides N+1 queries in rendering. Set it to <code>false</code> and fetch explicitly."},
          {"q":"How do you fix MultipleBagFetchException?","a":"You cannot <code>join fetch</code> two <code>List</code> collections at once. Options: change one to a <code>Set</code>, split into two queries (Hibernate reuses the persistence context), or use <code>@BatchSize</code>/batch fetching instead of joining."}
        ],
        related: [
          "n-plus-one",
          "persistence-context",
          "ann-entitygraph",
          "ann-entity"
        ]
      },
      {
        id: "ann-query",
        title: "@Query @Param & @Modifying",
        lede: "Write the query yourself when a derived method name is not enough — Jakarta Persistence Query Language (JPQL), or native SQL.",
        flow: "<div class=\"flow\">\n      <div class=\"node good\">derived name<small>up to ~3 conditions</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node accent\">@Query JPQL<small>joins, projections</small></div>\n      <div class=\"arrow\">→</div>\n      <div class=\"node\">nativeQuery<small>vendor features only</small></div>\n    </div>\n    <div class=\"callout danger\"><b><code>@Modifying</code> bypasses the persistence context.</b> Already-loaded entities keep stale values — and can overwrite your update at flush. Use <code>clearAutomatically = true</code> or re-fetch.</div>",
        what: "<ul>\n      <li><b><code>@Query</code></b> — JPQL by default, SQL with <code>nativeQuery = true</code>.</li>\n      <li><b><code>@Param</code></b> — named binding; positional <code>?1</code> breaks silently when arguments are reordered.</li>\n      <li><b><code>@Modifying</code></b> — required for update/delete, and <b>must run inside a transaction</b>.</li>\n      <li>Bulk operations <b>don't cascade and skip lifecycle callbacks</b>.</li>\n    </ul>",
        why: "<ul>\n      <li>Derived method names <b>stop scaling around three conditions</b>.</li>\n      <li><code>@Query</code> keeps the SQL <b>visible and reviewable</b> instead of hidden in a forty-character method name.</li>\n    </ul>",
        apply: [
          "Switch from a derived name to <code>@Query</code> once the name exceeds a line.",
          "Use named parameters — positional ones break silently when arguments are reordered.",
          "Select a DTO projection instead of whole entities for read-only screens.",
          "Prefer JPQL for portability; drop to <code>nativeQuery</code> only for vendor features."
        ],
        code: "@Query(\"select new com.acme.OrderSummary(o.id, o.total) from Order o where o.userId = :uid\")\nList<OrderSummary> summaries(@Param(\"uid\") Long uid);\n\n@Modifying(clearAutomatically = true)\n@Query(\"update Order o set o.status = :s where o.id = :id\")\nint updateStatus(@Param(\"id\") Long id, @Param(\"s\") Status s);",
        gotcha: [
          "<b>A <code>@Modifying</code> query bypasses the persistence context.</b> Entities already loaded keep their stale values — set <code>clearAutomatically = true</code>, or reload.",
          "<code>@Modifying</code> without a surrounding transaction throws <code>TransactionRequiredException</code> at runtime.",
          "Bulk update/delete does <b>not</b> cascade and does not fire entity lifecycle callbacks — <code>orphanRemoval</code> and <code>@PreUpdate</code> are skipped.",
          "Native queries lose type checking and portability, and their paging requires a separate <code>countQuery</code>.",
          "String-concatenating a parameter into <code>@Query</code> is SQL injection. Always bind."
        ],
        ask: [
          {"q":"When is a derived query name the wrong tool?","a":"When the name stops being readable (more than about three conditions), when the query needs a join or projection, or when you want the SQL visible for review. <code>@Query</code>, a <code>Specification</code>, or a dedicated query object are all better past that point."},
          {"q":"Why did my entity not reflect a @Modifying update?","a":"Bulk JPQL executes directly against the database, outside the persistence context. The already-managed entity still holds its old state — and can even overwrite your update at flush. Use <code>clearAutomatically = true</code> or re-fetch."}
        ],
        related: [

      {
        id: "ann-entitygraph",
        title: "@EntityGraph",

/* ---- Index (built-in + custom terms, rebuildable) ---- */
let GROUPS = [];
let TERMS = {};
let customTerms = {};   // id -> custom term (loaded from server or localStorage)

/* nested tags use "::" as the delimiter, e.g. "Reliability::Retries" */
const TAG_SEP = "::";
function tagParts(group) { return (group || "").split(TAG_SEP).map(s => s.trim()).filter(Boolean); }
function tagLeaf(group) { const p = tagParts(group); return p[p.length - 1] || group; }

function rebuildData() {
  GROUPS = []; TERMS = {};
  const byName = {};
  Object.values(customTerms).forEach(t => {
    if (!t.builtin) t._custom = true;
    let g = byName[t.group];
    if (!g) { g = { name: t.group, tag: t.tag || tagLeaf(t.group), terms: [] }; byName[t.group] = g; GROUPS.push(g); }
    g.terms.push(t);
  });
  GROUPS.forEach(g => g.terms.forEach(t => { t._group = g; TERMS[t.id] = t; }));
}

/* drop runtime-only props (_group back-ref, _custom) before persisting */
function stripRuntime(o) {
  const c = {};
  for (const k in o) if (k.charAt(0) !== "_") c[k] = o[k];
  return c;
}
function serializeMap(map) {
  const out = {};
  for (const id in map) out[id] = stripRuntime(map[id]);
  return out;
}

/* built-in terms become seed rows in the store (terms.json / localStorage) */
function builtinSeed() {
  const out = {};
  BUILTIN_GROUPS.forEach(g => g.terms.forEach(t => {
    out[t.id] = {
      id: t.id, title: t.title, group: g.name, tag: g.tag,
      lede: t.lede, flow: t.flow, what: t.what, why: t.why, apply: t.apply,
      code: t.code, variants: t.variants, gotcha: t.gotcha, ask: t.ask,
      related: t.related, builtin: true
    };
  }));
  return out;
}

const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---- Eclipse-style Java syntax highlighter (self-contained, no deps) ---- */
const JAVA_KW = new Set(("abstract assert boolean break byte case catch char class const continue " +
  "default do double else enum extends final finally float for goto if implements import instanceof " +
  "int interface long native new package private protected public return short static strictfp super " +
  "switch synchronized this throw throws transient try void volatile while var yield record sealed " +
  "permits when true false null").split(" "));
function highlightJava(src) {
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  // one token category per match: comment | string/char | annotation | number | word
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*[dDfFlL]?\b)|([A-Za-z_$][\w$]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tok-ann">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
    else {
      const w = m[5];
      if (JAVA_KW.has(w)) out += `<span class="tok-kw">${esc(w)}</span>`;
      else if (/^[A-Z]/.test(w)) out += `<span class="tok-cls">${esc(w)}</span>`;
      else out += esc(w);
    }
  }
  out += esc(src.slice(last));
  return out;
}
function highlightBlocks(root) {
  if (!root) return;
  root.querySelectorAll("pre code").forEach(c => {
    if (c.dataset.hl) return;
    c.innerHTML = highlightJava(c.textContent);
    c.dataset.hl = "1";
  });
}

    ${t.variants && t.variants.length ? `<div class="section"><h3>Flavours &amp; their fixes</h3>${t.variants.map(v => `

        <div class="variant-head">${v.name}</div>

/* ---- Sidebar (Terms / QA tabs, each Tree / Flat) ---- */
const nav = document.getElementById("nav");
let sidebarMode = "tree";
let navSection = "terms";            // "terms" | "qa" | "topics" | "docs"
function navGroups() { return navSection === "qa" ? QA_GROUPS : navSection === "topics" ? TOPIC_GROUPS : GROUPS; }
function navIndex() { return navSection === "qa" ? QA_INDEX : navSection === "topics" ? TOPIC_INDEX : TERMS; }
function navOpen(id) { return navSection === "qa" ? selectQA(id) : navSection === "topics" ? selectTopic(id) : select(id); }
function renderSidebar(mode) {
  sidebarMode = mode;
  nav.innerHTML = "";
  nav.classList.toggle("flat", mode === "flat");

  if (navSection === "docs") {
    const group = document.createElement("div");
    group.className = "group";
    const items = document.createElement("div");
    items.className = "group-items";
    if (!DOCS.length) {
      const msg = document.createElement("div");
      msg.className = "nav-empty";
      msg.innerHTML = SERVER
        ? "No <code>.md</code> files in the <code>docs/</code> folder yet."
        : "Docs live in Google Drive — sign in to load them.";
      items.appendChild(msg);
    } else {
      DOCS.forEach(d => {
        const el = document.createElement("div");
        el.className = "term";
        el.dataset.id = d.name;
        el.textContent = d.title || d.name;
        el.title = d.name;
        el.addEventListener("click", () => selectDoc(d.name));
        items.appendChild(el);
      });
    }
    group.appendChild(items);
    nav.appendChild(group);
    applyFilter();
    if (currentDocName) markActive(currentDocName);
    return;
  }

  if (mode === "flat") {
    const all = Object.values(navIndex()).slice().sort((a, b) => a.title.localeCompare(b.title));
    const group = document.createElement("div");
    group.className = "group";
    const items = document.createElement("div");
    items.className = "group-items";
    all.forEach(t => items.appendChild(itemEl(t)));
    group.appendChild(items);
    nav.appendChild(group);
  } else {
    renderTreeNode(buildTree(navGroups()), nav, 0);
  }
  applyFilter();
  const activeId = navSection === "qa" ? currentQAId : navSection === "topics" ? currentTopicId : currentId;
  if (activeId) markActive(activeId);
}
function itemEl(t) {
  const el = document.createElement("div");
  el.className = "term";
  el.dataset.id = t.id;
  el.textContent = t.title;
  el.addEventListener("click", () => navOpen(t.id));
  return el;
}
/* build a nested tree from groups whose names use "::" (e.g. "A::B::C") */
function buildTree(groups) {
  const root = { children: {}, order: [], terms: [] };
  groups.forEach(g => {
    let node = root;
    tagParts(g.name).forEach(p => {
      if (!node.children[p]) { node.children[p] = { name: p, children: {}, order: [], terms: [] }; node.order.push(p); }
      node = node.children[p];
    });
    node.terms.push(...g.terms);
  });
  return root;
}
function countTree(node) {
  let n = node.terms.length;
  node.order.forEach(k => (n += countTree(node.children[k])));
  return n;
}
function renderTreeNode(node, container, depth) {
  node.order.forEach(key => {
    const child = node.children[key];
    const group = document.createElement("div");
    group.className = "group";
    const head = document.createElement("div");
    head.className = "group-head";
    head.style.paddingLeft = (10 + depth * 12) + "px";
    head.innerHTML = `<span class="caret">▼</span><span>${child.name}</span><span class="count">${countTree(child)}</span>`;
    head.addEventListener("click", () => group.classList.toggle("collapsed"));
    group.appendChild(head);
    const items = document.createElement("div");
    items.className = "group-items";
    renderTreeNode(child, items, depth + 1);          // nested sub-tags first
    child.terms.forEach(t => {
      const el = itemEl(t);
      el.style.paddingLeft = (22 + depth * 12) + "px";
      items.appendChild(el);
    });
    group.appendChild(items);
    container.appendChild(group);
  });
}

/* ---- Globe view (rotating 3D sphere of term chips) ---- */
const ovGlobe = document.getElementById("ov-globe");
const ovbGlobe = document.getElementById("ovb-globe");
let globeBuilt = false, globeActive = false, globeRAF = null;
let globeChips = [];
let gAngleX = 0.3, gAngleY = 0, gVelX = 0, gVelY = 0.004, gPaused = false;
let gZoom = 1, gAuto = true;
const gMouse = { x: 0, y: 0, inside: false };

function buildGlobe() {
  if (globeBuilt) return;
  const all = [];
  ovCtx.groups().forEach((g, gi) => g.terms.forEach(t => all.push({ t, color: GROUP_COLORS[gi % GROUP_COLORS.length] })));
  const N = all.length;
  all.forEach((item, idx) => {
    const phi = Math.acos(1 - 2 * (idx + 0.5) / N);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (idx + 0.5);
    const chip = document.createElement("div");
    chip.className = "globe-chip";
    chip.textContent = item.t.title;
    chip.style.color = item.color;
    chip.style.borderColor = item.color;
    chip.addEventListener("mouseenter", e => { gPaused = true; showTip(e, item.t); });
    chip.addEventListener("mousemove", moveTip);
    chip.addEventListener("mouseleave", () => { gPaused = false; hideTip(); });
    chip.addEventListener("click", () => { hideTip(); ovCtx.open(item.t.id); });
    ovGlobe.appendChild(chip);
    globeChips.push({
      el: chip,
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    });
  });
  globeBuilt = true;
}
function globeFrame() {
  if (!globeActive) return;
  const rect = ovGlobe.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const radius = (Math.min(rect.width, rect.height) / 2 - 70) * gZoom;
  if (!gPaused && gAuto) {
    if (gMouse.inside) {
      gVelY = ((gMouse.x - cx) / cx) * 0.06;
      gVelX = -((gMouse.y - cy) / cy) * 0.06;
    } else {
      gVelY += (0.004 - gVelY) * 0.02;
      gVelX += (0 - gVelX) * 0.02;
    }
    gAngleY += gVelY;
    gAngleX += gVelX;
  }
  const sinY = Math.sin(gAngleY), cosY = Math.cos(gAngleY);
  const sinX = Math.sin(gAngleX), cosX = Math.cos(gAngleX);
  globeChips.forEach(c => {
    const x1 = c.x * cosY - c.z * sinY;
    const z1 = c.x * sinY + c.z * cosY;
    const y2 = c.y * cosX - z1 * sinX;
    const z2 = c.y * sinX + z1 * cosX;
    const depth = (z2 + 1) / 2;                 // 0 (back) .. 1 (front)
    const px = cx + x1 * radius;
    const py = cy + y2 * radius;
    const el = c.el;
    el.style.transform = `translate(-50%,-50%) translate(${px}px,${py}px) scale(${(0.6 + depth * 0.55).toFixed(3)})`;
    el.style.opacity = (0.3 + depth * 0.7).toFixed(3);
    el.style.zIndex = Math.round(depth * 100);
  });
  globeRAF = requestAnimationFrame(globeFrame);
}
function startGlobe() {
  buildGlobe();
  globeActive = true;
  if (!globeRAF) globeRAF = requestAnimationFrame(globeFrame);
}
function stopGlobe() {
  globeActive = false;
  if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
}
ovGlobe.addEventListener("mousemove", e => {
  const r = ovGlobe.getBoundingClientRect();
  gMouse.x = e.clientX - r.left; gMouse.y = e.clientY - r.top; gMouse.inside = true;
});
ovGlobe.addEventListener("mouseleave", () => { gMouse.inside = false; });

let gHoldTimer = null;
function gHoldStart(fn) { fn(); gHoldTimer = setInterval(fn, 40); }
function gHoldStop() { if (gHoldTimer) { clearInterval(gHoldTimer); gHoldTimer = null; } }
const GSTEP = 0.1;
function gNudge(dir) {
  if (dir === "left") gAngleY -= GSTEP;
  else if (dir === "right") gAngleY += GSTEP;
  else if (dir === "up") gAngleX -= GSTEP;
  else if (dir === "down") gAngleX += GSTEP;
}
function gZoomBy(f) { gZoom = Math.min(2.4, Math.max(0.6, gZoom * f)); }
const HOLD_END = ["pointerup", "pointerleave", "pointercancel"];
globeControls.querySelectorAll(".gc-btn[data-dir]").forEach(btn => {

const NOTE_KEY = id => "springfw-note:" + id;
let dirHandle = null;                       // chosen folder for pasted images
const objectUrls = [];                       // track for cleanup

/* --- tiny IndexedDB kv (to persist the folder handle across reloads) --- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("app:" + APP_ID, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv").objectStore("kv").get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

/* --- Local server upload (preferred when page is served over http) --- */
const SERVER = location.protocol === "http:" || location.protocol === "https:";
async function uploadToServer(blob, name, subdir) {
  const headers = { "X-Filename": name, "Content-Type": blob.type || "application/octet-stream" };
  if (subdir) headers["X-Subdir"] = subdir;   // e.g. "terms" or "qa"
  const res = await fetch("/upload", { method: "POST", headers, body: blob });
  if (!res.ok) throw new Error("upload failed: " + res.status);
  return (await res.json()).url;   // e.g. "/images/mynotes/object-class__123.png"
}

  }

}
function saveNoteToServer(termId, html) {

  fetch("/notes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
