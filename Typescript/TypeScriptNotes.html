<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Bridge between the app's startup and the Drive-backed store.
 *
 * The application below is a classic (non-module) script, so it executes during
 * parsing — before app/boot.js, which is a module and therefore deferred. Its
 * first act is to fetch('/terms'), and on a static host that would 404 long
 * before the store exists to answer it.
 *
 * So window.fetch is replaced up front with a version that parks every call.
 * Once the store installs it calls __pghubInstall, the parked calls are
 * replayed into it, and fetch behaves normally from then on. The app just
 * experiences a slightly slow first request.
 */
(function () {
  // Which Drive folder this page's content lives in. Stamped in by
  // tools/build-app.py from the folder the page sits in.
  window.__pghubModule = "Typescript";
  var native = window.fetch.bind(window);
  // Published so the store can pass non-app requests straight to the browser.
  // It cannot capture window.fetch itself: by the time its module is imported
  // this shim has already replaced it, so what it would capture is the shim —
  // and passthrough would call back into the handler forever.
  window.__pghubNativeFetch = native;
  var parked = [];
  var handler = null;
  window.__pghubInstall = function (fn) {
    handler = fn;
    var queued = parked.splice(0);
    for (var i = 0; i < queued.length; i++) queued[i]();
  };
  window.fetch = function (input, init) {
    if (handler) return handler(input, init);
    return new Promise(function (resolve, reject) {
      parked.push(function () { (handler || native)(input, init).then(resolve, reject); });
    });
  };
})();
</script>

<meta charset="UTF-8" />

<title>TypeScriptNotes — Terms</title>
<style>
  /* ===== Dark (default) ===== */
  :root, [data-theme="dark"] {
    --bg: #0f1117;
    --panel: #161922;
    --panel-2: #1d2230;
    --border: #2a2f3d;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --accent-soft: #1e2a44;
    --chip: #2a3550;
    --code-bg: #0b0d13;
    --code-text: #c8d3f5;
    --accent-ink: #0b0d13;
  }

  /* ===== Moonlight ===== */
  [data-theme="moonlight"] {
    --bg: #0b1023; --panel: #121833; --panel-2: #1a2244; --border: #27305a;
    --text: #dfe4ff; --muted: #8e98c9; --accent: #8b9dff; --accent-soft: #1f2a55;
    --chip: #26305c; --code-bg: #080c1c; --code-text: #aeb8ff; --accent-ink: #0b1023;
  }

  /* ===== Gray ===== */
  [data-theme="gray"] {
    --bg: #2b2f36; --panel: #33383f; --panel-2: #3c424a; --border: #4a5159;
    --text: #e7e9ec; --muted: #a7aeb6; --accent: #9fb0c0; --accent-soft: #3f4651;
    --chip: #444b54; --code-bg: #23272d; --code-text: #cdd3da; --accent-ink: #1b1e23;
  }

  /* ===== Soft ===== */
  [data-theme="soft"] {
    --bg: #f6f4f1; --panel: #fffdfb; --panel-2: #f0ebe5; --border: #e6ded6;
    --text: #4b4658; --muted: #9b93a3; --accent: #9d8ec2; --accent-soft: #ece7f5;
    --chip: #ece6f1; --code-bg: #f4efea; --code-text: #6f6678; --accent-ink: #ffffff;
  }

  /* ===== White ===== */
  [data-theme="white"] {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f6; --border: #dfe3ea;
    --text: #1a1d24; --muted: #667085; --accent: #2563eb; --accent-soft: #e5edff;
    --chip: #e8edf7; --code-bg: #f3f5f9; --code-text: #334155; --accent-ink: #ffffff;
  }

  /* ===== Colorful ===== */
  [data-theme="colorful"] {
    --bg: #fef6ff; --panel: #ffffff; --panel-2: #fbeeff; --border: #f0d7f5;
    --text: #2a1b33; --muted: #8a6f93; --accent: #e0179d; --accent-soft: #ffe1f4;
    --chip: #ffe6f7; --code-bg: #2a1b33; --code-text: #ffd6f0; --accent-ink: #ffffff;
  }

  /* ===== Cartoon ===== */
  [data-theme="cartoon"] {
    --bg: #fffbe7; --panel: #ffffff; --panel-2: #fff3c4; --border: #1a1a1a;
    --text: #1a1a1a; --muted: #7a6f3a; --accent: #ff5c8a; --accent-soft: #ffe0ea;
    --chip: #ffe9a8; --code-bg: #1a1a1a; --code-text: #ffe27a; --accent-ink: #1a1a1a;
  }
  [data-theme="cartoon"] .box { border-width: 2px; box-shadow: 3px 3px 0 var(--border); }
  [data-theme="cartoon"] .box:hover { box-shadow: 5px 5px 0 var(--accent); }
  [data-theme="cartoon"] .tab-btn.active,
  [data-theme="cartoon"] #drawer { box-shadow: -3px 0 0 rgba(0,0,0,.15); }
  [data-theme="cartoon"] .tag-chip,
  [data-theme="cartoon"] .related .pill { border: 2px solid var(--border); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #b692ff);
    display: grid; place-items: center; font-weight: 700; font-size: 12px;
    letter-spacing: -.02em; color: var(--accent-ink);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }

  /* Top tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* Theme picker */
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ===== Narrow screens =====
     The desktop layout is a fixed sidebar beside a flexible main. On a 390px
     phone that leaves main at a handful of characters, and the header's
     right-hand cluster — five tabs plus the theme picker — will not wrap, so
     the document comes out wider than the screen and scrolls sideways.

     Below 860px, the same breakpoint the hub uses, the sidebar stacks above the
     content at full width instead of competing with it, and the header wraps
     its controls onto a second row. Stacking rather than overlaying is
     deliberate: an overlay anchored at top:0 would cover the very button that
     closes it, and anchoring below a header whose height changes when it wraps
     is fragile. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1.05rem; }
    .sub { display: none; }                 /* the tagline is on the hub card too */

    /* display:contents dissolves the wrapper so its children become direct flex
       items of the header. That is what lets the theme picker sit at the end of
       the title row while the tabs claim a full-width row of their own —
       otherwise the five tabs share the remainder with the picker and the last
       two are cut off, reachable only by a horizontal swipe nobody would guess
       at. */
    .header-right { display: contents; }
    .tp { margin-left: auto; flex: 0 0 auto; }
    /* order pulls the tabs after the picker so the header settles into two rows
       (title + picker, then tabs) rather than three. Without it the full-width
       tabs break the line first and the picker is stranded on a row of its own. */
    .tabs { order: 1; flex: 0 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; }

    .layout { flex-direction: column; }
    .layout > aside:not(#drawer) {
      width: 100%; min-width: 0; max-height: 45vh;
      border-right: 0; border-bottom: 1px solid var(--border);
    }

    main { padding: 20px 16px 64px; }
    .detail, .detail:has(.pdf-view), .sv-head, #search-results, #search-more, .sr-empty { max-width: 100%; }
    .pdf-frame { height: 70vh; }
    .boxes { grid-template-columns: 1fr; }
    .ov-globe { height: 60vh; }
  }

  .layout { display: flex; flex: 1; min-height: 0; }
  .nav-toggle { height: 34px; }
  .layout.nav-closed > aside:not(#drawer) { display: none; }

  /* Sidebar */
  aside {
    width: 300px; min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 14px 16px 8px; }
  .nav-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  .nav-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .nav-tabs button.active { background: var(--accent); color: var(--accent-ink); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }

  .search-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .search-row .search { margin-bottom: 0; flex: 1; }
  .view-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .view-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center;
  }
  .view-toggle button svg, .icon-btn svg { display: block; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    flex: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  nav { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }

  .group { margin-bottom: 4px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .group-head:hover { background: var(--panel-2); }
  .group-head .caret { transition: transform .15s ease; color: var(--muted); font-size: 11px; width: 12px; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 10px; }
  .group-items { padding-left: 8px; }
  .group.collapsed .group-items { display: none; }

  .term {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 22px; border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .term:hover { background: var(--panel-2); color: var(--text); }
  .term.active { background: var(--accent-soft); color: #fff; }
  .term.active::before {
    content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .term.hidden, .group.hidden { display: none; }

  /* flat-list mode: the single flat group hides its header */
  nav.flat .group-head { display: none; }
  nav.flat .group-items { padding-left: 0; }
  nav.flat .term { padding-left: 14px; }

  /* Detail pane (Glossary tab) */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; min-width: 0; }
  /* A wide child — a table, a diagram, a code block — must scroll inside its
     own box rather than widening the page. */
  .markdown-body pre, .markdown-body table { max-width: 100%; overflow-x: auto; }
  .detail { max-width: 820px; }
  /* embedded PDF viewer (docs that are .pdf files) */
  .detail:has(.pdf-view) { max-width: 1100px; }
  .pdf-view { display: flex; flex-direction: column; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .pdf-bar .pdf-name { font-weight: 650; color: var(--text); }
  .pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .pdf-bar a:hover { text-decoration: underline; }
  .pdf-frame { width: 100%; height: calc(100vh - 180px); min-height: 480px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag-chip {
    display: inline-block; background: var(--chip); color: var(--accent);
    padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  }
  h2.term-title { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.4px; }
  .lede { font-size: 16px; color: var(--muted); line-height: 1.6; margin: 0 0 26px; }

  .section { margin-bottom: 24px; }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 8px;
  }
  .section p, .section li { line-height: 1.65; font-size: 15px; color: var(--text); }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; }

  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--code-text); }
  p code, li code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }
  pre code { line-height: 1.55; display: block; }

  /* Comparison / reference tables inside a term's content */
  .section table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  .section th, .section td {
    border: 1px solid var(--border); padding: 7px 11px; text-align: left; vertical-align: top;
  }
  .section th { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .section tbody tr:nth-child(even) { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
  .section table.cmp td:first-child { color: var(--muted); font-weight: 600; white-space: nowrap; }
  /* highlight the "recommended" (last) column of a comparison table */
  .section table.cmp th:last-child { background: var(--chip); color: var(--accent); }
  .section table.cmp td:last-child { background: color-mix(in srgb, var(--chip) 45%, transparent); }
  .section table.cmp code { background: transparent; border: 0; padding: 0; }

  /* ===== TypeScript syntax highlighting ===== */
  /* Dark themes (default): IDE dark palette */
  .tok-kw  { color: #cc7832; font-weight: 600; }   /* keywords */
  .tok-str { color: #98c379; }                      /* strings / template literals */
  .tok-com { color: #7f848e; font-style: italic; }  /* comments */
  .tok-num { color: #6cb6ff; }                      /* numbers */
  .tok-ann { color: #d0b344; }                      /* @decorators */
  .tok-cls { color: #4ec9b0; }                      /* Types (Capitalized) */
  /* Light themes: classic light-IDE palette */
  [data-theme="soft"] .tok-kw, [data-theme="white"] .tok-kw, [data-theme="colorful"] .tok-kw, [data-theme="cartoon"] .tok-kw { color: #7f0055; font-weight: 700; }
  [data-theme="soft"] .tok-str, [data-theme="white"] .tok-str, [data-theme="colorful"] .tok-str, [data-theme="cartoon"] .tok-str { color: #2a00ff; }
  [data-theme="soft"] .tok-com, [data-theme="white"] .tok-com, [data-theme="colorful"] .tok-com, [data-theme="cartoon"] .tok-com { color: #3f7f5f; }
  [data-theme="soft"] .tok-num, [data-theme="white"] .tok-num, [data-theme="colorful"] .tok-num, [data-theme="cartoon"] .tok-num { color: #1750eb; }
  [data-theme="soft"] .tok-ann, [data-theme="white"] .tok-ann, [data-theme="colorful"] .tok-ann, [data-theme="cartoon"] .tok-ann { color: #646464; }
  [data-theme="soft"] .tok-cls, [data-theme="white"] .tok-cls, [data-theme="colorful"] .tok-cls, [data-theme="cartoon"] .tok-cls { color: #267f99; }

  .related { display: flex; flex-wrap: wrap; gap: 8px; }
  .related .pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .related .pill:hover { border-color: var(--accent); color: var(--text); }

  /* Notes (rich text) */
  .note-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .note-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .note-btn:hover { border-color: var(--accent); }
  .note-btn.muted { color: var(--muted); }
  .note-editor {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
    color: var(--text); outline: none;
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .note-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-editor h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-editor a { color: var(--accent); }
  .note-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .note-editor pre, .note-view pre, .rich pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  }
  .note-editor code, .note-view code, .rich code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .note-editor pre code, .note-view pre code, .rich pre code { background: none; border: 0; padding: 0; }
  .note-editor blockquote, .note-view blockquote, .rich blockquote {
    margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic;
  }
  .note-editor h3, .note-view h3, .rich h3 { margin: 12px 0 6px; font-size: 18px; }
  .note-editor hr, .note-view hr, .rich hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .note-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .note-hint b { color: var(--accent); font-weight: 600; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .notes-head h3 { margin: 0; }
  .notes-actions { display: flex; gap: 6px; }
  .note-action {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .note-action:hover { border-color: var(--accent); color: var(--accent); }
  .note-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note-action.primary:hover { color: var(--accent-ink); filter: brightness(1.05); }
  .note-view {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; min-height: 46px; color: var(--text);
  }
  .note-view img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-view h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-view a { color: var(--accent); }
  .note-view .empty-note { color: var(--muted); }
  .rich { line-height: 1.65; font-size: 15px; }
  .rich img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .rich h4 { margin: 10px 0 6px; font-size: 16px; }
  .rich a { color: var(--accent); }
  .rich table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .rich th, .rich td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .rich th { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .rich pre { margin: 8px 0; }
  .term-actions { display: flex; gap: 8px; margin: -2px 0 20px; }
  .term-actions .danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

  /* Add-term button */
  .add-term-btn {
    width: 100%; margin-top: 10px; border: 1px dashed var(--accent); background: transparent;
    color: var(--accent); padding: 8px 0; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  .add-term-btn:hover { background: var(--accent-soft); }
  .add-term-btn.inline { width: auto; padding: 8px 16px; margin: 0 0 24px 0; }

  /* Add-term modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 640px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-head .drawer-close { margin-left: auto; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-body label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .modal-body .field { margin-bottom: 16px; }
  .modal-body input[type=text], .modal-body textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);

  }
  .modal-body input[type=text]:focus, .modal-body textarea:focus { border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Terms overview (Terms tab) */
  #overview { flex: 1; overflow-y: auto; padding: 30px 40px 80px; display: none; }
  #overview.show { display: block; }
  .ov-head h2 { margin: 0 0 4px; font-size: 24px; }
  .ov-head p { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
  .ov-group { margin-bottom: 34px; }
  .ov-group-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ov-group-title .name { font-size: 15px; font-weight: 650; }
  .ov-group-title .count { font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
  .ov-group.ov-nested { margin-bottom: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
  .ov-group.ov-nested .ov-group-title .name { font-size: 13.5px; color: var(--muted); }
  /* Docs landing list. The tab used to jump straight into whichever document
     sorted first, so there was no way to see what a module actually held. The
     sidebar lists documents flat — these modules carry no doc tags — so the
     landing list is flat too, and the two agree. */
  .docs-index-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
  .docs-index-head h2 { font-size: 1.15rem; margin: 0; }
  .docs-index-head .count { color: var(--muted); font-size: .85rem; }
  .doc-box { text-align: left; }
  .doc-box .b-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .doc-box .b-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-top: 6px; }

  /* Close bar above an open document — a document is something you come back
     from, so it needs a way out that does not depend on the sidebar. */
  .doc-back { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-back button { background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12px;
    font-family: inherit; font-weight: 600; cursor: pointer; }
  .doc-back button:hover { color: var(--text); border-color: var(--accent); }
  .doc-back .doc-close { margin-left: auto; padding: 5px 9px; }

  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s, background .15s;
  }
  .box:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-2px); }
  .box .b-title { font-weight: 650; font-size: 15px; margin-bottom: 4px; }
  .box .b-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }

  /* Overview view toggle + Wall view */
  .ov-toggle { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
  .ov-toggle button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .ov-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .ov-wall { display: none; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px 12px; max-width: 880px; margin: 0 auto; padding-bottom: 70px; }
  .chip-term {
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; font-weight: 600; line-height: 1;
    transition: transform .12s ease, background .15s, box-shadow .15s;
  }
  .chip-term:hover { transform: scale(1.08); background: var(--panel-2); box-shadow: 0 5px 16px rgba(0,0,0,.28); }

  /* Globe view */
  .ov-globe { display: none; position: relative; width: 100%; max-width: 900px; height: 560px; margin: 0 auto; }
  .globe-chip {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    will-change: transform, opacity; user-select: none;
  }
  .globe-chip:hover { background: var(--panel-2); }
  .globe-controls { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px auto 0; }
  .gc-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    width: 40px; height: 38px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 700; line-height: 1; display: grid; place-items: center;
    user-select: none; touch-action: none;
  }
  .gc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gc-btn:active { background: var(--accent); color: var(--accent-ink); }
  .gc-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Search view */
  #search-view { flex: 1; overflow-y: auto; padding: 26px 40px 80px; display: none; }
  #search-view.show { display: block; }
  .sv-head { max-width: 820px; margin: 0 auto 16px; }
  #search-input {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .sv-summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sv-summary b { color: var(--text); }
  #search-results { max-width: 820px; margin: 0 auto; }
  .sr-hit { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; }
  .sr-hit:hover { border-color: var(--accent); }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sr-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; background: var(--chip); color: var(--accent); }
  .sr-title { font-weight: 650; font-size: 14px; }
  .sr-field { font-size: 11px; color: var(--muted); margin-left: auto; }
  .sr-snippet { font-size: 13.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap; }
  .sr-snippet mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  #search-more { max-width: 820px; margin: 6px auto 0; text-align: center; }
  .sr-more-btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .sr-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sr-empty { color: var(--muted); max-width: 820px; margin: 0 auto; }

  /* Docs (rendered in the main pane, listed in the Terms/QA/Docs sidebar) */
  .nav-empty { color: var(--muted); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  .markdown-body { max-width: 820px; color: var(--text); font-size: 15px; line-height: 1.7; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 700; }
  .markdown-body h1 { font-size: 28px; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 22px; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 18px; }
  .markdown-body h4 { font-size: 15.5px; }
  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body blockquote { margin: 0 0 1em; padding: .4em 1em; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 6px 6px 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-text); padding: .12em .4em; border-radius: 4px; font-size: .88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1em; }
  .markdown-body pre code { background: none; padding: 0; color: var(--code-text); font-size: 13px; line-height: 1.55; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 14px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .markdown-body th { background: var(--panel-2); font-weight: 650; }
  .markdown-body [data-line] { scroll-margin-top: 20px; }
  .doc-flash { animation: docFlash 2s ease-out; border-radius: 6px; }
  @keyframes docFlash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .markdown-body mark.doc-hit { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

  /* Quick-peek tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 300px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.5; color: var(--text);
    box-shadow: 0 12px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; display: none;
  }
  #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; color: var(--accent); }

  /* Slide-over drawer */
  #backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80;
    opacity: 0; visibility: hidden; transition: opacity .2s;
  }
  #backdrop.open { opacity: 1; visibility: visible; }
  #drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 90;
    transform: translateX(100%); transition: transform .26s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column;
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-head .tag-chip { margin-right: auto; }
  .drawer-close {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .drawer-close:hover { color: var(--text); border-color: var(--accent); }
  .drawer-body { overflow-y: auto; padding: 22px 24px 50px; }
  .drawer-body h2.term-title { font-size: 24px; margin-top: 0; }
</style>

        title: "Structural Typing",
        lede: "TypeScript compares types by their shape, not by their name.",
        what: "<p>TypeScript's type system is <b>structural</b>. Two types are compatible when their members line up, regardless of where they were declared or what they are called. This is often nicknamed <i>duck typing</i>: if it has the members a <code>Duck</code> needs, it is a <code>Duck</code>.</p><p>This is the opposite of the <b>nominal</b> systems in Java or C#, where a class only satisfies an interface if it explicitly declares <code>implements</code>. In TypeScript, no declaration is needed. A plain object literal can satisfy an interface it has never heard of.</p><p>There is one deliberate exception. When you assign a <i>fresh object literal</i> directly to a typed target, TypeScript runs an <b>excess property check</b> and complains about keys the target does not declare. The reasoning is practical: an extra key in a literal is almost always a typo, not intent. Assign the literal to a variable first and the check does not apply, because the value is no longer fresh.</p><p>If you truly need nominal behaviour — so that a <code>UserId</code> cannot be passed where an <code>OrderId</code> is expected, even though both are strings — you fake it with a <b>branded type</b>: intersect the primitive with a phantom field that exists only at compile time.</p>",

        what: "<p>A <b>destructured parameter</b> combines two things in one place. The <b>destructuring pattern</b> <code>{ paperUrl, name, pagesToDelete }</code> pulls named fields out of the argument object, so inside the body you write <code>paperUrl</code> directly instead of <code>options.paperUrl</code>. The <b>type annotation</b> comes after the closing brace and describes the object as a whole: <code>}: { paperUrl: string; name: string; pagesToDelete?: number[] }</code>.</p><p>Two spaces are at work. The part inside the braces is a <i>value</i> pattern (JavaScript destructuring); the part after the <code>}:</code> is a <i>type</i>. A common readability win is to lift the type into a named alias — <code>function main({ paperUrl, name }: MainArgs)</code> — which keeps the signature short and lets the type be reused.</p><p>This is the <b>named-arguments</b> shape. Because callers pass one object, argument <b>order does not matter</b> and every value is <b>labelled at the call site</b>: <code>main({ name: \"r\", paperUrl: url })</code> reads the same as <code>main({ paperUrl: url, name: \"r\" })</code>. Contrast <b>positional parameters</b> <code>(a: string, b?: number)</code>, where order is fixed, optional args must come last, and skipping a middle optional forces <code>main(a, undefined, c)</code>.</p><table class=\"cmp\"><thead><tr><th>Aspect</th><th>Positional&nbsp; <code>(a, b?)</code></th><th>Destructured&nbsp; <code>({ a, b })</code></th></tr></thead><tbody><tr><td>Call site</td><td><code>main(\"x\", 1)</code></td><td><code>main({ a: \"x\", b: 1 })</code></td></tr><tr><td>Argument order</td><td>Fixed &mdash; position <i>is</i> meaning</td><td>Free &mdash; keyed by name</td></tr><tr><td>Readability, many params</td><td>Weak &mdash; values are unlabelled</td><td>Strong &mdash; names visible</td></tr><tr><td>Adding a param</td><td>Can shift positions / break callers</td><td>Usually just add a field</td></tr><tr><td>Skip a middle optional</td><td>Awkward: <code>main(a, undefined, c)</code></td><td>Natural: <code>main({ a, c })</code></td></tr><tr><td>Best for</td><td>1&ndash;2 simple values (id, callback)</td><td>3+ options, config-style APIs</td></tr></tbody></table>",
        why: "Object parameters make config-style APIs self-documenting and evolvable: adding a field usually means adding one optional property, not shifting positions and breaking every caller. Positional parameters stay tighter for one or two obvious values, but past three — or once optionals appear in the middle — the named shape is clearer and safer to extend.",
        apply: [
          "Use a destructured object parameter for 3+ options, optional fields, or config-style APIs; keep positional for 1&ndash;2 simple values (an <code>id</code>, a callback).",
          "Lift the inline <code>{ ... }</code> type into a named <code>type</code> alias once it has more than two fields &mdash; the signature reads better and the type is reusable.",
          "Mark truly optional fields with <code>?</code> (<code>pagesToDelete?: number[]</code>); callers can then omit them in any order.",
          "Give the whole parameter a default (<code>= {}</code>) when every field is optional, so callers can invoke it with no argument at all."
        ],
        code: `// Destructure in the parameter list, annotate after the }
function main({ paperUrl, name, pagesToDelete }: {
  paperUrl: string;
  name: string;
  pagesToDelete?: number[];
}) {
  console.log(paperUrl);        // use fields directly — no options.paperUrl
}

// Clearer with a named type
type MainArgs = {
  paperUrl: string;
  name: string;
  pagesToDelete?: number[];
};
async function run({ paperUrl, name, pagesToDelete }: MainArgs) { /* ... */ }

main({ paperUrl: "https://x/a.pdf", name: "report" });           // order-free
main({ pagesToDelete: [1, 3], name: "report", paperUrl: "u" });  // still fine

// vs positional — order fixed, names invisible, optionals last only
function seek(a: string, b?: number) {}
seek("hello");
seek("hello", 42);`,

        id: "overloads",
        title: "Function Overloads",
        lede: "Overloads let one function present several distinct signatures to callers.",
        what: "<p>You write two or more <b>overload signatures</b> with no bodies, then one <b>implementation signature</b> with a body that must be compatible with all of them. The implementation signature is invisible to callers — it exists only to type-check the body:</p><pre><code>function len(x: string): number;\nfunction len(x: unknown[]): number;\nfunction len(x: string | unknown[]): number { return x.length; }</code></pre><p>Resolution walks the overload list <b>top to bottom and picks the first that matches</b>. So order matters: put the most specific signature first, or a broad one will shadow it.</p><p>Overloads are often the wrong tool. If every signature has the same shape and differs only in types, a <b>union parameter</b> or a <b>generic</b> is simpler and composes better. Reserve overloads for the case where argument count or the argument/return <i>relationship</i> genuinely changes between forms.</p>",
        why: "Overloads model APIs where the return type depends on the arguments in a way no single signature captures — think <code>document.createElement</code>. But they are hand-written lookup tables: the compiler does not verify that the implementation actually honours each declared pairing, so a wrong overload is a silent lie.",

      {
        id: "keyof-typeof",
        title: "keyof, typeof & Indexed Access",
        lede: "TypeScript has two parallel spaces — values and types — and these operators move between them.",
        what: "<p>Every name lives in the <b>value space</b>, the <b>type space</b>, or both. <code>const user = {...}</code> creates a value; <code>interface User {...}</code> creates a type. They never collide, which is why <code>const User: User</code> is legal.</p><ul><li><code>typeof x</code> — in a type position, lifts the <i>value</i> <code>x</code> into type space and yields its inferred type. This is not JavaScript's runtime <code>typeof</code>; same word, different space.</li><li><code>keyof T</code> — yields a <b>union of T's keys</b> as literal types. <code>keyof { a: 1; b: 2 }</code> is <code>\"a\" | \"b\"</code>.</li><li><code>T[K]</code> — <b>indexed access</b>: the type of property <code>K</code> in <code>T</code>. It takes types, not values, so <code>T[\"a\" | \"b\"]</code> gives a union of both property types.</li></ul><p>Together they give the classic safe accessor: <code>&lt;T, K extends keyof T&gt;(obj: T, key: K): T[K]</code>. The key is checked against the object, and the return type is exactly that property's type.</p>",
        why: "These operators let types be <i>derived</i> from what already exists instead of restated by hand. Derive <code>keyof typeof config</code> from your config object and the union updates itself when you add a key; write the union manually and it drifts the day someone edits the object.",

          "Type a property accessor as <code>&lt;T, K extends keyof T&gt;(o: T, k: K) =&gt; T[K]</code> — never <code>string</code>.",
          "Index with a union (<code>T[keyof T]</code>) to get the union of all value types.",

      {
        id: "conditional-types",
        title: "Conditional Types & infer",
        lede: "A conditional type is a ternary that runs in the type system.",
        what: "<p>The form is <code>T extends U ? X : Y</code>: if <code>T</code> is assignable to <code>U</code>, the type resolves to <code>X</code>, otherwise <code>Y</code>. Same <code>extends</code>-means-assignable rule as in constraints.</p><p>The behaviour that trips everyone up is <b>distribution</b>. When the checked type is a <i>naked type parameter</i> and you pass a union, the conditional distributes over each member and unions the results. So <code>ToArray&lt;string | number&gt;</code> becomes <code>string[] | number[]</code>, not <code>(string | number)[]</code>.</p><p>To <b>opt out</b>, wrap both sides in a tuple: <code>[T] extends [U] ? X : Y</code>. Now <code>T</code> is no longer naked, the union is checked whole, and no distribution happens. This is how <code>IsNever&lt;T&gt;</code> is written — a naked <code>never</code> distributes over zero members and yields <code>never</code>.</p><p><code>infer</code> declares a type variable inside the <code>extends</code> clause and binds it by pattern matching: <code>T extends Promise&lt;infer U&gt; ? U : T</code> pulls the awaited type out. It is destructuring for types.</p>",

        id: "mapped-types",
        title: "Mapped Types",
        lede: "A mapped type walks the keys of one type and builds a new type from them.",
        what: "<p>The syntax is a <code>for...in</code> loop for types: <code>{ [K in keyof T]: T[K] }</code>. <code>K</code> is bound to each key in turn, and the body says what the new property type should be. That exact form is the identity mapping — it copies <code>T</code>.</p><p>You can add or remove <b>modifiers</b> as you map:</p><ul><li><code>{ readonly [K in keyof T]: T[K] }</code> — adds <code>readonly</code>. This is <code>Readonly&lt;T&gt;</code>.</li><li><code>{ [K in keyof T]?: T[K] }</code> — adds optionality. This is <code>Partial&lt;T&gt;</code>.</li><li><code>{ -readonly [K in keyof T]-?: T[K] }</code> — <i>removes</i> both. This is roughly <code>Required&lt;T&gt;</code> plus mutability.</li></ul><p><b>Key remapping</b> with <code>as</code> lets you rename or filter keys: <code>{ [K in keyof T as NewKey]: T[K] }</code>. Mapping a key to <code>never</code> drops it, which is how <code>Omit</code>-style filtering works.</p><p>Every mapped type is built on <code>keyof</code> and indexed access — <code>Partial</code>, <code>Readonly</code>, <code>Pick</code>, and <code>Record</code> are each three lines of this.</p>",

        title: "Template Literal Types",
        lede: "String literal types can be composed at the type level, the way template strings compose values.",
        what: "<p>A template literal type looks like a JavaScript template string, but it lives in type space and you interpolate <i>types</i> into it rather than values. The result is a string literal type. Spelled out: a type written as a backtick string containing <code>get&#36;&#123;string&#125;</code> matches any string beginning with <code>get</code>, because the <code>string</code> type stands in for any remainder.</p><p>The power comes from <b>unions multiplying out</b>. Interpolate a union and you get the cross product: combining <code>&quot;get&quot; | &quot;set&quot;</code> with <code>&quot;Name&quot; | &quot;Age&quot;</code> — as <code>&#36;&#123;Verb&#125;&#36;&#123;Prop&#125;</code> — produces all four literals, <code>&quot;getName&quot; | &quot;getAge&quot; | &quot;setName&quot; | &quot;setAge&quot;</code>. Two unions of size 3 give 9 members; this grows fast, so keep the operands small.</p><p>Four <b>intrinsic</b> string types ship with the compiler: <code>Uppercase&lt;S&gt;</code>, <code>Lowercase&lt;S&gt;</code>, <code>Capitalize&lt;S&gt;</code>, and <code>Uncapitalize&lt;S&gt;</code>. They are implemented in the compiler itself, not in <code>lib.d.ts</code>.</p><p>Paired with <code>infer</code>, template literal types can also <i>parse</i> strings — pulling <code>:id</code> params out of a route pattern, for example. That is how typed routers give you a params object derived from the path string alone.</p>",

        lede: "TypeScript classes add compile-time privacy on top of ordinary JavaScript classes.",
        what: "<p>A class declaration creates <b>two things at once</b>: a <i>value</i> (the constructor function you can call with <code>new</code>) and a <i>type</i> (the shape of its instances). That is why <code>const c: Counter = new Counter()</code> works with only one declaration.</p><p>The modifiers <code>public</code>, <code>private</code>, and <code>protected</code> are <b>checked by the compiler and then erased</b>. At runtime a <code>private</code> field is a normal property; nothing stops <code>(obj as any).secret</code> or a debugger from reading it. JavaScript's <code>#private</code> fields are different — they are enforced by the engine itself and survive compilation.</p><ul><li><code>public</code> — the default; visible everywhere.</li><li><code>protected</code> — visible in the class and its subclasses.</li><li><code>private</code> — visible only inside the declaring class body.</li></ul><p><b>Parameter properties</b> are shorthand: writing <code>constructor(private name: string)</code> declares the field, types it, and assigns it in one line.</p><p><code>implements</code> is a <i>check</i>, not a contribution. It verifies the class satisfies an interface but adds no members and infers no types for you.</p>",

        lede: "An abstract class is a partially built base that cannot be instantiated on its own.",
        what: "<p>Marking a class <code>abstract</code> tells TypeScript it may not be constructed directly — only subclassed. Inside it, an <code>abstract</code> method or property declares a signature with no body: every concrete subclass must supply one.</p><p>The useful contrast is with <code>interface</code>. An interface is <b>pure contract</b>: no bodies, no state, and it disappears entirely at compile time. An abstract class is a contract <b>plus shared implementation</b>: it can hold constructors, fields, concrete methods, and <code>protected</code> helpers, and it still exists at runtime as a real JavaScript class in the prototype chain.</p><p>Two more consequences follow from that. A class can <code>implements</code> many interfaces but <code>extends</code> only one base. And the abstract class's own type still exists — <code>let s: Shape</code> is fine as a variable type, you just cannot write <code>new Shape()</code>.</p>",

        what: "<p><code>readonly</code> on a property means the compiler rejects assignments after construction. On an array, <code>readonly string[]</code> (equivalently <code>ReadonlyArray&lt;string&gt;</code>) removes the mutating methods — no <code>push</code>, no <code>sort</code>, no index assignment. All of this is <b>compile-time only</b>; nothing calls <code>Object.freeze</code> for you, and the object is fully mutable from plain JavaScript.</p><p><code>as const</code> is a different tool for a different job. Applied to a literal, it does two things: it keeps the <b>narrowest literal type</b> instead of widening (<code>\"GET\"</code> stays <code>\"GET\"</code> rather than becoming <code>string</code>), and it makes object and array literals <b>deeply readonly</b>, turning arrays into <code>readonly</code> tuples.</p><p>Do not confuse the two <code>const</code>s. The JS keyword <code>const</code> freezes the <i>binding</i> — you cannot rebind the variable, but you can still mutate the object it points at. The <code>as const</code> assertion freezes the <i>type</i> — it says nothing about the binding.</p>",

        what: "<p>Decorators are the one place where TypeScript syntax <b>does not disappear</b>. A decorator is an ordinary function that runs when the class is defined; it receives the thing being decorated and may return a replacement. Whatever it does happens at runtime, on every call or on class creation.</p><p>Two dialects exist and they are not compatible:</p><ul><li><b>Standard decorators</b> (TC39, supported since TypeScript 5.0) are the default. A method decorator is called as <code>(value, context)</code>, where <code>context</code> carries <code>kind</code>, <code>name</code>, <code>static</code>, and helpers like <code>addInitializer</code>.</li><li><b>Legacy decorators</b> are enabled by the <code>experimentalDecorators</code> compiler flag. They use the older <code>(target, key, descriptor)</code> signature and pair with <code>emitDecoratorMetadata</code>. Angular and NestJS are built on this form, so those projects keep the flag on.</li></ul><p>Turning <code>experimentalDecorators</code> on switches the whole compilation to the legacy shape. Pick one per project; you cannot mix them file by file.</p>",

        what: "<p>Inside a class method, <code>this</code> is inferred as the instance type — that part is free. In a standalone <code>function</code>, <code>this</code> depends entirely on how the function is <i>called</i>, so TypeScript cannot infer it. Under <code>noImplicitThis</code> (included in <code>strict</code>), such a <code>this</code> is an error rather than a silent <code>any</code>.</p><p>The fix is the <b>this parameter</b>: a fake first parameter named <code>this</code> that declares the expected receiver. It is checked at call sites and then erased — it is not a real argument, and it never shifts the positions of the others.</p><p><b>Polymorphic <code>this</code></b> is a return type meaning \"whatever the current subclass is\". Returning <code>this</code> instead of the base class keeps fluent chains correctly typed through inheritance, which is what builder APIs need.</p><p>Arrow functions have no <code>this</code> of their own; they capture the enclosing scope's. That is why a class field like <code>handler = () =&gt; this.x</code> stays bound when passed as a callback, while a method extracted with <code>const h = obj.method</code> loses its receiver.</p>",
        why: "Detached-method bugs — a callback that reads <code>this.something</code> as <code>undefined</code> — are among the oldest failure modes in JavaScript. A <code>this</code> parameter turns that class of bug into a compile error, and polymorphic <code>this</code> keeps inherited builder chains from collapsing to the base type.",
        apply: [

          "Add a <code>this</code> parameter to callbacks and standalone functions that expect a receiver.",
          "Return <code>this</code>, not the class name, from chainable methods so subclasses chain correctly.",

    name: "Type Safety Patterns",

    terms: [
      {
        id: "any-unknown-never",
        title: "any, unknown & never",
        lede: "Three special types marking the top, the safe top, and the bottom of the type system.",
        what: "<p>These three types sit at the edges of TypeScript's type lattice. Learning where each one lives is most of the battle.</p><p><b>any</b> switches the checker off. A value typed <code>any</code> can be called, indexed, assigned anywhere, and it infects everything it touches: read a property off an <code>any</code> and the result is <code>any</code> too. It is not a type so much as a hole in the type system.</p><p><b>unknown</b> is the honest version of <code>any</code>. Every value is assignable <i>to</i> <code>unknown</code>, but <code>unknown</code> is assignable to nothing except <code>unknown</code> and <code>any</code>. You cannot read a property, call it, or do arithmetic until you narrow it. It is the correct type for JSON, <code>catch</code> bindings, and anything crossing a trust boundary.</p><p><b>never</b> is the empty type: no value has it. It is what a function returns when it never returns normally &mdash; it throws, or loops forever. It is also the result of impossible intersections such as <code>string &amp; number</code>, and what a union collapses to when every member has been narrowed away.</p><p>That last property is the useful one. In an exhaustive <code>switch</code>, the default branch receives <code>never</code> if you handled every case. Assign it to a <code>never</code>-typed variable and TypeScript will fail the build the day someone adds a new union member.</p><p>Assignability, in one line: everything flows into <code>unknown</code>; <code>never</code> flows into everything; <code>any</code> flows both ways and should be rare.</p>",
        why: "Reaching for <code>any</code> is how a typed codebase quietly stops being typed &mdash; the hole spreads silently through every value it touches. <code>unknown</code> gives you the same flexibility at the boundary while forcing a narrowing check before use. <code>never</code> turns \"I handled every case\" from a comment into a compiler-enforced guarantee.",
        apply: [
          "Type external data (<code>JSON.parse</code>, <code>fetch</code> bodies, <code>catch</code> bindings) as <code>unknown</code>, never <code>any</code>.",
          "Enable <code>useUnknownInCatchVariables</code> (included in <code>strict</code>) so errors arrive as <code>unknown</code>.",
          "Add a <code>never</code> assignment in every <code>switch</code> default over a union to lock in exhaustiveness.",
          "If you must use <code>any</code>, confine it to one line with a comment &mdash; do not let it escape into a return type."

        code: `function assertNever(x: never): never {\n  throw new Error("Unexpected: " + JSON.stringify(x));\n}\n\ntype Shape = { kind: "circle" } | { kind: "square" };\n\nfunction area(s: Shape) {\n  switch (s.kind) {\n    case "circle": return 1;\n    default: return assertNever(s); // s: never — add "square" and this errors\n  }\n}`,

      {
        id: "type-guards",
        title: "Type Guards & Predicates",
        lede: "Runtime checks that TypeScript reads to narrow a value's static type inside a block.",
        what: "<p>Narrowing is control-flow analysis. TypeScript walks your code and tracks, per branch, what a variable could still be. A <i>type guard</i> is any expression it knows how to interpret.</p><p>The built-in guards cover most cases:</p><ul><li><code>typeof x === \"string\"</code> &mdash; primitives.</li><li><code>x instanceof Error</code> &mdash; classes and prototypes.</li><li><code>\"radius\" in shape</code> &mdash; property presence.</li><li><code>if (x)</code> &mdash; truthiness, which removes <code>null</code>, <code>undefined</code>, <code>\"\"</code>, <code>0</code>.</li><li><code>x === null</code> or <code>x.kind === \"circle\"</code> &mdash; equality and literal comparison.</li></ul><p>When the check is too complex to inline, write a <b>user-defined type predicate</b>: a function returning <code>value is Foo</code>. Callers get narrowing at the call site, exactly as if they had written the check by hand.</p><pre><code>function isUser(v: unknown): v is User {\n  return typeof v === \"object\" &amp;&amp; v !== null &amp;&amp; \"id\" in v;\n}</code></pre><p><b>Assertion functions</b> are the throwing variant: <code>function assertUser(v: unknown): asserts v is User</code>. They narrow everything <i>after</i> the call rather than inside an <code>if</code>. The declaration needs an explicit type annotation on the variable holding it &mdash; TypeScript will not infer an assertion signature.</p><p>Here is the part people miss. A predicate is an <b>unchecked promise</b>. TypeScript does not verify that the body actually proves the claim. <code>function isUser(v: unknown): v is User { return true; }</code> compiles fine and lies to every caller. The return type is a contract you are responsible for honouring, not a check the compiler performs.</p>",
        why: "Narrowing is what makes union types usable: you model a value honestly as \"one of these\" and let the compiler prove which one you are in. Predicates package that reasoning behind a name so validation lives in one place instead of being copy-pasted. But because the compiler trusts a predicate's signature without verifying it, a sloppy predicate is more dangerous than an <code>as</code> cast &mdash; it looks like a check.",
        apply: [
          "Reach for built-in narrowing first &mdash; <code>typeof</code>, <code>in</code>, <code>instanceof</code> &mdash; before writing a predicate.",
          "Keep predicate bodies small and total: check every field the type claims exists.",
          "Use <code>asserts x is T</code> at boundaries where a failure should throw, not branch.",
          "Treat a predicate like an assertion in a code review &mdash; if the body cannot prove the type, it is a bug."
        ],
        code: `type Cat = { meow(): void };\ntype Dog = { bark(): void };\n\nfunction isCat(a: Cat | Dog): a is Cat {\n  return "meow" in a; // we must guarantee this — TS just believes it\n}\n\nfunction speak(a: Cat | Dog) {\n  if (isCat(a)) a.meow(); // a: Cat\n  else a.bark();          // a: Dog\n}`,
        related: ["any-unknown-never", "discriminated-unions", "union-intersection", "type-assertions"]

      {
        id: "discriminated-unions",
        title: "Discriminated Unions",
        lede: "A union whose members share a literal tag field, letting TypeScript narrow the whole object from one check.",
        what: "<p>A discriminated (or tagged) union is a union of object types where every member has a common property whose type is a distinct <i>literal</i>: <code>kind: \"circle\"</code> versus <code>kind: \"square\"</code>. Check that one field and TypeScript narrows the entire object &mdash; you get <code>radius</code> in one branch and <code>side</code> in the other, with no cast.</p><p>Three ingredients are required, and all three matter:</p><ul><li>A <b>common property name</b> across every member.</li><li>Its type must be a <b>literal or literal union</b>, not <code>string</code>.</li><li>The property must be present on every member (usually non-optional).</li></ul><p>The alternative, which every codebase drifts toward, is the optional-fields-everywhere shape:</p><pre><code>// Bad: 2^3 states, most of them nonsense\ntype Request = {\n  loading?: boolean;\n  data?: User;\n  error?: Error;\n};</code></pre><p>Nothing stops <code>{ loading: true, error: e }</code>, and every consumer writes defensive <code>if (r.data)</code> checks. Model it as a union instead and the illegal states cannot be constructed:</p><pre><code>type Request =\n  | { status: \"loading\" }\n  | { status: \"success\"; data: User }\n  | { status: \"error\"; error: Error };</code></pre><p>Now <code>data</code> exists exactly when <code>status</code> is <code>\"success\"</code>. Pair the union with an exhaustive <code>switch</code> and a <code>never</code> default, and adding a fourth state becomes a compile error at every site that must handle it. That combination &mdash; tagged union plus exhaustive switch &mdash; is the single highest-leverage modelling tool TypeScript offers.</p>",
        why: "Optional fields multiply states: three optional booleans describe eight combinations when your domain has three. A discriminated union describes exactly the states that exist, so impossible ones are unrepresentable rather than merely unlikely. It also turns adding a case into a guided refactor: the compiler lists every place that needs updating.",
        apply: [

      {
        id: "utility-types",
        title: "Utility Types",
        lede: "Built-in generic types that transform existing types instead of restating them.",
        what: "<p>Utility types are generics that ship with TypeScript in <code>lib.es5.d.ts</code>. They take a type and give you a related one: the same shape with everything optional, a subset of its keys, the return type of a function. Nothing magic is involved &mdash; every one of them is written in ordinary TypeScript using mapped types and conditional types, and you could write them yourself. Reading their real definitions is the fastest way to understand the type system's machinery.</p>" +
              "<p><b>The catalogue</b></p>" +
              "<table><thead><tr><th>Utility</th><th>What it does</th><th>Example</th></tr></thead><tbody>" +
              "<tr><td><code>Partial&lt;T&gt;</code></td><td>Makes every property optional.</td><td><code>Partial&lt;User&gt;</code> &rarr; <code>{ id?: string; name?: string }</code></td></tr>" +
              "<tr><td><code>Required&lt;T&gt;</code></td><td>Makes every property required.</td><td><code>Required&lt;Config&gt;</code> &rarr; all fields present</td></tr>" +
              "<tr><td><code>Readonly&lt;T&gt;</code></td><td>Makes every property read-only (shallow).</td><td><code>Readonly&lt;User&gt;</code> &rarr; <code>{ readonly id: string }</code></td></tr>" +
              "<tr><td><code>Pick&lt;T, K&gt;</code></td><td>Keeps only the listed keys.</td><td><code>Pick&lt;User, \"id\"&gt;</code> &rarr; <code>{ id: string }</code></td></tr>" +
              "<tr><td><code>Omit&lt;T, K&gt;</code></td><td>Removes the listed keys.</td><td><code>Omit&lt;User, \"password\"&gt;</code></td></tr>" +
              "<tr><td><code>Record&lt;K, V&gt;</code></td><td>Builds an object type from keys to a value type.</td><td><code>Record&lt;string, number&gt;</code></td></tr>" +
              "<tr><td><code>Exclude&lt;T, U&gt;</code></td><td>Removes union members assignable to <code>U</code>.</td><td><code>Exclude&lt;\"a\" | \"b\", \"a\"&gt;</code> &rarr; <code>\"b\"</code></td></tr>" +
              "<tr><td><code>Extract&lt;T, U&gt;</code></td><td>Keeps union members assignable to <code>U</code>.</td><td><code>Extract&lt;string | number, string&gt;</code> &rarr; <code>string</code></td></tr>" +
              "<tr><td><code>NonNullable&lt;T&gt;</code></td><td>Removes <code>null</code> and <code>undefined</code>.</td><td><code>NonNullable&lt;string | null&gt;</code> &rarr; <code>string</code></td></tr>" +
              "<tr><td><code>ReturnType&lt;F&gt;</code></td><td>The type a function returns.</td><td><code>ReturnType&lt;typeof makeUser&gt;</code></td></tr>" +
              "<tr><td><code>Parameters&lt;F&gt;</code></td><td>A function's parameters as a tuple.</td><td><code>Parameters&lt;typeof send&gt;</code> &rarr; <code>[string, number]</code></td></tr>" +
              "<tr><td><code>Awaited&lt;T&gt;</code></td><td>Unwraps a promise, recursively.</td><td><code>Awaited&lt;Promise&lt;User&gt;&gt;</code> &rarr; <code>User</code></td></tr>" +
              "</tbody></table>" +
              "<p><b>They are just mapped and conditional types</b></p>" +
              "<p>Here are the real definitions, straight from the standard library. <code>Partial</code>, <code>Required</code>, and <code>Readonly</code> are mapped types that walk the keys of <code>T</code> and add or strip a modifier. The <code>-?</code> and <code>-readonly</code> syntax <i>removes</i> a modifier rather than adding one:</p>" +
              "<pre><code>type Partial&lt;T&gt; = { [P in keyof T]?: T[P] };\ntype Required&lt;T&gt; = { [P in keyof T]-?: T[P] };\ntype Readonly&lt;T&gt; = { readonly [P in keyof T]: T[P] };</code></pre>" +
              "<p><code>Pick</code> is a mapped type too, but it iterates a supplied key set rather than <code>keyof T</code>. The constraint <code>K extends keyof T</code> is what makes a typo in the key list a compile error:</p>" +
              "<pre><code>type Pick&lt;T, K extends keyof T&gt; = { [P in K]: T[P] };</code></pre>" +
              "<p><code>Exclude</code> is a conditional type, and a <i>distributive</i> one: because <code>T</code> is a bare type parameter on the left of <code>extends</code>, TypeScript applies the condition to each union member separately and unions the results:</p>" +
              "<pre><code>type Exclude&lt;T, U&gt; = T extends U ? never : T;\ntype Extract&lt;T, U&gt; = T extends U ? T : never;\ntype NonNullable&lt;T&gt; = T &amp; {};</code></pre>" +
              "<p>And <code>Omit</code> is simply the two composed &mdash; use <code>Exclude</code> to compute the keys to keep, then <code>Pick</code> them:</p>" +
              "<pre><code>type Omit&lt;T, K extends keyof any&gt; = Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;;</code></pre>" +
              "<p><code>ReturnType</code> and <code>Parameters</code> use conditional types with <code>infer</code>, which pattern-matches a type and binds part of it to a variable:</p>" +
              "<pre><code>type ReturnType&lt;T extends (...a: any) =&gt; any&gt; =\n  T extends (...a: any) =&gt; infer R ? R : any;\n\ntype Parameters&lt;T extends (...a: any) =&gt; any&gt; =\n  T extends (...a: infer P) =&gt; any ? P : never;</code></pre>" +
              "<p><b>Pick or Omit?</b></p>" +
              "<p>They express the same idea from opposite ends, and the choice is about what happens when <code>T</code> gains a field later.</p>" +
              "<ul>" +
              "<li><code>Pick</code> is an <b>allowlist</b>. New fields on <code>T</code> are excluded by default. Choose it when the result is a public contract &mdash; an API response, a DTO &mdash; and accidentally leaking a newly added field would be a bug.</li>" +
              "<li><code>Omit</code> is a <b>denylist</b>. New fields on <code>T</code> flow through automatically. Choose it when the result is \"<code>T</code> minus a couple of things\", such as <code>Omit&lt;User, \"id\"&gt;</code> for a creation payload.</li>" +
              "<li>Rule of thumb: if you are removing more than about half the keys, you wanted <code>Pick</code>.</li>" +
              "</ul>" +
              "<p><b>The Omit pitfall: it does not distribute over unions</b></p>" +
              "<p>This is the one that costs people an afternoon. <code>Omit</code> is defined via <code>Pick&lt;T, ...&gt;</code>, and <code>Pick</code> is a mapped type over a <i>single</i> object type. Hand it a union and <code>keyof T</code> collapses to the keys common to <b>all</b> members &mdash; the union is flattened into one object and the variants are lost:</p>" +
              "<pre><code>type Shape =\n  | { kind: \"circle\"; radius: number }\n  | { kind: \"square\"; side: number };\n\ntype Bad = Omit&lt;Shape, \"kind\"&gt;;\n// {} — radius and side are both gone, because\n// keyof Shape is just \"kind\"</code></pre>" +
              "<p>The fix is to force distribution yourself with a distributive conditional type, which splits the union before <code>Omit</code> ever sees it:</p>" +
              "<pre><code>type DistributiveOmit&lt;T, K extends keyof any&gt; =\n  T extends any ? Omit&lt;T, K&gt; : never;\n\ntype Good = DistributiveOmit&lt;Shape, \"kind\"&gt;;\n// { radius: number } | { side: number }</code></pre>" +
              "<p>The same trap applies to <code>Partial</code>, <code>Pick</code>, and any other mapped type applied to a union. If a utility seems to have eaten your union members, this is why.</p>",
        why: "Utility types keep derived types honest: <code>Omit&lt;User, \"password\"&gt;</code> tracks <code>User</code> forever, while a hand-copied interface silently drifts the first time someone adds a field. Because they are ordinary mapped and conditional types, understanding their definitions teaches you to write your own domain-specific transforms. And knowing which ones distribute over unions &mdash; and which quietly do not &mdash; is what separates a type that works from one that mysteriously returns <code>{}</code>.",
        apply: [
          "Derive types from a single source of truth &mdash; <code>Omit&lt;User, \"id\"&gt;</code> beats a second hand-written interface.",
          "Pick <code>Pick&lt;&gt;</code> for public contracts (allowlist) and <code>Omit&lt;&gt;</code> for \"<code>T</code> minus a field\" (denylist).",
          "Reach for <code>DistributiveOmit</code> whenever the input might be a union &mdash; plain <code>Omit</code> flattens it.",
          "Read the definitions in <code>lib.es5.d.ts</code> once; they are short, and they teach mapped and conditional types better than any tutorial."
        ],
        code: `interface User { id: string; name: string; password: string }\n\ntype PublicUser = Omit<User, "password">;   // { id: string; name: string }\ntype NewUser = Omit<User, "id">;            // creation payload\ntype UserPatch = Partial<Pick<User, "name">>; // { name?: string }\n\ndeclare function load(id: string): Promise<User>;\ntype Loaded = Awaited<ReturnType<typeof load>>; // User`,
        related: ["mapped-types", "conditional-types", "keyof-typeof", "generic-constraints"]
      },
      {
        id: "type-assertions",
        title: "Type Assertions & Non-null",
        lede: "A claim to the compiler that you know a value's type better than it does — checked by nobody.",
        what: "<p><code>value as T</code> is a <b>compile-time claim</b>, not a runtime cast. Nothing is checked, nothing is converted, and nothing survives compilation &mdash; the assertion is erased along with every other type. <code>const n = \"5\" as unknown as number</code> produces the string <code>\"5\"</code> at runtime, and <code>n.toFixed()</code> crashes.</p><p>TypeScript does apply one guard rail: it rejects assertions between types with no overlap. <code>\"hello\" as number</code> is an error. The escape hatch is the <b>double assertion</b>, <code>x as unknown as T</code>, which launders any type into any other by stopping at the top type in between. It works precisely because it defeats the only check there was, so treat every occurrence as a comment saying \"the compiler could not verify this and neither did I\".</p><p>The <b>non-null assertion</b> <code>x!</code> is a narrow special case: it removes <code>null</code> and <code>undefined</code> from a type and nothing else. <code>document.getElementById(\"root\")!</code> says the element exists. If it does not, you get a runtime <code>TypeError</code> at the next property access, not a friendly message.</p><p>There is an older <b>angle-bracket form</b>, <code>&lt;T&gt;value</code>, identical in meaning to <code>as T</code>. It is unusable in <code>.tsx</code> files because <code>&lt;T&gt;</code> is ambiguous with a JSX element, so <code>as</code> won and is the only form you should write today.</p><p>Assertions are legitimate when you hold information the compiler structurally cannot:</p><ul><li>Narrowing a validated <code>unknown</code> immediately after a real check.</li><li><code>as const</code> &mdash; a different operator entirely, which narrows rather than lies.</li><li>Satisfying a DOM API that returns a supertype: <code>e.target as HTMLInputElement</code>.</li><li>Building an object incrementally in a test factory.</li></ul><p>They are a smell when they paper over a modelling problem: asserting away a union you should have narrowed, or a <code>!</code> that admits your types say a value may be missing while your code assumes it is not. The fix is usually a type guard or a better type, not a louder claim.</p>",
        why: "An assertion moves the burden of proof from the compiler to you, and leaves no runtime trace that it happened. That is occasionally necessary at the edges of the type system, but every <code>as</code> is a place where a refactor can introduce a crash with no compile error to warn you. A codebase's <code>as</code> count is a decent proxy for how much of its type safety is real.",
        apply: [
          "Prefer a type guard or a validated <code>unknown</code> over <code>as</code> &mdash; a check narrows, an assertion only claims.",
          "Treat <code>as unknown as T</code> as a code review trigger; it defeats the only safety check <code>as</code> has.",
          "Use <code>!</code> only where an invariant genuinely holds, and prefer an explicit throw when the message would help.",
          "Always write <code>as T</code>, never <code>&lt;T&gt;x</code> &mdash; the angle-bracket form is ambiguous with JSX."
        ],
        code: `const raw: unknown = JSON.parse('{"id":"1"}');\n\nconst bad = raw as User;   // compiles; no check happens at runtime\n\nconst el = document.getElementById("root")!; // HTMLElement, not null — we promise\n\nconst n = "5" as unknown as number; // double assertion: still a string at runtime\nn.toFixed(); // TypeError — the compiler was told to look away`,
        related: ["satisfies", "type-guards", "any-unknown-never", "type-erasure"]
      },
      {
        id: "satisfies",
        title: "The satisfies Operator",
        lede: "Check a value against a type without widening it to that type — you keep the precise inference and get the check.",
        what: "<p><code>satisfies</code> arrived in TypeScript 4.9 to resolve a long-standing conflict: you want a value validated against a type, but you also want the specific type TypeScript inferred from the literal.</p><p>An <b>annotation widens</b>. Write <code>const config: Record&lt;string, string&gt; = { ... }</code> and every value is now just <code>string</code>; the keys are lost, and <code>config.host</code> is not even a known property. You bought the check by discarding what the compiler knew.</p><p><b><code>as</code> lies.</b> It asserts a relationship without verifying it, and it can silently accept an object missing required fields once you reach for a double assertion.</p><p><b><code>satisfies</code> checks and keeps.</b> The expression <code>expr satisfies T</code> verifies that <code>expr</code> is assignable to <code>T</code> &mdash; excess property checks and all &mdash; and then evaluates to <code>expr</code>'s own inferred type, untouched.</p><pre><code>const config = {\n  host: \"localhost\",\n  port: 8080,\n} satisfies Record&lt;string, string | number&gt;;\n\nconfig.host;   // string — a real, known key\nconfig.port;   // number — not widened to string | number\nconfig.hots;   // error: property does not exist</code></pre><p>Compare that to the annotated version, where <code>config.port</code> would be <code>string | number</code> and <code>config.hots</code> would be perfectly legal.</p><p>The pattern generalises to any place a literal carries information worth keeping: route tables, theme palettes, permission maps, plugin registries. You constrain the shape while keeping the keys and literal values precise enough to feed into <code>keyof typeof</code>.</p><p>Two notes. <code>satisfies</code> is erased at compile time like every other type construct. And it composes with <code>as const</code>: <code>{ ... } as const satisfies T</code> freezes the value to its narrowest literal type and <i>then</i> checks it against <code>T</code>.</p>",

<p><code>.tsx</code> = <b>TypeScript + JSX</b>.</p>

</ul>
<p>A real one: <code>llm-chat-ui/src/components/chat/composer.tsx</code>.</p>
