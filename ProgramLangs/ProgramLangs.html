          "<b>Coming from Java/Python, expect no shared state in Node workers</b> — design around <code>postMessage</code>, not shared objects.",
          "<b>Don't create raw platform threads in a loop</b> — that is a pool's job; only virtual/JS-worker creation scales per-task."
        ],

          "java": "// Java 21 — in a method body\nThread t = new Thread(() ->\n    System.out.println(\"hi from \" + Thread.currentThread()));\nt.start();\nt.join(); // wait for it\n\n// virtual thread — same API, cheap enough to make millions\nThread v = Thread.ofVirtual().start(() ->\n    System.out.println(\"hi virtual\"));\nv.join();",
          "python": "import threading\n\ndef work() -> None:\n    print(f\"hi from {threading.current_thread().name}\")\n\nt = threading.Thread(target=work)\nt.start()\nt.join()  # daemon=True threads die with the process",

      {
        "id": "thread-pools",
        "title": "Thread Pools & Executors",
        "lede": "Java has rich Executors, Python has concurrent.futures with a process variant, Node ships no pool at all.",
        "what": "<p>Creating a thread per task is wasteful and unbounded. A pool reuses a fixed set of workers and queues excess work, letting you cap concurrency and reuse expensive threads. The three differ sharply in what the standard library gives you.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Fixed pool</td><td><code>newFixedThreadPool(n)</code></td><td><code>ThreadPoolExecutor</code></td><td>none (roll your own)</td></tr><tr><td>CPU parallel</td><td>any thread pool</td><td><code>ProcessPoolExecutor</code></td><td>Piscina / worker_threads</td></tr><tr><td>Per-task threads</td><td><code>newVirtualThreadPerTaskExecutor()</code></td><td>none</td><td>none</td></tr><tr><td>Submit</td><td><code>submit()</code>, <code>invokeAll()</code></td><td><code>submit()</code>, <code>map()</code></td><td>hand-written</td></tr><tr><td>Result handle</td><td><code>Future</code></td><td><code>Future</code></td><td><code>Promise</code></td></tr></tbody></table><p>Java's <code>Executors</code> factory is the richest: fixed, cached, scheduled, and — since 21 — <code>newVirtualThreadPerTaskExecutor()</code>, which does not pool at all but spawns a virtual thread per task. <code>ExecutorService</code> is <code>AutoCloseable</code>, so try-with-resources awaits termination on close.</p><p>Python's <code>concurrent.futures</code> gives two interchangeable pools with the same API: <code>ThreadPoolExecutor</code> for I/O-bound work (threads overlap during blocking calls despite the GIL) and <code>ProcessPoolExecutor</code> for CPU-bound work (separate interpreters, no shared GIL, at the cost of pickling arguments across the process boundary).</p><p>Node ships <b>no</b> thread pool in its standard library. For I/O you rarely need one — the event loop already interleaves thousands of pending operations. For CPU parallelism you reach for a library like Piscina or hand-roll a bounded runner over <code>worker_threads</code>. The sizing rule is the same everywhere: roughly one worker per core for CPU-bound work, many more for I/O-bound.</p><p>Java also exposes a subtlety the others hide: a fixed pool has an internal task queue, and pairing a <i>bounded</i> queue with a saturation policy lets the pool reject work via <code>RejectedExecutionException</code> instead of growing without limit. An unbounded queue silently absorbs backpressure and can exhaust memory under load. Right-sizing therefore means sizing the queue as well as the worker count, and deciding what should happen when both are full — drop, block, or fail.</p>",
        "why": "Pool sizing is a common production incident. Sizing a thread pool by core count starves an I/O-bound service; sizing it huge for CPU work causes context-thrash. A Python engineer who picks <code>ThreadPoolExecutor</code> for number-crunching gets no speedup at all because of the GIL and must switch to <code>ProcessPoolExecutor</code>. A Node engineer expecting a stdlib pool finds none and must reach outside it.",
        "apply": [
          "<b>Size by workload:</b> CPU-bound ≈ core count; I/O-bound can be far larger, or use virtual threads/async and stop sizing.",
          "<b>In Python, pick the pool by bottleneck</b> — <code>ThreadPoolExecutor</code> for I/O, <code>ProcessPoolExecutor</code> for CPU.",
          "<b>Coming from Java, expect no stdlib pool in Node</b> — use Promise concurrency for I/O and a worker library for CPU.",
          "<b>Prefer <code>newVirtualThreadPerTaskExecutor()</code> in Java 21</b> for blocking tasks instead of tuning a fixed pool size."
        ],

          "python": "from concurrent.futures import ProcessPoolExecutor\n\ndef square(n: int) -> int:\n    return n * n\n\nif __name__ == \"__main__\":\n    # processes sidestep the GIL for CPU-bound work\n    with ProcessPoolExecutor(max_workers=4) as pool:\n        for r in pool.map(square, range(1, 5)):\n            print(r)",
          "ts": "// No stdlib thread pool — bound concurrency by hand\nasync function pool<T>(\n  items: number[], limit: number, fn: (n: number) => Promise<T>,\n) {\n  const out: T[] = [];\n  const q = [...items];\n  const run = async () => {\n    let n: number | undefined;\n    while ((n = q.shift()) !== undefined) out.push(await fn(n));\n  };\n  await Promise.all(Array.from({ length: limit }, run));\n  return out;\n}\nconsole.log(await pool([1, 2, 3, 4], 2, async (n) => n * n));"
        },

        "title": "Async / Await",
        "lede": "Java has no async/await, Python and TS both use async def/await but only TS is always single-threaded.",
        "what": "<p><code>async</code>/<code>await</code> is syntax for writing non-blocking code that reads like sequential code. But \"async\" names a different mechanism in each language, and Java does not have the keywords at all.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Keywords</td><td>none</td><td><code>async def</code> / <code>await</code></td><td><code>async</code> / <code>await</code></td></tr><tr><td>Runs on</td><td>any thread</td><td>event loop</td><td>event loop</td></tr><tr><td>Await parks</td><td>the (virtual) thread</td><td>the coroutine</td><td>the coroutine</td></tr><tr><td>Function colour</td><td>uncoloured</td><td>coloured</td><td>coloured</td></tr><tr><td>Underlying</td><td><code>CompletableFuture</code></td><td>coroutine</td><td><code>Promise</code></td></tr></tbody></table><p>Java made a deliberate bet: rather than add keywords, Java 21 makes blocking cheap with virtual threads. You write ordinary blocking calls and the runtime parks the virtual thread at the blocking point. For explicit composition there is <code>CompletableFuture</code> with <code>thenApply</code>/<code>thenCompose</code>. The upside is no <i>function colouring</i>: any method can call any other, blocking or not.</p><p>Python and TypeScript both colour functions. An <code>async</code> function returns a coroutine or <code>Promise</code>; to get its value you must be inside another <code>async</code> function and <code>await</code> it. <code>await</code> does not block a thread — it yields control back to the single event loop, which runs other ready tasks until this one's awaited operation completes.</p><p>The trap in both is that <code>await</code> is a scheduling point: while one coroutine is parked, another can run and mutate shared state. And a coloured function is contagious — making one function <code>async</code> forces every caller up the chain to be <code>async</code> too, or to bridge with <code>asyncio.run</code> / a top-level <code>await</code>. Java's virtual threads exist precisely to avoid that whole-program contagion.</p><p>Neither coloured model gives parallelism by itself. Ten <code>await</code>ed network calls overlap because the loop switches between them while each waits, but ten CPU-bound coroutines still run strictly one after another — <code>await</code> only yields at I/O, never mid-computation. To use more than one core you place threads, processes, or workers <i>underneath</i> the async layer; async is about not wasting a thread while waiting, not about having more of them.</p>",
        "why": "Engineers moving to Python or TS hit the colouring wall: a deep helper needs one <code>await</code> and suddenly the whole call stack must go async, or you deadlock by blocking the loop. Java engineers should not go looking for <code>await</code> — the idiomatic answer in 21 is a virtual thread doing plain blocking I/O. Confusing the two models leads to blocking the event loop, the classic async performance bug.",
        "apply": [
          "<b>Never block the event loop</b> in Python/TS — no <code>time.sleep</code> or sync file reads inside an <code>async</code> function; use the async variant.",
          "<b>Coming from Python/TS, don't hunt for async in Java</b> — use virtual threads and write straight-line blocking code.",
          "<b>Treat every <code>await</code> as an interleaving point</b> — shared state can change across it.",
          "<b>Bridge sync and async explicitly</b> — <code>asyncio.run()</code> at the top in Python; do not call <code>await</code> from sync code."
        ],

      {
        "id": "futures-promises",
        "title": "Futures & Promises",
        "lede": "All three have a handle to a pending result, but a JS Promise runs eagerly while a Future often wraps submitted work.",
        "what": "<p>A future or promise is a handle to a value that is not ready yet. You get it back immediately and either wait on it, chain a callback, or combine it with others. The semantics — especially <i>when</i> the underlying work starts — differ in ways that bite.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Type</td><td><code>CompletableFuture</code></td><td><code>Future</code> / <code>asyncio.Future</code></td><td><code>Promise</code></td></tr><tr><td>Starts when</td><td>submitted</td><td>submitted / task created</td><td>constructed (eager)</td></tr><tr><td>Chain</td><td><code>thenApply</code>/<code>thenCompose</code></td><td><code>await</code> / callback</td><td><code>.then()</code></td></tr><tr><td>Wait all</td><td><code>allOf</code></td><td><code>gather</code> / <code>as_completed</code></td><td><code>Promise.all</code></td></tr><tr><td>First done</td><td><code>anyOf</code></td><td><code>wait(FIRST_COMPLETED)</code></td><td><code>Promise.race</code></td></tr></tbody></table><p>A JavaScript <code>Promise</code> is <b>eager</b>: the executor runs the moment you construct it, so the work is already in flight before you <code>await</code>. There is no way to make a Promise lazy. That is why <code>Promise.all([a, b])</code> runs <code>a</code> and <code>b</code> concurrently — both started when created; <code>all</code> only joins them.</p><p>Java's plain <code>Future</code> is just a read handle on work you already submitted to an executor. <code>CompletableFuture</code> adds composition — <code>thenApply</code> transforms the value, <code>thenCompose</code> flattens a future-returning step (Java's <code>flatMap</code>), and <code>allOf</code>/<code>anyOf</code> combine several. It completes on whatever thread ran the stage.</p><p>Python has two future types. <code>concurrent.futures.Future</code> is returned by executor <code>submit()</code>; <code>asyncio.Future</code> lives on the event loop and is what <code>await</code> consumes. A coroutine does not start until you <code>await</code> it or wrap it in a task via <code>create_task</code> — the opposite of a Promise. Wrapping in <code>gather</code> schedules them concurrently and returns results in argument order.</p><p>Failure propagates along the chain rather than at the call site. A rejected Promise skips <code>.then</code> handlers until a <code>.catch</code>; a failed <code>CompletableFuture</code> stage short-circuits later stages and surfaces as a <code>CompletionException</code> from <code>join</code>; an exception in an asyncio task is stored and re-raised when awaited. The classic leak in all three is the unobserved failure — an orphaned rejected Promise or a never-awaited task can swallow the error entirely and pass silently.</p>",
        "why": "The eager/lazy split causes real bugs. A JS developer assumes a Promise is already running and fires two off before awaiting; a Python developer copying that pattern with bare coroutines runs them one after another, because a coroutine is inert until awaited or turned into a task. Getting this wrong turns intended-concurrent I/O into accidental sequential I/O and doubles latency.",
        "apply": [
          "<b>In JS, construct-then-await for concurrency:</b> create both Promises, then <code>Promise.all</code> — awaiting each in turn serialises them.",
          "<b>In Python, wrap coroutines in <code>gather</code> or <code>create_task</code></b> to run them concurrently — a bare coroutine is lazy.",
          "<b>Coming from JS, expect Java <code>thenCompose</code></b> where you would flat-chain <code>.then()</code> that returns a Promise.",
          "<b>Use the right combinator:</b> <code>allOf</code>/<code>gather</code>/<code>all</code> for all, <code>anyOf</code>/<code>race</code> for the first."
        ],
        "code3": {
          "java": "// in a method body — Java 21\nCompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 20);\nCompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 22);\n\n// both already running; combine once each completes\nCompletableFuture<Integer> sum = a.thenCombine(b, Integer::sum);\n\n// thenCompose flattens a future-returning step (flatMap)\nCompletableFuture<Integer> result =\n    sum.thenCompose(s -> CompletableFuture.supplyAsync(() -> s));\nSystem.out.println(result.join()); // 42",
          "python": "import asyncio\n\nasync def val(n: int) -> int:\n    await asyncio.sleep(0)\n    return n\n\nasync def main() -> None:\n    # gather schedules both concurrently\n    a, b = await asyncio.gather(val(20), val(22))\n    print(a + b)  # 42\n\nasyncio.run(main())",
          "ts": "const val = (n: number): Promise<number> => Promise.resolve(n);\n\n// Promises are eager — the work starts on construction\nconst pa = val(20);\nconst pb = val(22);\n\n// all() only joins them; it did not start them\nconst [a, b] = await Promise.all([pa, pb]);\nconsole.log(a + b); // 42"
        },

      {
        "id": "locks-synchronization",
        "title": "Locks & Synchronization",
        "lede": "Java needs locks and a memory model, Python still needs them despite the GIL, JS needs none for in-memory state.",
        "what": "<p>When two lines of execution touch the same data, you need rules for who wins and when writes become visible. How much machinery that takes depends entirely on the concurrency model.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Mutex</td><td><code>synchronized</code>, <code>ReentrantLock</code></td><td><code>threading.Lock</code>, <code>RLock</code></td><td>none needed</td></tr><tr><td>Atomics</td><td><code>AtomicInteger</code></td><td>none (GIL ≠ atomic)</td><td>n/a</td></tr><tr><td>Visibility</td><td><code>volatile</code>, happens-before</td><td>not an issue (GIL)</td><td>n/a (one thread)</td></tr><tr><td>Race window</td><td>any interleaving</td><td>any bytecode boundary</td><td>only across <code>await</code></td></tr><tr><td>Data races</td><td>real</td><td>real</td><td>impossible</td></tr></tbody></table><p>Java has the hardest job. Threads run in parallel and each may cache values, so besides mutual exclusion (<code>synchronized</code>, <code>ReentrantLock</code>) you need <i>visibility</i> guarantees. The Java Memory Model defines <b>happens-before</b>: <code>volatile</code> reads/writes and lock acquire/release establish ordering so one thread's writes are seen by another. <code>AtomicInteger</code> gives lock-free atomic updates like <code>incrementAndGet()</code>.</p><p>Python's GIL is the great deceiver. It guarantees a single bytecode executes at a time, so people assume <code>counter += 1</code> is safe. It is not: that statement is three bytecodes (load, add, store) and a thread switch can land between them, losing an update. You still need a <code>threading.Lock</code>. The GIL removes visibility problems, not atomicity.</p><p>JavaScript needs no locks for in-memory state because nothing preempts a running function — a synchronous block runs to completion. The subtlety is that <code>await</code> is a yield point: between the two halves of an <code>async</code> function, other tasks run and can change what you read before and after. That is an interleaving bug, not a data race, and no lock is required — though a mutex over an async critical section is occasionally useful.</p><p>The failure modes scale with the machinery. Java's locks bring the full deadlock and livelock hazard the moment two are acquired in inconsistent order; asyncio's interleaving bugs are subtler but easier to reproduce, because scheduling only switches at <code>await</code> and is otherwise deterministic. That gap in hazard is a large part of why immutable data and message passing are increasingly preferred over shared-mutable-state-plus-lock across all three languages.</p>",
        "why": "The Python <code>+=</code> myth is a genuine bug source: code that passes on one machine drops increments under load because the GIL was mistaken for atomicity. A Java engineer arriving in JS wastes effort adding locks that do nothing; a JS engineer arriving in Java ships lost updates and stale reads by ignoring the memory model. Each model demands a different reflex.",
        "apply": [
          "<b>In Python, lock compound updates</b> — <code>+=</code>, check-then-act, and read-modify-write are not atomic despite the GIL.",
          "<b>In Java, remember visibility, not just mutual exclusion</b> — use <code>volatile</code>/atomics or a lock, or writes may never be seen.",
          "<b>Coming from Java, drop the locks in JS</b> — synchronous code never interleaves; only guard state across <code>await</code>.",
          "<b>Prefer atomics or immutability</b> to hand-rolled locking where the operation fits — fewer deadlocks, clearer intent."
        ],
        "code3": {
          "java": "// in a method body\nAtomicInteger counter = new AtomicInteger();\nRunnable inc = () -> {\n    for (int i = 0; i < 100_000; i++) counter.incrementAndGet();\n};\nThread t1 = new Thread(inc), t2 = new Thread(inc);\nt1.start(); t2.start();\nt1.join(); t2.join();\nSystem.out.println(counter.get()); // 200000 — atomic, no lock",
          "python": "import threading\n\ncounter = 0\nlock = threading.Lock()\n\ndef inc() -> None:\n    global counter\n    for _ in range(100_000):\n        with lock:      # GIL does NOT make += atomic\n            counter += 1\n\nts = [threading.Thread(target=inc) for _ in range(2)]\nfor t in ts: t.start()\nfor t in ts: t.join()\nprint(counter)  # 200000 only because of the lock",
          "ts": "// One thread: no lock exists or is needed for memory\nlet counter = 0;\nconst inc = () => {\n  for (let i = 0; i < 100_000; i++) counter += 1;\n};\ninc();\ninc(); // runs to completion — never interleaved mid-loop\nconsole.log(counter); // 200000, deterministically"
        },
        "related": [
          "concurrency-model",
          "creating-threads",
          "queues-producer-consumer",
          "memory-gc",
          "constants-immutability"
        ]

      {
        "id": "queues-producer-consumer",
        "title": "Queues & Producer/Consumer",
        "lede": "Java and Python ship blocking queues for hand-off between threads, JS has none and leans on async iteration.",
        "what": "<p>The producer/consumer pattern decouples work generation from work processing through a shared queue. The queue's blocking behaviour is what provides <i>backpressure</i>: a slow consumer forces a fast producer to wait rather than exhaust memory.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Thread queue</td><td><code>BlockingQueue</code></td><td><code>queue.Queue</code></td><td>none (build it)</td></tr><tr><td>Bounded</td><td><code>ArrayBlockingQueue(n)</code></td><td><code>Queue(maxsize=n)</code></td><td><code>highWaterMark</code> (streams)</td></tr><tr><td>Async queue</td><td>n/a</td><td><code>asyncio.Queue</code></td><td>async generator</td></tr><tr><td>Block full/empty</td><td><code>put</code>/<code>take</code></td><td><code>put</code>/<code>get</code></td><td>pull-based await</td></tr><tr><td>Signal end</td><td>poison pill</td><td>poison pill / <code>task_done</code></td><td><code>return</code>/close</td></tr></tbody></table><p>Java's <code>BlockingQueue</code> (commonly <code>ArrayBlockingQueue</code> for a bounded buffer) is the canonical hand-off between threads: <code>put</code> blocks when full, <code>take</code> blocks when empty, and both are thread-safe. To end the stream you enqueue a sentinel — a <i>poison pill</i> — that each consumer recognises and stops on.</p><p>Python offers <code>queue.Queue</code> for threads (same blocking <code>put</code>/<code>get</code>, with <code>maxsize</code> for backpressure) and <code>asyncio.Queue</code> for coroutines, whose <code>put</code>/<code>get</code> are awaitable rather than blocking. The poison-pill idiom carries over.</p><p>JavaScript has no built-in concurrent queue, and mostly does not need one. The idiomatic producer/consumer is an <b>async generator</b>: the consumer pulls the next value with <code>for await</code>, and the producer is suspended until then. This is pull-based backpressure with no explicit buffer and no poison pill — the generator simply <code>return</code>s to signal completion. Node streams generalise this with a <code>highWaterMark</code> buffer for the byte/object case.</p><p>Scaling to several consumers changes the shutdown handshake. With N worker threads draining one queue you must enqueue N poison pills — one per worker — or some workers block forever on an empty queue. Python's <code>queue.Queue</code> offers an alternative in <code>task_done()</code> and <code>join()</code>: producers call <code>join()</code> to wait until every enqueued item has been marked processed, decoupling completion from any sentinel value at all.</p>",
        "why": "Skipping backpressure is how services fall over: an unbounded queue papers over a slow consumer until memory runs out under load. Java and Python engineers get bounding for free by setting a capacity; a Node engineer must remember that a plain array as a queue has no backpressure at all, and reach for async iteration or streams to get pull-based flow control.",
        "apply": [
          "<b>Always bound the queue</b> — set <code>ArrayBlockingQueue</code> capacity or <code>maxsize</code> so a slow consumer applies backpressure.",
          "<b>Use a poison pill to end thread-based streams</b> — enqueue one sentinel per consumer so each one exits cleanly.",
          "<b>Coming from Java/Python, reach for async generators in JS</b> — <code>for await…of</code> gives pull-based backpressure without a queue type.",
          "<b>Match queue to model:</b> <code>queue.Queue</code> for threads, <code>asyncio.Queue</code> for coroutines — they are not interchangeable."
        ],
        "code3": {
          "java": "// in a method body\nBlockingQueue<Integer> q = new ArrayBlockingQueue<>(8);\nThread producer = new Thread(() -> {\n    try {\n        for (int i = 1; i <= 3; i++) q.put(i); // blocks if full\n        q.put(-1);                              // poison pill\n    } catch (InterruptedException e) {\n        Thread.currentThread().interrupt();\n    }\n});\nproducer.start();\nint x;\nwhile ((x = q.take()) != -1) System.out.println(x); // blocks if empty",
          "python": "import queue, threading\n\nq: queue.Queue[int] = queue.Queue(maxsize=8)\n\ndef produce() -> None:\n    for i in range(1, 4):\n        q.put(i)   # blocks if full\n    q.put(-1)      # poison pill\n\nthreading.Thread(target=produce).start()\nwhile (x := q.get()) != -1:  # blocks if empty\n    print(x)",
          "ts": "// No stdlib queue — an async generator gives backpressure\nasync function* produce(): AsyncGenerator<number> {\n  for (let i = 1; i <= 3; i++) yield i; // waits until pulled\n}\n\nfor await (const x of produce()) {\n  console.log(x); // pull-based: no buffer, no poison pill\n}"
        },

      {
        "id": "cancellation-timeouts",
        "title": "Cancellation & Timeouts",
        "lede": "Cancellation is cooperative in all three — you cannot kill a thread; you signal it and it must check.",
        "what": "<p>Stopping in-flight work is never a hard kill. Every model here is <b>cooperative</b>: you raise a flag, throw an exception, or fire a signal, and the target must reach a checkpoint and honour it. A timeout is just cancellation on a timer.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Cancel</td><td><code>Future.cancel</code>, <code>interrupt()</code></td><td><code>task.cancel()</code></td><td><code>AbortController.abort()</code></td></tr><tr><td>Timeout</td><td><code>future.get(t, unit)</code></td><td><code>asyncio.wait_for</code></td><td><code>Promise.race</code> + timer</td></tr><tr><td>Delivered as</td><td>interrupt flag / <code>InterruptedException</code></td><td><code>CancelledError</code></td><td><code>AbortSignal</code> + reject</td></tr><tr><td>Force-kill</td><td>no</td><td>no (threads can't be killed)</td><td>n/a (one thread)</td></tr><tr><td>Structured</td><td><code>StructuredTaskScope</code> (preview)</td><td><code>asyncio.TaskGroup</code></td><td>none</td></tr></tbody></table><p>In Java, <code>Thread.interrupt()</code> sets a flag; blocking calls like <code>sleep</code>, <code>take</code>, or <code>join</code> throw <code>InterruptedException</code>, and compute-only loops must poll <code>Thread.interrupted()</code>. <code>Future.cancel(true)</code> interrupts the running thread. A busy loop that never checks cannot be stopped. Structured concurrency (<code>StructuredTaskScope</code>, preview) ties subtask lifetimes to a scope so one failure cancels siblings.</p><p>Python's asyncio cancels a task by scheduling a <code>CancelledError</code> to raise at its next <code>await</code>. <code>asyncio.wait_for(coro, timeout)</code> wraps that as a timeout, raising <code>TimeoutError</code> to the caller. Plain threads, though, cannot be cancelled at all — there is no API to kill one; it must watch a flag itself.</p><p>JavaScript standardised on <code>AbortController</code>: you pass its <code>signal</code> into an operation (<code>fetch</code>, timers, streams) and call <code>abort()</code> to reject the pending Promise with the signal's reason. A timeout is <code>AbortSignal.timeout(ms)</code>, or racing the work against a timer with <code>Promise.race</code>. As always, the operation only stops if it was written to observe the signal.</p><p>Cleanup is the other half of cancellation. Because the stop arrives as an exception or an interrupt at a checkpoint, resources opened before it must be released in a <code>finally</code> block — asyncio guarantees the <code>CancelledError</code> unwinds through <code>finally</code>, and Java's interrupt does the same for try-with-resources. Swallowing the signal to \"finish anyway\" both defeats the timeout's intent and can hang shutdown, so the discipline everywhere is the same: clean up, then propagate.</p>",
        "why": "The shared lesson trips people repeatedly: a tight CPU loop that never hits a checkpoint ignores every cancellation mechanism in all three languages. Java engineers must design interrupt points; asyncio engineers must not swallow <code>CancelledError</code> (catching it broadly breaks timeouts and shutdown); Node engineers must actually thread the <code>AbortSignal</code> through, or <code>abort()</code> does nothing.",
        "apply": [
          "<b>Design cancellation checkpoints</b> — poll the interrupt flag / let <code>await</code> points exist; unbroken compute loops are uncancellable.",
          "<b>In asyncio, never swallow <code>CancelledError</code></b> — re-raise after cleanup, or you defeat timeouts and shutdown.",
          "<b>Coming from Java/Python, thread the <code>AbortSignal</code> through in JS</b> — pass <code>signal</code> into every op you want cancellable.",
          "<b>Prefer structured concurrency</b> — <code>asyncio.TaskGroup</code> or Java's <code>StructuredTaskScope</code> to cancel siblings on failure."
        ],
        "code3": {
          "java": "// in a method body\nExecutorService ex = Executors.newSingleThreadExecutor();\nFuture<Integer> f = ex.submit(() -> { Thread.sleep(1000); return 42; });\ntry {\n    System.out.println(f.get(100, TimeUnit.MILLISECONDS));\n} catch (TimeoutException e) {\n    f.cancel(true); // interrupts the thread — it must cooperate\n}\nex.shutdown();",
          "python": "import asyncio\n\nasync def slow() -> int:\n    await asyncio.sleep(1)\n    return 42\n\nasync def main() -> None:\n    try:\n        await asyncio.wait_for(slow(), timeout=0.1)\n    except asyncio.TimeoutError:\n        print(\"cancelled\")  # CancelledError raised inside slow()\n\nasyncio.run(main())",
          "ts": "const slow = (signal: AbortSignal): Promise<number> =>\n  new Promise((resolve, reject) => {\n    const id = setTimeout(() => resolve(42), 1000);\n    signal.addEventListener(\"abort\", () => {\n      clearTimeout(id);\n      reject(signal.reason);\n    });\n  });\n\nconst ac = new AbortController();\nsetTimeout(() => ac.abort(new Error(\"timeout\")), 100);\ntry { await slow(ac.signal); } catch { console.log(\"cancelled\"); }"
        },

        "title": "Console I/O",
        "lede": "All three give you stdin, stdout and argv, then disagree on flushing, on the end-of-input signal, and on where argument zero lives.",
        "what": "<p>Every process gets three streams — stdin, stdout, stderr — and an argument vector. The three languages expose all four. They disagree on whether a read blocks, when a write is flushed, and where the user's first argument sits.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Write a line</td><td><code>System.out.println</code></td><td><code>print()</code></td><td><code>console.log</code></td></tr><tr><td>Formatted write</td><td><code>System.out.printf</code></td><td><code>print(f\"…\")</code></td><td><code>console.log(`…`)</code></td></tr><tr><td>Read a line</td><td><code>BufferedReader.readLine</code></td><td><code>input()</code></td><td><code>await rl.question()</code></td></tr><tr><td>End of input</td><td>returns <code>null</code></td><td><code>EOFError</code></td><td><code>'close'</code> event</td></tr><tr><td>First user arg</td><td><code>args[0]</code></td><td><code>sys.argv[1]</code></td><td><code>process.argv[2]</code></td></tr><tr><td>Prompt, no newline</td><td>needs <code>flush()</code></td><td>flushed by <code>input()</code></td><td><code>process.stdout.write</code></td></tr></tbody></table><p>Java's <code>System.out</code> is a <code>PrintStream</code> over an 8 KiB <code>BufferedOutputStream</code> with autoflush enabled — and autoflush means <i>flush when a newline goes through</i>, nothing more. <code>System.out.print(\"name: \")</code> therefore sits in the buffer, and the prompt appears only once something else emits a newline. Python inverts the problem: stdout is line-buffered when attached to a terminal and block-buffered when attached to a pipe, so a script that behaves interactively goes silent under <code>tee</code> or in a container log. <code>print(…, flush=True)</code>, <code>python -u</code> or <code>PYTHONUNBUFFERED=1</code> is the fix.</p><p>Node cannot block. <code>process.stdin</code> is a <code>Readable</code> that pushes bytes at you through events, so the read-a-line-then-continue shape has to be rebuilt from promises — that is what <code>node:readline/promises</code> is for. Writes mirror it: <code>process.stdout</code> is synchronous to a file and to a POSIX terminal, but asynchronous to a pipe, which is why queued output can be lost if the process calls <code>process.exit()</code> while bytes are still in flight.</p><p>The argument vector is off by one in every direction. Java strips the class name, so <code>args[0]</code> is the user's first argument and an empty array is the normal no-args case. Python puts the script path at <code>sys.argv[0]</code>. Node puts the interpreter at <code>process.argv[0]</code> and the script at <code>[1]</code>, so user arguments start at <code>[2]</code>. Porting the index unchanged is the most common bug in this group.</p><p>Java alone has a first-class answer for secrets: <code>System.console().readPassword()</code> suppresses echo. Python needs <code>getpass</code>; Node needs manual raw-mode handling.</p><pre><code data-lang=\"python\">import sys\nprint(\"progress\")                            # invisible under `python app.py | tee log`\nprint(\"progress\", flush=True)                # or -u, or PYTHONUNBUFFERED=1\nsys.stdout.reconfigure(line_buffering=True)  # 3.7+, fix the stream once at startup</code></pre>",
        "why": "Porting a CLI between these three breaks in three predictable places: the argv index shifts, the prompt stops appearing because the buffering rule changed, and end-of-input turns from a null return into an exception into an event. None of them fail loudly — the program runs and does the wrong thing. The buffering one only shows up once output is redirected, which is usually in production.",
        "apply": [
          "<b>Re-index argv on every port</b> — <code>args[0]</code> in Java, <code>sys.argv[1]</code> in Python, <code>process.argv[2]</code> in Node; the offsets are all different.",
          "<b>Flush bare prompts in Java</b> — <code>System.out.print</code> autoflushes only on a newline, so an unterminated prompt needs an explicit <code>System.out.flush()</code>.",
          "<b>Coming from Java or Python, expect no blocking read in Node</b> — use <code>node:readline/promises</code> rather than trying to drain <code>process.stdin</code> synchronously.",
          "<b>Force flushing for piped Python</b> — set <code>flush=True</code> or <code>PYTHONUNBUFFERED=1</code> before block buffering swallows progress output in a container log."
        ],

          "java": "import java.io.BufferedReader;\nimport java.io.InputStreamReader;\n\npublic class Greet {                                  // run: java Greet.java Hi\n    public static void main(String[] args) throws Exception {\n        // args[0] is the FIRST user arg — the class name is not in args\n        String greeting = args.length > 0 ? args[0] : \"Hello\";\n\n        var in = new BufferedReader(new InputStreamReader(System.in));\n        System.out.print(\"name: \");                   // no newline → no autoflush\n        System.out.flush();                           // so flush by hand\n        String line = in.readLine();                  // null at EOF, not \"\"\n\n        String name = (line == null || line.isEmpty()) ? \"world\" : line;\n        System.out.printf(\"%s, %s!%n\", greeting, name);\n    }\n}",

      {
        "id": "file-read-write",
        "title": "Reading & Writing Files",
        "lede": "Slurping a file is a one-liner in all three; the default text encoding is not the same in any two of them.",
        "what": "<p>Reading a file is two decisions: whole-file or streaming, and bytes or text. The whole-file call is a one-liner everywhere. The bytes-to-text step is where the three part company, because each picked a different default and fixed it at a different time.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Read whole file</td><td><code>Files.readString(p)</code></td><td><code>p.read_text()</code></td><td><code>await readFile(p, \"utf8\")</code></td></tr><tr><td>Write whole file</td><td><code>Files.writeString</code></td><td><code>p.write_text</code></td><td><code>await writeFile</code></td></tr><tr><td>Iterate lines</td><td><code>Files.lines(p)</code></td><td><code>for line in f</code></td><td><code>readline</code> over a stream</td></tr><tr><td>Default encoding</td><td>UTF-8 since 18</td><td>locale, UTF-8 from 3.15</td><td>none → <code>Buffer</code></td></tr><tr><td>Blocking</td><td>yes</td><td>yes</td><td><code>readFileSync</code> stalls the loop</td></tr></tbody></table><p>Java made UTF-8 the default charset only in Java 18, via JEP 400. Before that <code>new FileReader(f)</code> and <code>Files.readAllLines(p)</code> used the platform default — UTF-8 on a Linux build agent, windows-1252 on a developer laptop — so identical code produced different bytes on different machines and the bug surfaced as mojibake in someone else's file. Because old code depended on that behaviour, the change was staged across releases with <code>-Dfile.encoding=COMPAT</code> as an escape hatch.</p><p>Python carries the same wound, still open. <code>open(p)</code> and <code>Path.read_text()</code> use <code>locale.getencoding()</code>: UTF-8 on most Linux and macOS installs, cp1252 on a stock Windows one. PEP 686 makes UTF-8 mode the default in 3.15; until your version floor is that high, an explicit <code>encoding=\"utf-8\"</code> on every text open is the only portable habit. Run with <code>-X warn_default_encoding</code> and each unqualified open raises an <code>EncodingWarning</code>, which is how you find them.</p><p>Node made a different choice: no default text encoding at all, so <code>readFile(p)</code> resolves to a <code>Buffer</code>. That is not an error, and in plain JavaScript it is not caught either — <code>buf + \"x\"</code> quietly stringifies the buffer. TypeScript does catch it, because the overload without an encoding is declared <code>Promise&lt;Buffer&gt;</code> and the one with <code>\"utf8\"</code> is declared <code>Promise&lt;string&gt;</code>. That is a rare case of the type system covering for a runtime default.</p><p>Whole-file reads have a ceiling in each. <code>Files.readString</code> throws <code>OutOfMemoryError</code> past roughly 2 GiB because arrays are int-indexed, Python will cheerfully exhaust RAM, and Node's <code>Buffer</code> stops at <code>buffer.constants.MAX_LENGTH</code>. Past a few megabytes, stream instead.</p><pre><code data-lang=\"java\">// any code that names no charset, on any JDK\nList&lt;String&gt; lines = Files.readAllLines(p);               // platform default before 18\nvar r = new BufferedReader(new FileReader(f));            // same trap, still no charset\n// explicit survives version and machine changes:\nList&lt;String&gt; ok = Files.readAllLines(p, StandardCharsets.UTF_8);</code></pre>",
        "why": "The encoding default is the difference that bites in production rather than in review. A Java service upgraded past 18 starts writing UTF-8 where it wrote cp1252; a Python script authored on macOS mangles accented text on Windows; a Node handler that forgot \"utf8\" concatenates a Buffer and gets something that looks almost right. All three are silent, and all three only misbehave on non-ASCII input — which fixtures rarely contain.",
        "apply": [
          "<b>Name the charset even when it is already the default</b> — <code>StandardCharsets.UTF_8</code>, <code>encoding=\"utf-8\"</code>, <code>\"utf8\"</code>; explicit code does not change meaning across versions or machines.",
          "<b>Coming from Java or Python, expect bytes from Node</b> — <code>readFile</code> without an encoding resolves to a <code>Buffer</code>, and only TypeScript will tell you.",
          "<b>Stream past a few megabytes</b> — <code>Files.lines</code>, iterate the file object, or run <code>readline</code> over a read stream instead of holding the whole file.",
          "<b>Close what holds a handle</b> — <code>Files.lines</code> returns a <code>Stream</code> that owns an open file; it belongs in try-with-resources, unlike every other <code>Stream</code>."
        ],
        "code3": {
          "java": "// in a method that throws IOException; imports: java.nio.file.Files, java.nio.file.Path\nPath in = Path.of(\"notes.txt\");\n\n// readString decodes as UTF-8 — the default charset since Java 18 (JEP 400)\nString text = Files.readString(in);\nlong count = text.lines().filter(s -> !s.isBlank()).count();\n\n// streaming instead: Files.lines returns a Stream that HOLDS the file open\ntry (var lines = Files.lines(in)) {\n    count = lines.filter(s -> !s.isBlank()).count();\n}\n\nFiles.writeString(Path.of(\"summary.txt\"), count + \" non-empty lines\\n\");\n// no charset argument needed now; before 18 this wrote the platform default",
          "python": "from pathlib import Path\n\nsrc = Path(\"notes.txt\")\n\n# encoding follows the locale, not UTF-8 — pass it explicitly before 3.15\ntext = src.read_text(encoding=\"utf-8\")\ncount = sum(1 for line in text.splitlines() if line.strip())\n\n# streaming instead: a file object is its own line iterator\nwith src.open(encoding=\"utf-8\") as f:\n    count = sum(1 for line in f if line.strip())\n\nPath(\"summary.txt\").write_text(f\"{count} non-empty lines\\n\", encoding=\"utf-8\")\n# PEP 686 makes UTF-8 the default in 3.15; -X warn_default_encoding finds the gaps",
          "ts": "// Node.js\nimport { readFile, writeFile } from \"node:fs/promises\";\nimport { createReadStream } from \"node:fs\";\nimport { createInterface } from \"node:readline\";\n\n// drop \"utf8\" and this resolves to a Buffer, not a string — typed, not thrown\nconst text = await readFile(\"notes.txt\", \"utf8\");\nlet count = text.split(\"\\n\").filter((l) => l.trim() !== \"\").length;\n\n// streaming instead: readline never holds the whole file in memory\ncount = 0;\nfor await (const line of createInterface({ input: createReadStream(\"notes.txt\") })) {\n  if (line.trim() !== \"\") count++;\n}\n\nawait writeFile(\"summary.txt\", `${count} non-empty lines\\n`, \"utf8\");\n// readFileSync is the sync twin — it blocks the one event-loop thread"

      {
        "id": "paths-filesystem",
        "title": "Paths & Filesystem",
        "lede": "Java made Path a type with the verbs moved to Files, Python made Path a type with the verbs attached, and Node left paths as strings.",
        "what": "<p>A path is a name, not a file. All three agree on that eventually, but they model it at three different levels, and the level decides how much help you get before the program runs.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Build a path</td><td><code>Path.of(\"a\", \"b\")</code></td><td><code>Path(\"a\") / \"b\"</code></td><td><code>join(\"a\", \"b\")</code></td></tr><tr><td>Static type</td><td><code>java.nio.file.Path</code></td><td><code>pathlib.Path</code></td><td><code>string</code></td></tr><tr><td>Where I/O lives</td><td><code>Files</code> statics</td><td>on the <code>Path</code> object</td><td><code>node:fs</code></td></tr><tr><td>Exists</td><td><code>Files.exists(p)</code></td><td><code>p.exists()</code></td><td><code>access()</code>, or just try</td></tr><tr><td>Recursive walk</td><td><code>Files.walk</code> → <code>Stream</code></td><td><code>p.rglob(\"*\")</code></td><td><code>readdir({ recursive: true })</code></td></tr><tr><td>Glob</td><td><code>FileSystem.getPathMatcher</code></td><td><code>p.glob(\"**/*.txt\")</code></td><td><code>fs.glob</code> (Node 22+)</td></tr></tbody></table><p>Java's split is deliberate. <code>Path</code> is a lexical value: <code>resolve</code>, <code>relativize</code>, <code>normalize</code> and <code>getParent</code> are pure string algebra bound to a <code>FileSystem</code>, and none of them touches the disk. Everything that can fail lives on <code>Files</code>, where it can throw a typed <code>IOException</code> carrying a real message. That is a direct reaction to legacy <code>java.io.File</code>, whose <code>delete()</code> returns <code>false</code> for \"no such file\", \"not permitted\" and \"directory not empty\" alike. <code>File</code> still turns up in old APIs; <code>Path.toFile()</code> and <code>File.toPath()</code> bridge, and new code should stay on <code>Path</code>.</p><p>Python fused the two. <code>read_text()</code>, <code>stat()</code>, <code>rglob()</code> and <code>unlink()</code> hang off the value, which reads well in a script at the cost of a very wide surface on one class. The <code>/</code> operator is <code>__truediv__</code> overloaded, and it is why nobody writes <code>os.path.join</code> any more. <code>Path</code> is also polymorphic over the platform — it instantiates as <code>PosixPath</code> or <code>WindowsPath</code> — so comparing <code>str(p)</code> against a hardcoded <code>\"a/b\"</code> fails on Windows.</p><p>Node has no path type. <code>node:path</code> is a set of string functions and <code>node:fs</code> accepts strings, <code>URL</code>s or file descriptors. Nothing in the type system separates a path from a username, and TypeScript can only recover the distinction with a branded type you maintain yourself. Paths stay trivially comparable and serialisable; the price is that <code>\"/etc/\" + userInput</code> typechecks perfectly.</p><p>None of the three lets you hardcode a separator safely — <code>Path.of</code>, <code>/</code> and <code>join</code> all emit <code>\\</code> on Windows. And an <code>exists</code> check is a lie in all three: the answer is stale the moment it returns, and it also reports absence when the path is there but unreadable. Attempt the operation, handle the failure.</p><pre><code data-lang=\"java\">new java.io.File(\"/nope/x.txt\").delete();   // false — but why? no idea\nFiles.delete(Path.of(\"/nope/x.txt\"));       // NoSuchFileException: /nope/x.txt\nFiles.exists(p);                            // false ALSO means \"permission denied\"</code></pre>",
        "why": "Coming from Python, Java's Path looks crippled until you notice every failure has a typed exception behind it instead of a boolean. Coming from either, Node's stringly-typed paths delete a whole category of compile-time help: joining bugs and injection through user-controlled segments become runtime problems. And the exists-then-open pattern is a TOCTOU race in every one of them — it reads as defensive and is not.",
        "apply": [
          "<b>Never concatenate segments</b> — <code>Path.of</code>, <code>/</code>, <code>join</code>; a hardcoded <code>/</code> is a Windows bug in waiting.",
          "<b>Coming from Python, expect the verbs to move</b> — in Java they live on <code>Files</code>, and <code>Path</code> only does string algebra.",
          "<b>Skip the exists check</b> — open or delete and catch the failure; <code>exists</code> is racy and conflates \"absent\" with \"forbidden\".",
          "<b>Close directory streams</b> — <code>Files.walk</code> and <code>Files.list</code> hold an open handle until the returned <code>Stream</code> is closed."
        ],
        "code3": {
          "java": "// in a method that throws IOException; imports: java.nio.file.Files, java.nio.file.Path\nPath root = Path.of(\"docs\");               // varargs join — never a separator by hand\nPath one = root.resolve(\"readme.txt\");     // docs/readme.txt, docs\\readme.txt on Windows\nSystem.out.println(Files.exists(one));     // false when absent OR unreadable\n\n// walk returns a Stream holding an open directory handle — it must be closed\ntry (var paths = Files.walk(root)) {\n    paths.filter(Files::isRegularFile)\n         .filter(p -> p.toString().endsWith(\".txt\"))\n         .map(root::relativize)\n         .forEach(System.out::println);\n}\n\n// Path is a value; Files performs the I/O. Path.toFile() bridges to legacy File",
          "python": "from pathlib import Path\n\nroot = Path(\"docs\")                        # / is __truediv__, overloaded on Path\none = root / \"readme.txt\"                  # PosixPath('docs/readme.txt')\nprint(one.exists())                        # False when absent OR unreadable\n\n# rglob walks recursively and yields Paths lazily\nfor p in root.rglob(\"*.txt\"):\n    if p.is_file():\n        print(p.relative_to(root))\n\n# the value and the operations are the same object:\nprint(one.suffix, one.stem, one.parent)    # .txt readme docs\n# str(p) is platform-shaped — never compare it to a hardcoded \"docs/readme.txt\"",
          "ts": "// Node.js\nimport { join, extname } from \"node:path\";\nimport { readdir, access } from \"node:fs/promises\";\n\nconst root = \"docs\";                       // a path is just a string — there is no Path type\nconst one = join(root, \"readme.txt\");      // node:path is string maths; it never hits disk\n\n// there is no exists(): probe with access(), or just attempt the read and catch\nconst found = await access(one).then(() => true, () => false);\nconsole.log(found);\n\n// recursive: true (Node 18.17+) yields names relative to root\nfor (const name of await readdir(root, { recursive: true })) {\n  if (extname(name) === \".txt\") console.log(name);\n}\n\n// fs.glob arrived in Node 22; before that, globbing was a userland package"

      {
        "id": "streams-buffers",
        "title": "Streams & Buffers",
        "lede": "Java splits I/O by byte vs char, Python by binary vs text mode, Node by Buffer vs string — and java.util.stream is none of these.",
        "what": "<p>A stream is a sequence you consume without holding all of it. Each language draws the byte/text line somewhere different, and one of them reuses the word for an unrelated feature.</p><p>Before the table, the terminology trap: <code>java.util.stream.Stream</code> is <b>not</b> an I/O stream. It is a lazy pipeline over a collection — <code>map</code>, <code>filter</code>, <code>collect</code> — and it shares nothing with <code>java.io.InputStream</code> but the noun. <code>Files.lines(p)</code> returns the collection kind, which is also the only <code>Stream</code> you are obliged to close.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Bytes</td><td><code>InputStream</code>/<code>OutputStream</code></td><td><code>open(p, \"rb\")</code></td><td><code>Readable</code> of <code>Buffer</code></td></tr><tr><td>Text</td><td><code>Reader</code>/<code>Writer</code></td><td><code>open(p)</code>, text mode</td><td>stream with an encoding</td></tr><tr><td>The adapter</td><td><code>InputStreamReader(in, cs)</code></td><td><code>io.TextIOWrapper</code></td><td><code>setEncoding(\"utf8\")</code></td></tr><tr><td>In memory</td><td><code>ByteArrayInputStream</code></td><td><code>io.BytesIO</code>/<code>StringIO</code></td><td><code>Buffer.from</code>, <code>Readable.from</code></td></tr><tr><td>Composition</td><td>decorator wrapping</td><td><code>open()</code> builds the stack</td><td><code>pipeline()</code></td></tr><tr><td>Backpressure</td><td>blocking write</td><td>blocking write</td><td><code>write()</code> → <code>false</code>, <code>'drain'</code></td></tr></tbody></table><p>Java's split is in the type system: <code>InputStream</code> deals in <code>byte</code>, <code>Reader</code> deals in <code>char</code>, and the only legal crossing is an <code>InputStreamReader</code> — which is exactly where a <code>Charset</code> must be named. The encoding decision is forced into the open. The cost is the decorator tower, <code>new BufferedReader(new InputStreamReader(new FileInputStream(f), UTF_8))</code>, which is why <code>Files.newBufferedReader</code> exists.</p><p>Python builds the identical tower and hides it behind one function. <code>open(p)</code> in text mode returns a <code>TextIOWrapper</code> over a <code>BufferedReader</code> over a <code>FileIO</code>, and you can walk the layers with <code>f.buffer</code> and <code>f.buffer.raw</code>. The <code>\"b\"</code> in the mode string picks which layer you are handed, so <code>\"rb\"</code> yields <code>bytes</code> and <code>\"r\"</code> yields <code>str</code> from the same call — and mixing them is a runtime <code>TypeError</code>, not a compile error.</p><p>Node's streams push rather than pull, because they must. There is one thread and it may not block, so a <code>Readable</code> emits <code>'data'</code> at you instead of waiting to be asked. That inverts flow control. In Java or Python a slow consumer simply blocks the producing thread and backpressure is free; in Node nothing blocks, so <code>writable.write()</code> returns <code>false</code> to mean \"my buffer is full, stop until <code>'drain'</code>\". Ignoring that return value is how a copy loop that passed on a 4 MB fixture dies on a 4 GB file. <code>pipeline()</code> wires backpressure, propagates errors in both directions and destroys every stream on failure — none of which <code>pipe()</code> does.</p><p><code>Buffer</code> is Node's byte array: a <code>Uint8Array</code> subclass over off-heap memory, predating typed arrays in the platform. Web Streams (<code>ReadableStream</code>) are the newer cross-runtime API; Node carries both and converts with <code>Readable.fromWeb</code> and <code>Readable.toWeb</code>.</p><pre><code data-lang=\"ts\">// Node.js — the shape that OOMs\nsrc.on(\"data\", (chunk) =&gt; dst.write(chunk));  // return value dropped on the floor\n// dst is slow, src never pauses, chunks pile up in dst's internal buffer\nawait pipeline(src, dst);                     // does the bookkeeping for you</code></pre>",
        "why": "The byte/text confusion is a one-line fix in each language, but a different one-line fix, and it announces itself differently: a Python TypeError, a Node Buffer where a string was wanted, a Java compile error. The expensive difference is backpressure — automatic in Java and Python, manual in Node — so a copy loop ported from either works on small inputs and exhausts memory on large ones. And the word \"stream\" has to be unlearned once in each direction.",
        "apply": [
          "<b>Read <code>Stream</code> in Java twice</b> — <code>java.util.stream.Stream</code> is a collection pipeline, <code>java.io.InputStream</code> is I/O; only the first appears in <code>map</code>/<code>filter</code> code.",
          "<b>Coming from a blocking language, arrange backpressure yourself in Node</b> — use <code>pipeline()</code> rather than <code>pipe()</code> or a hand-written <code>'data'</code> handler.",
          "<b>Name the charset at the byte→char boundary</b> — <code>InputStreamReader(in, UTF_8)</code>, <code>encoding=\"utf-8\"</code>, <code>setEncoding(\"utf8\")</code>; nowhere else.",
          "<b>Prefer <code>transferTo</code>, <code>copyfileobj</code> and <code>pipeline</code> to hand-rolled loops</b> — each sizes its own buffer and handles short reads correctly."
        ],
        "code3": {
          "java": "// in a method that throws IOException; imports: java.io.*, java.nio.file.*\ntry (InputStream in = Files.newInputStream(Path.of(\"in.bin\"));\n     OutputStream out = Files.newOutputStream(Path.of(\"out.bin\"))) {\n    in.transferTo(out);          // Java 9+, internal 8 KiB buffer, blocking = backpressure\n}\n\n// text needs an explicit adapter: the byte→char crossing carries the Charset\ntry (Reader r = Files.newBufferedReader(Path.of(\"in.txt\"));     // UTF-8 since Java 18\n     Writer w = Files.newBufferedWriter(Path.of(\"out.txt\"))) {\n    r.transferTo(w);             // Reader.transferTo is Java 10+\n}\n\n// Files.lines returns java.util.stream.Stream<String> — a COLLECTION pipeline,\n// unrelated to java.io.InputStream, yet it still owns a file handle",
          "python": "import io\nimport shutil\n\n# \"rb\"/\"wb\" hand back bytes; no \"b\" hands back str, decoded by a TextIOWrapper\nwith open(\"in.bin\", \"rb\") as src, open(\"out.bin\", \"wb\") as dst:\n    shutil.copyfileobj(src, dst)          # fixed-size chunks, never the whole file\n\n# the text stack is TextIOWrapper -> BufferedReader -> FileIO, assembled by open()\nwith open(\"in.txt\", encoding=\"utf-8\") as src:\n    print(type(src.buffer))               # <class '_io.BufferedReader'>\n    print(type(src.buffer.raw))           # <class '_io.FileIO'>\n\nbuf = io.BytesIO(b\"in memory\")            # same API, no file descriptor\nprint(buf.read(2))                        # b'in'\n# a blocking write IS the backpressure — a slow consumer stalls the producer",
          "ts": "// Node.js\nimport { createReadStream, createWriteStream } from \"node:fs\";\nimport { pipeline } from \"node:stream/promises\";\n\n// streams push Buffers; pipeline wires backpressure, errors and cleanup\nawait pipeline(createReadStream(\"in.bin\"), createWriteStream(\"out.bin\"));\n\n// text: give the stream an encoding and it emits strings instead of Buffers\nconst text = createReadStream(\"in.txt\", { encoding: \"utf8\" });\nfor await (const chunk of text) console.log(typeof chunk);   // \"string\"\n\n// Buffer is a Uint8Array subclass over off-heap memory\nconst buf = Buffer.from(\"in memory\", \"utf8\");\nconsole.log(buf instanceof Uint8Array);                      // true\nconsole.log(buf.subarray(0, 2).toString());                  // \"in\"\n\n// dst.write(x) === false means \"stop\" — ignore it and memory grows unbounded"

      {
        "id": "json-serialization",
        "title": "JSON & Serialization",
        "lede": "Python and JavaScript ship JSON in the box and hand back an untyped bag; Java ships none and, via Jackson, hands back a checked object.",
        "what": "<p>JSON is the default wire format for all three, and they disagree on whether parsing it is the runtime's job. Python and JavaScript ship it. Java, after a false start, still does not.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>In the stdlib</td><td>no</td><td><code>json</code></td><td><code>JSON</code>, in the language</td></tr><tr><td>Parse</td><td><code>mapper.readValue</code> (Jackson)</td><td><code>json.loads</code></td><td><code>JSON.parse</code></td></tr><tr><td>Static type out</td><td>the class you asked for</td><td><code>Any</code></td><td><code>any</code></td></tr><tr><td>Checked at parse</td><td>yes, at bind time</td><td>no</td><td>no</td></tr><tr><td>Bind to a type</td><td><code>record</code>, constructor runs</td><td><code>User(**d)</code>, unchecked</td><td><code>as User</code>, an assertion</td></tr><tr><td>Binary sibling</td><td><code>Serializable</code> — avoid</td><td><code>pickle</code> — avoid</td><td>none</td></tr></tbody></table><p>The JDK has no JSON API. A lightweight one was proposed as JEP 198 and never shipped, so Jackson and Gson became the de facto standard and every Java service carries a dependency for something the other two treat as a keyword. The compensation is real: Jackson binds straight into a <code>record</code>, calling the canonical constructor, so declared types are checked at parse time and <code>{\"age\": \"x\"}</code> throws right there, at the boundary, with a JSON pointer in the message.</p><p>The two languages that do ship JSON hand back a shapeless value. <code>json.loads</code> returns <code>Any</code>. <code>JSON.parse</code> is declared to return <code>any</code>, which is worse, because <code>any</code> switches off checking for everything downstream of it. Neither <code>User(**data)</code> nor <code>data as User</code> validates anything: the first builds a dataclass whose <code>age: int</code> field holds a string, the second is a compile-time assertion that emits no code at all. The failure then surfaces three frames later as <code>unsupported operand type</code> or <code>undefined is not a function</code>, nowhere near the payload that caused it.</p><p>The rule is the same in all three: <b>parse, then validate, at the boundary</b>. In TypeScript that means annotating the result <code>unknown</code> so the compiler forces a check, then a type predicate or a schema library. In Python it means pydantic or explicit checks. Java gets it by default, and this is the one place its heavier setup pays for itself.</p><p>Java's <code>Serializable</code> is a separate, older, binary mechanism, and it is discouraged for concrete reasons. It reconstructs objects without running any constructor — an object-creation channel outside the language — so invariants a class enforces on construction simply do not hold. It makes every private field part of the public API forever. And because it will instantiate any serialisable class on the classpath, a crafted payload can chain existing classes into remote code execution; <code>ObjectInputFilter</code> (JEP 290) is a mitigation, not a fix. The stated long-term plan is to remove it. Python's <code>pickle</code> has the same shape and the same warning printed in its own documentation.</p><pre><code data-lang=\"ts\">const u = JSON.parse(body) as User;   // no code emitted, nothing checked\nu.age.toFixed(2);                     // TypeError at runtime if age was \"x\"\nconst v: unknown = JSON.parse(body);  // forces the compiler to make you check first</code></pre>",
        "why": "A Java developer moving to Python or TypeScript keeps the habit of trusting a deserialised object, and that habit is only earned in Java. In the other two, the type on a parsed payload is documentation rather than enforcement, so bad input travels deep into the call graph before failing — usually as a baffling error in code that never touched the network. Going the other way, the surprise is that JSON needs a dependency at all.",
        "apply": [
          "<b>Annotate <code>JSON.parse</code> as <code>unknown</code></b> — its declared <code>any</code> silently disables checking on everything derived from it.",
          "<b>Validate once, at the edge</b> — a type predicate or schema at the boundary, so the interior is entitled to trust its own types.",
          "<b>Coming from Python or Node, expect a dependency</b> — Java has no stdlib JSON; take Jackson and bind into <code>record</code>s so the constructor does the checking.",
          "<b>Do not add <code>Serializable</code> or reach for <code>pickle</code></b> — both bypass constructors and both deserialise untrusted input into arbitrary classes."
        ],
        "code3": {
          "java": "// needs com.fasterxml.jackson.core:jackson-databind — the JDK ships NO JSON API\n// in a method that throws JsonProcessingException\nimport com.fasterxml.jackson.databind.ObjectMapper;\n\nrecord User(String name, int age) {}\n\nvar mapper = new ObjectMapper();\nString json = \"\"\"\n        {\"name\": \"Ada\", \"age\": 36}\"\"\";\n\n// Jackson calls the record's canonical constructor: types are checked HERE\nUser u = mapper.readValue(json, User.class);\nSystem.out.println(u.name());                  // Ada\n\n// {\"age\": \"x\"} throws InvalidFormatException at this line, not three frames later\nSystem.out.println(mapper.writeValueAsString(u));   // {\"name\":\"Ada\",\"age\":36}",
          "python": "import json\nfrom dataclasses import dataclass, asdict\n\n@dataclass\nclass User:\n    name: str\n    age: int\n\ndata = json.loads('{\"name\": \"Ada\", \"age\": 36}')   # -> dict, statically typed Any\nu = User(**data)          # no validation: age=\"x\" constructs happily\nprint(u.name)             # Ada\n\nprint(json.dumps(asdict(u)))                      # {\"name\": \"Ada\", \"age\": 36}\n\n# dataclasses never check types at runtime; the annotation is documentation\n# pydantic exists precisely to close this gap at the boundary",
          "ts": "// Node.js, or any runtime — JSON is part of the language\ninterface User { name: string; age: number }\n\n// JSON.parse is declared any — annotate unknown to force a check\nconst raw: unknown = JSON.parse('{\"name\": \"Ada\", \"age\": 36}');\n\nconst lie = raw as User;   // unchecked assertion: compiles even for {\"age\": \"x\"}\nconsole.log(lie.age);      // would be a string at runtime, with no error here\n\nfunction isUser(v: unknown): v is User {\n  return typeof v === \"object\" && v !== null &&\n    typeof (v as { name?: unknown }).name === \"string\" &&\n    typeof (v as { age?: unknown }).age === \"number\";\n}\n\nif (!isUser(raw)) throw new TypeError(\"bad payload\");\nconsole.log(raw.name);                  // narrowed to User only after the guard\nconsole.log(JSON.stringify(raw));       // {\"name\":\"Ada\",\"age\":36}"
        },
