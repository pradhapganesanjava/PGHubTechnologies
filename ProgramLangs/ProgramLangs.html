        "id": "function-declaration",
        "title": "Function Declaration",
        "lede": "Java forces every function to live inside a class; Python and TypeScript allow top-level definitions — and only Java overloads for real.",
        "what": "<p>A function declaration binds a name to a body of callable code. The three languages agree on that and disagree on almost everything around it: where a function is allowed to live, where the return type goes, and whether one name may carry several signatures.</p>\n<p>The sharpest divide is overloading. Java resolves it at compile time against the <i>static</i> types of the arguments; Python has no overloading at all; TypeScript has overload <i>signatures</i> that vanish before the code ever runs.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Top-level function</td><td>no — must be a class member</td><td>yes, <code>def f()</code></td><td>yes, <code>function f()</code> or arrow</td></tr>\n<tr><td>Return type</td><td>before the name, <code>int f()</code></td><td>annotation, <code>-&gt; int</code></td><td>annotation, <code>: number</code></td></tr>\n<tr><td>Overloading</td><td>real, by arity + static types</td><td>none — a second <code>def</code> rebinds</td><td>signatures only, one body</td></tr>\n<tr><td>Dispatch on</td><td>declared type, at compile time</td><td>runtime type, via <code>singledispatch</code></td><td>nothing — erased</td></tr>\n<tr><td>Hoisting</td><td>n/a — resolved at compile</td><td>no — <code>def</code> executes in order</td><td><code>function</code> yes, <code>const</code> arrow no</td></tr>\n</tbody>\n</table>\n<p>Java's everything-inside-a-class rule dates to 1995 and the decision to have exactly one namespacing mechanism. The class <i>is</i> the namespace, so a free function has nowhere to be, and <code>static</code> methods on a utility class became the standard workaround. Java 21 still has no top-level <code>def</code>. The payoff is that a method's owner is always known, which is what makes overload resolution tractable: javac picks the most specific applicable signature from the argument expressions' compile-time types. Hand it an <code>Object</code> variable holding a <code>String</code> and it picks the <code>Object</code> overload — or refuses to compile — because it never looks at what is actually in the variable.</p>\n<p>Python's model is simpler and stricter about it: a name in a namespace maps to exactly one object. Two <code>def</code>s with the same name do not overload, the second silently replaces the first. When runtime dispatch on argument type is genuinely wanted, <code>functools.singledispatch</code> supplies it as a library, keyed on the first argument's actual class — the opposite of Java, and it walks the MRO to find the closest registered match.</p>\n<p>TypeScript sits in a third place. Overload signatures are a compile-time fiction over one JavaScript function: the implementation signature is not callable from outside, and the emitted <code>.js</code> holds a single <code>function</code>. This buys precise call-site typing (a <code>string</code> in, a <code>string</code> out) with zero runtime machinery, but the body must still narrow by hand with <code>typeof</code> — the compiler will not do it.</p>\n<pre><code data-lang=\"java\">// Java resolves overloads on the STATIC type, and it will not guess.\nstatic void p(Object o) { System.out.println(\"object\"); }\nstatic void p(String s) { System.out.println(\"string\"); }\n\nObject o = \"hi\";\np(o);        // prints \"object\" — the runtime class is never consulted\np((String) o);  // prints \"string\"</code></pre>",
        "why": "Coming from Python or TypeScript, the reflex to write a helper at the top of a file has no Java equivalent — everything becomes a <code>static</code> method on some <code>Utils</code> class, and that shapes how Java codebases are organised. Going the other way, a Java developer will reach for overloads and quietly lose them: Python overwrites the first definition with no warning at all, which produces a genuinely confusing bug. And Java's static-type overload resolution surprises people who expect the runtime type to decide, which is exactly what Python's <code>singledispatch</code> does instead.",
        "apply": [
          "<b>Do not expect overloading in Python</b> — a second <code>def</code> of the same name silently replaces the first; reach for <code>functools.singledispatch</code> or an <code>isinstance</code> branch.",
          "<b>Coming from Java, treat TS overloads as call-site documentation</b> — the implementation body still has to narrow with <code>typeof</code>, and no dispatch happens at runtime.",
          "<b>Remember Java picks overloads from declared types</b> — assign to <code>Object</code> or a supertype and the resolution changes, even though the object did not.",
          "<b>Prefer distinct names over overloads</b> when the behaviours differ, since only one of the three languages can express the distinction anyway."
        ],
        "code3": {
          "java": "// Overloading: real, resolved at compile time from the static types.\npublic final class Describe {\n    static String describe(int n)    { return \"int: \" + n; }\n    static String describe(String s) { return \"str: \" + s; }\n\n    public static void main(String[] args) {\n        System.out.println(describe(42));     // int: 42\n        System.out.println(describe(\"hi\"));   // str: hi\n\n        Object o = \"hi\";\n        // System.out.println(describe(o));   // error: no suitable method found\n        // the compiler sees Object, not String — it never looks at the value\n    }\n}",
          "python": "from functools import singledispatch\n\n@singledispatch                      # the fallback implementation\ndef describe(x: object) -> str:\n    return f\"other: {x}\"\n\n@describe.register                   # registered from the annotation\ndef _(x: int) -> str:\n    return f\"int: {x}\"\n\n@describe.register\ndef _(x: str) -> str:\n    return f\"str: {x}\"\n\nprint(describe(42))      # int: 42\nprint(describe(\"hi\"))    # str: hi\n\no: object = \"hi\"\nprint(describe(o))       # str: hi — dispatch is on the RUNTIME class",
          "ts": "function describe(n: number): string;   // overload signature\nfunction describe(s: string): string;   // overload signature\nfunction describe(x: number | string): string {   // impl: not callable directly\n  return typeof x === \"number\" ? `num: ${x}` : `str: ${x}`;\n}\n\nconsole.log(describe(42));     // num: 42\nconsole.log(describe(\"hi\"));   // str: hi\n\nconst o: unknown = \"hi\";\n// describe(o);   // Error: no overload matches — unknown is not number | string\n\n// At runtime exactly ONE function exists; the two signatures above are erased.\n// The body must narrow by hand — nothing dispatches for you."

      {
        "id": "parameters-arguments",
        "title": "Parameters, Defaults & Varargs",
        "lede": "Java has no default arguments and pays for it in overloads; Python has defaults, keyword-only params and the mutable-default trap.",
        "what": "<p>Every call has to answer three questions: which arguments may be omitted, whether they can be named, and what happens to the values once inside. Java answers the first two with <i>nothing at all</i>; Python answers with the richest parameter grammar of the three; TypeScript sits between them.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Default values</td><td>none — overload or builder</td><td><code>def f(a, b=2)</code></td><td><code>function f(a, b = 2)</code></td></tr>\n<tr><td>Named arguments</td><td>none</td><td><code>f(b=2)</code>; <code>*</code> forces keyword-only</td><td>none — pass an options object</td></tr>\n<tr><td>Varargs</td><td><code>String... xs</code> → an array</td><td><code>*args</code>, <code>**kwargs</code></td><td><code>...xs: string[]</code></td></tr>\n<tr><td>Optional marker</td><td>n/a</td><td>trailing default</td><td><code>b?: number</code>, trailing only</td></tr>\n<tr><td>Default evaluated</td><td>n/a</td><td>once, at <code>def</code> time</td><td>on every call</td></tr>\n<tr><td>Argument passing</td><td>value of the reference</td><td>value of the reference</td><td>value of the reference</td></tr>\n</tbody>\n</table>\n<p>Java's missing defaults are not an oversight. A JVM method is identified by its name plus an exact descriptor of arity and erased parameter types; a default value would have to be baked into every call site or into a synthetic bridge method, and either choice breaks binary compatibility the moment the default changes — recompiled callers and old callers would disagree. So the idiom is telescoping overloads that delegate inward, and once the optional count passes three or four, a builder. That is why Java APIs look the way they do.</p>\n<p>Python evaluates each default expression exactly once, when the <code>def</code> statement runs, and stores the results on the function's <code>__defaults__</code> tuple. A mutable default is therefore one object shared by every call for the lifetime of the process — the most reliable trap in the language, and it bites hardest when the function looks stateless. The fix is a <code>None</code> sentinel. TypeScript avoids it by accident of compilation: a default compiles to an assignment inside the body, so <code>= []</code> builds a fresh array per call.</p>\n<p>The last row matters more than it looks. All three pass the value of a reference, always. Reassigning a parameter never touches the caller's variable; mutating the object it points at always does. Java's <code>final</code> on a parameter, and TypeScript's lack of one, change nothing about this — the distinction is between rebinding a name and mutating a thing, and it is identical in all three.</p>\n<pre><code data-lang=\"python\"># The default list is built ONCE, when this line is executed.\ndef add(item, target=[]):\n    target.append(item)\n    return target\n\nadd(\"a\")   # ['a']\nadd(\"b\")   # ['a', 'b']  — same list, still alive\nprint(add.__defaults__)   # (['a', 'b'],)  — it lives on the function object</code></pre>",
        "why": "The mutable-default bug is the single most common way a Java or TypeScript developer breaks a Python function, because both of those languages evaluate defaults per call and the intuition transfers wrongly. In the other direction, an API designed around Python's keyword arguments does not port to Java at all — it becomes a builder or a parameter object, which is a real refactor rather than a translation. And Python's keyword-only parameters (everything after a bare <code>*</code>) have no equivalent in either other language, so boolean flags that read fine in Python become unreadable positional arguments elsewhere.",
        "apply": [
          "<b>Never use a mutable default in Python</b> — write <code>target: list[str] | None = None</code> and build the list inside the body.",
          "<b>Coming from Python, expect no named arguments in Java or TypeScript</b> — model optional inputs as an options object in TS, and as a builder in Java once there are more than three.",
          "<b>Use a bare <code>*</code> in Python</b> to force flags to be keyword-only; a call site reading <code>f(x, True, False)</code> is unreviewable.",
          "<b>Stop arguing about pass-by-reference</b> — all three pass the reference by value, so reassigning a parameter is always local and mutating it is always visible."
        ],
        "code3": {
          "java": "import java.util.*;\n\npublic final class Args {\n    // No defaults in the language: the 1-arg overload IS the default.\n    static List<String> addItem(String item) {\n        return addItem(item, new ArrayList<>());\n    }\n    static List<String> addItem(String item, List<String> target) {\n        target.add(item);\n        return target;\n    }\n    static String join(String sep, String... parts) {   // varargs -> String[]\n        return String.join(sep, parts);\n    }\n    public static void main(String[] args) {\n        System.out.println(addItem(\"a\"));          // [a]\n        System.out.println(addItem(\"b\"));          // [b] — a fresh list every call\n        System.out.println(join(\"-\", \"x\", \"y\"));   // x-y\n    }\n}",
          "python": "def add_item(item: str, target: list[str] = []) -> list[str]:\n    target.append(item)      # BUG: the default list is created ONCE, at def time\n    return target\n\nprint(add_item(\"a\"))         # ['a']\nprint(add_item(\"b\"))         # ['a', 'b'] — the same list, still holding 'a'\n\ndef add_item_ok(\n    item: str,\n    target: list[str] | None = None,\n    *,                       # everything after this is keyword-only\n    upper: bool = False,\n) -> list[str]:\n    target = [] if target is None else target   # the None-sentinel fix\n    target.append(item.upper() if upper else item)\n    return target\n\nprint(add_item_ok(\"a\"))                 # ['a']\nprint(add_item_ok(\"b\", upper=True))     # ['B']",
          "ts": "function addItem(item: string, target: string[] = []): string[] {\n  target.push(item);   // the default is evaluated on EVERY call\n  return target;\n}\n\nconsole.log(addItem(\"a\"));   // ['a']\nconsole.log(addItem(\"b\"));   // ['b'] — fresh array, no Python-style trap\n\nfunction join(sep: string, ...parts: string[]): string {   // rest parameter\n  return parts.join(sep);\n}\nconsole.log(join(\"-\", \"x\", \"y\"));   // x-y\n\n// No keyword arguments: an options object plus destructured defaults is the idiom.\nfunction rows(sql: string, opts: { limit?: number; offset?: number } = {}): string {\n  const { limit = 100, offset = 0 } = opts;\n  return `${sql} LIMIT ${limit} OFFSET ${offset}`;\n}\nconsole.log(rows(\"select 1\", { limit: 10 }));   // select 1 LIMIT 10 OFFSET 0"

      {
        "id": "lambdas-closures",
        "title": "Lambdas & Closures",
        "lede": "All three close over their environment, but Java captures only effectively-final values and Python's lambda is capped at one expression.",
        "what": "<p>A closure is a function plus the environment it was created in. The three languages implement that idea on very different runtimes, and the differences show up in what a lambda may capture, whether it may write to what it captured, and how big its body is allowed to be.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Syntax</td><td><code>x -&gt; x * 2</code></td><td><code>lambda x: x * 2</code></td><td><code>x =&gt; x * 2</code></td></tr>\n<tr><td>Body</td><td>expression or block</td><td>one expression only</td><td>expression or block</td></tr>\n<tr><td>Static type</td><td>a functional interface</td><td>none — it is an object</td><td>structural function type</td></tr>\n<tr><td>Captures</td><td>effectively-final, by value</td><td>the variable's cell</td><td>the binding</td></tr>\n<tr><td>Writing to captures</td><td>forbidden — use a holder</td><td>needs <code>nonlocal</code>/<code>global</code></td><td>allowed directly</td></tr>\n<tr><td>Method reference</td><td><code>String::length</code></td><td><code>obj.method</code> — carries <code>self</code></td><td>loses <code>this</code>; needs <code>bind</code></td></tr>\n</tbody>\n</table>\n<p>Java captures by value because a lambda can outlive the stack frame that made it, and the JVM has no boxed cell for a local variable — the compiler copies the value into a field of the synthetic class. Copying is only safe if the source can never change afterwards, hence the \"effectively final\" rule: assign to the variable once and never again, or the compiler rejects the capture. The escape hatches (a one-element array, an <code>AtomicInteger</code>) work because the <i>reference</i> stays final while the contents move.</p>\n<p>Python closes over the cell rather than the value, which is why the classic loop bug exists: every lambda made in a loop shares one cell and all of them see the final value. The <code>i=i</code> default-argument trick works precisely because defaults are evaluated eagerly. Writing to an enclosing variable needs <code>nonlocal</code>, because a bare assignment inside a function creates a local — Python decides scope statically from the presence of an assignment, not from what exists at runtime.</p>\n<p>JavaScript, and so TypeScript, gives <code>let</code> a fresh binding per loop iteration by specification, so the loop bug only appears with <code>var</code>. The real JS-specific hazard is <code>this</code>: methods do not capture their receiver, so pulling a method off an object loses it and the call throws. Arrow functions capture <code>this</code> lexically, which is why class fields assigned an arrow are the standard fix. Python has no such problem — <code>obj.method</code> builds a bound method that carries <code>self</code> with it.</p>\n<pre><code data-lang=\"java\">// Not effectively final: the loop variable is mutated by i++\nfor (int i = 0; i &lt; 3; i++) {\n    // fns.add(() -&gt; i);   // error: local variables referenced from a lambda\n    int captured = i;      // assigned once per iteration — this compiles\n    fns.add(() -&gt; captured);\n}\n// An enhanced for-loop variable IS effectively final per iteration.</code></pre>",
        "why": "The loop-capture bug is the same shape in Java and Python and absent in TypeScript, which makes it easy to carry the wrong intuition in either direction: Java refuses to compile it, Python happily prints <code>[2, 2, 2]</code>, and TS with <code>let</code> just does the obvious thing. Java's effectively-final rule also blocks the accumulator pattern that Python and JS allow outright, so a straightforward loop rewrite becomes an <code>AtomicInteger</code> or a stream. And a Python developer reaching for the <code>obj.method</code> reflex in TypeScript will strip <code>this</code> off the method and get a runtime <code>TypeError</code> with no compile warning.",
        "apply": [
          "<b>Coming from Python or JS, expect Java to reject writes to captured locals</b> — accumulate with a stream reduction, or wrap the state in an <code>AtomicInteger</code> if a loop is genuinely clearer.",
          "<b>Use <code>let</code>, never <code>var</code>, in TypeScript loops</b> — the per-iteration binding is what makes closures in loops behave.",
          "<b>Reach for <code>lambda i=i: ...</code> in Python</b> only inside loops; everywhere else it is noise that hides a real bug.",
          "<b>Never detach a TypeScript method from its object</b> — assign an arrow to a class field, or <code>bind</code> at the point of extraction."
        ],
        "code3": {
          "java": "import java.util.*;\nimport java.util.function.Supplier;\nimport java.util.concurrent.atomic.AtomicInteger;\n\n// in a method body:\nList<Supplier<Integer>> fns = new ArrayList<>();\nfor (int i = 0; i < 3; i++) {\n    int captured = i;            // i itself is NOT effectively final (i++)\n    fns.add(() -> captured);     // captured BY VALUE into a synthetic field\n}\nfns.forEach(f -> System.out.println(f.get()));   // 0 1 2\n\n// int total = 0;\n// fns.forEach(f -> total += f.get());   // error: must be effectively final\nAtomicInteger sum = new AtomicInteger();\nfns.forEach(f -> sum.addAndGet(f.get()));   // the reference is final; contents move\nSystem.out.println(sum.get());              // 3",
          "python": "fns = [lambda: i for i in range(3)]       # every lambda shares ONE cell for i\nprint([f() for f in fns])                # [2, 2, 2] — all see the final value\n\nfns = [lambda i=i: i for i in range(3)]  # defaults are eager: snapshots the value\nprint([f() for f in fns])                # [0, 1, 2]\n\ndef make_counter():\n    count = 0\n    def inc() -> int:\n        nonlocal count    # without this, `count = ...` would create a LOCAL\n        count += 1\n        return count\n    return inc\n\nc = make_counter()\nprint(c(), c(), c())      # 1 2 3 — the cell outlives make_counter's frame",

      {
        "id": "classes-objects",
        "title": "Classes & Objects",
        "lede": "Java enforces access modifiers in the JVM itself, Python enforces only convention, and TypeScript's `private` disappears at compile time.",
        "what": "<p>All three have classes with constructors, fields and methods, and the syntax is close enough to read across without a dictionary. The interesting differences are about enforcement: what stops a caller from touching a field it should not, and whether anything checks at runtime.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Constructor</td><td>method named for the class</td><td><code>__init__</code> (and <code>__new__</code>)</td><td><code>constructor()</code></td></tr>\n<tr><td>Receiver</td><td>implicit <code>this</code></td><td>explicit <code>self</code>, first param</td><td>implicit <code>this</code>, rebindable</td></tr>\n<tr><td>Privacy</td><td><code>private</code> — compiler + JVM</td><td><code>_x</code> convention; <code>__x</code> mangles</td><td><code>private</code> erased; <code>#x</code> real</td></tr>\n<tr><td>Instance state</td><td>declared fields, fixed layout</td><td>any attribute, via <code>__dict__</code></td><td>declared fields</td></tr>\n<tr><td>Computed access</td><td>a getter method</td><td><code>@property</code></td><td><code>get</code>/<code>set</code> accessors</td></tr>\n<tr><td>Enforced at runtime</td><td>yes</td><td>no</td><td>only <code>#</code> fields</td></tr>\n</tbody>\n</table>\n<p>Java checks <code>private</code> twice: javac rejects the access, and the JVM's verifier rejects the bytecode even if you hand-assemble it. Reflection can still break in — <code>setAccessible(true)</code> — which is why the module system exists to slam that door shut for real. The guarantee costs flexibility: fields are fixed at class-load time and a class cannot grow one later.</p>\n<p>Python has no access control whatsoever, and this is deliberate. A single leading underscore is documentation. A double underscore triggers name mangling to <code>_ClassName__x</code>, which exists to stop a subclass from <i>accidentally</i> colliding with a base class's attribute, not to stop anyone reading it — the mangled name is right there. The whole design follows from objects carrying a <code>__dict__</code>: attributes can appear at any moment, so there is nothing fixed to protect. <code>__slots__</code> removes the dict and gives a fixed layout, trading the dynamism for memory.</p>\n<p>Explicit <code>self</code> falls out of the same model. A method is just a function stored on the class; <code>obj.m()</code> finds <code>m</code> on the type and binds <code>obj</code> as the first argument. Once that is the mechanism, hiding the first parameter would be a lie.</p>\n<p>TypeScript's <code>private</code> is a compile-time annotation and nothing more — the emitted JavaScript has an ordinary property that any JS consumer, any <code>Object.keys</code>, and any <code>JSON.stringify</code> will happily see. The <code>#name</code> syntax is a real ECMAScript private field: enforced by the engine, invisible to reflection, and a <code>TypeError</code> if accessed from outside. Reach for <code>#</code> when the boundary must hold at runtime, and <code>private</code> when it only has to hold in review.</p>",
        "why": "A Java developer will assume Python's <code>__x</code> is a privacy guarantee and design around it; it is not, and any consumer can read <code>obj._ClassName__x</code>. In the other direction, TypeScript's <code>private</code> looks like Java's and behaves like Python's underscore — a private field lands in <code>JSON.stringify</code> output and leaks straight into an API response, which is a real bug class rather than a style question. Python's ability to add an attribute to a live object also has no Java analogue, so defensive code that checks <code>hasattr</code> reads as paranoid to a Java eye and as ordinary to a Python one.",
        "apply": [
          "<b>Use <code>#field</code>, not <code>private</code>, in TypeScript</b> when the value must not escape at runtime — <code>private</code> survives into the emitted JS and into <code>JSON.stringify</code>.",
          "<b>Coming from Java, read Python's underscore as a request</b> — <code>_x</code> is convention and <code>__x</code> is only mangling; if invariants must hold, enforce them in a <code>@property</code> setter.",
          "<b>Expose computed reads as a property or accessor</b> in Python and TypeScript rather than porting Java's <code>getX()</code> naming across.",
          "<b>Add <code>__slots__</code> in Python</b> when a class is instantiated in bulk and its attribute set is genuinely closed."
        ],
        "code3": {
          "java": "public class Account {\n    private final String owner;   // enforced by javac AND the JVM verifier\n    private long balanceCents;\n\n    public Account(String owner, long balanceCents) {\n        this.owner = owner;               // `this` is implicit but usually written\n        this.balanceCents = balanceCents;\n    }\n    public void deposit(long cents) {\n        if (cents <= 0) throw new IllegalArgumentException(\"must be positive\");\n        this.balanceCents += cents;\n    }\n    public long getBalanceCents() { return balanceCents; }   // read-only accessor\n    public static void main(String[] args) {\n        var a = new Account(\"ada\", 100);\n        a.deposit(50);\n        System.out.println(a.getBalanceCents());   // 150\n        // a.balanceCents = 0;   // error: balanceCents has private access\n    }\n}",
          "python": "class Account:\n    def __init__(self, owner: str, balance_cents: int) -> None:\n        self._owner = owner               # single underscore = convention only\n        self.__balance = balance_cents    # mangled to _Account__balance\n\n    def deposit(self, cents: int) -> None:\n        if cents <= 0:\n            raise ValueError(\"must be positive\")\n        self.__balance += cents\n\n    @property\n    def balance_cents(self) -> int:       # no setter defined => read-only\n        return self.__balance\n\na = Account(\"ada\", 100)\na.deposit(50)\nprint(a.balance_cents)       # 150\nprint(a._Account__balance)   # 150 — mangling is collision avoidance, not privacy\n# a.balance_cents = 0        # AttributeError: property 'balance_cents' has no setter",
          "ts": "class Account {\n  #balance: number;   // a real ECMAScript private field: enforced at runtime\n\n  constructor(readonly owner: string, balance: number) {\n    this.#balance = balance;   // `readonly owner` is a parameter property\n  }\n  deposit(cents: number): void {\n    if (cents <= 0) throw new RangeError(\"must be positive\");\n    this.#balance += cents;\n  }\n  get balanceCents(): number { return this.#balance; }   // no setter => read-only\n}\n\nconst a = new Account(\"ada\", 100);\na.deposit(50);\nconsole.log(a.balanceCents);        // 150\nconsole.log(Object.keys(a));        // [ 'owner' ] — #balance is invisible\nconsole.log(JSON.stringify(a));     // {\"owner\":\"ada\"} — a `private` field would leak here\n// a.balanceCents = 0;              // Error: Cannot assign, it only has a getter"
        },

      {
        "id": "interfaces-contracts",
        "title": "Interfaces & Contracts",
        "lede": "Java checks interfaces by name, Python by duck-typing at the call, and TypeScript by shape — no `implements` needed.",
        "what": "<p>An interface states what a type can do without saying how. The three languages differ on the only question that matters: <i>when and how is conformance decided</i> — by declaration, by shape, or by whether the call happens to work.</p>\n<p>This is the term where a Java mental model misleads most. In Java, implementing an interface is an act; in TypeScript it is an accident of having the right members; in Python it is usually not checked at all.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Conformance</td><td>nominal — must <code>implements</code></td><td>duck-typed at the call</td><td>structural — shape match</td></tr>\n<tr><td>Declaring intent</td><td>required</td><td><code>ABC</code> or <code>Protocol</code>, optional</td><td><code>implements</code> is just an assertion</td></tr>\n<tr><td>Checked when</td><td>compile + class load</td><td>at attribute access</td><td>compile only</td></tr>\n<tr><td>Default bodies</td><td><code>default</code> methods</td><td>concrete methods on the ABC</td><td>none — types only</td></tr>\n<tr><td>Can hold state</td><td>no — only <code>static final</code></td><td>yes, on an ABC</td><td>no</td></tr>\n<tr><td>Runtime test</td><td><code>x instanceof I</code></td><td><code>isinstance</code> if <code>@runtime_checkable</code></td><td>none — write a type guard</td></tr>\n</tbody>\n</table>\n<p>Java's nominal typing buys an exact guarantee and charges for it. The interface name is written into the class file, <code>instanceof</code> is precise, and <code>invokeinterface</code> dispatches without ambiguity. The cost is that you cannot retrofit an interface onto a type you do not own — a third-party class with a perfectly matching <code>area()</code> method still needs an adapter. <code>default</code> methods were added in Java 8 for one reason: to let <code>Collection</code> grow <code>stream()</code> without breaking every implementer ever compiled. They are an interface-evolution tool, not a mixin mechanism, and interfaces still cannot hold state.</p>\n<p>Python's ABCs are nominal-ish — subclass or <code>register()</code> — while <code>typing.Protocol</code> (PEP 544) is structural but exists only for the type checker. Add <code>@runtime_checkable</code> and <code>isinstance</code> starts working, but it checks that the <i>method names</i> exist and nothing about their signatures, so it will cheerfully approve a class whose <code>area</code> takes four arguments. Most Python code declares no interface at all and simply calls the method.</p>\n<p>TypeScript is structural because it is describing JavaScript, where an object is a bag of properties with no nominal identity at runtime. Nothing to check against, so the compiler checks shape. That makes typing existing JS tractable and makes object literals conform for free — but two unrelated interfaces with identical shapes become interchangeable, and there is no way to say \"this string is a <code>UserId</code> and that one is not\" without a branding trick.</p>\n<pre><code data-lang=\"ts\">// Structural typing has no opinion about intent.\ninterface Meters { value: number }\ninterface Feet   { value: number }\nconst m: Meters = { value: 10 };\nconst f: Feet = m;        // fine — identical shapes are the same type\n\n// Branding forces nominal behaviour back in:\ntype UserId = string &amp; { readonly __brand: unique symbol };</code></pre>",
        "why": "A Java developer will look for <code>implements</code> in TypeScript and misread its absence as untyped code; it is checked, just structurally, and adding <code>implements</code> only makes the compiler verify the claim earlier with a better error. Going the other way, code that relies on structural or duck typing does not port to Java without adapters, which turns a two-line change into a class. And the fact that TypeScript interfaces do not exist at runtime catches people constantly: there is no <code>instanceof Shape</code>, so every runtime check has to be a hand-written type guard.",
        "apply": [
          "<b>Reach for <code>Protocol</code>, not <code>ABC</code></b>, when typing something you do not own — an ABC demands inheritance, a Protocol only demands the shape.",
          "<b>Coming from Java, do not hunt for <code>implements</code> in TypeScript</b> — write it anyway on classes you own, purely to make the error point at the class rather than at every call site.",
          "<b>Never trust <code>isinstance</code> against a <code>@runtime_checkable</code> Protocol</b> for correctness — it checks method names only, never signatures.",
          "<b>Brand your TypeScript identifier types</b> when two same-shaped types must not be swapped; structural typing will otherwise let them through silently."
        ],
        "code3": {
          "java": "interface Shape {\n    double area();\n    default String describe() { return \"area=\" + area(); }   // interface evolution\n}\n\n// Both records MUST name the interface — nominal conformance.\nrecord Circle(double r) implements Shape {\n    public double area() { return Math.PI * r * r; }\n}\nrecord Square(double s) implements Shape {\n    public double area() { return s * s; }\n}\n\n// in a method body:\nList<Shape> shapes = List.of(new Circle(1), new Square(2));\ndouble total = shapes.stream().mapToDouble(Shape::area).sum();\nSystem.out.printf(\"%.2f%n\", total);                   // 7.14\nSystem.out.println(new Square(2).describe());         // area=4.0\nSystem.out.println(shapes.get(0) instanceof Shape);   // true — real at runtime",
          "python": "import math\nfrom typing import Protocol, runtime_checkable\n\n@runtime_checkable\nclass Shape(Protocol):\n    def area(self) -> float: ...\n\nclass Circle:                     # no base class, no `implements`\n    def __init__(self, r: float) -> None: self.r = r\n    def area(self) -> float: return math.pi * self.r ** 2\n\nclass Square:\n    def __init__(self, s: float) -> None: self.s = s\n    def area(self) -> float: return self.s ** 2\n\nshapes: list[Shape] = [Circle(1), Square(2)]     # checkers accept: the shape matches\nprint(f\"{sum(s.area() for s in shapes):.2f}\")    # 7.14\nprint(isinstance(Circle(1), Shape))              # True — but it only checked the NAME",
          "ts": "interface Shape {\n  area(): number;\n}\n\nclass Circle {   // no `implements` — a structural match is enough\n  constructor(private r: number) {}\n  area(): number { return Math.PI * this.r ** 2; }\n}\n\nconst square = { s: 2, area() { return this.s ** 2; } };   // a plain object fits too\n\nconst shapes: Shape[] = [new Circle(1), square];\nconst total = shapes.reduce((acc, s) => acc + s.area(), 0);\nconsole.log(total.toFixed(2));   // 7.14\n\n// `Shape` is erased: there is no `x instanceof Shape`. Write a type guard.\nconst isShape = (x: unknown): x is Shape =>\n  typeof (x as Shape | undefined)?.area === \"function\";\nconsole.log(isShape(square), isShape({}));   // true false"
        },
        "related": [

      {
        "id": "inheritance-polymorphism",
        "title": "Inheritance & Polymorphism",
        "lede": "Java allows one superclass plus many interfaces, Python allows multiple inheritance resolved by C3, and TypeScript composes mixins instead.",
        "what": "<p>Every object system has to answer the diamond question: if a type inherits from two places that both define <code>m</code>, which one runs? Java sidesteps it, Python answers it with an algorithm, and TypeScript does not have the problem because it only ever has one prototype chain.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Multiple inheritance</td><td>no — interfaces only</td><td>yes — C3 linearization</td><td>no — mixins + intersections</td></tr>\n<tr><td>Resolution order</td><td>single chain</td><td><code>__mro__</code>, computed per class</td><td>prototype chain</td></tr>\n<tr><td>Virtual by default</td><td>yes, unless <code>final</code></td><td>always — no opt-out</td><td>always — no opt-out</td></tr>\n<tr><td><code>super</code> means</td><td>the direct parent</td><td>the <i>next class in the MRO</i></td><td>the direct parent</td></tr>\n<tr><td>Abstract</td><td><code>abstract class</code>, real</td><td><code>ABC</code> + <code>@abstractmethod</code></td><td><code>abstract</code>, erased</td></tr>\n<tr><td>Closing the hierarchy</td><td><code>sealed</code> + <code>permits</code></td><td>nothing</td><td>a union type</td></tr>\n</tbody>\n</table>\n<p>Java refused multiple implementation inheritance to dodge the diamond outright: two superclasses means two sets of fields and an unanswerable question about which <code>m</code> wins. Interfaces carry no state, so they can be multiply inherited safely. Java 8's <code>default</code> methods reopened a narrow version of the problem, resolved by fixed rules — a class beats an interface, a more specific interface beats a less specific one, and anything still ambiguous is a compile error you must override away.</p>\n<p>Python went the other way and made the ordering explicit. C3 linearization produces a single list, <code>__mro__</code>, and this is the detail that Java developers misread: <code>super()</code> does not mean \"my parent\". It means \"the next class in the MRO <i>of the instance's actual type</i>\", which is only knowable at call time. That is what makes cooperative multiple inheritance work — a mixin's <code>super().speak()</code> can land on a class the mixin has never heard of — and it is why a class must never assume what <code>super()</code> will reach.</p>\n<p>JavaScript has one prototype chain, so TypeScript expresses mixins as a function that takes a base class and returns a subclass of it; the type-level half is an intersection. It composes, but the chain stays linear and there is no MRO to reason about.</p>\n<p>Virtual dispatch is the quiet difference. Java methods are virtual unless marked <code>final</code>, which lets the JIT devirtualize and inline aggressively. Python and JavaScript are always dynamic — every call is a lookup, and there is no way to forbid an override.</p>",
        "why": "The <code>super()</code> misreading is expensive: a Java developer writes a Python mixin assuming <code>super()</code> targets a fixed parent, and the method silently lands somewhere else — or the chain breaks entirely because one class in it forgot to call <code>super()</code>. In the other direction, a Python design leaning on multiple inheritance has no Java translation and must be restructured into composition or interfaces with defaults. And <code>abstract</code> in TypeScript feels like Java's but is erased, so nothing stops JavaScript callers from instantiating the class at runtime.",
        "apply": [
          "<b>Read Python's <code>super()</code> as \"next in the MRO\", never \"my parent\"</b> — check <code>Cls.__mro__</code> before assuming which method a mixin will reach.",
          "<b>Coming from Python, expect to compose rather than inherit in Java</b> — a second superclass is not available, so hoist shared state into a field and shared behaviour into an interface with <code>default</code> methods.",
          "<b>Call <code>super()</code> in every cooperative Python mixin</b>, even when it looks unnecessary — one class that skips it silently truncates the chain for everyone downstream.",
          "<b>Use <code>sealed</code> in Java or a union in TypeScript</b> when the set of subtypes is closed; both buy exhaustiveness checking that Python cannot offer."
        ],
        "code3": {
          "java": "abstract class Animal {\n    protected final String name;\n    Animal(String name) { this.name = name; }\n    abstract String sound();\n    String speak() { return name + \" says \" + sound(); }\n}\ninterface Swimmer {                                  // no state allowed\n    default String swim() { return \"paddling\"; }     // a default method\n}\n// ONE superclass, any number of interfaces.\nfinal class Dog extends Animal implements Swimmer {\n    Dog(String name) { super(name); }                // super = the direct parent\n    @Override String sound() { return \"woof\"; }\n    @Override String speak() { return super.speak() + \"!\"; }\n}\n\n// in a method body:\nAnimal a = new Dog(\"rex\");\nSystem.out.println(a.speak());               // rex says woof!  — virtual dispatch\nSystem.out.println(new Dog(\"rex\").swim());   // paddling",
          "python": "class Animal:\n    def __init__(self, name: str) -> None:\n        self.name = name\n    def sound(self) -> str:\n        raise NotImplementedError\n    def speak(self) -> str:\n        return f\"{self.name} says {self.sound()}\"\n\nclass Loud:                              # a mixin — it does NOT inherit from Animal\n    def speak(self) -> str:\n        return super().speak().upper()   # super() = NEXT in the MRO, not a fixed class\n\nclass Dog(Loud, Animal):                 # multiple inheritance\n    def sound(self) -> str:\n        return \"woof\"\n\nprint(Dog(\"rex\").speak())                 # REX SAYS WOOF\nprint([c.__name__ for c in Dog.__mro__])  # ['Dog', 'Loud', 'Animal', 'object']\n# Loud.speak's super() resolves to Animal only because of Dog's MRO.",
          "ts": "class Animal {\n  constructor(protected name: string) {}\n  sound(): string { throw new Error(\"not implemented\"); }\n  speak(): string { return `${this.name} says ${this.sound()}`; }\n}\ntype Ctor<T> = new (...args: any[]) => T;\n\n// No multiple inheritance: a mixin is a function returning a subclass.\nfunction Loud<T extends Ctor<Animal>>(Base: T) {\n  return class extends Base {\n    override speak(): string { return super.speak().toUpperCase(); }\n  };\n}\nclass Dog extends Loud(Animal) {   // still ONE prototype chain, just composed\n  override sound(): string { return \"woof\"; }\n}\n\nconst d: Animal = new Dog(\"rex\");\nconsole.log(d.speak());   // REX SAYS WOOF — always virtual, no `final` to opt out"

      {
        "id": "modules-imports",
        "title": "Modules & Imports",
        "lede": "Java imports a type name from a package, Python imports a file as a live object, and TypeScript imports from a file path.",
        "what": "<p>The unit of code organisation differs in a way that is easy to skim past and then trips you for years. Java's import names a <i>type</i> in a namespace. Python's binds a <i>module object</i>. TypeScript's resolves a <i>path</i>. Everything else follows from that.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Unit</td><td>package + class</td><td>module = one <code>.py</code> file</td><td>module = one file</td></tr>\n<tr><td>You import</td><td>a type name</td><td>a module object or a name in it</td><td>bindings from a path</td></tr>\n<tr><td>Specifier</td><td>a namespace</td><td>a name resolved via <code>sys.path</code></td><td>a path or a bare specifier</td></tr>\n<tr><td>Grouping</td><td>directory = package</td><td>directory + <code>__init__.py</code></td><td><code>index.ts</code> barrel</td></tr>\n<tr><td>Imported names are</td><td>compile-time references</td><td>copies of the reference</td><td>live bindings</td></tr>\n<tr><td>Circular import</td><td>fine — linked lazily</td><td><code>ImportError</code> if not yet bound</td><td>ESM often survives; CJS gives <code>undefined</code></td></tr>\n</tbody>\n</table>\n<p>In Java, <code>import java.util.List</code> introduces a name, and the compiler finds the type on the classpath. The directory layout is a convention the class loader depends on, not part of the import — which is why two jars can contribute classes to the same package, and why moving a file without changing its <code>package</code> line breaks the build. Java 9's module system added a second layer above packages: <code>module-info.java</code> declares which packages are <code>exports</code>ed, so a public class is no longer automatically reachable.</p>\n<p>Python's import runs the file. The whole module body executes exactly once, the resulting module object is cached in <code>sys.modules</code>, and later imports get the cache. Because the module is a first-class object with a <code>__dict__</code>, <code>from m import f</code> <i>copies the current reference</i> into your namespace — rebind <code>m.f</code> afterwards and your imported name still points at the old object. This surprises people constantly, and it is the reason monkeypatching has to target the module attribute rather than the imported name.</p>\n<p>ESM went the other way: imports are live bindings into the exporting module's scope, so a later reassignment there <i>is</i> visible to importers, and assigning to an import is a compile error. That difference explains why the same circular shape fails differently — ESM hoists declarations and can often survive a cycle, CommonJS <code>require</code> hands back a half-built <code>module.exports</code>, and Python raises <code>ImportError: cannot import name ... (most likely due to a circular import)</code> the moment a name is not bound yet.</p>",
        "why": "The path-versus-namespace distinction decides how a refactor goes: moving a Python or TypeScript file changes every importer, while moving a Java file changes nothing as long as the package line matches the directory. Python's copy-the-reference semantics is a live bug source for anyone arriving from ESM — patch <code>module.func</code> in a test and code that did <code>from module import func</code> never sees the patch. And circular imports, which a Java developer has never had to think about because the linker resolves lazily, are a design constraint in both other languages.",
        "apply": [
          "<b>Import the module, not the name, in Python</b> when the target may be rebound or patched — <code>from m import f</code> snapshots the reference at import time.",
          "<b>Coming from Java, expect the file path to be part of the import in Python and TypeScript</b> — moving a file is a breaking change, not a bookkeeping detail.",
          "<b>Break Python import cycles by moving the import into the function body</b>, or by hoisting the shared types into a third module that neither imports.",
          "<b>Keep <code>__init__.py</code> and barrel files thin</b> — every symbol re-exported there is executed on first import and drags its whole transitive graph in with it."
        ],

      {
        "id": "packages-dependencies",
        "title": "Packages & Dependency Management",
        "lede": "Maven and pip force one version of a library per application; npm nests conflicting versions and lets several coexist.",
        "what": "<p>Every dependency manager solves the same two problems — fetch the transitive graph, then decide what happens when two paths want different versions of the same library. The second answer is where Java, Python and JavaScript genuinely part company.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Manifest</td><td><code>pom.xml</code> / <code>build.gradle</code></td><td><code>pyproject.toml</code></td><td><code>package.json</code></td></tr>\n<tr><td>Registry / artifact</td><td>Maven Central, <code>.jar</code></td><td>PyPI, wheel</td><td>npm registry, tarball</td></tr>\n<tr><td>Isolation unit</td><td>the classpath</td><td>the virtualenv</td><td><code>node_modules</code> per project</td></tr>\n<tr><td>Version conflict</td><td>one wins silently</td><td>hard resolver error</td><td>both installed, nested</td></tr>\n<tr><td>Lockfile</td><td>uncommon by default</td><td><code>uv.lock</code>, <code>poetry.lock</code></td><td><code>package-lock.json</code>, <code>pnpm-lock.yaml</code></td></tr>\n<tr><td>Range style</td><td>exact pins are normal</td><td>PEP 440, <code>&gt;=1.2,&lt;2</code></td><td>semver, <code>^1.2.3</code> by default</td></tr>\n</tbody>\n</table>\n<p>Java has one flat classpath, and two versions of the same class cannot both be loaded by one class loader. So Maven picks the version <i>nearest the root</i> of the dependency tree and drops the others without asking; Gradle instead picks the <i>highest</i>. Either way the loser disappears silently, and if a method vanished between those two versions the failure arrives much later as <code>NoSuchMethodError</code> at the first call. This is the single most common Java dependency incident, and <code>mvn dependency:tree</code> exists to diagnose it.</p>\n<p>Python is structurally similar. There is one <code>site-packages</code> per environment, so exactly one version of a library can be installed — the environment, not the project, is the unit of isolation, because Python has no per-import path scoping. Modern resolvers (pip's since 2020, and <code>uv</code>) backtrack across the whole graph and fail loudly with an unsatisfiable-constraint error rather than picking a winner. Loud beats silent, but it means genuinely incompatible transitive pins are a wall, not a warning.</p>\n<p>Node's resolver walks up from the importing file through each <code>node_modules</code>, which lets package <code>a</code> keep its own copy of <code>lodash@3</code> while everything else uses <code>lodash@4</code>. Diamonds simply do not conflict. The bills come as disk usage and duplicated module identity: two copies of a class are two distinct classes, so <code>instanceof</code> fails across them and singletons stop being single. pnpm keeps the nesting semantics but hard-links from a content-addressed store, which recovers most of the disk.</p>\n<p>Semver ranges are the other half. npm's default <code>^1.2.3</code> auto-accepts any 1.x, so the lockfile is not optional — without it, two installs a week apart are different programs.</p>",
        "why": "The conflict model changes what a version bump costs. On the JVM or in a venv, one library pinning an old transitive dependency can block an upgrade for the whole application; in Node it usually just installs both and moves on. Coming from npm, the absence of nesting is the surprise — you cannot have two versions, so the fight has to be resolved rather than deferred. Coming from Maven, the surprise is the opposite: <code>instanceof</code> and singleton checks quietly fail in Node because the same package got installed twice at different paths.",
        "apply": [
          "<b>Commit a lockfile in Python and Node</b> — <code>^1.2.3</code> and an unpinned <code>requirements.txt</code> both mean \"whatever resolved today\".",
          "<b>Run <code>mvn dependency:tree</code> before believing a version</b> — the pom declares intent, the tree shows what nearest-wins actually kept.",
          "<b>Coming from npm, expect to arbitrate conflicts rather than duplicate</b> in Java and Python; one version per classpath and per virtualenv is a hard constraint, not a default.",
          "<b>Suspect duplicate installs when <code>instanceof</code> fails in Node</b> — two copies of a package at different paths produce two unrelated classes."
        ],

          "python": "# pyproject.toml\n#   [project]\n#   dependencies = [\"httpx>=0.27,<0.29\", \"attrs~=24.2\"]   # PEP 440 specifiers\n#\n# $ uv venv && uv add httpx    # creates .venv/ and writes uv.lock\n# $ uv sync                    # installs EXACTLY what uv.lock pins\n\nimport httpx                      # from .venv/lib/python3.12/site-packages/\nimport importlib.metadata as md\n\nprint(md.version(\"httpx\"))        # 0.28.1 — the one resolved version\nprint(md.requires(\"httpx\")[:2])   # ['anyio', 'certifi'] — its own transitives\n\n# One site-packages per venv => exactly ONE version of httpx can exist.\n# Incompatible constraints are a hard error, never a silent pick:\n#   error: no solution found when resolving dependencies",

      {
        "id": "exceptions-errors",
        "title": "Exceptions & Error Handling",
        "lede": "Java's checked exceptions force a compile-time choice no other language here makes; TS cannot even promise the caught value is an Error.",
        "what": "<p>The shapes look interchangeable — <code>try</code>, a handler, a cleanup block — and then two details diverge hard: whether the compiler makes you deal with a failure, and what type the handler actually receives.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Checked at compile</td><td>yes — <code>throws</code> in the signature</td><td>no</td><td>no</td></tr>\n<tr><td>Clauses</td><td><code>try/catch/finally</code></td><td><code>try/except/else/finally</code></td><td><code>try/catch/finally</code></td></tr>\n<tr><td>Handler binds</td><td>the declared exception type</td><td>the exception instance</td><td><code>unknown</code> under <code>strict</code></td></tr>\n<tr><td>Multi-catch</td><td><code>catch (A | B e)</code></td><td><code>except (A, B) as e</code></td><td>none — branch by hand</td></tr>\n<tr><td>Chaining</td><td><code>new E(msg, cause)</code></td><td><code>raise E from err</code></td><td><code>new Error(msg, { cause })</code></td></tr>\n<tr><td>Throwable values</td><td>must extend <code>Throwable</code></td><td>must extend <code>BaseException</code></td><td>literally anything</td></tr>\n</tbody>\n</table>\n<p>Checked exceptions are Java's alone and remain its most argued-about decision. The compiler will not let an <code>IOException</code> pass unhandled, which pushes failure modes into the type system where they are visible and reviewable. In practice it also produces acres of <code>catch (Exception e) { throw new RuntimeException(e); }</code>, because the checked type is right at the wrong layer. Lambdas made it worse: <code>Function.apply</code> declares no <code>throws</code>, so a checked exception cannot escape a stream pipeline at all. Nothing in the JVM enforces any of this — <code>throws</code> is a javac-only rule and the bytecode can throw whatever it likes, which is exactly why Kotlin and Scala dropped it.</p>\n<p>Python's <code>else</code> clause is the piece that most people never adopt. It runs only when the <code>try</code> body raised nothing, which lets you keep the <code>try</code> down to the single line that can actually fail — worth caring about, because <code>except</code> catches from the entire block and will happily swallow a failure you did not mean to cover. Chaining is automatic: <code>raise E from err</code> sets <code>__cause__</code>, and even a bare <code>raise E</code> inside an <code>except</code> records <code>__context__</code>, so the original traceback is never actually lost.</p>\n<p>TypeScript types the catch binding as <code>unknown</code> (under <code>useUnknownInCatchVariables</code>, on with <code>strict</code> since 4.4) for an honest reason: JavaScript permits <code>throw 42</code>, or <code>throw undefined</code>. There is no guarantee whatsoever that a caught value is an <code>Error</code>, so every handler has to start by narrowing. Java and Python both constrain throwables to a class hierarchy and simply do not have this problem.</p>",
        "why": "A Java developer moving to Python or TypeScript loses the compiler's insistence that failures be handled, and the usual result is code that handles nothing until production finds the gap. Moving the other way, checked exceptions are a design constraint rather than a syntax detail — a helper that throws <code>IOException</code> infects every caller's signature, and dropping it into a stream simply will not compile. And <code>catch (e)</code> reads as familiar in TypeScript right up to the moment <code>e.message</code> fails to compile because <code>e</code> is <code>unknown</code>.",
        "apply": [
          "<b>Narrow before touching a caught value in TypeScript</b> — start every handler with <code>e instanceof Error</code>, because JavaScript can throw any value at all.",
          "<b>Coming from Java, do not expect a signature to advertise failure</b> in Python or TypeScript; put the failure modes in the docstring or the return type, since nothing else will.",
          "<b>Keep the Python <code>try</code> body to the one line that can fail</b> and move the rest into <code>else</code> — a wide <code>try</code> swallows errors you never intended to catch.",
          "<b>Always chain the cause</b> — <code>raise E from err</code>, <code>{ cause }</code>, or the two-argument constructor; a re-raise that drops the original turns a five-minute diagnosis into an afternoon."
        ],
        "code3": {
          "java": "import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\nstatic class ConfigException extends Exception {          // extends Exception = CHECKED\n    ConfigException(String msg, Throwable cause) { super(msg, cause); }\n}\n\n// `throws` is part of the contract: every caller must catch or declare it.\nstatic int readPort(Path p) throws ConfigException {\n    try {\n        return Integer.parseInt(Files.readString(p).trim());\n    } catch (IOException e) {              // checked — the compiler REQUIRED this\n        throw new ConfigException(\"cannot read \" + p, e);      // chain the cause\n    } catch (NumberFormatException e) {    // unchecked — catching was optional\n        throw new ConfigException(\"not a number in \" + p, e);\n    } finally {\n        System.out.println(\"done\");        // runs on every path\n    }\n}",
          "python": "from pathlib import Path\n\nclass ConfigError(Exception):\n    pass\n\n# Nothing in the signature declares failure: every exception is unchecked.\ndef read_port(p: Path) -> int:\n    try:\n        raw = p.read_text()          # keep the try body to the line that can fail\n    except OSError as e:             # optional — nothing forces this handler\n        raise ConfigError(f\"cannot read {p}\") from e   # sets __cause__\n    else:\n        return int(raw.strip())      # else = \"the try body raised nothing\"\n    finally:\n        print(\"done\")                # runs on every path, including the raise\n\n# int() failing escapes as a bare ValueError — no compiler mentioned it.",
          "ts": "import { readFile } from \"node:fs/promises\";\n\nclass ConfigError extends Error {}\n\nasync function readPort(path: string): Promise<number> {\n  try {\n    const raw = await readFile(path, \"utf8\");\n    const n = Number.parseInt(raw.trim(), 10);\n    if (Number.isNaN(n)) throw new ConfigError(`not a number in ${path}`);\n    return n;\n  } catch (e) {   // e is `unknown` under strict — JS can `throw 42`\n    if (e instanceof ConfigError) throw e;\n    // console.log(e.message);   // Error: 'e' is of type 'unknown'\n    const cause = e instanceof Error ? e : new Error(String(e));\n    throw new ConfigError(`cannot read ${path}`, { cause });   // ES2022 cause\n  } finally {\n    console.log(\"done\");\n  }\n}"
        },

      {
        "id": "generics",
        "title": "Generics",
        "lede": "All three erase type arguments before runtime — Java patches the gap with wildcards, Python never checks, TypeScript infers structurally.",
        "what": "<p>Generics let a type or function be parameterised by another type. All three erase those parameters before the code runs, which sounds like agreement and is not: they erase for different reasons, and each pays a different bill.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>Declaration</td><td><code>class Box&lt;T&gt;</code></td><td><code>class Box[T]</code> (PEP 695)</td><td><code>class Box&lt;T&gt;</code></td></tr>\n<tr><td>Bounds</td><td><code>&lt;T extends Comparable&lt;T&gt;&gt;</code></td><td><code>[T: SupportsRichComparison]</code></td><td><code>&lt;T extends Shape&gt;</code></td></tr>\n<tr><td>Variance</td><td>invariant + use-site wildcards</td><td>declaration-site or inferred</td><td>inferred from position</td></tr>\n<tr><td>Arrays / lists</td><td><code>List&lt;String&gt;</code> is not a <code>List&lt;Object&gt;</code></td><td>nothing is checked</td><td><code>string[]</code> IS an <code>unknown[]</code></td></tr>\n<tr><td><code>new T()</code></td><td>impossible — pass <code>Class&lt;T&gt;</code></td><td>impossible — pass the class</td><td>impossible — no runtime type</td></tr>\n<tr><td>Enforcement</td><td>compile; <code>ClassCastException</code> later</td><td>none, unless a checker runs</td><td>compile only</td></tr>\n</tbody>\n</table>\n<p>Java erased in 2004 to keep binary compatibility. A <code>List&lt;String&gt;</code> had to stay a plain <code>List</code> in the class file so that pre-generics jars and pre-generics callers kept working — a migration decision, not a design preference. The bill: no <code>new T[]</code>, no <code>instanceof List&lt;String&gt;</code>, and heap pollution when an unchecked cast lets the wrong element in and the <code>ClassCastException</code> surfaces at some unrelated read. Wildcards then exist because generics are invariant: a <code>List&lt;String&gt;</code> cannot be a <code>List&lt;Object&gt;</code>, or you could add an <code>Integer</code> to it. PECS — <code>? extends</code> to read from a Producer, <code>? super</code> to write to a Consumer — reintroduces the variance one use site at a time.</p>\n<p>Python's annotations are metadata and nothing else. They are attached to <code>__annotations__</code> and the interpreter never looks at them, so a <code>list[int]</code> full of strings runs perfectly until something downstream chokes on a value with a confusing traceback. PEP 695 (3.12) added real syntax — <code>def first[T](xs: list[T]) -> T</code> — with properly scoped type parameters, replacing the old <code>TypeVar</code> boilerplate. It changed nothing at runtime; the checking still lives entirely in mypy or pyright.</p>\n<p>TypeScript erases because JavaScript has no types to keep. Its generics are structural and inferred aggressively, and variance is computed from where the parameter appears — output positions covariant, input positions contravariant, with <code>in</code>/<code>out</code> annotations available since 4.7 to state it explicitly. Notably, arrays are covariant, so <code>string[]</code> is assignable to <code>unknown[]</code>. That is unsound by the same argument that makes Java invariant; TypeScript took the ergonomics and accepted the hole.</p>",
        "why": "The three erasures fail differently and that decides where you look when something breaks. Java's shows up as a <code>ClassCastException</code> on a line that contains no cast, thrown by a compiler-inserted one. Python's does not show up at all — the annotation was decorative, and only CI running a checker would have caught it. TypeScript's shows up as nothing until an array covariance hole lets a wrong value through at runtime. A Java developer will also reach for <code>T.class</code> or <code>new T()</code> in all three and find it impossible in all three, for three unrelated reasons.",
        "apply": [
          "<b>Apply PECS in Java signatures</b> — <code>? extends T</code> for parameters you only read, <code>? super T</code> for ones you only write; skipping it makes the method unusable with subtypes.",

          "java": "import java.util.*;\nimport java.util.function.Function;\n\nrecord Box<T>(T value) {\n    // PECS: consume a T (super), produce an R (extends)\n    <R> Box<R> map(Function<? super T, ? extends R> f) {\n        return new Box<>(f.apply(value));\n    }\n}\n// in a method body:\nBox<String> b = new Box<>(\"hi\");\nSystem.out.println(b.map(String::length));   // Box[value=2]\n\n// List<Object> o = new ArrayList<String>();   // error: generics are INVARIANT\nList<?> any = List.of(1, \"two\");               // unbounded wildcard: read-only\nSystem.out.println(any.size());                // 2\nSystem.out.println(new Box<>(\"x\").getClass()); // class Box — the <String> is GONE\n// if (any instanceof List<String>) {}         // error: illegal generic type",
          "python": "from collections.abc import Callable\n\nclass Box[T]:                        # PEP 695 syntax (Python 3.12+)\n    def __init__(self, value: T) -> None:\n        self.value = value\n    def map[R](self, f: Callable[[T], R]) -> \"Box[R]\":\n        return Box(f(self.value))\n\ndef first[T](xs: list[T]) -> T:\n    return xs[0]\n\nprint(Box(\"hi\").map(len).value)   # 2\nprint(first([1, 2, 3]))           # 1\nprint(type(Box(\"hi\")))            # <class '__main__.Box'> — no type arg at runtime\n\nbad: list[int] = [\"not an int\"]   # runs fine: annotations are NEVER enforced\nprint(first(bad) + \"!\")           # not an int!  — only a type checker would object",

        "id": "enums",
        "title": "Enums",
        "lede": "Java's enum is a full class with fields and exhaustive switch; Python's is a class of singletons; TS's is the one construct that emits JS.",
        "what": "<p>An enum names a closed set of values. What differs is how much the member is allowed to <i>be</i> — a bare label, or an object with state and behaviour — and whether the compiler will tell you when a <code>switch</code> misses a case.</p>\n<table>\n<thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead>\n<tbody>\n<tr><td>What a member is</td><td>an instance of a real class</td><td>a singleton instance</td><td>a number or string</td></tr>\n<tr><td>Carries data</td><td>yes — constructor + fields</td><td>yes — <code>value</code> plus attributes</td><td>no — the value is all there is</td></tr>\n<tr><td>Methods on members</td><td>yes, even per-constant</td><td>yes</td><td>no</td></tr>\n<tr><td>Exhaustive <code>switch</code></td><td>checked in switch expressions</td><td>no runtime check</td><td>via a <code>never</code> assertion</td></tr>\n<tr><td>Iterate</td><td><code>values()</code></td><td>the class is iterable</td><td><code>Object.values(E)</code></td></tr>\n<tr><td>Idiomatic alternative</td><td>—</td><td><code>StrEnum</code> at boundaries</td><td>a union of string literals</td></tr>\n</tbody>\n</table>\n<p>Java's enum is sugar for a <code>final class</code> with private construction and one static instance per constant. That is why members can hold fields, implement interfaces, and even override a method per constant with a body of their own. Because the set is closed and known at compile time, a <code>switch</code> over an enum can be checked for exhaustiveness — mandatory for switch <i>expressions</i>, which is the main reason to prefer them. It also enables <code>EnumMap</code> and <code>EnumSet</code>, which are backed by arrays and bitsets rather than hashing, and are correspondingly fast.</p>\n<p>Python's <code>Enum</code> uses a metaclass to convert class attributes into singleton instances at class-creation time, so <code>Color.RED is Color.RED</code> holds and identity comparison is the idiom. <code>StrEnum</code> and <code>IntEnum</code> (3.11 brought the former) mix in <code>str</code> or <code>int</code>, so the member <i>is</i> usable wherever the primitive is — which is what you want at a serialization boundary and what you do not want when you need the type distinction to survive. <code>match</code> performs no exhaustiveness check at runtime; mypy and pyright will flag a missing case only when they have something to prove against.</p>\n<p>TypeScript's <code>enum</code> is the one construct in the language that emits runtime code. Everything else erases, so <code>enum</code> quietly breaks the \"types are free\" model, and it does not survive type-stripping — Node's <code>--experimental-strip-types</code> rejects it, as does <code>isolatedModules</code> for <code>const enum</code>. Numeric enums also build a reverse map, so <code>E[0]</code> gives back <code>\"RED\"</code> and <code>Object.values</code> returns both directions. The modern replacement is a union of string literals with <code>as const</code>: it erases completely, serializes as itself, and still gets exhaustiveness through a <code>never</code> check.</p>",
        "why": "A Java developer will expect enum members to carry behaviour and find TypeScript's are just labels — a lookup table or a union with a helper function is the port, not a translation. Python's <code>StrEnum</code> is the pragmatic middle and worth knowing early, because plain <code>Enum</code> members do not compare equal to their string values, which produces a genuinely mystifying bug when one crosses a JSON boundary. And in TypeScript, choosing <code>enum</code> over a literal union commits you to emitted runtime code that some toolchains will simply refuse to build.",
        "apply": [
          "<b>Prefer a union of string literals over <code>enum</code> in TypeScript</b> — it erases, matches JSON directly, and works under type-stripping toolchains.",
          "<b>Coming from Java, expect no exhaustiveness for free</b> — add a <code>never</code> assertion in the TS <code>default</code> branch, and run a type checker in Python or nothing checks at all.",
          "<b>Use <code>StrEnum</code> at serialization boundaries in Python</b> — a plain <code>Enum</code> member is not equal to its own value, and that difference surfaces after the JSON round-trip.",
          "<b>Reach for <code>EnumMap</code> and <code>EnumSet</code> in Java</b> over <code>HashMap</code> keyed by an enum; they are array-backed and the intent is clearer."
        ],
        "code3": {
          "java": "enum Status {\n    ACTIVE(\"running\", 1),      // members are instances of a real class\n    PAUSED(\"on hold\", 0);\n\n    private final String label;\n    private final int weight;\n    Status(String label, int weight) { this.label = label; this.weight = weight; }\n    String label() { return label; }\n    int weight() { return weight; }\n}\n// in a method body:\nfor (Status s : Status.values())    // ACTIVE running / PAUSED on hold\n    System.out.println(s + \" \" + s.label());\n\nStatus s = Status.ACTIVE;\nString msg = switch (s) {   // a switch EXPRESSION must be exhaustive\n    case ACTIVE -> \"go\";\n    case PAUSED -> \"wait\";  // drop a case => \"does not cover all possible values\"\n};\nSystem.out.println(msg + \" \" + s.ordinal());   // go 0",
          "python": "from enum import Enum, StrEnum\n\nclass Status(Enum):\n    ACTIVE = (\"running\", 1)      # the value is a tuple, unpacked by __init__\n    PAUSED = (\"on hold\", 0)\n\n    def __init__(self, label: str, weight: int) -> None:\n        self.label = label       # members can carry any attributes\n        self.weight = weight\n\nfor s in Status:                 # the class itself is iterable\n    print(s.name, s.label)       # ACTIVE running / PAUSED on hold\n\nmatch Status.ACTIVE:             # no runtime exhaustiveness check at all\n    case Status.ACTIVE: print(\"go\")     # go\n    case Status.PAUSED: print(\"wait\")\n\nclass Kind(StrEnum):             # 3.11+: the member IS a str\n    JSON = \"json\"\nprint(Kind.JSON == \"json\", f\"{Kind.JSON}\")   # True json",
          "ts": "enum Status {          // the one TS construct that EMITS runtime code\n  Active = \"running\",\n  Paused = \"on hold\",\n}\nconsole.log(Object.values(Status));   // [ 'running', 'on hold' ]\n// The modern alternative: a literal union — fully erased, no emitted object.\nconst STATUSES = [\"running\", \"on hold\"] as const;\ntype StatusLit = (typeof STATUSES)[number];\n\nfunction describe(s: StatusLit): string {\n  switch (s) {\n    case \"running\": return \"go\";\n    case \"on hold\": return \"wait\";\n    default: {\n      const _exhaustive: never = s;   // compile error if a case is missing\n      return _exhaustive;\n    }\n  }\n}\nconsole.log(describe(\"running\"));   // go"
        },

        "id": "concurrency-model",
        "title": "Concurrency Models Compared",
        "lede": "Java runs real threads on shared memory, Python has threads but the GIL serialises them, JS runs one event loop.",
        "what": "<p>Concurrency is structuring a program as independently progressing tasks; parallelism is running them at literally the same instant on multiple cores. A language can offer one without the other, and the three here each drew that line differently.</p><p>The distinction that matters most: what is the unit of execution, and can two of them touch the same memory at the same time.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Unit</td><td>OS thread; virtual thread (21)</td><td>OS thread (GIL-bound); process</td><td>single event loop; worker</td></tr><tr><td>Real parallelism</td><td>yes, many cores</td><td>only via <code>multiprocessing</code></td><td>only via <code>worker_threads</code></td></tr><tr><td>Shared heap</td><td>yes</td><td>yes</td><td>no — messages/<code>SharedArrayBuffer</code></td></tr><tr><td>Cheap concurrency</td><td>virtual threads</td><td><code>asyncio</code></td><td><code>async</code>/<code>await</code></td></tr><tr><td>Data races</td><td>possible</td><td>possible</td><td>impossible (one thread)</td></tr></tbody></table><p>Java exposes real OS threads that share one heap, so it gets true multicore parallelism and, as the price, data races. Java 21 adds <i>virtual threads</i>: millions of lightweight threads multiplexed onto a few OS carriers, so blocking code stays cheap without changing the model.</p><p>Python's threads are also real OS threads, but the <b>Global Interpreter Lock</b> lets only one execute bytecode at a time. The GIL exists because CPython's memory management is reference-counted and non-atomic refcount updates would corrupt without it; it also keeps C extensions simple. The consequence is that threads help I/O-bound work (the GIL is released during blocking calls) but not CPU-bound work — for that you spawn processes. PEP 703 adds an experimental free-threaded build in 3.13+ that removes the GIL.</p><p>JavaScript was born in a browser where a second thread mutating the DOM would be chaos, so it runs one thread draining an event loop. Nothing preempts your function, so there are no data races on in-memory state — but a CPU-bound loop freezes everything. Parallelism means spawning workers that communicate by message passing, not shared variables.</p><p>A useful way to hold it: Java chose raw power and now hides the sharp edges behind virtual threads; Python chose a simple, safe interpreter and pays with the GIL; JavaScript chose to forbid sharing outright and buys race-freedom at the price of manual parallelism. None is strictly better — they are different points on the safety-versus-parallelism curve, and porting code across them means re-deciding where that code sits.</p>",
        "why": "The word \"thread\" means three different things here. A Java engineer expects shared mutable state and reaches for locks; that instinct is dangerous in Python (where the GIL lulls you into thinking <code>+=</code> is safe) and pointless in JS (where nothing interleaves mid-function). Mis-mapping the model produces either phantom race bugs or code that needlessly serialises work that could parallelise.",
        "apply": [
          "<b>Match the tool to the bottleneck:</b> I/O-bound wants async or virtual threads; CPU-bound wants OS threads (Java) or processes/workers (Python, JS).",
          "<b>Coming from Java, expect no free parallelism</b> in Python threads or JS — reach for <code>multiprocessing</code> or <code>worker_threads</code>.",
          "<b>Coming from Python or JS, expect real races in Java</b> — shared mutable state needs synchronisation from day one.",
          "<b>Never block the JS event loop</b> — offload heavy CPU work to a worker or you stall every pending task."
        ],
        "code3": {
          "java": "// in a method body — Java 21, virtual threads\ntry (var exec = Executors.newVirtualThreadPerTaskExecutor()) {\n    var futures = IntStream.rangeClosed(1, 4)\n        .mapToObj(n -> exec.submit(() -> n * n)) // real parallelism\n        .toList();\n    int total = 0;\n    for (var f : futures) total += f.get(); // blocks cheaply\n    System.out.println(total);               // 30\n}",
          "python": "from concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor\n\ndef square(n: int) -> int:\n    return n * n\n\n# threads are real, but the GIL serialises the bytecode\nwith ThreadPoolExecutor() as ex:\n    print(sum(ex.map(square, range(1, 5))))  # 30, one-at-a-time\n\n# swap in ProcessPoolExecutor for true CPU parallelism\nwith ProcessPoolExecutor() as ex:\n    print(sum(ex.map(square, range(1, 5))))  # 30, across cores",

      {
        "id": "creating-threads",
        "title": "Creating Threads",
        "lede": "Java starts OS or virtual threads directly, Python has threading.Thread, JS spawns a separate Worker isolate.",
        "what": "<p>Starting an independent line of execution looks superficially similar everywhere: give it a function, start it, optionally wait for it. The differences are in what the new thread shares with its parent and whether it can run truly in parallel.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>API</td><td><code>Thread</code> + <code>Runnable</code></td><td><code>threading.Thread</code></td><td><code>Worker</code> (worker_threads)</td></tr><tr><td>Lightweight</td><td><code>Thread.ofVirtual()</code></td><td>none</td><td>none</td></tr><tr><td>Memory</td><td>shared heap</td><td>shared heap</td><td>separate isolate</td></tr><tr><td>Wait</td><td><code>join()</code></td><td><code>join()</code></td><td><code>'exit'</code> event</td></tr><tr><td>Background</td><td><code>setDaemon(true)</code></td><td><code>daemon=True</code></td><td>n/a</td></tr></tbody></table><p>In Java you pass a <code>Runnable</code> to <code>new Thread(...)</code> or, since 21, call <code>Thread.ofVirtual().start(...)</code> for a virtual thread — same API, negligible cost, so you can start one per task. A <i>daemon</i> thread does not keep the JVM alive; the process exits when only daemons remain. <code>join()</code> blocks the caller until the thread finishes.</p><p>Python mirrors this with <code>threading.Thread(target=fn)</code> and the same <code>join()</code> / daemon semantics. But because of the GIL these threads interleave rather than run in parallel, so they are for I/O overlap, not compute.</p><p>JavaScript has no threads in the language. Node's <code>worker_threads</code> spawns a Worker that is a separate V8 isolate with its own heap; it communicates by structured-clone message passing over <code>postMessage</code>, not shared variables. A worker typically re-executes the entry file, branching on <code>isMainThread</code>. That isolation is why JS never has the shared-memory race bugs the other two must guard against.</p><p>One shared trap outlives the model: an exception thrown inside a thread's body does not propagate to whoever started it. In Java it reaches the thread's <code>UncaughtExceptionHandler</code>; in Python <code>threading.excepthook</code> prints it and the thread quietly dies; in a Node worker it surfaces as an <code>'error'</code> event on the parent. The launching code sees nothing unless it checks — which is exactly why futures and pools, which capture a task's result or exception, are usually a safer hand-off than a bare thread.</p>",
        "why": "A Java or Python developer reaches for a thread to \"run this alongside\" and assumes it can read the same objects. In Node that assumption is wrong: a Worker cannot see your variables, only cloned copies of what you post. Conversely, over-creating platform threads in Java is a resource cliff — thousands is too many — whereas virtual threads or Python threads are cheap enough to create per request.",

          "<b>Prefer virtual threads in Java 21</b> for blocking tasks — <code>Thread.ofVirtual().start(r)</code> instead of a bounded platform-thread pool.",
