<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Bridge between the app's startup and the Drive-backed store.
 *
 * The application below is a classic (non-module) script, so it executes during
 * parsing — before app/boot.js, which is a module and therefore deferred. Its
 * first act is to fetch('/terms'), and on a static host that would 404 long
 * before the store exists to answer it.
 *
 * So window.fetch is replaced up front with a version that parks every call.
 * Once the store installs it calls __pghubInstall, the parked calls are
 * replayed into it, and fetch behaves normally from then on. The app just
 * experiences a slightly slow first request.
 */
(function () {
  // Which Drive folder this page's content lives in. Stamped in by
  // tools/build-app.py from the folder the page sits in.
  window.__pghubModule = "ProgramLangs";
  var native = window.fetch.bind(window);
  // Published so the store can pass non-app requests straight to the browser.
  // It cannot capture window.fetch itself: by the time its module is imported
  // this shim has already replaced it, so what it would capture is the shim —
  // and passthrough would call back into the handler forever.
  window.__pghubNativeFetch = native;
  var parked = [];
  var handler = null;
  window.__pghubInstall = function (fn) {
    handler = fn;
    var queued = parked.splice(0);
    for (var i = 0; i < queued.length; i++) queued[i]();
  };
  window.fetch = function (input, init) {
    if (handler) return handler(input, init);
    return new Promise(function (resolve, reject) {
      parked.push(function () { (handler || native)(input, init).then(resolve, reject); });
    });
  };
})();
</script>

<style>

  }

  /* ===== Cartoon ===== */
  [data-theme="cartoon"] {
    --bg: #fffbe7; --panel: #ffffff; --panel-2: #fff3c4; --border: #1a1a1a;
    --text: #1a1a1a; --muted: #7a6f3a; --accent: #ff5c8a; --accent-soft: #ffe0ea;
    --chip: #ffe9a8; --code-bg: #1a1a1a; --code-text: #ffe27a; --accent-ink: #1a1a1a;
  }
  [data-theme="cartoon"] .box { border-width: 2px; box-shadow: 3px 3px 0 var(--border); }
  [data-theme="cartoon"] .box:hover { box-shadow: 5px 5px 0 var(--accent); }
  [data-theme="cartoon"] .tab-btn.active,
  [data-theme="cartoon"] #drawer { box-shadow: -3px 0 0 rgba(0,0,0,.15); }

  [data-theme="cartoon"] .related .pill { border: 2px solid var(--border); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #b692ff);
    display: grid; place-items: center; font-weight: 700; font-size: 12px;
    letter-spacing: -.02em; color: var(--accent-ink);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }

  /* Top tabs */
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* Theme picker */
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ===== Narrow screens =====
     The desktop layout is a fixed sidebar beside a flexible main. On a 390px
     phone that leaves main at a handful of characters, and the header's
     right-hand cluster — five tabs plus the theme picker — will not wrap, so
     the document comes out wider than the screen and scrolls sideways.

     Below 860px, the same breakpoint the hub uses, the sidebar stacks above the
     content at full width instead of competing with it, and the header wraps
     its controls onto a second row. Stacking rather than overlaying is
     deliberate: an overlay anchored at top:0 would cover the very button that
     closes it, and anchoring below a header whose height changes when it wraps
     is fragile. */
  @media (max-width: 860px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1.05rem; }
    .sub { display: none; }                 /* the tagline is on the hub card too */

    /* display:contents dissolves the wrapper so its children become direct flex
       items of the header. That is what lets the theme picker sit at the end of
       the title row while the tabs claim a full-width row of their own —
       otherwise the five tabs share the remainder with the picker and the last
       two are cut off, reachable only by a horizontal swipe nobody would guess
       at. */
    .header-right { display: contents; }
    .tp { margin-left: auto; flex: 0 0 auto; }
    /* order pulls the tabs after the picker so the header settles into two rows
       (title + picker, then tabs) rather than three. Without it the full-width
       tabs break the line first and the picker is stranded on a row of its own. */
    .tabs { order: 1; flex: 0 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; }

    .layout { flex-direction: column; }
    .layout > aside:not(#drawer) {
      width: 100%; min-width: 0; max-height: 45vh;
      border-right: 0; border-bottom: 1px solid var(--border);
    }

    main { padding: 20px 16px 64px; }
    .detail, .detail:has(.pdf-view), .sv-head, #search-results, #search-more, .sr-empty { max-width: 100%; }
    .pdf-frame { height: 70vh; }
    .boxes { grid-template-columns: 1fr; }
    .ov-globe { height: 60vh; }
  }

  .layout { display: flex; flex: 1; min-height: 0; }
  .nav-toggle { height: 34px; }
  .layout.nav-closed > aside:not(#drawer) { display: none; }

  /* Sidebar */
  aside {
    width: 300px; min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 14px 16px 8px; }
  .nav-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  .nav-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .nav-tabs button.active { background: var(--accent); color: var(--accent-ink); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; outline: none; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }

  .search-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .search-row .search { margin-bottom: 0; flex: 1; }
  .view-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .view-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center;
  }
  .view-toggle button svg, .icon-btn svg { display: block; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    flex: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  nav { overflow-y: auto; padding: 6px 8px 24px; flex: 1; }

  .group { margin-bottom: 4px; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none;
    color: var(--text); font-weight: 600; font-size: 13px;
  }
  .group-head:hover { background: var(--panel-2); }
  .group-head .caret { transition: transform .15s ease; color: var(--muted); font-size: 11px; width: 12px; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 10px; }
  .group-items { padding-left: 8px; }
  .group.collapsed .group-items { display: none; }

  .term {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 22px; border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .term:hover { background: var(--panel-2); color: var(--text); }
  .term.active { background: var(--accent-soft); color: #fff; }
  .term.active::before {
    content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .term.hidden, .group.hidden { display: none; }

  /* flat-list mode: the single flat group hides its header */
  nav.flat .group-head { display: none; }
  nav.flat .group-items { padding-left: 0; }
  nav.flat .term { padding-left: 14px; }

  /* Detail pane (Glossary tab) */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; min-width: 0; }
  /* A wide child — a table, a diagram, a code block — must scroll inside its
     own box rather than widening the page. */
  .markdown-body pre, .markdown-body table { max-width: 100%; overflow-x: auto; }
  .detail { max-width: 820px; }
  /* embedded PDF viewer (docs that are .pdf files) */
  .detail:has(.pdf-view) { max-width: 1100px; }
  .pdf-view { display: flex; flex-direction: column; }
  .pdf-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .pdf-bar .pdf-name { font-weight: 650; color: var(--text); }
  .pdf-bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .pdf-bar a:hover { text-decoration: underline; }
  .pdf-frame { width: 100%; height: calc(100vh - 180px); min-height: 480px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tag-chip {
    display: inline-block; background: var(--chip); color: var(--accent);
    padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
  }
  h2.term-title { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.4px; }
  .lede { font-size: 16px; color: var(--muted); line-height: 1.6; margin: 0 0 26px; }

  .section { margin-bottom: 24px; }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 8px;
  }
  .section p, .section li { line-height: 1.65; font-size: 15px; color: var(--text); }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 6px; }

  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--code-text); }
  p code, li code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }
  pre code { line-height: 1.55; display: block; }

  /* ===== Syntax highlighting (Java / Python / TypeScript) ===== */
  /* Dark themes (default): IDE dark palette */
  .tok-kw  { color: #cc7832; font-weight: 600; }   /* keywords */
  .tok-str { color: #98c379; }                      /* strings / template literals */
  .tok-com { color: #7f848e; font-style: italic; }  /* comments */
  .tok-num { color: #6cb6ff; }                      /* numbers */
  .tok-ann { color: #d0b344; }                      /* @decorators */
  .tok-cls { color: #4ec9b0; }                      /* Types (Capitalized) */
  /* Light themes: classic light-IDE palette */
  [data-theme="soft"] .tok-kw, [data-theme="white"] .tok-kw, [data-theme="colorful"] .tok-kw, [data-theme="cartoon"] .tok-kw { color: #7f0055; font-weight: 700; }
  [data-theme="soft"] .tok-str, [data-theme="white"] .tok-str, [data-theme="colorful"] .tok-str, [data-theme="cartoon"] .tok-str { color: #2a00ff; }
  [data-theme="soft"] .tok-com, [data-theme="white"] .tok-com, [data-theme="colorful"] .tok-com, [data-theme="cartoon"] .tok-com { color: #3f7f5f; }
  [data-theme="soft"] .tok-num, [data-theme="white"] .tok-num, [data-theme="colorful"] .tok-num, [data-theme="cartoon"] .tok-num { color: #1750eb; }
  [data-theme="soft"] .tok-ann, [data-theme="white"] .tok-ann, [data-theme="colorful"] .tok-ann, [data-theme="cartoon"] .tok-ann { color: #646464; }
  [data-theme="soft"] .tok-cls, [data-theme="white"] .tok-cls, [data-theme="colorful"] .tok-cls, [data-theme="cartoon"] .tok-cls { color: #267f99; }

  /* ===== Three-language side-by-side compare ===== */
  /* Give the detail pane room when it holds a 3-way compare (cf. the .pdf-view rule). */
  .detail:has(.cmp3) { max-width: 1280px; }
  .cmp-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .cmp-bar h3 { margin: 0; }
  .cmp-toggle { margin-left: auto; display: inline-flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
  .cmp-toggle button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 4px 11px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
  }
  .cmp-toggle button:hover { color: var(--text); }
  .cmp-toggle button.active { background: var(--accent); color: var(--accent-ink); }

  .cmp3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
  .cmp3.stacked { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .cmp-col { min-width: 0; display: flex; flex-direction: column; }
  .cmp-head {
    display: flex; align-items: center; gap: 7px; padding: 0 2px 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
  }
  .cmp-head .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cmp-col[data-lang="java"]   .dot { background: #e76f00; }
  .cmp-col[data-lang="python"] .dot { background: #4b8bbe; }
  .cmp-col[data-lang="ts"]     .dot { background: #3178c6; }
  .cmp-col pre { flex: 1; padding: 12px 13px; }
  .cmp-col pre code { font-size: 12px; line-height: 1.55; }
  /* The drawer is too narrow for three columns — always stack, and hide the toggle there. */
  #drawer .cmp3 { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  #drawer .cmp-toggle { display: none; }
  @media (max-width: 1180px) { .cmp3 { grid-template-columns: minmax(0, 1fr); gap: 16px; } .cmp-toggle { display: none; } }
  /* first column of a comparison table reads as a row label */
  .rich table td:first-child { font-weight: 600; color: var(--muted); }

  .related { display: flex; flex-wrap: wrap; gap: 8px; }
  .related .pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .related .pill:hover { border-color: var(--accent); color: var(--text); }

  /* Notes (rich text) */
  .note-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .note-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .note-btn:hover { border-color: var(--accent); }
  .note-btn.muted { color: var(--muted); }
  .note-editor {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
    color: var(--text); outline: none;
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .note-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-editor h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-editor a { color: var(--accent); }
  .note-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  .note-editor pre, .note-view pre, .rich pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  }
  .note-editor code, .note-view code, .rich code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .note-editor pre code, .note-view pre code, .rich pre code { background: none; border: 0; padding: 0; }
  .note-editor blockquote, .note-view blockquote, .rich blockquote {
    margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic;
  }
  .note-editor h3, .note-view h3, .rich h3 { margin: 12px 0 6px; font-size: 18px; }
  .note-editor hr, .note-view hr, .rich hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .note-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .note-hint b { color: var(--accent); font-weight: 600; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .notes-head h3 { margin: 0; }
  .notes-actions { display: flex; gap: 6px; }
  .note-action {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .note-action:hover { border-color: var(--accent); color: var(--accent); }
  .note-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note-action.primary:hover { color: var(--accent-ink); filter: brightness(1.05); }
  .note-view {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; min-height: 46px; color: var(--text);
  }
  .note-view img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .note-view h4 { margin: 10px 0 6px; font-size: 16px; }
  .note-view a { color: var(--accent); }
  .note-view .empty-note { color: var(--muted); }
  .rich { line-height: 1.65; font-size: 15px; }
  .rich img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .rich h4 { margin: 10px 0 6px; font-size: 16px; }
  .rich a { color: var(--accent); }

  .rich pre { margin: 8px 0; }
  .term-actions { display: flex; gap: 8px; margin: -2px 0 20px; }

  /* Add-term button */
  .add-term-btn {
    width: 100%; margin-top: 10px; border: 1px dashed var(--accent); background: transparent;
    color: var(--accent); padding: 8px 0; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  .add-term-btn:hover { background: var(--accent-soft); }
  .add-term-btn.inline { width: auto; padding: 8px 16px; margin: 0 0 24px 0; }

  /* Add-term modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 640px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-head .drawer-close { margin-left: auto; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-body label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .modal-body .field { margin-bottom: 16px; }
  .modal-body input[type=text], .modal-body textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .modal-body input[type=text]:focus, .modal-body textarea:focus { border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Terms overview (Terms tab) */
  #overview { flex: 1; overflow-y: auto; padding: 30px 40px 80px; display: none; }
  #overview.show { display: block; }
  .ov-head h2 { margin: 0 0 4px; font-size: 24px; }
  .ov-head p { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
  .ov-group { margin-bottom: 34px; }
  .ov-group-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ov-group-title .name { font-size: 15px; font-weight: 650; }
  .ov-group-title .count { font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
  .ov-group.ov-nested { margin-bottom: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
  .ov-group.ov-nested .ov-group-title .name { font-size: 13.5px; color: var(--muted); }
  /* Docs landing list. The tab used to jump straight into whichever document
     sorted first, so there was no way to see what a module actually held. The
     sidebar lists documents flat — these modules carry no doc tags — so the
     landing list is flat too, and the two agree. */
  .docs-index-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
  .docs-index-head h2 { font-size: 1.15rem; margin: 0; }
  .docs-index-head .count { color: var(--muted); font-size: .85rem; }
  .doc-box { text-align: left; }
  .doc-box .b-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .doc-box .b-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-top: 6px; }

  /* Close bar above an open document — a document is something you come back
     from, so it needs a way out that does not depend on the sidebar. */
  .doc-back { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .doc-back button { background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12px;
    font-family: inherit; font-weight: 600; cursor: pointer; }
  .doc-back button:hover { color: var(--text); border-color: var(--accent); }
  .doc-back .doc-close { margin-left: auto; padding: 5px 9px; }

  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s, background .15s;
  }
  .box:hover { border-color: var(--accent); background: var(--panel-2); transform: translateY(-2px); }
  .box .b-title { font-weight: 650; font-size: 15px; margin-bottom: 4px; }
  .box .b-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }

  /* Overview view toggle + Wall view */
  .ov-toggle { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
  .ov-toggle button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .ov-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .ov-wall { display: none; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px 12px; max-width: 880px; margin: 0 auto; padding-bottom: 70px; }
  .chip-term {
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; font-weight: 600; line-height: 1;
    transition: transform .12s ease, background .15s, box-shadow .15s;
  }
  .chip-term:hover { transform: scale(1.08); background: var(--panel-2); box-shadow: 0 5px 16px rgba(0,0,0,.28); }

  /* Globe view */
  .ov-globe { display: none; position: relative; width: 100%; max-width: 900px; height: 560px; margin: 0 auto; }
  .globe-chip {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    border: 1.5px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    will-change: transform, opacity; user-select: none;
  }
  .globe-chip:hover { background: var(--panel-2); }
  .globe-controls { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px auto 0; }
  .gc-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    width: 40px; height: 38px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 700; line-height: 1; display: grid; place-items: center;
    user-select: none; touch-action: none;
  }
  .gc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gc-btn:active { background: var(--accent); color: var(--accent-ink); }
  .gc-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Search view */
  #search-view { flex: 1; overflow-y: auto; padding: 26px 40px 80px; display: none; }
  #search-view.show { display: block; }
  .sv-head { max-width: 820px; margin: 0 auto 16px; }
  #search-input {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .sv-summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sv-summary b { color: var(--text); }
  #search-results { max-width: 820px; margin: 0 auto; }
  .sr-hit { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; cursor: pointer; }
  .sr-hit:hover { border-color: var(--accent); }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sr-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; background: var(--chip); color: var(--accent); }
  .sr-title { font-weight: 650; font-size: 14px; }
  .sr-field { font-size: 11px; color: var(--muted); margin-left: auto; }
  .sr-snippet { font-size: 13.5px; line-height: 1.65; color: var(--muted); white-space: pre-wrap; }
  .sr-snippet mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  #search-more { max-width: 820px; margin: 6px auto 0; text-align: center; }
  .sr-more-btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 9px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .sr-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sr-empty { color: var(--muted); max-width: 820px; margin: 0 auto; }

  /* Docs (rendered in the main pane, listed in the Terms/QA/Docs sidebar) */
  .nav-empty { color: var(--muted); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  .markdown-body { max-width: 820px; color: var(--text); font-size: 15px; line-height: 1.7; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 700; }
  .markdown-body h1 { font-size: 28px; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 22px; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 18px; }
  .markdown-body h4 { font-size: 15.5px; }
  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body blockquote { margin: 0 0 1em; padding: .4em 1em; border-left: 3px solid var(--accent); background: var(--panel-2); color: var(--muted); border-radius: 0 6px 6px 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-text); padding: .12em .4em; border-radius: 4px; font-size: .88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1em; }
  .markdown-body pre code { background: none; padding: 0; color: var(--code-text); font-size: 13px; line-height: 1.55; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .markdown-body img { max-width: 100%; border-radius: 6px; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 14px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .markdown-body th { background: var(--panel-2); font-weight: 650; }
  .markdown-body [data-line] { scroll-margin-top: 20px; }
  .doc-flash { animation: docFlash 2s ease-out; border-radius: 6px; }
  @keyframes docFlash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .markdown-body mark.doc-hit { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

  /* Quick-peek tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 300px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.5; color: var(--text);
    box-shadow: 0 12px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; display: none;
  }
  #tooltip .tt-title { font-weight: 700; margin-bottom: 4px; color: var(--accent); }

  /* Slide-over drawer */
  #backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80;
    opacity: 0; visibility: hidden; transition: opacity .2s;
  }
  #backdrop.open { opacity: 1; visibility: visible; }
  #drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 90;
    transform: translateX(100%); transition: transform .26s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column;
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-head .tag-chip { margin-right: auto; }
  .drawer-close {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .drawer-close:hover { color: var(--text); border-color: var(--accent); }
  .drawer-body { overflow-y: auto; padding: 22px 24px 50px; }
  .drawer-body h2.term-title { font-size: 24px; margin-top: 0; }
</style>

  <div id="qa-modal" class="modal-bg">

/* app-identity: stamp local writes so another app's server rejects them (409) */
const APP_ID = "programlangs";

        "lede": "Java needs a compile step to bytecode; Python runs source directly; TypeScript must be turned into JavaScript before it runs.",
        "what": "<p>Every language has to answer two questions before it can print a line: how source becomes something executable, and where execution begins. The three answer differently, and the gap shows up the first minute you switch languages.</p><p>Java front-loads a compile step; Python skips it; TypeScript's types are a build-time fiction that must be erased into JavaScript first.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Compile step</td><td><code>javac</code> → bytecode</td><td>none</td><td><code>tsc</code> → JS, or type-strip</td></tr><tr><td>Runtime</td><td>JVM</td><td>CPython</td><td>Node / Deno / browser</td></tr><tr><td>Entry point</td><td><code>main(String[])</code></td><td>top-level or <code>__main__</code></td><td>top-level</td></tr><tr><td>Run one file</td><td><code>java Hello.java</code></td><td><code>python hello.py</code></td><td><code>tsx</code> / <code>deno run</code></td></tr></tbody></table><p>Java's compile step exists so the JVM can load verified, typed bytecode and then JIT-compile hot paths to native code. Historically you always ran <code>javac</code> first; since JEP 330 (Java 11) a single source file runs in one command with <code>java Hello.java</code>, and JEP 445 (preview in 21, finalized as JEP 512 in Java 25) lets you drop the class wrapper and write an instance <code>void main()</code>. The bytecode is still produced — just in memory.</p><p>Python has no separate compile you invoke; the interpreter parses and executes source on the spot (it caches <code>.pyc</code> bytecode transparently). There is no mandatory entry point — the module body runs top to bottom, and the <code>if __name__ == \"__main__\"</code> guard only matters when a file is imported rather than executed.</p><p>TypeScript is the odd one: no runtime executes <code>.ts</code> in its type-annotated form. Either <code>tsc</code> emits JavaScript, or a tool strips the types on the fly — <code>tsx</code>, <code>deno</code>, or recent Node, which strips types natively. The types never reach execution, which is why a program can type-check and still crash on real data.</p>",

        "lede": "Java declares typed var/final; Python binds bare names at function scope; TypeScript uses block-scoped let/const with a temporal dead zone.",
        "what": "<p>Declaring a variable settles three things at once: what may go in it, whether it can be reassigned, and where the name is visible. Each language draws those lines in a different place, and the scoping rule in particular trips up anyone moving between them.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Keyword</td><td><code>var</code> / <code>Type x</code></td><td>none (bare name)</td><td><code>let</code> / <code>const</code></td></tr><tr><td>Scope</td><td>block</td><td>function (+ LEGB)</td><td>block</td></tr><tr><td>Reassign</td><td><code>var</code> yes, <code>final</code> no</td><td>always</td><td><code>let</code> yes, <code>const</code> no</td></tr><tr><td>Before declaration</td><td>compile error</td><td><code>NameError</code></td><td>TDZ → <code>ReferenceError</code></td></tr><tr><td>Redeclare in scope</td><td>no</td><td>just rebinds</td><td><code>let</code>/<code>const</code> no</td></tr></tbody></table><p>Python does not declare variables at all — an assignment binds a name, and the binding lives for the whole enclosing function (or module), not the block. A name first assigned inside an <code>if</code> or <code>for</code> is visible after it, and the loop variable survives the loop. Name lookup follows LEGB: Local, Enclosing, Global, Built-in. This is why a stray assignment to a global inside a function needs an explicit <code>global</code> or <code>nonlocal</code> statement.</p><p>JavaScript's original <code>var</code> was also function-scoped and was <i>hoisted</i>: the declaration moved to the top of the function and read as <code>undefined</code> before its line. That silent <code>undefined</code> caused enough bugs that ES6 added block-scoped <code>let</code> and <code>const</code>. They are still hoisted, but into a temporal dead zone — reading them before the declaration throws instead of returning <code>undefined</code>. TypeScript inherits all of this and adds a type to the binding.</p><p>Java is the strict one: block scope, no hoisting, and a name must be declared before use or it will not compile. <code>var</code> (Java 10) only infers the type; it is still statically typed and still block-scoped. <code>final</code> locks the binding.</p><pre><code data-lang=\"ts\">for (var i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i));\n// prints 3 3 3 — one function-scoped i, shared by every closure\nfor (let j = 0; j &lt; 3; j++) setTimeout(() =&gt; console.log(j)); // 0 1 2 — fresh j per iteration</code></pre>",

        "id": "type-systems",
        "title": "Type Systems Compared",
        "lede": "Java: static, nominal, erased. Python: dynamic, duck-typed, hints optional. TypeScript: static, structural, erased to plain JavaScript.",
        "what": "<p>A type system decides three things: <i>when</i> types are checked, <i>how</i> two types are judged compatible, and <i>whether</i> type information survives to runtime. The three languages sit at three corners of that space, and the differences drive real code.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Checked</td><td>compile time</td><td>runtime</td><td>build time (<code>tsc</code>)</td></tr><tr><td>Compatibility</td><td>nominal</td><td>duck / structural</td><td>structural</td></tr><tr><td>Type at runtime</td><td>classes kept, generics erased</td><td>full</td><td>fully erased</td></tr><tr><td>Enforcement</td><td>won't compile</td><td>none (unless you check)</td><td>won't build, no runtime guard</td></tr><tr><td>Annotations</td><td>required</td><td>optional hints</td><td>required, then stripped</td></tr></tbody></table><p>Nominal typing (Java) means compatibility is by <i>name</i>: a type satisfies an interface only if it explicitly <code>implements</code> it, no matter how similar its shape. Structural typing (TypeScript) means compatibility is by <i>shape</i>: any object with the right fields fits, declaration or not. This is why porting a Java interface to TypeScript quietly loosens it — unrelated objects that happen to match will pass.</p><p>Python is dynamically typed with duck typing: no check happens until an operation actually runs, and an object works anywhere its attributes and methods line up. Type hints (PEP 484) are exactly that — hints. CPython ignores them at runtime; a separate tool like mypy or pyright checks them. You can annotate <code>x: int</code> and pass a string, and the program runs until something breaks.</p><p>Both Java and TypeScript erase, but differently. TypeScript erases <i>everything</i> — the emitted JavaScript has no types at all, so you cannot ask at runtime whether a value is a <code>User</code>. Java keeps classes but erases generic parameters: a <code>List&lt;String&gt;</code> is just a <code>List</code> at runtime, so you cannot test <code>instanceof List&lt;String&gt;</code>. Both erasures exist for compatibility — TS with plain JS engines, Java with pre-generics bytecode — and both cost you runtime type introspection.</p>",

        "lede": "Java's int/long/double are fixed-width and overflow silently; Python ints grow without bound; TypeScript has one number (f64) plus bigint.",
        "what": "<p>Numbers look interchangeable until they get large or fractional. The three languages made opposite trade-offs between speed, size, and correctness, and each has a failure mode that surprises newcomers from the other two.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Integer</td><td><code>int</code> 32-bit, <code>long</code> 64-bit</td><td>arbitrary precision</td><td><code>number</code> (safe to 2^53), <code>bigint</code></td></tr><tr><td>Overflow</td><td>wraps silently</td><td>never (grows)</td><td>loses precision past 2^53</td></tr><tr><td>Float</td><td><code>double</code> 64-bit</td><td><code>float</code> 64-bit</td><td><code>number</code> (same type)</td></tr><tr><td>Object form</td><td><code>int</code> vs <code>Integer</code> (boxing)</td><td>all ints are objects</td><td>primitive values</td></tr><tr><td><code>7 / 2</code></td><td><code>3</code> (int div)</td><td><code>3.5</code>; <code>//</code> → <code>3</code></td><td><code>3.5</code></td></tr></tbody></table><p>Java's numeric types are fixed-width machine values, chosen for speed and predictable memory. The cost is silent two's-complement overflow: a <code>long</code> multiplication that exceeds 63 bits wraps to a negative number with no error. Java also splits primitives (<code>int</code>) from their boxed objects (<code>Integer</code>); autoboxing hides the conversion but the object allocation is real, which matters in hot loops and is the source of the identity gotcha in equality.</p><p>Python integers are arbitrary precision — they transparently grow into bignums, so factorials and cryptographic sizes are exact and overflow simply does not exist. The price is that every int is a heap object and arithmetic is slower. Division splits into two operators: <code>/</code> always produces a float, <code>//</code> floors.</p><p>TypeScript inherits JavaScript's single <code>number</code>, an IEEE-754 double. There is no integer type at all; every number is a 64-bit float, exact only up to 2^53 (<code>Number.MAX_SAFE_INTEGER</code>). Beyond that, integers silently lose precision. <code>bigint</code> (the <code>n</code> suffix) was added for exact large integers, but it does not mix with <code>number</code> in arithmetic. All three share the classic float trap: <code>0.1 + 0.2</code> is <code>0.30000000000000004</code>, because tenths are not representable in binary floating point.</p>",
        "why": "Overflow and precision are silent data-corruption bugs. Coming from Python, where integers are always exact, both Java's wrapping <code>long</code> and TypeScript's precision loss past 2^53 will produce wrong answers with no exception — an ID or accumulator that quietly goes wrong. Coming from Java, TypeScript's lack of an integer type means <code>/</code> never truncates and bit-work needs care.",

        "title": "Strings & Formatting",
        "lede": "Strings are immutable everywhere; formatting uses text blocks, f-strings, or template literals; length is UTF-16 units or code points.",
        "what": "<p>Strings are immutable in Java, Python, and TypeScript — every operation returns a new string. What differs is how you interpolate values, how you build strings efficiently, and — the subtle one — what a single unit of length actually counts.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Interpolate</td><td><code>\"x=%s\".formatted(x)</code></td><td><code>f\"x={x}\"</code></td><td><code>`x=${x}`</code></td></tr><tr><td>Multi-line</td><td>text block <code>\"\"\"…\"\"\"</code></td><td>triple-quote <code>\"\"\"…\"\"\"</code></td><td>backtick <code>`…`</code></td></tr><tr><td>Build in loop</td><td><code>StringBuilder</code></td><td><code>\"\".join(parts)</code></td><td>array + <code>.join(\"\")</code></td></tr><tr><td>Length unit</td><td>UTF-16 code units</td><td>code points</td><td>UTF-16 code units</td></tr><tr><td>Mutability</td><td>immutable</td><td>immutable</td><td>immutable</td></tr></tbody></table><p>Because strings are immutable, <code>a + b</code> in a loop allocates a fresh string every iteration — O(n²) work. Java's answer is <code>StringBuilder</code> (or <code>StringBuffer</code> for the rare synchronized case); Python's is to collect pieces in a list and <code>\"\".join</code> them; TypeScript's is to push into an array and <code>join</code>, since <code>+=</code> in a loop has the same problem. The <code>+</code>-in-a-loop mistake ports directly between all three.</p><p>Interpolation is where they diverge stylistically. Python f-strings and TypeScript template literals both embed arbitrary expressions inline (<code>f\"{a+b}\"</code>, <code>`${a + b}`</code>) and read cleanly. Java has no interpolation syntax; <code>String.format</code> / <code>\"…\".formatted(…)</code> use printf-style placeholders, and text blocks (Java 15) handle multi-line literals but still do not interpolate.</p><p>The trap is length. Java and JavaScript store strings as UTF-16, so <code>.length()</code> / <code>.length</code> count 16-bit code units. A character outside the Basic Multilingual Plane — an emoji, say — is a surrogate <i>pair</i> and counts as 2. Python stores strings as sequences of Unicode code points, so <code>len(\"😀\")</code> is 1. To count real characters in Java or TS you iterate code points (Java's <code>codePointCount</code>, TS's spread <code>[...s]</code>), and even that is not grapheme clusters — a flag or skin-toned emoji spans several code points.</p>",
        "why": "Two bug classes port between languages here. First, the <code>+</code>-in-a-loop quadratic blow-up hits all three the same way — fix it with a builder/join. Second, string length silently means different things: code that slices or validates by index works in Python and breaks on emoji in Java and JavaScript, because one user-visible character can be two units.",
        "apply": [
          "<b>Never build strings with <code>+=</code> in a loop</b>: use <code>StringBuilder</code>, <code>\"\".join</code>, or array <code>join</code>.",
          "<b>Coming from Python</b>, do not trust <code>.length</code> in Java/TS as a character count — emoji and non-BMP text count as 2.",
          "<b>Prefer f-strings and template literals</b> over concatenation for readability; Java has only printf-style <code>formatted</code>.",
          "<b>Iterate code points</b> (<code>[...s]</code> in TS, <code>codePoints()</code> in Java) when you must count or reverse real characters."
        ],
        "code3": {
          "java": "// in a method body\nString name = \"Ada\";\nString s = \"Hello, %s!\".formatted(name);   // printf-style, or String.format(...)\nSystem.out.println(s);                        // Hello, Ada!\nString block = \"\"\"\n    line1\n    line2\"\"\";                                // text block, Java 15+\nSystem.out.println(\"😀\".length());           // 2 — UTF-16 code units (surrogate pair)\nStringBuilder sb = new StringBuilder();\nfor (int i = 0; i < 3; i++) sb.append(i);\nSystem.out.println(sb);                        // 012 (avoids N allocations)",
          "python": "name = \"Ada\"\ns = f\"Hello, {name}!\"          # f-string, expressions allowed: f\"{1+1}\"\nprint(s)                        # Hello, Ada!\nblock = \"\"\"line1\nline2\"\"\"                        # triple-quoted multi-line\nprint(len(\"😀\"))                # 1 — Python counts code points\nparts = [str(i) for i in range(3)]\nprint(\"\".join(parts))          # 012 — join, not += in a loop",
          "ts": "const name = \"Ada\";\nconst s = `Hello, ${name}!`;        // template literal, expressions: ${1 + 1}\nconsole.log(s);                      // Hello, Ada!\nconst block = `line1\nline2`;                              // backticks span lines\nconsole.log(\"😀\".length);           // 2 — UTF-16 code units, like Java\nconsole.log([...\"😀\"].length);       // 1 — spread iterates code points\nconst parts: string[] = [];\nfor (let i = 0; i < 3; i++) parts.push(String(i));\nconsole.log(parts.join(\"\"));         // 012"
        },

      {
        "id": "collections",
        "title": "Lists, Maps & Sets",
        "lede": "All three have lists, maps and sets, but key equality differs (equals/hashCode, __hash__/__eq__, SameValueZero); JS objects key by string.",
        "what": "<p>Every language ships the same three workhorses: a growable list, a key-value map, and a set of unique values. The APIs rhyme, but ordering guarantees and — critically — what makes two keys \"the same\" differ in ways that cause silent lookup misses.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>List</td><td><code>ArrayList</code></td><td><code>list</code></td><td><code>Array</code></td></tr><tr><td>Map</td><td><code>HashMap</code></td><td><code>dict</code></td><td><code>Map</code> / object</td></tr><tr><td>Set</td><td><code>HashSet</code></td><td><code>set</code></td><td><code>Set</code></td></tr><tr><td>Map ordering</td><td>none (<code>HashMap</code>)</td><td>insertion order</td><td>insertion order</td></tr><tr><td>Key equality</td><td><code>equals</code> + <code>hashCode</code></td><td><code>__eq__</code> + <code>__hash__</code></td><td>SameValueZero</td></tr></tbody></table><p>Ordering is the first surprise. Python's <code>dict</code> has guaranteed insertion order since 3.7, and JavaScript's <code>Map</code> and objects preserve insertion order too. Java's <code>HashMap</code> makes no ordering promise at all — if you need it, reach for <code>LinkedHashMap</code> (insertion) or <code>TreeMap</code> (sorted). Code that iterates a map and expects a stable order will behave differently the moment it lands on <code>HashMap</code>.</p><p>Key identity is the deeper trap. Java maps and sets hash with <code>hashCode()</code> and compare with <code>equals()</code>; a custom key class that overrides one but not the other, or neither, produces lookups that silently miss even for \"equal\" objects. Python requires keys to be hashable (<code>__hash__</code> + <code>__eq__</code>), which is why lists cannot be keys but tuples can. JavaScript's <code>Map</code> compares keys by SameValueZero (like <code>===</code>, but <code>NaN</code> equals <code>NaN</code>), so object keys match by reference, never by contents.</p><p>The worst footgun is the plain JavaScript object as a map. Its keys are coerced to strings (or symbols), so the number <code>1</code> and the string <code>\"1\"</code> collide, and iteration order puts integer-like keys first in numeric order regardless of insertion. Use a real <code>Map</code> when keys are not fixed strings.</p><pre><code data-lang=\"ts\">const o: Record&lt;string, number&gt; = {};\no[1 as any] = 9;         // key coerced to \"1\"\nconsole.log(o[\"1\"]);     // 9 — 1 and \"1\" are the same key\nconsole.log(Object.keys({ b: 1, 2: 0, a: 1, 1: 0 })); // [\"1\",\"2\",\"b\",\"a\"] — ints first</code></pre>",
        "why": "Silent lookup misses are the shared danger. Coming from Python or JS, a Java <code>HashMap</code> keyed on a class you forgot to give <code>equals</code>/<code>hashCode</code> will never find the entry you stored. Coming from Java, a JS object-as-map collapses <code>1</code> and <code>\"1\"</code> into one key and reorders integer keys — reach for <code>Map</code>. And do not depend on <code>HashMap</code> iteration order; it has none.",
        "apply": [
          "<b>Override <code>equals</code> and <code>hashCode</code> together</b> in Java (or use a <code>record</code>, which does it) before using a class as a map key.",
          "<b>Coming from Python/JS</b>, do not expect <code>HashMap</code> to preserve order — use <code>LinkedHashMap</code> if you need it.",
          "<b>Prefer <code>Map</code> over a plain object</b> in TypeScript for non-string keys; objects stringify keys and reorder integers.",
          "<b>Use tuples, not lists, as dict keys</b> in Python — keys must be hashable and lists are not."
        ],
        "code3": {
          "java": "// in a method body\nList<String> list = new ArrayList<>(List.of(\"a\", \"b\", \"a\"));\nMap<String, Integer> counts = new HashMap<>();\nfor (String w : list)\n    counts.merge(w, 1, Integer::sum);       // {a=2, b=1}, order NOT guaranteed\nSystem.out.println(counts.get(\"a\"));        // 2\nSet<String> uniq = new HashSet<>(list);\nSystem.out.println(uniq.size());             // 2\n// a custom-key class needs equals()+hashCode() or lookups silently miss",
          "python": "lst = [\"a\", \"b\", \"a\"]\ncounts: dict[str, int] = {}\nfor w in lst:\n    counts[w] = counts.get(w, 0) + 1        # {'a': 2, 'b': 1}, insertion order\nprint(counts[\"a\"])                          # 2\nuniq = set(lst)\nprint(len(uniq))                             # 2\nprint({(1, 2): \"x\"}[(1, 2)])                 # tuple key: hashable, works",
          "ts": "const list = [\"a\", \"b\", \"a\"];\nconst counts = new Map<string, number>();\nfor (const w of list)\n  counts.set(w, (counts.get(w) ?? 0) + 1);  // Map keeps insertion order\nconsole.log(counts.get(\"a\"));               // 2\nconst uniq = new Set(list);\nconsole.log(uniq.size);                       // 2\nconst seen = new Map<object, boolean>();\nseen.set({}, true);\nconsole.log(seen.get({}));                    // undefined — keys match by reference"
        },
        "related": [

      {
        "id": "iteration-loops",
        "title": "Iteration & Loops",
        "lede": "Java uses for-each and streams, Python comprehensions, TypeScript for-of — and for-in means values in Python but keys in JavaScript.",
        "what": "<p>All three offer an index loop and a way to walk elements directly, but the idioms and — one genuinely dangerous keyword — do not line up. The word <code>for…in</code> means opposite things in Python and JavaScript, and mixing them up is a real bug.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Index loop</td><td><code>for (int i…)</code></td><td><code>for i in range(n)</code></td><td><code>for (let i…)</code></td></tr><tr><td>Over elements</td><td><code>for (T x : xs)</code></td><td><code>for x in xs</code></td><td><code>for (const x of xs)</code></td></tr><tr><td>With index</td><td><code>IntStream</code> / manual</td><td><code>enumerate(xs)</code></td><td><code>xs.entries()</code></td></tr><tr><td><code>for…in</code></td><td>n/a</td><td>elements (values)</td><td>keys/indices (strings!)</td></tr><tr><td>Transform</td><td><code>stream().map()</code></td><td><code>[f(x) for x in xs]</code></td><td><code>xs.map(f)</code></td></tr></tbody></table><p>Here is the trap. In Python, <code>for x in xs</code> iterates the <i>values</i> of a sequence — it is the everyday loop. In JavaScript, <code>for (const x in xs)</code> iterates the <i>keys</i>: for an array those are the string indices <code>\"0\"</code>, <code>\"1\"</code>, … plus any enumerable inherited properties. Someone arriving from Python writes <code>for…in</code> over an array expecting values and gets string indices instead. The correct element loop in JS/TS is <code>for…of</code>.</p><p>Beyond that, style diverges. Python favors comprehensions — <code>[f(x) for x in xs if p(x)]</code> — which build a new list eagerly and read as a single expression. TypeScript favors array methods (<code>map</code>, <code>filter</code>, <code>reduce</code>), which also return new arrays and chain. Java's Streams (<code>stream().map(…).filter(…).toList()</code>) look similar but are <i>lazy</i>: nothing runs until a terminal operation like <code>toList</code> or <code>sum</code>, which enables fusion and short-circuiting a classic <code>for</code> loop cannot express.</p><p>For pairing an index with a value, Python's <code>enumerate</code> is the idiom, TypeScript has <code>entries()</code> or a <code>forEach((x, i) =&gt; …)</code>, and Java either counts manually or uses <code>IntStream.range</code>. Reaching for a C-style index loop just to read elements is a tell that someone has not yet learned the local idiom.</p>",
        "why": "The <code>for…in</code> collision is a correctness bug, not a style nit. A Python developer writing <code>for (const x in array)</code> in TypeScript iterates string keys and inherited properties, not values — silently wrong. Beyond that, Java Streams being lazy versus comprehensions/array methods being eager changes when side effects and exceptions fire, which matters when the pipeline touches I/O.",
        "apply": [
          "<b>Use <code>for…of</code>, never <code>for…in</code></b>, to walk array values in TypeScript; <code>for…in</code> gives string keys.",
          "<b>Coming from Java</b>, prefer comprehensions (Python) and <code>map</code>/<code>filter</code> (TS) over manual index loops for transforms.",
          "<b>Pair index and value idiomatically</b>: <code>enumerate</code> in Python, <code>.entries()</code> in TS — not a bare counter.",
          "<b>Remember Java Streams are lazy</b>: nothing executes until a terminal op, unlike eager comprehensions and array methods."
        ],
        "code3": {
          "java": "// in a method body\nList<Integer> nums = List.of(1, 2, 3, 4);\nfor (int n : nums)                       // enhanced for-each over values\n    System.out.print(n + \" \");           // 1 2 3 4\nList<Integer> doubled = nums.stream()\n    .map(n -> n * 2).toList();            // [2, 4, 6, 8]\nint sumEven = nums.stream()\n    .filter(n -> n % 2 == 0)\n    .mapToInt(Integer::intValue).sum();   // 6\nSystem.out.println(doubled + \" \" + sumEven);",
          "python": "nums = [1, 2, 3, 4]\nfor n in nums:                 # for-in iterates VALUES\n    print(n, end=\" \")          # 1 2 3 4\ndoubled = [n * 2 for n in nums]              # [2, 4, 6, 8]\nsum_even = sum(n for n in nums if n % 2 == 0)  # 6\nfor i, n in enumerate(nums):   # index + value\n    pass\nprint(doubled, sum_even)",
          "ts": "const nums = [1, 2, 3, 4];\nlet line = \"\";\nfor (const n of nums) line += n + \" \";      // for-OF iterates values → \"1 2 3 4 \"\nconst doubled = nums.map(n => n * 2);        // [2, 4, 6, 8]\nconst sumEven = nums\n  .filter(n => n % 2 === 0)\n  .reduce((a, b) => a + b, 0);               // 6\nfor (const i in nums) console.log(typeof i); // \"string\" — for-IN gives keys, avoid\nconsole.log(doubled, sumEven);"
        },
        "related": [

      {
        "id": "conditionals-branching",
        "title": "Conditionals & Branching",
        "lede": "Java has switch expressions with pattern matching; Python has if/elif and structural match; TypeScript keeps C-style fallthrough switch.",
        "what": "<p>Branching starts the same — <code>if</code> everywhere — but the multi-way construct is where the three genuinely differ. Java and Python have modernized theirs into pattern matching; TypeScript is still stuck with a C-style <code>switch</code> that falls through.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Chained</td><td><code>else if</code></td><td><code>elif</code></td><td><code>else if</code></td></tr><tr><td>Multi-way</td><td><code>switch</code> expression</td><td><code>match</code> (3.10+)</td><td><code>switch</code> statement</td></tr><tr><td>Pattern match</td><td>types &amp; records (21)</td><td>structural</td><td>none (narrowing only)</td></tr><tr><td>Fallthrough</td><td>no (<code>-&gt;</code>), yes (<code>:</code>)</td><td>no</td><td>yes (needs <code>break</code>)</td></tr><tr><td>Ternary</td><td><code>c ? a : b</code></td><td><code>a if c else b</code></td><td><code>c ? a : b</code></td></tr></tbody></table><p>Java's <code>switch</code> is now an <i>expression</i> that returns a value. The arrow form (<code>case X -&gt; …</code>) has no fallthrough and no <code>break</code>, and when the selector is a sealed type the compiler enforces exhaustiveness. Java 21 added pattern matching (JEP 441): <code>case Circle c</code> matches by type and binds, and record patterns destructure. The old colon form with fallthrough still exists for compatibility.</p><p>Python's <code>match</code> (PEP 634, 3.10) is <i>not</i> a C switch — it is structural pattern matching. Cases match the <i>shape</i> of a value: literals, sequences, mappings, class patterns with capture. There is no fallthrough; the first matching case runs and that is it. The wildcard <code>case _</code> is the default. It reads like Java's pattern switch but works on structure rather than nominal type.</p><p>TypeScript's <code>switch</code> is the classic C construct, and its defining hazard is fallthrough: without a <code>break</code> or <code>return</code>, control drops into the next case. Forgetting one is a well-worn bug source. TypeScript compensates with exhaustiveness checking over discriminated unions — assign the value to a <code>never</code> in the default branch and the compiler flags any unhandled case — but the fallthrough behavior itself is unchanged. All three share a ternary conditional expression, though Python's word order (<code>a if c else b</code>) puts the value first.</p>",
        "why": "Fallthrough is the portable footgun. Coming from Python (no fallthrough) or Java's arrow <code>switch</code>, a TypeScript <code>switch</code> silently runs the next case when you omit <code>break</code>. In the other direction, Java's <code>switch</code> as an <i>expression</i> and Python's structural <code>match</code> are more powerful than a C switch — using them as if they only compared constants leaves capability on the table.",
        "apply": [
          "<b>Always <code>break</code> or <code>return</code></b> in a TypeScript <code>switch</code> case; missing it falls through to the next.",
          "<b>Prefer the arrow <code>switch</code> expression</b> in Java — it returns a value, needs no <code>break</code>, and can be exhaustive.",
          "<b>Use <code>match</code> for shape</b> in Python (sequences, mappings, class patterns), not just as an <code>elif</code> chain over constants.",
          "<b>Coming from Java/Python</b>, add a <code>never</code> default in TS to make a <code>switch</code> over a union exhaustive."
        ],
        "code3": {
          "java": "sealed interface Shape permits Circle, Square {}\nrecord Circle(double r) implements Shape {}\nrecord Square(double s) implements Shape {}\n\nstatic double area(Shape sh) {\n    return switch (sh) {                     // switch expression, exhaustive\n        case Circle c -> Math.PI * c.r() * c.r();  // type pattern, Java 21\n        case Square s -> s.s() * s.s();\n    };                                       // no break, no fallthrough\n}",
          "python": "def area(sh: tuple) -> float:\n    match sh:                                # structural pattern matching\n        case (\"circle\", r):                  # matches shape, binds r\n            return 3.14159 * r * r\n        case (\"square\", s):\n            return s * s\n        case _:                              # wildcard; no fallthrough\n            raise ValueError(\"unknown shape\")",
          "ts": "type Shape =\n  | { kind: \"circle\"; r: number }\n  | { kind: \"square\"; s: number };\nfunction area(sh: Shape): number {\n  switch (sh.kind) {                         // C-style: needs break/return\n    case \"circle\": return Math.PI * sh.r * sh.r;\n    case \"square\": return sh.s * sh.s;       // omit return → fallthrough bug\n    default: throw new Error(\"unknown\");      // exhaustive via discriminated union\n  }\n}"
        },
        "related": [

      {
        "id": "null-optional",
        "title": "Null, None & Undefined",
        "lede": "Java has null and Optional; Python has a single None; TypeScript has both null and undefined, tamed by strictNullChecks.",
        "what": "<p>Representing \"no value\" sounds trivial, but it is the source of the most famous bug in programming. Each language models absence differently, and TypeScript uniquely splits it into <i>two</i> empty values with distinct meanings.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Absence value</td><td><code>null</code> (+ <code>Optional</code>)</td><td><code>None</code></td><td><code>null</code> and <code>undefined</code></td></tr><tr><td>Type-checked</td><td>no → NPE at runtime</td><td>no → <code>AttributeError</code></td><td>yes, with strictNullChecks</td></tr><tr><td>Safe access</td><td><code>opt.map(…)</code></td><td><code>x.f if x else …</code></td><td><code>x?.f</code></td></tr><tr><td>Default</td><td><code>opt.orElse(d)</code></td><td><code>x or d</code> / <code>x ?? d</code></td><td><code>x ?? d</code></td></tr><tr><td>Kinds of empty</td><td>one</td><td>one</td><td>two (unset vs explicit)</td></tr></tbody></table><p>Java's <code>null</code> is untyped and assignable to any reference; dereferencing it throws <code>NullPointerException</code> at runtime with no compile-time warning. <code>Optional&lt;T&gt;</code> (Java 8) is a wrapper meant for <i>return types</i> that may be empty — <code>map</code>, <code>filter</code>, <code>orElse</code> chain safely — but it is a convention, not enforcement; nothing stops a raw <code>null</code> elsewhere. Using <code>Optional</code> for fields or parameters is considered misuse.</p><p>Python has exactly one absence value, <code>None</code>, a singleton compared with <code>is</code>. There is no static protection: calling a method on <code>None</code> raises <code>AttributeError</code> at runtime. The idiomatic guard is <code>x if x is not None else default</code>. Beware <code>x or default</code> — it treats <code>0</code>, <code>\"\"</code>, and <code>[]</code> as absent because they are falsy, which is a distinct and common bug from a genuine <code>None</code> check.</p><p>TypeScript has both <code>null</code> and <code>undefined</code>: <code>undefined</code> means a value was never set (a missing property, an unassigned variable), while <code>null</code> is a deliberate \"nothing.\" The <code>strictNullChecks</code> flag is the single most valuable setting in the language — with it on, <code>null</code> and <code>undefined</code> are not assignable to other types, so the compiler forces you to handle absence before use. Optional chaining <code>?.</code> short-circuits to <code>undefined</code>, and nullish coalescing <code>??</code> supplies a default only for <code>null</code>/<code>undefined</code> (not for falsy <code>0</code> or <code>\"\"</code>, unlike <code>||</code>).</p>",
        "why": "Absence is where the null-dereference crash lives, and each language moves it to a different time. Coming from TypeScript with strictNullChecks, both Java and Python give you no compile-time net — the NPE or AttributeError is a runtime surprise. Coming from Java or Python, TypeScript's split between <code>null</code> and <code>undefined</code>, and the difference between <code>??</code> and <code>||</code>, decides whether a legitimate <code>0</code> or empty string gets clobbered by a default.",
        "apply": [
          "<b>Turn on <code>strictNullChecks</code></b> in TypeScript (it is in <code>strict</code>); without it, null safety does not exist.",
          "<b>Coming from TS/Java</b>, guard Python with <code>is not None</code>, not truthiness — <code>x or d</code> wrongly replaces <code>0</code>/<code>\"\"</code>/<code>[]</code>.",
          "<b>Use <code>??</code>, not <code>||</code></b>, for defaults in TypeScript so a valid <code>0</code> or <code>\"\"</code> is not overwritten.",
          "<b>Return <code>Optional</code> from Java methods</b> that may be empty, but do not use it for fields or parameters."
        ],
        "code3": {
          "java": "// in a method body; assume lookup(String) returns a String or null\nOptional<String> name = Optional.ofNullable(lookup(\"user\"));\nString shown = name.map(String::toUpperCase)   // transform only if present\n                   .orElse(\"ANON\");             // default if empty\nSystem.out.println(shown);\nString raw = lookup(\"user\");\nint len = raw != null ? raw.length() : 0;       // manual guard — no ?. in Java\n// raw.length() when raw == null -> NullPointerException at runtime",
          "python": "config: dict[str, str] = {}\nname = config.get(\"user\")          # None if the key is missing\nshown = name.upper() if name is not None else \"ANON\"  # explicit None check\nprint(shown)\nlength = len(name) if name else 0   # careful: '' and None are both falsy\nval = config.get(\"user\") or \"ANON\"  # 'or' default — but '' also falls through\nprint(val)\n# name.upper() when name is None -> AttributeError",

      {
        "id": "equality-comparison",
        "title": "Equality & Comparison",
        "lede": "Java == is identity, use equals; Python has is vs ==; TypeScript has ===, coercing ==, and Object.is; integer caches make identity deceive.",
        "what": "<p>\"Are these two things equal?\" has at least two answers in every language: same <i>value</i> or same <i>object</i>. The operators that mean each differ, and a caching optimization in Java and Python makes identity comparisons appear to work — until they suddenly do not.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Value equality</td><td><code>.equals()</code></td><td><code>==</code></td><td><code>===</code></td></tr><tr><td>Identity</td><td><code>==</code></td><td><code>is</code></td><td><code>===</code> / <code>Object.is</code></td></tr><tr><td>Coercion</td><td>none</td><td>none</td><td><code>==</code> coerces</td></tr><tr><td>Hash contract</td><td><code>equals</code> + <code>hashCode</code></td><td><code>__eq__</code> + <code>__hash__</code></td><td>n/a</td></tr><tr><td>Edge cases</td><td>Integer cache</td><td>small-int cache</td><td><code>NaN</code>, <code>-0</code></td></tr></tbody></table><p>In Java, <code>==</code> on reference types compares object identity, never contents — <code>equals()</code> is value equality, and any class you compare by value must override both <code>equals</code> and <code>hashCode</code> consistently. The infamous gotcha: <code>Integer</code> autoboxing caches values from −128 to 127, so <code>Integer a = 127, b = 127; a == b</code> is <code>true</code> (same cached object) but the same code with <code>128</code> is <code>false</code>. Use <code>equals</code> and the trap disappears.</p><p>Python separates <code>==</code> (value, via <code>__eq__</code>) from <code>is</code> (identity). The mirror-image gotcha: CPython caches small integers from −5 to 256, so <code>is</code> accidentally returns <code>True</code> for <code>256</code> but <code>False</code> for <code>257</code>. <code>is</code> is correct only for singletons like <code>None</code>; use <code>==</code> for values.</p><p>JavaScript's <code>==</code> performs type coercion with famously surprising results (<code>0 == \"\"</code>, <code>null == undefined</code>, <code>[] == false</code> all <code>true</code>). TypeScript does not fix the runtime behavior, so the rule is simple: always use <code>===</code>, which compares without coercion. Two remaining oddities: <code>NaN === NaN</code> is <code>false</code> (NaN equals nothing, itself included), and <code>===</code> treats <code>+0</code> and <code>-0</code> as equal. <code>Object.is</code> flips both — it reports <code>NaN</code> equal to <code>NaN</code> and <code>+0</code> distinct from <code>-0</code> — which is also why <code>Set</code> and <code>Map</code> (SameValueZero) can hold a single <code>NaN</code> key.</p>",
        "why": "Identity-vs-value is a portable bug. Coming from Python or JS value equality, Java's <code>==</code> on objects silently compares references, and the Integer cache makes it pass in tests (small numbers) then fail in production (large ones). The same shape bites Python's <code>is</code>. Coming from Java, JavaScript's coercing <code>==</code> produces nonsense unless you commit to <code>===</code>.",
        "apply": [
          "<b>Never compare objects with <code>==</code> in Java</b> or values with <code>is</code> in Python — use <code>equals</code> / <code>==</code> for value equality.",
          "<b>Always use <code>===</code> in TypeScript</b>; the coercing <code>==</code> makes <code>0 == \"\"</code> and <code>null == undefined</code> true.",
          "<b>Override <code>hashCode</code> whenever you override <code>equals</code></b> in Java, or hash-based collections break.",
          "<b>Reach for <code>Object.is</code></b> only when <code>NaN</code>/<code>-0</code> matter; otherwise <code>===</code> is the default."
        ],
        "code3": {
          "java": "// in a method body\nInteger a = 127, b = 127;\nSystem.out.println(a == b);          // true  — cached (-128..127)\nInteger c = 128, d = 128;\nSystem.out.println(c == d);          // false — new objects; == is identity!\nSystem.out.println(c.equals(d));     // true  — value equality\nString s1 = \"hi\", s2 = new String(\"hi\");\nSystem.out.println(s1 == s2);        // false — different objects\nSystem.out.println(s1.equals(s2));   // true",
          "python": "a = int(\"127\"); b = int(\"127\")\nprint(a == b, a is b)      # True True  — small-int cache (-5..256)\nc = int(\"257\"); d = int(\"257\")\nprint(c == d, c is d)      # True False — outside cache, 'is' fails\nprint([1, 2] == [1, 2])    # True  — __eq__ compares by value\nprint([1, 2] is [1, 2])    # False — different objects\nprint(None is None)        # True  — 'is' is correct for singletons\nprint(\"ab\" == \"a\" + \"b\")    # True  — use == for value equality, not 'is'",
          "ts": "console.log(0 == \"\");              // true  — == coerces (\"\" -> 0)\nconsole.log(0 === \"\");             // false — === does not coerce\nconsole.log(null == undefined);    // true  (== quirk)\nconsole.log(NaN === NaN);          // false — NaN never equals itself\nconsole.log(Object.is(NaN, NaN));  // true\nconsole.log(0 === -0, Object.is(0, -0)); // true false\nconsole.log(\"ab\" === \"a\" + \"b\");         // true — === compares primitive values\nconsole.log({ a: 1 } === { a: 1 });      // false — objects by reference"
        },

      {
        "id": "constants-immutability",
        "title": "Constants & Immutability",
        "lede": "final, UPPER_CASE, and const stop reassignment, not mutation; real immutability needs List.of, tuples/frozenset, or readonly/Object.freeze.",
        "what": "<p>Two ideas get conflated constantly: a binding that cannot be <i>reassigned</i>, and a value that cannot be <i>mutated</i>. Java's <code>final</code>, Python's <code>UPPER_CASE</code>, and TypeScript's <code>const</code> all do the first and none does the second. True immutability is a separate, opt-in mechanism.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Constant binding</td><td><code>final</code></td><td><code>UPPER_CASE</code> (convention)</td><td><code>const</code></td></tr><tr><td>Enforced by</td><td>compiler</td><td>nothing</td><td>compiler / runtime freeze</td></tr><tr><td>Immutable list</td><td><code>List.of(…)</code></td><td><code>tuple</code></td><td><code>readonly</code> / <code>as const</code></td></tr><tr><td>Immutable set</td><td><code>Set.of(…)</code></td><td><code>frozenset</code></td><td>—</td></tr><tr><td>Depth</td><td>shallow</td><td>shallow</td><td>shallow</td></tr></tbody></table><p>Java's <code>final</code> is a compile-time lock on the <i>binding</i>: a <code>final List</code> cannot be reassigned to a new list, but you can still <code>.add</code> to it all day. For an immutable value use the factory methods — <code>List.of</code>, <code>Set.of</code>, <code>Map.of</code>, or <code>Collections.unmodifiableList</code> — which throw <code>UnsupportedOperationException</code> on mutation. Records (Java 16) give shallow-immutable data carriers.</p><p>Python offers the least enforcement. <code>UPPER_CASE</code> is pure convention — nothing stops you reassigning a \"constant.\" For genuinely immutable containers there are <code>tuple</code> and <code>frozenset</code>, and frozen dataclasses. But immutability is shallow: a tuple <i>of</i> a list still lets you mutate the inner list, because the tuple only fixes which objects it references, not their contents.</p><p>TypeScript spans compile time and runtime. <code>const</code> locks the binding only. <code>readonly</code> on properties and <code>ReadonlyArray</code> are compile-time checks that are <i>erased</i> — they vanish in the emitted JavaScript, so nothing enforces them at runtime. <code>as const</code> narrows a literal to its most specific readonly type. For a runtime guarantee there is <code>Object.freeze</code>, which actually prevents mutation — but it too is shallow, freezing only the top level, and in non-strict code a write to a frozen object fails silently rather than throwing.</p>",
        "why": "The reassign-vs-mutate distinction causes shared-state bugs in every language. Coming from any of the three, assuming <code>final</code>/<code>const</code>/<code>UPPER_CASE</code> makes a collection safe to hand out is wrong — callers can still mutate it. And immutability being shallow everywhere means a \"frozen\" outer structure with mutable contents is a false sense of security. Reach for <code>List.of</code>, <code>tuple</code>, or <code>Object.freeze</code> when you truly need it.",
        "apply": [
          "<b>Separate binding from value</b>: <code>final</code>/<code>const</code> stop reassignment; you still need <code>List.of</code>/<code>freeze</code> to stop mutation.",
          "<b>Coming from Java/TS</b>, know Python's <code>UPPER_CASE</code> enforces nothing — use <code>tuple</code>/<code>frozenset</code> for real immutability.",
          "<b>Remember it is shallow</b> in all three: a frozen or tuple wrapper does not protect mutable contents one level down.",
          "<b>Do not rely on TS <code>readonly</code> at runtime</b> — it is erased; use <code>Object.freeze</code> when you need an actual guard."
        ],
        "code3": {
          "java": "// in a method body\nfinal int MAX = 10;\n// MAX = 11;                       // compile error: cannot reassign final\nfinal List<String> a = new ArrayList<>(List.of(\"x\"));\na.add(\"y\");                        // ALLOWED — final locks the binding, not contents\n// a = new ArrayList<>();           // this WOULD be a compile error\nList<String> b = List.of(\"x\");     // truly immutable\n// b.add(\"y\");                      // UnsupportedOperationException at runtime\nSystem.out.println(a + \" \" + b);   // [x, y] [x]",
          "python": "MAX = 10               # UPPER_CASE is convention only\nMAX = 11               # nothing stops this reassignment\na = [\"x\"]\na.append(\"y\")          # lists are mutable\nt = (\"x\", \"y\")         # tuple: immutable structure\n# t[0] = \"z\"           # TypeError: 'tuple' does not support item assignment\nnested = ([1],)        # but a tuple OF a list...\nnested[0].append(2)    # ...still mutates: ([1, 2],) — shallow\nprint(a, t, nested)",
          "ts": "const MAX = 10;\n// MAX = 11;                 // error: cannot reassign a const\nconst a: string[] = [\"x\"];\na.push(\"y\");                // ALLOWED — const locks the binding, not contents\nconst r = [\"x\"] as const;   // readonly [\"x\"] — r.push is a compile error\nconst frozen = Object.freeze({ n: 1 });\n// frozen.n = 2;             // silently ignored (TypeError in strict mode)\nconst ro: readonly number[] = [1, 2];  // compile-time only, erased at runtime\nconsole.log(a, r, frozen, ro);"
        },
