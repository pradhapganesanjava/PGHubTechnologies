      {
        "id": "http-clients",
        "title": "HTTP Clients",
        "lede": "Java and Node ship the client everyone uses; Python ships one nobody uses, and only Python's throws on a 404.",
        "what": "<p>An HTTP GET is a good probe of a runtime's stdlib philosophy: whether it ships a client people actually reach for, and what shape it gives the asynchronous version.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Built in</td><td><code>java.net.http</code> (11+)</td><td><code>urllib.request</code></td><td><code>fetch</code> (Node 18+)</td></tr><tr><td>What people use</td><td>the built-in</td><td><code>httpx</code> / <code>requests</code></td><td>the built-in</td></tr><tr><td>Blocking call</td><td><code>client.send(…)</code></td><td><code>urlopen(…)</code></td><td>none exists</td></tr><tr><td>Async call</td><td><code>sendAsync</code> → <code>CompletableFuture</code></td><td><code>httpx.AsyncClient</code></td><td><code>await fetch</code></td></tr><tr><td>On 4xx/5xx</td><td>returns normally</td><td>raises <code>HTTPError</code></td><td>returns, <code>res.ok</code> false</td></tr><tr><td>Reading the body</td><td><code>BodyHandlers.ofString</code></td><td><code>res.read()</code> → bytes</td><td>a second <code>await</code></td></tr></tbody></table><p>Java replaced <code>HttpURLConnection</code> with <code>java.net.http.HttpClient</code> in Java 11 (JEP 321): immutable builders, HTTP/2 and WebSocket, a connection pool, and two symmetrical entry points — <code>send</code> blocks, <code>sendAsync</code> returns a <code>CompletableFuture</code>. Java 21 changed the calculus. On a virtual thread a blocking <code>send</code> costs almost nothing, so the <code>CompletableFuture</code> chain — which existed to avoid parking a platform thread — has become mostly a way to make readable code unreadable. Prefer <code>send</code> unless you are genuinely composing many in-flight requests.</p><p>Python is the outlier: the stdlib client works and nobody uses it. <code>urllib.request</code> predates context managers, exposes an opener/handler architecture no one wants, pools no connections, decodes nothing, and raises on 4xx — which sounds principled until you need to read the error body off the exception object. <code>requests</code> took the synchronous world; <code>httpx</code> took it back by offering the same API plus a real <code>async</code> twin. <code>requests</code> was considered for the stdlib and deliberately left out: the stdlib's release cadence would have frozen a library that needed to keep moving, and it would have dragged <code>urllib3</code> in behind it.</p><p>Node had no built-in client worth using until <code>fetch</code> became a global in 18, backed by undici and marked stable in 21. It has only an async form — there is no blocking HTTP in Node and there never will be. Two details catch people. The promise resolves when the <b>headers</b> arrive, so the body is a second <code>await</code>. And it does not reject on 4xx or 5xx; only a transport failure rejects. <code>if (!res.ok) throw</code> is not ceremony — without it a 500 error page gets parsed as JSON and fails somewhere unrelated.</p><p>Timeouts are three different answers: <code>HttpRequest.timeout()</code> plus <code>HttpClient.connectTimeout()</code>; a <code>timeout=</code> argument to <code>urlopen</code>; and, because <code>fetch</code> has no timeout option at all, <code>AbortSignal.timeout(ms)</code>.</p><pre><code data-lang=\"ts\">// Node.js — the two things fetch does not treat as errors\nconst res = await fetch(url);   // resolves for 404 and for 500\nconst body = await res.json();  // parses the error page, or throws a confusing SyntaxError\nif (!res.ok) throw new Error(`HTTP ${res.status}`);   // this belongs FIRST</code></pre>",
        "why": "The status-code convention is the trap. Java's send and Node's fetch both return normally on a 500, Python's urlopen raises, and requests/httpx return but offer raise_for_status(). Port a client between them and error handling either vanishes or starts throwing on responses you meant to inspect. The second cost is the async shape: a CompletableFuture chain, a separate async client, and a promise are not mechanically interchangeable, so a port rewrites the call site rather than renaming it.",
        "apply": [
          "<b>Check the status yourself</b> — <code>statusCode()</code>, <code>raise_for_status()</code>, <code>res.ok</code>; only <code>urlopen</code> throws for you, and it throws the body away.",
          "<b>Coming from Java or Node, do not reach for <code>urllib.request</code></b> — being in the stdlib does not make it the default; <code>httpx</code> is what Python actually writes.",
          "<b>Set a timeout on every request</b> — <code>HttpRequest.timeout</code>, <code>urlopen(timeout=)</code>, <code>AbortSignal.timeout</code>; <code>fetch</code> has no option and will hang indefinitely.",
          "<b>On Java 21+, prefer blocking <code>send</code> on a virtual thread</b> — <code>sendAsync</code> buys nothing once threads are cheap, and the chain costs readability."
        ],
        "code3": {
          "java": "// in a method that throws IOException, InterruptedException\n// imports: java.net.URI, java.net.http.*, java.time.Duration\nvar client = HttpClient.newHttpClient();       // HTTP/2 by default, pools connections\nvar req = HttpRequest.newBuilder(URI.create(\"https://api.example.com/user\"))\n        .header(\"Accept\", \"application/json\")\n        .timeout(Duration.ofSeconds(5))\n        .build();\n\n// blocking — and cheap again on a virtual thread (Java 21+)\nHttpResponse<String> res = client.send(req, HttpResponse.BodyHandlers.ofString());\nSystem.out.println(res.statusCode());          // 200 — a 404 does NOT throw\nSystem.out.println(res.body());\n\n// async twin: same request, a CompletableFuture instead of a parked thread\nclient.sendAsync(req, HttpResponse.BodyHandlers.ofString())\n      .thenApply(HttpResponse::body)\n      .thenAccept(System.out::println);",
          "python": "import json\nimport urllib.request\n\nreq = urllib.request.Request(\n    \"https://api.example.com/user\",\n    headers={\"Accept\": \"application/json\"},\n)\n\n# stdlib: blocking, no pooling, no async twin, no decoding\nwith urllib.request.urlopen(req, timeout=5) as res:\n    print(res.status)                                # 200\n    body = json.loads(res.read().decode(\"utf-8\"))    # bytes -> str -> dict, by hand\n\nprint(body[\"name\"])\n\n# urlopen RAISES urllib.error.HTTPError on 4xx/5xx — unlike Java and fetch\n# what people actually write: httpx.get(url, timeout=5).json()\n# and httpx.AsyncClient for the awaited version",
          "ts": "// Node.js 18+ — fetch is a global, no import, undici underneath\nconst res = await fetch(\"https://api.example.com/user\", {\n  headers: { Accept: \"application/json\" },\n  signal: AbortSignal.timeout(5000),   // there is no timeout option — use a signal\n});\n\n// fetch does NOT reject on 4xx/5xx; only a transport failure rejects\nif (!res.ok) throw new Error(`HTTP ${res.status}`);\n\n// the body is a SECOND await — the promise resolved once headers arrived\nconst body = (await res.json()) as { name: string };   // json() returns Promise<any>\nconsole.log(res.status, body.name);\n\n// there is no synchronous form, and there will not be one"
        },
        "related": [
          "async-await",
          "futures-promises",
          "json-serialization",
          "cancellation-timeouts"
        ]
      },
      {
        "id": "resource-management",
        "title": "Resource Management",
        "lede": "Java and Python have had a scope-exit construct for over a decade; JavaScript got one in TypeScript 5.2 and it is still opt-in.",
        "what": "<p>Every runtime owns resources the collector cannot manage — file descriptors, sockets, locks — because collection is not prompt and the OS limit is. All three answer with \"run this on the way out of a scope\", but only two made it a language construct early, and the third arrived a decade late.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Construct</td><td>try-with-resources</td><td><code>with</code></td><td><code>using</code> (5.2+)</td></tr><tr><td>Protocol</td><td><code>AutoCloseable.close()</code></td><td><code>__enter__</code>/<code>__exit__</code></td><td><code>[Symbol.dispose]()</code></td></tr><tr><td>Async form</td><td>none</td><td><code>async with</code></td><td><code>await using</code></td></tr><tr><td>Several at once</td><td><code>;</code> in the header</td><td>comma, or <code>ExitStack</code></td><td>one per declaration</td></tr><tr><td>Can swallow the error</td><td>no</td><td>yes, <code>__exit__</code> → <code>True</code></td><td>no</td></tr><tr><td>Fallback</td><td><code>try/finally</code></td><td><code>try/finally</code></td><td><code>try/finally</code></td></tr></tbody></table><p>Java's try-with-resources desugars to nested <code>try/finally</code> plus one detail hand-written code almost always gets wrong. If the body throws and <code>close()</code> then also throws, the close exception is <b>suppressed</b> — attached to the primary via <code>addSuppressed()</code> and printed under <code>Suppressed:</code> — rather than replacing it. A hand-rolled <code>finally { out.close(); }</code> discards the original entirely and reports the close failure instead, which is how a real bug gets misdiagnosed as a disk error. Resources close in reverse declaration order and the resource variable is implicitly final.</p><p>Python's <code>with</code> is more capable in one specific way: <code>__exit__</code> receives the exception type, value and traceback, and returning a truthy value swallows it. That is the design, not a loophole — <code>contextlib.suppress</code> is nothing but an <code>__exit__</code> that returns <code>True</code>. Java's construct cannot do this; it can only close. <code>@contextmanager</code> turns a generator into a context manager with the <code>yield</code> standing in for the body, and <code>ExitStack</code> covers a count of resources not known until runtime.</p><p>CPython muddies the lesson. Refcounting drops a file object the moment the last reference goes, so <code>open(p).read()</code> closes the descriptor immediately and appears fine. That is an implementation detail of one interpreter, not a language guarantee: on PyPy the file stays open until a collection runs, and CPython under <code>-X dev</code> raises a <code>ResourceWarning</code> to say so.</p><p>JavaScript had no construct at all — <code>try/finally</code> with an explicit close, or a helper like <code>pipeline()</code> that cleans up on your behalf. TypeScript 5.2 shipped the ECMAScript explicit-resource-management proposal: <code>using x = …</code> calls <code>x[Symbol.dispose]()</code> at the end of the enclosing block, <code>await using</code> calls <code>[Symbol.asyncDispose]()</code>. It needs a runtime carrying those well-known symbols — Node has been growing them since 20.4, where <code>FileHandle</code> gained <code>Symbol.asyncDispose</code> — or TypeScript's downlevel helpers plus a polyfill. Note the scoping difference from <code>with</code>: <code>using</code> is a declaration, so it disposes at the end of the <i>block</i>, not of an indented suite.</p><pre><code data-lang=\"java\">try (var out = new FileOutputStream(f)) {\n    throw new IllegalStateException(\"real bug\");\n}\n// close() also throws? You still see \"real bug\", with the close failure listed\n// under \"Suppressed:\". A hand-written finally would have hidden it completely.</code></pre>",
        "why": "Coming from Java or Python, the missing construct in JavaScript is easy to overlook because so much of Node cleans up for you — pipeline, fetch, the callback forms — right up to the point where you hold a FileHandle and leak descriptors under load. Going the other way, a Python developer's instinct that __exit__ may swallow an exception has no Java equivalent, and a Java developer's finally-close habit actively destroys the stack traces try-with-resources would have preserved.",
        "apply": [
          "<b>Use the construct, never a hand-written <code>finally</code></b> — try-with-resources preserves the primary exception via <code>addSuppressed()</code>; your <code>finally</code> replaces it.",
          "<b>Coming from Java, expect <code>__exit__</code> to be able to swallow</b> — a Python context manager returning <code>True</code> suppresses the exception; read every custom one before trusting it.",
          "<b>Do not lean on CPython refcounting</b> — <code>open(p).read()</code> closes promptly by accident, not by contract; use <code>with</code> or <code>Path.read_text()</code>.",
          "<b>In Node, close explicitly or use <code>using</code></b> — <code>await using</code> with <code>Symbol.asyncDispose</code> where the runtime supports it, <code>try/finally</code> otherwise; nothing closes a <code>FileHandle</code> for you."
        ],
        "code3": {
          "java": "// in a method that throws IOException; imports: java.nio.file.Files, java.nio.file.Path\nrecord Tx(String id) implements AutoCloseable {   // local records: Java 16+\n    Tx { System.out.println(\"open \" + id); }\n    public void close() { System.out.println(\"close \" + id); }\n}\n\ntry (var tx = new Tx(\"t1\");\n     var w = Files.newBufferedWriter(Path.of(\"out.txt\"))) {\n    w.write(\"hello\");\n    throw new IllegalStateException(\"boom\");\n}\n// prints: open t1 / (writer closed) / close t1 — reverse order, both always run\n// the IllegalStateException still propagates; a close() failure would be\n// attached to it via Throwable.addSuppressed(), not thrown in its place",
          "python": "from contextlib import contextmanager\nfrom pathlib import Path\n\n@contextmanager\ndef tx(name: str):\n    print(\"open\", name)\n    try:\n        yield name              # the caller's block runs here\n    finally:\n        print(\"close\", name)    # runs even when the block raises\n\nwith tx(\"t1\"), Path(\"out.txt\").open(\"w\") as w:\n    w.write(\"hello\")\n    raise RuntimeError(\"boom\")\n\n# prints: open t1 / close t1 — reverse order, then the error propagates\n# an __exit__ returning True would SWALLOW it; try-with-resources cannot do that",
          "ts": "// Node.js 24+, or TS 5.2 downlevel + a Symbol.dispose polyfill\n// tsconfig needs lib: [\"esnext.disposable\"]\nclass Tx implements Disposable {\n  constructor(readonly id: string) { console.log(\"open\", id); }\n  [Symbol.dispose]() { console.log(\"close\", this.id); }\n}\n\nfunction run(): void {\n  using tx = new Tx(\"t1\");     // disposed at the end of this BLOCK, reverse order\n  console.log(\"working in\", tx.id);\n  throw new Error(\"boom\");     // [Symbol.dispose]() still runs on the way out\n}\n\ntry { run(); } catch (e) { console.log((e as Error).message); }\n// prints: open t1 / working in t1 / close t1 / boom\n\n// `await using` + Symbol.asyncDispose is the async twin — Node's FileHandle has it"
        },
        "related": [
          "exceptions-errors",
          "file-read-write",
          "streams-buffers",
          "memory-gc"
        ]
      }
    ]

  {
    "name": "Advanced",
    "tag": "Advanced",
    "terms": [
      {
        "id": "reflection-metaprogramming",
        "title": "Reflection & Metaprogramming",
        "lede": "Java reflection is a bolt-on gated by the module system; Python is open to the metaclass; TS reflection dies at runtime.",
        "what": "<p>Reflection is a program inspecting and modifying its own structure at runtime — reading fields, invoking methods by name, rewriting attribute lookup. Metaprogramming is the broader act of writing code that shapes other code. How far each language lets you reach, and how much it fights you, differs sharply.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Entry point</td><td><code>Class</code>, <code>Method</code>, <code>Field</code></td><td><code>__dict__</code>, <code>getattr</code></td><td><code>Object.keys</code>, <code>Reflect</code></td></tr><tr><td>Access private</td><td><code>setAccessible(true)</code></td><td>name-mangled only</td><td>no true private at runtime</td></tr><tr><td>Intercept access</td><td>proxies via <code>Proxy</code> API</td><td><code>__getattr__</code></td><td><code>new Proxy</code></td></tr><tr><td>Redefine class shape</td><td>agents/bytecode only</td><td>metaclasses</td><td>impossible</td></tr><tr><td>Types at runtime</td><td>classes survive</td><td>classes survive</td><td>erased</td></tr></tbody></table><p>Java exposes a rich reflection API, but since Java 9 the module system pushes back: <code>setAccessible</code> on JDK internals throws <code>InaccessibleObjectException</code> unless a module explicitly <code>opens</code> the package. Reflection was too easy to abuse, so the platform re-fenced it. It is also slow relative to direct calls and defeats the JIT's assumptions, so frameworks cache <code>Method</code> handles or move to <code>MethodHandles</code>.</p><p>Python is radically open. Everything is a live object with a mutable <code>__dict__</code>; <code>getattr</code>/<code>setattr</code> reach any attribute, <code>__getattr__</code> intercepts misses, and metaclasses let you rewrite a class as it is being defined. This is why ORMs and pydantic feel effortless in Python — the language hands you the machinery. The cost is that almost nothing is guaranteed at rest, and tooling cannot see attributes conjured at runtime.</p><p>TypeScript occupies a strange middle. At runtime it is just JavaScript, so <code>Proxy</code>, <code>Reflect</code>, and <code>Object.keys</code> work — but the <i>types</i> are gone. You can enumerate an object's keys, yet you cannot ask \"what interface did this satisfy\"; that information never existed at runtime. Metaprogramming that depends on type shape must therefore be re-encoded as runtime values (schemas, decorators), because the compiler's knowledge does not survive.</p>",
        "why": "Coming from Python, expect Java to slam a door: a reflective hack that works in a script throws <code>InaccessibleObjectException</code> under the module system, and needs <code>--add-opens</code> JVM flags to run at all. Coming from Java, expect TypeScript reflection to be hollow — you can read keys but never recover the type, so anything type-driven must be duplicated as a runtime schema. Reflection is also a JIT/optimizer poison and a security surface everywhere.",
        "apply": [
          "<b>Cache reflective handles</b> in Java — resolve <code>Method</code>/<code>Field</code> once, never per call, and prefer <code>MethodHandles</code> in hot paths.",
          "<b>Coming from Python, do not assume open access</b> in Java — plan for module <code>opens</code>/<code>--add-opens</code> before reaching into internals.",
          "<b>Coming from Java, stop expecting runtime type info</b> in TS — carry a schema or discriminant value if you need shape at runtime.",
          "<b>Reserve metaclasses and <code>__getattr__</code></b> for genuine framework needs; they hide attributes from readers and tooling alike."
        ],

      {
        "id": "decorators-annotations",
        "title": "Decorators & Annotations",
        "lede": "Java annotations are inert metadata read by someone else; Python decorators actively replace the object; TS decorators wrap members.",
        "what": "<p>All three languages let you attach behaviour-adjacent syntax above a declaration with an <code>@</code> sigil, which invites the assumption that they do the same thing. They do not. The dividing line is <i>inert versus active</i>: whether the annotation does anything on its own, or is merely a label something else must read.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Nature</td><td>inert metadata</td><td>a function call</td><td>a function call</td></tr><tr><td>Effect on target</td><td>none by itself</td><td>replaces it</td><td>wraps/observes it</td></tr><tr><td>When it runs</td><td>never (just data)</td><td>at <code>def</code> time</td><td>at class-eval time</td></tr><tr><td>Who acts on it</td><td>reflection / APT</td><td>the decorator itself</td><td>the decorator itself</td></tr><tr><td>Retention</td><td><code>SOURCE</code>/<code>CLASS</code>/<code>RUNTIME</code></td><td>always runtime</td><td>always runtime</td></tr></tbody></table><p>A Java annotation is pure metadata. <code>@Override</code>, <code>@Entity</code>, <code>@Test</code> do nothing when the method loads. Their meaning is realised elsewhere: the compiler checks <code>@Override</code>, an annotation processor (APT) generates code at build time from <code>@Entity</code>, or a framework reads them via reflection at startup. This indirection is deliberate — annotations describe, and the describing is decoupled from the acting, which is why the same annotation can drive compile-time and runtime tools.</p><p>A Python decorator is the opposite: it is a function that receives the decorated object and returns a replacement, executed the instant the <code>def</code> or <code>class</code> is evaluated. <code>@app.route</code> genuinely registers the function; <code>@functools.cache</code> genuinely swaps in a memoising wrapper. The object you get back may not be the one you wrote. That power is also the footgun — decorators can silently change signatures, and stack in an order that matters.</p><p>TypeScript/JavaScript decorators (the Stage 3 standard, shipping in TS 5.0, distinct from the old <code>experimentalDecorators</code>) sit closer to Python: they are functions invoked when the class is evaluated, receiving the member and a context object, able to replace or wrap it. But because TS types are erased, a decorator cannot see static type information — only the runtime value — which limits the \"validate from the type\" tricks common elsewhere.</p>",
        "why": "The trap when switching is assuming <code>@X</code> is self-acting. A Java developer meeting Python decorators underestimates them — <code>@cache</code> really rewrites the function, and ordering bugs are real. A Python developer meeting Java annotations overestimates them — writing <code>@Entity</code> and expecting persistence, when without a processor or framework reading it, it is dead text. Retention policy is a further Java-only gotcha: a <code>SOURCE</code>-retained annotation is invisible to reflection at runtime.",
        "apply": [
          "<b>Coming from Python, treat Java annotations as data</b> — nothing happens until a processor, compiler check, or reflective framework reads them.",
          "<b>Coming from Java, treat Python/TS decorators as live code</b> that runs at definition time and can replace the target outright.",
          "<b>Mind decorator order</b> in Python/TS — they compose bottom-up around the target; the wrong order changes behaviour silently.",
          "<b>Set <code>@Retention(RUNTIME)</code></b> on any Java annotation you intend to read reflectively, or it will not survive to runtime."
        ],
        "code3": {
          "java": "import java.lang.annotation.*;\nimport java.lang.reflect.Method;\n\n@Retention(RetentionPolicy.RUNTIME)\n@interface Route { String value(); }\n\nclass Api {\n    @Route(\"/ping\")            // inert: does nothing by itself\n    void ping() { System.out.println(\"pong\"); }\n}\n\n// Someone else must read it:\nMethod m = Api.class.getDeclaredMethod(\"ping\");\nRoute r = m.getAnnotation(Route.class);\nSystem.out.println(r.value()); // \"/ping\" — realised via reflection",
          "python": "import functools\n\ndef route(path):\n    def deco(fn):\n        fn.route = path        # active: we mutate/replace now\n        print(f\"registered {path}\")  # runs at def time\n        return fn\n    return deco\n\n@route(\"/ping\")               # calls route(...)(ping) immediately\ndef ping():\n    return \"pong\"\n\nprint(ping.route)             # \"/ping\" — set before any call",
          "ts": "// Stage 3 decorators (TS 5.0+), no experimentalDecorators\nfunction route(path: string) {\n  return function (target: any, ctx: ClassMethodDecoratorContext) {\n    // active: runs at class evaluation, can wrap `target`\n    console.log(`registered ${path} on ${String(ctx.name)}`);\n    return target;             // return a replacement if desired\n  };\n}\n\nclass Api {\n  @route(\"/ping\")\n  ping() { return \"pong\"; }\n}\nnew Api().ping();"
        },

      {
        "id": "iterators-generators",
        "title": "Iterators & Generators",
        "lede": "Java has iterators but no generators; Python and TypeScript both have first-class generator functions with pausable execution.",
        "what": "<p>An iterator is an object that yields a sequence one element at a time. A generator is language sugar for <i>writing</i> an iterator by pausing a function mid-execution. All three have iterators; only two have generators, and that gap shapes how lazy sequences are expressed.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Iterable contract</td><td><code>Iterable.iterator()</code></td><td><code>__iter__</code></td><td><code>[Symbol.iterator]</code></td></tr><tr><td>Advance</td><td><code>hasNext</code>/<code>next</code></td><td><code>__next__</code></td><td><code>next()</code></td></tr><tr><td>End signal</td><td><code>hasNext()==false</code></td><td><code>raise StopIteration</code></td><td><code>{done:true}</code></td></tr><tr><td>Generators</td><td>none</td><td><code>yield</code></td><td><code>function*</code>/<code>yield</code></td></tr><tr><td>Comprehension form</td><td>—</td><td>genexpr <code>(x for …)</code></td><td>—</td></tr><tr><td>Async variant</td><td><code>Flow</code>/reactive</td><td><code>async def</code>+<code>yield</code></td><td><code>async function*</code></td></tr></tbody></table><p>Java standardised the iterator but never added a language construct to pause a method, because the JVM has no cheap continuation for arbitrary stack frames. To build a lazy sequence you either implement <code>Iterator</code> by hand (holding state in fields) or reach for <code>Stream.iterate</code>/<code>Stream.generate</code>, or a <code>Spliterator</code> for custom sources. These are the closest analogues to a generator, but they force you to externalise the state a <code>yield</code> would have kept implicitly on the stack.</p><p>Python's generator suspends the whole frame at each <code>yield</code>, resuming with local state intact — the runtime keeps the frame alive as a heap object. Exhaustion raises <code>StopIteration</code>, which the <code>for</code> loop swallows. Generator expressions give a one-line lazy pipeline, and <code>async def</code> plus <code>yield</code> produces async generators consumed with <code>async for</code>.</p><p>TypeScript inherits JavaScript's <code>function*</code>/<code>yield</code>, backed by the <code>Symbol.iterator</code> protocol and a <code>{value, done}</code> result object rather than an exception. A generator object is itself iterable, so it slots straight into <code>for…of</code> and spread. Async generators (<code>async function*</code>, consumed by <code>for await</code>) are first-class and are the idiomatic way to stream chunked I/O.</p><p>The key laziness point holds across all three: a lazy sequence computes nothing until pulled, so an infinite source is fine as long as you stop taking from it. The difference is ergonomic — Python and TS keep the producer's state implicitly on a suspended frame, while Java forces it into fields or a <code>Stream</code>'s internals. That is a readability tax, not a capability gap: anything a generator does, a hand-written Java iterator can do, only more verbosely.</p>",
        "why": "The concrete cost lands when porting lazy code to Java: a three-line Python generator becomes a stateful <code>Iterator</code> class or a <code>Stream</code> with a captured mutable holder, because there is no <code>yield</code> to suspend the frame. In the other direction, remember that Python signals end with a <code>StopIteration</code> exception while JS uses a <code>done</code> flag — hand-written iterators differ accordingly, and a stray <code>StopIteration</code> leaking out of a generator is a known Python gotcha (PEP 479).",
        "apply": [
          "<b>Coming from Python/TS to Java</b>, rewrite <code>yield</code> as a hand-rolled <code>Iterator</code> or <code>Stream.iterate</code> holding state explicitly — there is no generator.",
          "<b>Consume lazily</b>: never materialise an infinite generator; bound it with <code>limit</code>/<code>islice</code>/a <code>break</code>.",
          "<b>Coming from Java</b>, expect Python's end-of-iteration to be an exception (<code>StopIteration</code>), not a boolean check.",
          "<b>Use async generators</b> (<code>async def</code>+<code>yield</code>, <code>async function*</code>) for streamed I/O instead of buffering a whole list."
        ],
        "code3": {
          "java": "import java.util.stream.Stream;\n\n// No generators: lazy infinite sequence via Stream.iterate\n// in a method body:\nStream<Integer> squares =\n    Stream.iterate(1, n -> n + 1)   // 1,2,3,... lazily\n          .map(n -> n * n);          // 1,4,9,...\n\nsquares.limit(5)                     // must bound it\n       .forEach(System.out::println); // 1 4 9 16 25\n// State (the counter) lives inside iterate, not on our stack.",
          "python": "def squares():\n    n = 1\n    while True:            # infinite generator\n        yield n * n        # frame suspends here, state kept\n        n += 1\n\nimport itertools\nfor s in itertools.islice(squares(), 5):  # bound it\n    print(s)               # 1 4 9 16 25\n\n# generator expression, one line, also lazy:\ngen = (n * n for n in itertools.count(1))",
          "ts": "function* squares(): Generator<number> {\n  let n = 1;\n  while (true) {           // infinite generator\n    yield n * n;           // pauses; resumes with n intact\n    n++;\n  }\n}\n\nconst it = squares();\nfor (let i = 0; i < 5; i++) {\n  console.log(it.next().value); // 1 4 9 16 25\n}\n// end is signalled by { done: true }, not an exception"
        },

      {
        "id": "records-dataclasses",
        "title": "Records, Dataclasses & Structural Types",
        "lede": "Java records are compiler-generated nominal classes; Python dataclasses generate methods on real classes; a TS type is nothing at runtime.",
        "what": "<p>Every language offers a shortcut for \"a bundle of named fields with sensible equality and printing.\" What that shortcut compiles to — a genuine runtime entity or literally nothing — is where they diverge, and it maps onto the nominal-versus-structural split in their type systems.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Construct</td><td><code>record</code></td><td><code>@dataclass</code></td><td><code>interface</code>/type</td></tr><tr><td>Runtime presence</td><td>real final class</td><td>real class</td><td>none — erased</td></tr><tr><td>Equality</td><td>value-based auto</td><td>auto <code>__eq__</code></td><td>reference (<code>===</code>)</td></tr><tr><td>Immutability</td><td>always (final)</td><td><code>frozen=True</code> opt-in</td><td><code>readonly</code> (compile only)</td></tr><tr><td>Typing style</td><td>nominal</td><td>nominal</td><td>structural</td></tr><tr><td>Pattern match</td><td>record deconstruction</td><td><code>match</code> on class</td><td>none built-in</td></tr></tbody></table><p>A Java <code>record</code> (16+) is a final class whose canonical constructor, accessors, <code>equals</code>, <code>hashCode</code>, and <code>toString</code> the compiler writes for you. It is fully nominal and reflectable, and it participates in pattern matching via record deconstruction. The trade is rigidity: records are final, cannot extend a class, and every component is final — by design, they model transparent immutable data, not entities with identity.</p><p>Python's <code>@dataclass</code> is a class decorator that <i>generates</i> <code>__init__</code>, <code>__repr__</code>, and <code>__eq__</code> from annotated fields; <code>frozen=True</code> makes instances hashable and read-only. Alternatives trade off: <code>NamedTuple</code> is a tuple subclass (indexable, immutable), <code>TypedDict</code> types a plain dict with no class at all, and pydantic adds runtime validation on top. All but <code>TypedDict</code> produce a real class you can <code>isinstance</code>-check.</p><p>A TypeScript <code>interface</code> or type alias is the extreme case — a plain object shape that vanishes at compile time. There is no runtime entity, no generated equality, no constructor. Two objects are equal only by reference. Because the type system is structural, any object with the right fields <i>is</i> that type; you never \"construct\" one, you just assert a literal satisfies the shape. Runtime validation, if needed, comes from zod or io-ts, not the type.</p>",
        "why": "The surprise switching into TS is that a type gives you nothing at runtime: no equality, no validation, no <code>isinstance</code>. Data that crosses a boundary must be validated by hand or with zod, because the compiler's shape is gone. Coming to Java, expect records to be immutable and final — you cannot subclass one or mutate a field, so \"just add a setter\" is not available. And Python's <code>frozen=True</code> is the switch that turns a dataclass hashable; forget it and the instance cannot be a dict key.",
        "apply": [
          "<b>Reach for a Java <code>record</code></b> for immutable value carriers, but not when you need inheritance or mutability — it forbids both.",
          "<b>Set <code>frozen=True</code></b> on a Python dataclass when you need hashability or value immutability; the default is mutable.",
          "<b>Coming from Java/Python, do not trust a TS type at runtime</b> — validate external data with a schema library; the type is erased.",
          "<b>Pick <code>TypedDict</code> vs <code>@dataclass</code> deliberately</b> — the former is a dict with no runtime class, the latter a real, checkable class."
        ],
        "code3": {
          "java": "// Java 16+ record: final, value equality, auto methods\nrecord Point(int x, int y) {}\n\n// in a method body:\nPoint a = new Point(1, 2);\nPoint b = new Point(1, 2);\nSystem.out.println(a.equals(b));  // true — value-based\nSystem.out.println(a);            // Point[x=1, y=2]\n\n// pattern-matchable deconstruction:\nif (a instanceof Point(int x, int y))\n    System.out.println(x + y);    // 3",
          "python": "from dataclasses import dataclass\n\n@dataclass(frozen=True)   # immutable + hashable\nclass Point:\n    x: int\n    y: int\n\na = Point(1, 2)\nb = Point(1, 2)\nprint(a == b)             # True — generated __eq__\nprint(a)                  # Point(x=1, y=2)\nprint({a: \"ok\"}[b])       # 'ok' — usable as dict key",
          "ts": "// A type is a compile-time shape; nothing at runtime\ninterface Point { readonly x: number; readonly y: number }\n\nconst a: Point = { x: 1, y: 2 };\nconst b: Point = { x: 1, y: 2 };\nconsole.log(a === b);     // false — reference equality only\nconsole.log(a);           // { x: 1, y: 2 } (plain object)\n// structural: any {x,y} object IS a Point; no constructor,\n// no isinstance, no generated equals. Validate with zod if needed."
        },

      {
        "id": "functional-patterns",
        "title": "Functional Programming",
        "lede": "Java Streams are lazy pipelines; Python leans on comprehensions over map/filter; JS array methods are eager and allocate at each step.",
        "what": "<p>All three support first-class functions and the map/filter/reduce vocabulary, but the execution model underneath differs — lazy pull versus eager materialisation — and that changes both performance and idiom.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Pipeline API</td><td><code>Stream</code></td><td>comprehensions</td><td>array methods</td></tr><tr><td>Evaluation</td><td>lazy, single pass</td><td>eager list / lazy genexpr</td><td>eager, per-step array</td></tr><tr><td>Absent value</td><td><code>Optional&lt;T&gt;</code></td><td><code>None</code></td><td><code>undefined</code>/<code>null</code></td></tr><tr><td>Compose helpers</td><td><code>Function</code>/<code>Predicate</code></td><td><code>functools</code>/<code>itertools</code></td><td>closures</td></tr><tr><td>Reduce</td><td><code>.reduce</code>/<code>.collect</code></td><td><code>functools.reduce</code></td><td><code>.reduce</code></td></tr><tr><td>Tail calls</td><td>no</td><td>no</td><td>no (in practice)</td></tr></tbody></table><p>Java's Stream API is a lazy pipeline: intermediate operations (<code>map</code>, <code>filter</code>) build a plan and do nothing until a terminal operation (<code>collect</code>, <code>forEach</code>) pulls. The whole chain runs in a single pass with no intermediate collections, and can be parallelised with <code>parallelStream</code>. <code>Optional</code> models absence as a value to chain over rather than a null to check. A stream is single-use — consume it twice and it throws.</p><p>Python has <code>map</code>/<code>filter</code>, but idiom prefers comprehensions for readability; both a list comprehension (eager) and a generator expression (lazy) exist, so laziness is a choice you make. <code>functools.reduce</code> and <code>partial</code> plus the <code>itertools</code> toolbox cover the heavier functional work. There is no tail-call optimisation, so recursion is bounded by the stack.</p><p>JavaScript's <code>Array.prototype</code> methods are eager and allocate: <code>arr.map(f).filter(g)</code> builds one new array per step, walking the data multiple times. For small arrays this is irrelevant; for large ones it is a real allocation and cache cost, and there is no built-in lazy equivalent short of a manual generator. Despite the ECMAScript spec listing proper tail calls, no mainstream engine implements them, so deep recursion still overflows.</p><p>Absence handling also colours the style. Java's <code>Optional</code> is a value you map and chain over, encouraging a fluent pipeline that never touches null; Python and JS lean on plain <code>None</code>/<code>undefined</code> checks, which read more imperatively. None of the three is a purely functional language, so immutability is a discipline you opt into — Java via <code>final</code> and unmodifiable collections, Python via tuples and frozen dataclasses, TS via <code>readonly</code> and <code>const</code> — rather than a default the runtime enforces.</p>",
        "why": "The perf cliff is concrete: chaining <code>map().filter().map()</code> over a million-element JS array allocates three arrays and traverses three times, where the Java Stream does one pass and zero intermediate collections. Porting a hot loop from Java Streams to JS array methods can regress badly; the fix is a single reduce or a generator. Coming to Java, remember a Stream is consumed once — reusing it throws <code>IllegalStateException</code> — and <code>Optional</code> replaces the null check you would write in the others.",
        "apply": [
          "<b>Coming from JS to Java</b>, expect one lazy pass — build the whole chain before the terminal op, and never reuse a consumed stream.",
          "<b>For large JS data, avoid <code>map().filter()</code> chains</b> — collapse to one <code>reduce</code> or a generator to skip intermediate arrays.",
          "<b>Prefer comprehensions in Python</b> over <code>map</code>/<code>filter</code>; pick a genexpr when you want laziness.",
          "<b>Do not rely on tail-call recursion</b> in any of the three — rewrite deep recursion as iteration."
        ],
        "code3": {
          "java": "import java.util.List;\n// Sum of squares of even numbers — lazy single pass\n// in a method body:\nList<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\nint total = nums.stream()\n    .filter(n -> n % 2 == 0)   // 2,4,6  (lazy)\n    .mapToInt(n -> n * n)      // 4,16,36 (lazy)\n    .sum();                    // terminal: pulls the pipeline\nSystem.out.println(total);     // 56, no intermediate lists",
          "python": "# Comprehension is the idiom; genexpr keeps it lazy\nnums = [1, 2, 3, 4, 5, 6]\ntotal = sum(n * n for n in nums if n % 2 == 0)\nprint(total)                   # 56\n\n# functools/itertools for heavier composition:\nfrom functools import reduce\nprod = reduce(lambda a, b: a * b, (n for n in nums), 1)\nprint(prod)                    # 720",
          "ts": "// Array methods are eager: each step builds a new array\nconst nums = [1, 2, 3, 4, 5, 6];\nconst total = nums\n  .filter((n) => n % 2 === 0)  // allocates [2,4,6]\n  .map((n) => n * n)           // allocates [4,16,36]\n  .reduce((a, b) => a + b, 0); // walks a third time\nconsole.log(total);            // 56, three passes + 2 arrays"
        },

      {
        "id": "memory-gc",
        "title": "Memory Model & Garbage Collection",
        "lede": "The JVM uses tunable generational GC; CPython uses reference counting plus a cycle collector; V8 uses a generational scavenger.",
        "what": "<p>None of the three has manual free; all reclaim memory automatically. The algorithm differs, and with it the timing guarantees you can and cannot rely on — especially whether object cleanup is deterministic.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Primary mechanism</td><td>generational tracing</td><td>reference counting</td><td>generational scavenger</td></tr><tr><td>Cycles</td><td>collected</td><td>separate cycle detector</td><td>collected</td></tr><tr><td>Collectors</td><td>G1, ZGC, Parallel</td><td>refcount + gc module</td><td>Orinoco (Scavenge + M-C)</td></tr><tr><td>Cleanup timing</td><td>non-deterministic</td><td>often immediate</td><td>non-deterministic</td></tr><tr><td>Tunable heap</td><td><code>-Xmx</code>, GC flags</td><td>limited</td><td>flags, mostly fixed</td></tr><tr><td>Finalizers</td><td>deprecated/unreliable</td><td><code>__del__</code> unreliable</td><td>none reliable</td></tr></tbody></table><p>The JVM uses generational tracing: most objects die young, so a fast young-generation collection handles the churn and only survivors are promoted. Modern collectors (G1, ZGC) target low pause times — ZGC keeps stop-the-world pauses sub-millisecond by doing most work concurrently — and the heap is heavily tunable via flags. Cleanup timing is non-deterministic: an object is collected \"eventually\", which is why <code>finalize</code> is deprecated and you use <code>try-with-resources</code> for anything with a real resource.</p><p>CPython counts references: when an object's count hits zero it is freed immediately, giving semi-deterministic destruction (<code>__del__</code> often runs right when the last name drops). Reference cycles defeat refcounting, so a separate generational cycle collector runs periodically to catch them. The upside is prompt cleanup in the common case; the downside is refcount overhead on every assignment and the GIL-adjacent cost of atomic count updates.</p><p>V8 (behind TypeScript) is generational too: the Scavenger handles the young generation with fast copying, a mark-compact collector handles the old. Cleanup is non-deterministic. Across all three the real leaks are the same shape — a live reference you forgot: event listeners never removed, closures capturing large scopes, and static/global maps that only grow. <code>WeakReference</code>/<code>WeakHashMap</code>, <code>weakref</code>, and <code>WeakMap</code> exist precisely to hold a reference that does not prevent collection.</p>",
        "why": "The determinism gap bites when porting: Python code that leans on <code>__del__</code> firing when a variable leaves scope breaks on the JVM and in V8, where collection is deferred indefinitely — so file handles and sockets must be closed explicitly, not left to GC. In long-running services the leak class is identical everywhere and rarely about the GC algorithm: unremoved listeners, closures pinning big objects, and ever-growing static maps. Reach for weak references to cache without pinning.",
        "apply": [
          "<b>Never rely on finalizers</b> (<code>finalize</code>, <code>__del__</code>) for resource release — use <code>try-with-resources</code>, <code>with</code>, or explicit close.",
          "<b>Coming from Python, expect no prompt destruction</b> on the JVM/V8 — objects are freed eventually, not when the last reference drops.",
          "<b>Hunt leaks as retained references</b> everywhere: detach listeners, avoid unbounded static/global maps, watch closure capture.",
          "<b>Use weak references</b> (<code>WeakHashMap</code>, <code>weakref</code>, <code>WeakMap</code>) for caches and back-pointers that must not keep objects alive."
        ],
        "code3": {
          "java": "// Cleanup is non-deterministic: use try-with-resources\nimport java.io.BufferedReader;\nimport java.nio.file.*;\n\n// in a method body:\ntry (BufferedReader r =\n         Files.newBufferedReader(Path.of(\"data.txt\"))) {\n    System.out.println(r.readLine());\n}   // closed HERE, deterministically — not by the GC\n// finalize() is deprecated; never trust it to free resources",
          "python": "# Refcount frees promptly, but still close explicitly\nwith open(\"data.txt\") as f:      # deterministic close\n    print(f.readline())\n# f is closed at block exit, not left to __del__\n\nimport weakref\nclass Node: pass\nn = Node()\nref = weakref.ref(n)             # does not keep n alive\ndel n\nprint(ref())                     # None once collected",
          "ts": "// V8 GC is non-deterministic; close resources yourself\nconst cache = new WeakMap<object, string>(); // no pinning\nlet key: object | null = { id: 1 };\ncache.set(key, \"value\");\nconsole.log(cache.get(key));     // \"value\"\nkey = null;                      // entry may now be collected\n\n// classic leak: a listener you never remove keeps its\n// closure (and captured scope) alive forever."
        },
        "related": [
          "resource-management",
          "concurrency-model",
          "streams-buffers",
          "collections"
        ]

      {
        "id": "type-erasure-runtime",
        "title": "Type Erasure & Runtime Types",
        "lede": "Java erases generic parameters but keeps classes; Python erases hints but keeps classes; TypeScript erases everything to plain JS.",
        "what": "<p>\"How much of the type system survives to runtime\" is a spectrum, and the three land at three different points. It governs what you can check with <code>instanceof</code>, whether you can construct from a type parameter, and why runtime-validation libraries exist at all.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Classes at runtime</td><td>yes</td><td>yes</td><td>yes (JS classes)</td></tr><tr><td>Generic args</td><td>erased</td><td>erased</td><td>erased</td></tr><tr><td>Type hints/annotations</td><td>N/A</td><td>present, unenforced</td><td>fully erased</td></tr><tr><td><code>x instanceof T</code></td><td>class yes, <code>List&lt;String&gt;</code> no</td><td><code>isinstance</code> on class</td><td>class yes, interface no</td></tr><tr><td><code>new T()</code> from param</td><td>no</td><td>no (pass the class)</td><td>no</td></tr><tr><td>Runtime validation</td><td>manual/reflection</td><td>pydantic</td><td>zod</td></tr></tbody></table><p>Java erases generic <i>arguments</i> — <code>List&lt;String&gt;</code> and <code>List&lt;Integer&gt;</code> are the same class <code>List</code> at runtime — but keeps the classes themselves. So <code>x instanceof List</code> works, <code>x instanceof List&lt;String&gt;</code> does not compile, and you cannot write <code>new T()</code>; the type parameter is gone, so the convention is to pass a <code>Class&lt;T&gt;</code> token. Erasure was chosen for backward compatibility: pre-generics bytecode had to keep running, so generics became a compile-time-only overlay.</p><p>Python's annotations are erased in the sense that matters: they are stored as metadata (retrievable via <code>get_type_hints</code>) but <i>never enforced</i> — assigning a <code>str</code> to an <code>int</code>-annotated variable is fine at runtime, the mistake surfacing only under a separate checker like mypy. But classes are fully real, so <code>isinstance</code> works on them. This is why pydantic exists: to turn the ignored hints into actual runtime validation.</p><p>TypeScript is the extreme: <code>tsc</code> strips every type, interface, and generic, emitting plain JavaScript with nothing left to inspect. There is no runtime notion of an interface, no <code>instanceof</code> for a type, no way to reflect a generic. Anything crossing a runtime boundary — a JSON payload, a form — must be validated by a schema library (zod, io-ts) precisely because the compiler's guarantees evaporate at the edge.</p>",
        "why": "The shared trap is trusting a type at a boundary. In all three, a value deserialised from JSON is only the type you <i>claim</i> — nothing checked it — so a malformed payload flows in silently until it explodes later. Java at least keeps classes, so <code>instanceof</code> and a <code>Class&lt;T&gt;</code> token get you partway; TS keeps nothing, which is why zod is near-mandatory. And the <code>new T()</code> instinct from C#/C++ simply does not translate: pass a class object or factory instead.",
        "apply": [
          "<b>Validate external data at the boundary</b> — pydantic/zod/manual checks — because no language enforces a declared type on incoming JSON.",
          "<b>Coming from C#, drop <code>new T()</code></b> — pass a <code>Class&lt;T&gt;</code> (Java) or a factory/class value; the type parameter is erased.",
          "<b>Do not <code>instanceof</code> a generic or interface</b> — Java allows only the raw class, TS has no runtime interface at all.",
          "<b>Treat Python hints as documentation</b> the interpreter ignores; enforcement comes from mypy at build time, not at runtime."
        ],
        "code3": {
          "java": "import java.util.*;\n// Generic args are erased; the class is not\n// in a method body:\nList<String> ls = new ArrayList<>();\nList<Integer> li = new ArrayList<>();\nSystem.out.println(ls.getClass() == li.getClass()); // true!\nSystem.out.println(ls instanceof List);   // true (raw)\n// ls instanceof List<String>            // won't compile\n// new T()                               // impossible; pass Class<T>",
          "python": "def add(x: int, y: int) -> int:\n    return x + y\n\n# Hints are NOT enforced at runtime:\nprint(add(\"a\", \"b\"))        # 'ab' — no error, str concatenation!\n\nfrom typing import get_type_hints\nprint(get_type_hints(add))  # {'x': int, 'y': int, 'return': int}\n# classes ARE real, so isinstance works:\nprint(isinstance(5, int))   # True",
          "ts": "// Everything type-level is erased by tsc\ninterface User { id: number; name: string }\n\n// This compiles and runs, but nothing validates it:\nconst raw = JSON.parse('{\"id\":\"oops\"}') as User;\nconsole.log(raw.id);        // \"oops\" — a string, not a number\n// `raw instanceof User`    // error: interface is not a value\n// no runtime type survives — use zod to actually check"

        "lede": "Each ecosystem has a settled default stack: JUnit+Maven for Java, pytest+uv for Python, vitest+tsc+eslint for TypeScript.",
        "what": "<p>Beyond the language, each ecosystem converges on a test framework, a mocking approach, a build/dependency tool, and linters. The pieces are analogous but the conventions — how tests are discovered, how you assert — differ enough to trip a switcher.</p><table><thead><tr><th>Aspect</th><th>Java</th><th>Python</th><th>TypeScript</th></tr></thead><tbody><tr><td>Test framework</td><td>JUnit 5</td><td>pytest</td><td>vitest / jest</td></tr><tr><td>Mocking</td><td>Mockito</td><td><code>unittest.mock</code></td><td>vi/jest mocks</td></tr><tr><td>Build / deps</td><td>Maven, Gradle</td><td>uv, pip</td><td>npm, tsc</td></tr><tr><td>Lint / static</td><td>Checkstyle, SpotBugs</td><td>ruff, mypy</td><td>eslint, prettier</td></tr><tr><td>Discovery</td><td><code>@Test</code> annotation</td><td><code>test_*</code> name</td><td><code>*.test.ts</code> file</td></tr><tr><td>Assertion</td><td><code>assertEquals</code></td><td>plain <code>assert</code></td><td><code>expect().toBe</code></td></tr></tbody></table><p>Java testing is annotation-driven and explicit: JUnit 5 marks methods with <code>@Test</code>, Mockito builds mock objects, and Maven or Gradle drives the build and pulls dependencies from a declarative POM/build script. Static analysis is a separate layer — Checkstyle for style, SpotBugs for bug patterns — run in the build. Assertions are library methods, canonically <code>assertEquals(expected, actual)</code>, and argument order matters for the failure message.</p><p>Python's pytest discovers tests by naming convention (<code>test_*.py</code>, functions named <code>test_*</code>) and, distinctively, lets you use the bare <code>assert</code> statement — it rewrites the bytecode to produce rich failure output, so no assertion API is needed. <code>unittest.mock</code> patches objects in place. Tooling has consolidated fast: <code>ruff</code> now covers linting and formatting, <code>mypy</code> type-checks, and <code>uv</code> is the modern, very fast installer and resolver.</p><p>The TypeScript/JS side discovers tests by file pattern (<code>*.test.ts</code>), asserts with a fluent matcher API (<code>expect(x).toBe(y)</code>), and mocks through the runner (<code>vi.fn</code>/<code>jest.fn</code>). <code>tsc</code> type-checks separately from the test run, <code>eslint</code> lints, and <code>prettier</code> formats. The split of responsibilities — the type checker does not run tests, the test runner does not type-check unless told — is a recurring source of confusion for newcomers, and a green suite with a broken build is entirely possible.</p><p>The broader trend is consolidation. Python's tooling collapsed from a scatter of <code>flake8</code>/<code>black</code>/<code>isort</code>/<code>pip-tools</code> into <code>ruff</code> and <code>uv</code>, both written in Rust and dramatically faster. Java's build story stays split between the older, XML-declarative Maven and the more programmable Gradle. JavaScript remains the most fragmented — runner, type checker, linter, and formatter are four separate tools you wire together — though single-binary toolchains are beginning to merge those roles.</p>",

/* ---- Index (built-in + custom terms, rebuildable) ---- */
let GROUPS = [];
let TERMS = {};
let customTerms = {};   // id -> custom term (loaded from server or localStorage)

/* nested tags use "::" as the delimiter, e.g. "Reliability::Retries" */
const TAG_SEP = "::";
function tagParts(group) { return (group || "").split(TAG_SEP).map(s => s.trim()).filter(Boolean); }
function tagLeaf(group) { const p = tagParts(group); return p[p.length - 1] || group; }

function rebuildData() {
  GROUPS = []; TERMS = {};
  const byName = {};
  Object.values(customTerms).forEach(t => {
    if (!t.builtin) t._custom = true;
    let g = byName[t.group];
    if (!g) { g = { name: t.group, tag: t.tag || tagLeaf(t.group), terms: [] }; byName[t.group] = g; GROUPS.push(g); }
    g.terms.push(t);
  });
  GROUPS.forEach(g => g.terms.forEach(t => { t._group = g; TERMS[t.id] = t; }));
}

/* drop runtime-only props (_group back-ref, _custom) before persisting */
function stripRuntime(o) {
  const c = {};
  for (const k in o) if (k.charAt(0) !== "_") c[k] = o[k];
  return c;
}
function serializeMap(map) {
  const out = {};
  for (const id in map) out[id] = stripRuntime(map[id]);
  return out;
}

/* built-in terms become seed rows in the store (terms.json / localStorage) */
function builtinSeed() {
  const out = {};
  BUILTIN_GROUPS.forEach(g => g.terms.forEach(t => {
    out[t.id] = {
      id: t.id, title: t.title, group: g.name, tag: g.tag,
      lede: t.lede, what: t.what, why: t.why, apply: t.apply,
      code: t.code, code3: t.code3, related: t.related, builtin: true
    };
  }));
  return out;
}

const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---- Syntax highlighter: Java / Python / TypeScript (self-contained, no deps) ---- */
const LANG_KW = {
  java: new Set((
    "abstract assert boolean break byte case catch char class const continue default do double " +
    "else enum extends final finally float for goto if implements import instanceof int interface " +
    "long native new package private protected public return short static strictfp super switch " +
    "synchronized this throw throws transient try void volatile while " +
    // contextual keywords: var (10), yield (13), records/sealed/pattern matching (16-21)
    "var yield record sealed permits when " +
    "true false null").split(" ")),
  python: new Set((
    "and as assert async await break class continue def del elif else except finally for from " +
    "global if import in is lambda nonlocal not or pass raise return try while with yield " +
    // soft keywords (3.10+) and the conventional receiver names
    "match case self cls " +
    "True False None").split(" ")),
  ts: new Set((
    "break case catch class const continue debugger default delete do else enum export extends " +
    "finally for function if import in instanceof new return super switch this throw try typeof " +
    "var void while with yield let static async await of " +
    "abstract as asserts declare implements infer interface is keyof namespace never override " +
    "private protected public readonly require satisfies type unique unknown any accessor out using " +
    "boolean number string symbol object bigint undefined null true false").split(" "))
};

/* One capture group per token category, tried in source order:
   comment | string | annotation/decorator | number | word.
   The engine takes the leftmost match, so a '#' or '//' inside a string literal is
   consumed by the string alternative rather than starting a bogus comment. */
const LANG_RE = {
  java: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*[fFdDlL]?\b)|([A-Za-z_$][\w$]*)/g,
  python: /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*\.?[\d_]*\b)|([A-Za-z_]\w*)/g,
  ts: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*n?\b)|([A-Za-z_$][\w$]*)/g
};

function highlightCode(src, lang) {
  const L = LANG_KW[lang] ? lang : "ts";
  const kw = LANG_KW[L];
  const re = LANG_RE[L];
  re.lastIndex = 0;                       // the regexes are module-level and /g — reset per call
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tok-ann">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
    else {
      const w = m[5];
      if (kw.has(w)) out += `<span class="tok-kw">${esc(w)}</span>`;
      else if (/^[A-Z]/.test(w)) out += `<span class="tok-cls">${esc(w)}</span>`;
      else out += esc(w);
    }
  }
  out += esc(src.slice(last));
  return out;
}
/* Blocks declare their language with <code data-lang="java|python|ts">; default ts. */
function highlightBlocks(root) {
  if (!root) return;
  root.querySelectorAll("pre code").forEach(c => {
    if (c.dataset.hl) return;
    c.innerHTML = highlightCode(c.textContent, c.dataset.lang || "ts");
    c.dataset.hl = "1";
  });
}

/* ---- Shared detail HTML ---- */
function detailHTML(t, withTag) {
  const related = (t.related || []).filter(r => TERMS[r]).map(r =>
    `<span class="pill" data-id="${r}">${TERMS[r].title}</span>`).join("");
  return `
    ${withTag ? `<div class="crumbs"><span class="tag-chip">${t._group.tag}</span></div>` : ""}
    <h2 class="term-title">${t.title}</h2>
    ${t.lede ? `<p class="lede">${t.lede}</p>` : ""}
    <div class="term-actions">
      <button class="note-action" data-act="edit-term">&#9998; Edit term</button>
      ${!t.builtin ? `<button class="note-action danger" data-act="delete-term">&#128465; Delete</button>` : ""}
    </div>
    ${t.what ? `<div class="section"><h3>${t.builtin ? "What it is" : "Details"}</h3><div class="rich">${t.what}</div></div>` : ""}
    ${t.why ? `<div class="section"><h3>Why it matters</h3><p>${t.why}</p></div>` : ""}
    ${t.apply && t.apply.length ? `<div class="section"><h3>How to apply</h3><ul>${t.apply.map(a => `<li>${a}</li>`).join("")}</ul></div>` : ""}
    ${compareSectionHTML(t)}
    ${t.code ? `<div class="section"><h3>Example</h3><pre><code>${escapeHtml(t.code)}</code></pre></div>` : ""}
    ${notesSectionHTML()}
    ${related ? `<div class="section"><h3>Related terms</h3><div class="related">${related}</div></div>` : ""}
  `;
}

/* ---- Side-by-side Java / Python / TypeScript example ---- */
const CMP_LANGS = [
  { key: "java",   label: "Java" },
  { key: "python", label: "Python" },
  { key: "ts",     label: "TypeScript" }
];
function compareSectionHTML(t) {
  const c = t.code3;
  if (!c || !CMP_LANGS.some(l => c[l.key])) return "";
  const cols = CMP_LANGS.map(l => `
    <div class="cmp-col" data-lang="${l.key}">
      <div class="cmp-head"><span class="dot"></span>${l.label}</div>
      <pre><code data-lang="${l.key}">${escapeHtml(c[l.key] || "")}</code></pre>
    </div>`).join("");
  return `
    <div class="section cmp-section">
      <div class="cmp-bar">
        <h3>Side by side</h3>
        <div class="cmp-toggle">
          <button data-cmp="cols" class="active" title="Three columns">Columns</button>
          <button data-cmp="stack" title="Stacked">Stacked</button>
        </div>
      </div>
      <div class="cmp3">${cols}</div>
    </div>`;
}

/* shared "My notes" markup (used by Term and QA detail) */
function notesSectionHTML() {
  return `
    <div class="section notes-section">
      <div class="notes-head">
        <h3>My notes</h3>
        <div class="notes-actions">
          <button class="note-action" data-act="edit">&#9998; Edit</button>
          <button class="note-action primary" data-act="save" hidden>&#10003; Save</button>
          <button class="note-action" data-act="cancel" hidden>Cancel</button>
        </div>
      </div>
      <div class="note-view"></div>
      <div class="note-edit" hidden>
        <div class="note-toolbar">
          <button class="note-btn" data-cmd="bold" title="Bold"><b>B</b></button>
          <button class="note-btn" data-cmd="italic" title="Italic"><i>I</i></button>
          <button class="note-btn" data-cmd="underline" title="Underline"><u>U</u></button>
          <button class="note-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
          <button class="note-btn" data-cmd="formatBlock" title="Heading">H</button>

const nav = document.getElementById("nav");
let sidebarMode = "tree";
let navSection = "terms";            // "terms" | "qa" | "topics" | "docs"
function navGroups() { return navSection === "qa" ? QA_GROUPS : navSection === "topics" ? TOPIC_GROUPS : GROUPS; }
function navIndex() { return navSection === "qa" ? QA_INDEX : navSection === "topics" ? TOPIC_INDEX : TERMS; }
function navOpen(id) { return navSection === "qa" ? selectQA(id) : navSection === "topics" ? selectTopic(id) : select(id); }
function renderSidebar(mode) {
  sidebarMode = mode;
  nav.innerHTML = "";
  nav.classList.toggle("flat", mode === "flat");

  if (navSection === "docs") {
    const group = document.createElement("div");

  if (mode === "flat") {
    const all = Object.values(navIndex()).slice().sort((a, b) => a.title.localeCompare(b.title));
    const group = document.createElement("div");
    group.className = "group";

function itemEl(t) {
  const el = document.createElement("div");
  el.className = "term";
  el.dataset.id = t.id;
  el.textContent = t.title;
  el.addEventListener("click", () => navOpen(t.id));
  return el;
}
/* build a nested tree from groups whose names use "::" (e.g. "A::B::C") */
function buildTree(groups) {
  const root = { children: {}, order: [], terms: [] };
  groups.forEach(g => {
    let node = root;
    tagParts(g.name).forEach(p => {
      if (!node.children[p]) { node.children[p] = { name: p, children: {}, order: [], terms: [] }; node.order.push(p); }
      node = node.children[p];
    });
    node.terms.push(...g.terms);
  });
  return root;
}
function countTree(node) {
  let n = node.terms.length;
  node.order.forEach(k => (n += countTree(node.children[k])));
  return n;
}
function renderTreeNode(node, container, depth) {
  node.order.forEach(key => {
    const child = node.children[key];
    const group = document.createElement("div");
    group.className = "group";
    const head = document.createElement("div");
    head.className = "group-head";
    head.style.paddingLeft = (10 + depth * 12) + "px";
    head.innerHTML = `<span class="caret">▼</span><span>${child.name}</span><span class="count">${countTree(child)}</span>`;
    head.addEventListener("click", () => group.classList.toggle("collapsed"));
    group.appendChild(head);
    const items = document.createElement("div");
    items.className = "group-items";
    renderTreeNode(child, items, depth + 1);          // nested sub-tags first
    child.terms.forEach(t => {
      const el = itemEl(t);
      el.style.paddingLeft = (22 + depth * 12) + "px";
      items.appendChild(el);
    });
    group.appendChild(items);
    container.appendChild(group);
  });
}

const GROUP_COLORS = ["#6ea8fe", "#b692ff", "#ff9e64", "#5ed3a0", "#ff7b9c"];
const CHIP_SIZES = [14, 16, 13, 17, 15];
let wallBuilt = false;
function renderWall() {

/* ---- Globe view (rotating 3D sphere of term chips) ---- */
const ovGlobe = document.getElementById("ov-globe");
const ovbGlobe = document.getElementById("ovb-globe");
let globeBuilt = false, globeActive = false, globeRAF = null;
let globeChips = [];
let gAngleX = 0.3, gAngleY = 0, gVelX = 0, gVelY = 0.004, gPaused = false;
let gZoom = 1, gAuto = true;
const gMouse = { x: 0, y: 0, inside: false };

function buildGlobe() {
  if (globeBuilt) return;
  const all = [];
  ovCtx.groups().forEach((g, gi) => g.terms.forEach(t => all.push({ t, color: GROUP_COLORS[gi % GROUP_COLORS.length] })));
  const N = all.length;
  all.forEach((item, idx) => {
    const phi = Math.acos(1 - 2 * (idx + 0.5) / N);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (idx + 0.5);
    const chip = document.createElement("div");
    chip.className = "globe-chip";
    chip.textContent = item.t.title;
    chip.style.color = item.color;
    chip.style.borderColor = item.color;
    chip.addEventListener("mouseenter", e => { gPaused = true; showTip(e, item.t); });
    chip.addEventListener("mousemove", moveTip);
    chip.addEventListener("mouseleave", () => { gPaused = false; hideTip(); });
    chip.addEventListener("click", () => { hideTip(); ovCtx.open(item.t.id); });
    ovGlobe.appendChild(chip);
    globeChips.push({
      el: chip,
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    });
  });
  globeBuilt = true;
}
function globeFrame() {
  if (!globeActive) return;
  const rect = ovGlobe.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const radius = (Math.min(rect.width, rect.height) / 2 - 70) * gZoom;
  if (!gPaused && gAuto) {
    if (gMouse.inside) {
      gVelY = ((gMouse.x - cx) / cx) * 0.06;
      gVelX = -((gMouse.y - cy) / cy) * 0.06;
    } else {
      gVelY += (0.004 - gVelY) * 0.02;
      gVelX += (0 - gVelX) * 0.02;
    }
    gAngleY += gVelY;
    gAngleX += gVelX;
  }
  const sinY = Math.sin(gAngleY), cosY = Math.cos(gAngleY);
  const sinX = Math.sin(gAngleX), cosX = Math.cos(gAngleX);
  globeChips.forEach(c => {
    const x1 = c.x * cosY - c.z * sinY;
    const z1 = c.x * sinY + c.z * cosY;
    const y2 = c.y * cosX - z1 * sinX;
    const z2 = c.y * sinX + z1 * cosX;
    const depth = (z2 + 1) / 2;                 // 0 (back) .. 1 (front)
    const px = cx + x1 * radius;
    const py = cy + y2 * radius;
    const el = c.el;
    el.style.transform = `translate(-50%,-50%) translate(${px}px,${py}px) scale(${(0.6 + depth * 0.55).toFixed(3)})`;
    el.style.opacity = (0.3 + depth * 0.7).toFixed(3);
    el.style.zIndex = Math.round(depth * 100);
  });
  globeRAF = requestAnimationFrame(globeFrame);
}
function startGlobe() {
  buildGlobe();
  globeActive = true;
  if (!globeRAF) globeRAF = requestAnimationFrame(globeFrame);
}
function stopGlobe() {
  globeActive = false;
  if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
}
ovGlobe.addEventListener("mousemove", e => {
  const r = ovGlobe.getBoundingClientRect();
  gMouse.x = e.clientX - r.left; gMouse.y = e.clientY - r.top; gMouse.inside = true;
});
ovGlobe.addEventListener("mouseleave", () => { gMouse.inside = false; });

/* globe control bar */
const globeControls = document.getElementById("globe-controls");
let gHoldTimer = null;
function gHoldStart(fn) { fn(); gHoldTimer = setInterval(fn, 40); }
function gHoldStop() { if (gHoldTimer) { clearInterval(gHoldTimer); gHoldTimer = null; } }
const GSTEP = 0.1;
function gNudge(dir) {
  if (dir === "left") gAngleY -= GSTEP;
  else if (dir === "right") gAngleY += GSTEP;
  else if (dir === "up") gAngleX -= GSTEP;
  else if (dir === "down") gAngleX += GSTEP;
}
function gZoomBy(f) { gZoom = Math.min(2.4, Math.max(0.6, gZoom * f)); }
const HOLD_END = ["pointerup", "pointerleave", "pointercancel"];
globeControls.querySelectorAll(".gc-btn[data-dir]").forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener("pointerdown", e => { e.preventDefault(); gHoldStart(() => gNudge(dir)); });
  HOLD_END.forEach(ev => btn.addEventListener(ev, gHoldStop));
});

[zin, zout].forEach(b => HOLD_END.forEach(ev => b.addEventListener(ev, gHoldStop)));

globeControls.querySelector('[data-act="reset"]').addEventListener("click", () => {
