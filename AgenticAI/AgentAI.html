  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(searchInputEl.value), 150);
});

/* ---- Docs (renders .md files from the ./docs/ folder in the main pane) ---- */
let DOCS = [], docsLoaded = false, currentDocName = null;

async function loadDocs() {
  if (docsLoaded) return DOCS;
  if (SERVER) {
    try {
      const r = await fetch("/docs");
      if (r.ok) { DOCS = await r.json(); docsLoaded = true; }
    } catch (e) { DOCS = []; }
  } else {
    docsLoaded = true;
  }
  return DOCS;
}

/* --- inline markdown (bold / italic / code / links / images) --- */
function mdInline(s) {
  s = escapeHtml(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, (m, alt, src) => `<img alt="${alt}" src="${src}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, (m, t, h) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_/g, "$1<em>$2</em>");
  return s;
}

/* --- block markdown -> HTML; each block carries data-line for search jumps --- */
function renderMarkdown(md) {
  const lines = (md || "").replace(/\r\n?/g, "\n").split("\n");
  const at = n => ` data-line="${n}"`;
  const listRe = /^\s*([-*+]|\d+\.)\s+/;
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*```(.*)$/);
    if (fence) {
      const start = i; i++;
      const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;                                                   // consume closing fence
      const lang = (fence[1] || "").trim().toLowerCase();
      if (lang === "mermaid") {
        // emit a mermaid block; renderMermaid() turns it into an SVG after the doc mounts.
        // escaped source is the element's textContent, which mermaid reads verbatim.
        html += `<pre class="mermaid"${at(start)}>${escapeHtml(buf.join("\n"))}</pre>`;
      } else {
        // only colorize fences that declare a language; bare ``` fences in these
        // docs are ASCII diagrams / prose flows, which highlighting would just noise up.
        const src = buf.join("\n");
        html += `<pre${at(start)}><code>${lang ? highlightCode(src) : escapeHtml(src)}</code></pre>`;
      }
      continue;
    }
    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (h) { html += `<h${h[1].length}${at(i)}>${mdInline(h[2].trim())}</h${h[1].length}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += `<hr${at(i)}>`; i++; continue; }
    // table: header row followed by a |---|---| separator
    if (line.includes("|") && i + 1 < lines.length &&
        /-/.test(lines[i + 1]) && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const start = i;
      const row = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const heads = row(line); i += 2;
      let body = "";
      while (i < lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])) {
        body += "<tr>" + row(lines[i]).map(c => `<td>${mdInline(c)}</td>`).join("") + "</tr>"; i++;
      }
      html += `<table${at(start)}><thead><tr>${heads.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if (/^\s*>/.test(line)) {
      const start = i; const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html += `<blockquote${at(start)}>${mdInline(buf.join(" "))}</blockquote>`;
      continue;
    }
    if (listRe.test(line)) {
      const ordered = /^\s*\d+\.\s+/.test(line);
      const start = i; let items = "";
      while (i < lines.length && listRe.test(lines[i])) {
        items += `<li${at(i)}>${mdInline(lines[i].replace(listRe, ""))}</li>`; i++;
      }
      html += `<${ordered ? "ol" : "ul"}${at(start)}>${items}</${ordered ? "ol" : "ul"}>`;
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    const start = i; const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6})\s/.test(lines[i]) &&
           !/^\s*```/.test(lines[i]) && !/^\s*>/.test(lines[i]) && !listRe.test(lines[i]) &&
           !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
    html += `<p${at(start)}>${mdInline(buf.join(" "))}</p>`;
  }
  return html;
}

/* open a doc in the main pane (its title stays highlighted in the Docs sidebar) */
/* show the reading pane with the Docs top-tab highlighted */
function showDocsPane() {

  overview.classList.remove("show");

/* pick a mermaid theme from the current background luminance, so diagrams
   match whichever app theme is active (dark vs light family) */
function mermaidThemeForCurrent() {
  try {
    const m = getComputedStyle(document.body).backgroundColor.match(/\d+(\.\d+)?/g);
    if (!m) return "default";
    const [r, g, b] = m.map(Number);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128 ? "dark" : "default";
  } catch (e) { return "default"; }
}

/* turn any <pre class="mermaid"> in `container` into an SVG diagram.
   On failure the source stays visible in the code box, so a bad diagram
   degrades to text rather than vanishing. */
function renderMermaid(container) {
  if (!window.mermaid) return;
  const nodes = container.querySelectorAll("pre.mermaid:not(.mermaid-rendered):not(.mermaid-error)");
  if (!nodes.length) return;
  try {
    window.mermaid.initialize({ startOnLoad: false, theme: mermaidThemeForCurrent(),
      securityLevel: "strict", flowchart: { htmlLabels: true } });
  } catch (e) {}
  nodes.forEach((node, idx) => {
    const src = node.textContent;
    const id = "mmd-" + idx + "-" + (mermaidRenderSeq++);
    try {
      window.mermaid.render(id, src).then(({ svg }) => {
        node.innerHTML = svg;
        node.classList.add("mermaid-rendered");
      }).catch(() => node.classList.add("mermaid-error"));
    } catch (e) { node.classList.add("mermaid-error"); }
  });
}
let mermaidRenderSeq = 0;

/* re-render the current markdown doc so mermaid picks up a new theme.
   applyTheme() runs at startup before DOCS/currentDocName are initialized
   (they are `let`s in the temporal dead zone), so guard with try/catch —
   a throw here just means "nothing to re-render yet". */
function rerenderCurrentDoc() {
  try {
    if (!currentDocName || !DOCS) return;
    const d = DOCS.find(x => x.name === currentDocName);
    if (d && d.type !== "pdf") renderDoc(currentDocName);
  } catch (e) { /* app not initialized yet — no doc to re-render */ }
}

/* render one doc's markdown into the main pane */
/* ---- Link quick-view -------------------------------------------------------
   Adds a 👁 icon after links that point at a fetchable text file (GitHub blob /
   raw URLs, or any *.md/.py/.json/... link). Hovering the icon fetches the file
   and shows a scrollable preview. raw.githubusercontent.com sends
   `access-control-allow-origin: *`, so the cross-origin fetch is allowed. */
const LP_CACHE = new Map();
const LP_TEXT_EXT = /\.(md|markdown|txt|py|js|ts|json|ya?ml|toml|sh|java|go|rs|sql|proto)(\?.*)?$/i;

function toRawUrl(href) {
  const blob = href.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
  if (blob) return `https://raw.githubusercontent.com/${blob[1]}/${blob[2]}/${blob[3]}`;
  if (/^https:\/\/raw\.githubusercontent\.com\//.test(href)) return href;
  if (/^https?:\/\//.test(href) && LP_TEXT_EXT.test(href)) return href;
  return null;                                   // not previewable
}

let lpPop = null, lpHideTimer = null, lpOverPop = false;
function lpEl() {
  if (lpPop) return lpPop;
  lpPop = document.createElement("div");
  lpPop.className = "lp-pop";
  lpPop.addEventListener("mouseenter", () => { lpOverPop = true; clearTimeout(lpHideTimer); });
  lpPop.addEventListener("mouseleave", () => { lpOverPop = false; lpHide(); });
  document.body.appendChild(lpPop);
  return lpPop;
}
function lpHide() {
  clearTimeout(lpHideTimer);
  lpHideTimer = setTimeout(() => { if (!lpOverPop) lpEl().classList.remove("show"); }, 260);
}
function lpPosition(icon) {
  const pop = lpEl(), r = icon.getBoundingClientRect();
  pop.style.visibility = "hidden"; pop.classList.add("show");
  const pr = pop.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - pr.width - 12);
  let top = r.bottom + 8;
  if (top + pr.height > window.innerHeight - 10) top = Math.max(10, r.top - pr.height - 8);
  pop.style.left = Math.max(10, left) + "px";
  pop.style.top = top + "px";
  pop.style.visibility = "";
}

async function lpShow(icon, href, rawUrl) {
  const pop = lpEl();
  const name = decodeURIComponent(rawUrl.split("/").pop() || "file");
  const head = `<div class="lp-head"><span class="lp-name">${escapeHtml(name)}</span>` +
               `<a class="lp-open" href="${href}" target="_blank" rel="noopener">Open ↗</a></div>`;
  if (!LP_CACHE.has(rawUrl)) {
    pop.innerHTML = head + `<div class="lp-body" style="color:var(--muted)">Loading…</div>`;
    lpPosition(icon);
    try {
      const res = await fetch(rawUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      LP_CACHE.set(rawUrl, await res.text());
    } catch (e) {
      LP_CACHE.set(rawUrl, null);
    }
  }
  const text = LP_CACHE.get(rawUrl);
  if (text === null || text === undefined) {
    pop.innerHTML = head + `<div class="lp-body" style="color:var(--muted)">` +
      `Couldn't fetch this file (offline, or the host blocks cross-origin reads). Use <b>Open ↗</b>.</div>`;
  } else {
    const LIMIT = 12000;
    const clipped = text.length > LIMIT;
    const src = clipped ? text.slice(0, LIMIT) : text;
    const body = /\.(md|markdown)(\?.*)?$/i.test(rawUrl)
      ? renderMarkdown(src)
      : `<pre><code>${highlightCode(src)}</code></pre>`;
    pop.innerHTML = head + `<div class="lp-body">${body}` +
      (clipped ? `<div class="lp-fade">… truncated — open the file for the rest.</div>` : "") +
      `</div>`;
  }
  lpPosition(icon);
}

function attachLinkPreviews(root) {
  if (!root) return;
  root.querySelectorAll("a[href]").forEach(a => {
    if (a.dataset.lp === "1") return;
    const raw = toRawUrl(a.getAttribute("href") || "");
    if (!raw) return;
    a.dataset.lp = "1";
    const icon = document.createElement("span");
    icon.className = "lp-icon";
    icon.textContent = "👁";
    icon.title = "Quick view";
    let hoverTimer = null;
    icon.addEventListener("mouseenter", () => {
      clearTimeout(lpHideTimer);
      hoverTimer = setTimeout(() => lpShow(icon, a.href, raw), 140);
    });
    icon.addEventListener("mouseleave", () => { clearTimeout(hoverTimer); lpHide(); });
    icon.addEventListener("click", e => { e.preventDefault(); lpShow(icon, a.href, raw); });
    a.insertAdjacentElement("afterend", icon);
  });
}

function renderDoc(name) {
  const doc = DOCS.find(d => d.name === name);
  if (!doc) return false;
  currentDocName = name;
  markActive(name);
  if (doc.type === "pdf" || doc.type === "html") {
    // both render in an isolated iframe — an HTML doc keeps its own CSS/JS
    // instead of clashing with the app's stylesheet.
    detail.innerHTML =
      `<div class="pdf-view">` +
        `<div class="pdf-bar"><span class="pdf-name">${escapeHtml(doc.title || doc.name)}</span>` +
        `<a href="${doc.url}">Open full page →</a></div>` +
        `<iframe class="pdf-frame" data-src="${doc.url}" title="${escapeHtml(doc.name)}"></iframe>` +
      `</div>`;
  } else {
    detail.innerHTML = `<div class="markdown-body">${renderMarkdown(doc.markdown)}</div>`;
    renderMermaid(detail);
    attachLinkPreviews(detail);
  }
  // A document needs a way out that does not depend on the sidebar. Injected
  // after the body is built, because the six renderDoc variants across these
  // pages assemble `detail` differently but all end here.
  detail.insertAdjacentHTML("afterbegin",
    `<div class="doc-back">` +
      `<button type="button" data-act="docs-back">\u2190 All documents</button>` +
      `<button type="button" class="doc-close" data-act="docs-back" title="Close document" aria-label="Close document">\u2715</button>` +
    `</div>`);
  detail.querySelectorAll('[data-act="docs-back"]').forEach(b =>
    b.addEventListener("click", renderDocsIndex));
  history.replaceState(null, "", "#doc/" + encodeURIComponent(name));
  main.scrollTop = 0;
  return true;
}

/* entry point for the Docs tab (top tab or sidebar tab): show a doc, or a hint if none */
/* A document's kind, for the card. Some baked entries predate the `type`
   field, so fall back to the extension rather than mislabelling them. */
function docKind(d) {
  const t = d.type || (/\.md$/i.test(d.name) ? "markdown" : /\.pdf$/i.test(d.name) ? "pdf" : "html");
  return t === "markdown" ? "Markdown" : t === "pdf" ? "PDF" : "Page";
}

/* One card per document. */
function docBox(d) {
  const el = document.createElement("div");
  el.className = "box doc-box";
  el.innerHTML = `<div class="b-title">${escapeHtml(d.title || d.name)}</div>` +
                 `<div class="b-kind">${docKind(d)}</div>`;
  el.title = d.name;
  el.addEventListener("click", () => selectDoc(d.name));
  return el;
}

/* The Docs landing page: what this module actually holds. */
function renderDocsIndex() {
  currentDocName = null;
  markActive(null);
  detail.innerHTML = "";
  if (!DOCS.length) {
      detail.innerHTML = `<div class="markdown-body"><p style="color:var(--muted)">${SERVER
        ? "No <code>.md</code> files in the <code>docs/</code> folder yet — drop some in and reload."
        : "Docs live in Google Drive — sign in to load them."}</p></div>`;
    history.replaceState(null, "", "#docs");
    return;
  }
  const head = document.createElement("div");
  head.className = "docs-index-head";
  head.innerHTML = `<h2>Documents</h2><span class="count">${DOCS.length}</span>`;
  detail.appendChild(head);
  const boxes = document.createElement("div");
  boxes.className = "boxes";
  DOCS.forEach(d => boxes.appendChild(docBox(d)));
  detail.appendChild(boxes);
  history.replaceState(null, "", "#docs");
  main.scrollTop = 0;
}

function enterDocs() {
  loadDocs().then(() => {
    setNavSection("docs");
    showDocsPane();
    renderDocsIndex();
  });
}

/* clicking a doc in the sidebar opens it in the main pane */
function selectDoc(name) {
  if (!DOCS.find(d => d.name === name)) return;
  setNavSection("docs");
  showDocsPane();
  renderDoc(name);
}

/* open a doc from a search hit and jump to the matching line */
async function openDocAt(name, lineNo, query) {
  await loadDocs();
  setNavSection("docs");
  showDocsPane();
  renderDoc(name);
  requestAnimationFrame(() => scrollDocToLine(lineNo, query));
}

function scrollDocToLine(lineNo, query) {
  const blocks = [...detail.querySelectorAll("[data-line]")];
  if (!blocks.length) return;
  let target = blocks.find(b => +b.getAttribute("data-line") === lineNo);
  if (!target) {                                            // otherwise, the block that contains this line
    blocks.forEach(b => {
      const bl = +b.getAttribute("data-line");
      if (bl <= lineNo && (!target || bl > +target.getAttribute("data-line"))) target = b;
    });
  }
  if (!target) target = blocks[0];
  target.scrollIntoView({ block: "center", behavior: "smooth" });
  target.classList.remove("doc-flash"); void target.offsetWidth; target.classList.add("doc-flash");
  setTimeout(() => target.classList.remove("doc-flash"), 2000);
  highlightMatch(target, query);
}

function highlightMatch(el, query) {
  if (!query) return;
  const q = query.toLowerCase();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while (n = walker.nextNode()) nodes.push(n);
  for (const node of nodes) {
    const idx = node.nodeValue.toLowerCase().indexOf(q);
    if (idx === -1) continue;
    const after = node.splitText(idx);
    after.splitText(query.length);
    const mark = document.createElement("mark");
    mark.className = "doc-hit";
    mark.textContent = after.nodeValue;
    after.parentNode.replaceChild(mark, after);
    setTimeout(() => {
      if (mark.parentNode) mark.parentNode.replaceChild(document.createTextNode(mark.textContent), mark);
    }, 4000);
    break;
  }
}

/* ---- Init ---- */
async function boot() {
  [customTerms, qaItems, topicItems] = await Promise.all([loadCustomTerms(), loadQA(), loadTopics()]);
  // ensure built-in terms live in the store; seed any that are missing
  const seed = builtinSeed();
  const missing = Object.keys(seed).filter(id => !customTerms[id]);
  if (missing.length) {
    missing.forEach(id => { customTerms[id] = seed[id]; });
    if (SERVER) {
      for (const id of missing) {
        try { await fetch("/terms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(seed[id]) }); } catch (e) {}
      }
    } else {
      try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(serializeMap(customTerms))); } catch (e) {}
    }
  }
  rebuildData();
  rebuildQAData();
  rebuildTopicData();
  initFolder();
  // restore sidebar open/closed + tree/flat view
  // Stacked above the content on a phone, an open sidebar would push the
  // detail off-screen on arrival, so it starts closed there — but only when
  // the user has expressed no preference of their own.
  const navPref = loadPref("agentai-nav-open", "");
  const narrow  = window.matchMedia("(max-width: 860px)").matches;
  if (navPref === "0" || (navPref === "" && narrow)) layout.classList.add("nav-closed");
  const savedView = loadPref("agentai-nav-view", "tree");
  btnTree.classList.toggle("active", savedView === "tree");
  btnFlat.classList.toggle("active", savedView !== "tree");
  renderSidebar(savedView);
  const initial = location.hash.slice(1);
  if (initial === "docs") {                       // the Docs landing list
    await loadDocs();
    enterDocs();
  } else if (initial.startsWith("doc/")) {        // deep link to a doc: #doc/<filename>
    const nm = decodeURIComponent(initial.slice(4));
    await loadDocs();
    if (DOCS.find(d => d.name === nm)) selectDoc(nm);
    // A link to a document since renamed or removed should land on the list it
    // belongs to, not on an unrelated term.
    else enterDocs();
  } else if (initial.startsWith("topic/") && TOPIC_INDEX[initial.slice(6)]) {
    selectTopic(initial.slice(6));                // #topic/<id>
    loadDocs();
  } else if (initial.startsWith("qa/") && QA_INDEX[initial.slice(3)]) {
    selectQA(initial.slice(3));                   // #qa/<id>
    loadDocs();
  } else {
    select(TERMS[initial] ? initial : GROUPS[0].terms[0].id);
    loadDocs();                                   // warm the docs cache so Search covers them immediately
  }
}
boot();

/* ===== Universal code highlighter — python | js | ts | java | xml | pseudo =====
   Collision-proof: everything lives in this IIFE, so it never clashes with an
   app's own highlightCode/LANG_KW. It highlights every read-only <pre><code>
   (skipping contenteditable editors) and re-highlights on each detail render. */
const HLMOD = (function () {
  const KW = {
    java: new Set(("abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var yield record sealed permits when true false null").split(" ")),
    python: new Set(("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case self cls True False None print len range str int float dict list set tuple bool").split(" ")),
    ts: new Set(("break case catch class const continue debugger default delete do else enum export extends finally for function if import in instanceof new return super switch this throw try typeof var void while with yield let static async await of abstract as asserts declare implements infer interface is keyof namespace never override private protected public readonly require satisfies type unique unknown any accessor out using boolean number string symbol object bigint undefined null true false console").split(" ")),
    pseudo: new Set(("if then else elif endif fi for foreach while do done repeat until loop return function procedure proc def end begin let set print output input read write and or not true false null nil to step in of break continue call").split(" ")),
  };
  const RE = {
    java: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*[fFdDlL]?\b)|([A-Za-z_$][\w$]*)/g,
    python: /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*\.?[\d_]*\b)|([A-Za-z_]\w*)/g,
    ts: /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_$][\w$]*)|(\b\d[\d_]*\.?[\d_]*n?\b)|([A-Za-z_$][\w$]*)/g,
    pseudo: /(#[^\n]*|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|($.^)|(\b\d[\d_]*\.?[\d_]*\b)|([A-Za-z_]\w*)/g,
  };
  const ALIAS = { js: "ts", javascript: "ts", typescript: "ts", py: "python", python3: "python", html: "xml", xhtml: "xml", plaintext: "pseudo", text: "pseudo", pseudocode: "pseudo" };
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function normLang(lang) {
    lang = (lang || "").toLowerCase();
    lang = ALIAS[lang] || lang;
    return (KW[lang] || lang === "xml") ? lang : null;
  }

  function highlightWords(src, L) {
    const kw = KW[L], re = RE[L];
    re.lastIndex = 0;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = re.lastIndex;
      if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
      else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="tok-ann">${esc(m[3])}</span>`;
      else if (m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
      else {
        const w = m[5];
        if (kw.has(w)) out += `<span class="tok-kw">${esc(w)}</span>`;
        else if (/^[A-Z]/.test(w)) out += `<span class="tok-cls">${esc(w)}</span>`;
        else out += esc(w);
      }
    }
    out += esc(src.slice(last));
    return out;
  }

  function highlightXml(src) {
    const re = /(<!--[\s\S]*?-->)|(<[?!]?\/?)([\w:.-]+)((?:\s+[\w:.-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'))?)*)(\s*\/?[?]?>)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = re.lastIndex;
      if (m[1]) { out += `<span class="tok-com">${esc(m[1])}</span>`; continue; }
      let s = `<span class="tok-kw">${esc(m[2])}${esc(m[3])}</span>`;
      s += (m[4] || "").replace(/([\w:.-]+)(\s*=\s*)?("[^"]*"|'[^']*')?/g, (mm, name, eq, val) =>
        !name ? mm :
          `<span class="tok-cls">${esc(name)}</span>` + (eq || "") + (val ? `<span class="tok-str">${esc(val)}</span>` : ""));
      s += `<span class="tok-kw">${esc(m[5])}</span>`;
      out += s;
    }
    out += esc(src.slice(last));
    return out;
  }

  function highlightCode(src, lang) {
    const L = normLang(lang) || detectLang(src);
    return L === "xml" ? highlightXml(src) : highlightWords(src, L);
  }

  function detectLang(s) {
    const t = (s || "").trim();
    if (/^<[!?/a-zA-Z]/.test(t) && /(<\/[a-zA-Z]|\/>|<[a-zA-Z][\w:.-]*[\s/>]|<!--|<\?xml)/.test(t)) return "xml";
    if (/(^|\n)\s*(def |class \w|import \w|from \w+ import|print\()/.test(t) || /:\s*\n/.test(t) && /\bself\b/.test(t)) return "python";
    if (/\b(public|private|protected)\s+(class|static|void|final)|System\.out|\bpackage\s+[\w.]+;|void\s+main/.test(t)) return "java";
    if (/\b(interface|type)\s+[A-Za-z]|:\s*(string|number|boolean)\b|=>|\bconst\s+\w+\s*[:=]|\bfunction\b|console\./.test(t)) return "ts";
    if (/(^|\n)\s*#/.test(t)) return "python";
    return "pseudo";
  }

  return { highlightCode, detectLang, normLang };
})();

(function () {
  function hlOne(code) {
    if (code.dataset.hlx) return;                                  // my own idempotency flag
    if (code.closest && code.closest('[contenteditable="true"], [contenteditable=""]')) return;  // never touch live editors
    if (!code.dataset.lang && code.children.length) return;        // leave pre-highlighted / hand-styled blocks alone
    const lang = code.dataset.lang || HLMOD.detectLang(code.textContent);
    code.dataset.hlx = "1";
    code.innerHTML = HLMOD.highlightCode(code.textContent, lang);
  }
  function hlScan(root) { if (root && root.querySelectorAll) root.querySelectorAll("pre code").forEach(hlOne); }
  const obs = new MutationObserver(ms => {
    for (const mu of ms) for (const n of mu.addedNodes) {
      if (n.nodeType !== 1) continue;
      if (n.matches && n.matches("pre code")) hlOne(n);
      if (n.querySelectorAll) n.querySelectorAll("pre code").forEach(hlOne);
    }
  });
  const roots = ["main", "drawer"].map(id => document.getElementById(id)).filter(Boolean);
  (roots.length ? roots : [document.body]).forEach(r => obs.observe(r, { childList: true, subtree: true }));
  hlScan(document);
})();
</script>
